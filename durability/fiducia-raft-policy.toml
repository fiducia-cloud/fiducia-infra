policy_id = "den-437-fiducia-raft-durability-v1"
clusters = "laptop-aws-sim,laptop-gcp-sim,laptop-azure-sim"
authoritative_workloads = "fiducia-node,fiducia-brain"
node_data_dir = "/var/lib/fiducia"
brain_data_dir = "/var/lib/fiducia-brain"
node_minimum_capacity_gib = 10
brain_minimum_capacity_gib = 2
required_access_mode = "ReadWriteOnce"
required_pvc_retention_when_deleted = "Retain"
required_pvc_retention_when_scaled = "Retain"
disk_warning_percent = 70
disk_critical_percent = 85
maximum_p99_write_latency_milliseconds = 25
maximum_final_member_lag_entries = 0
maximum_backup_age_hours = 26
maximum_restore_test_age_days = 90
maximum_critical_rpo_seconds = 3600
maximum_member_replacement_rto_seconds = 7200
maximum_clean_restore_rto_seconds = 28800
minimum_daily_restore_points = 35
minimum_monthly_restore_points = 12
minimum_quarterly_restore_points = 4
require_application_consistent_snapshot = true
require_encryption_before_external_storage = true
require_independent_destination = true
require_immutable_retention = true
require_checksum = true
require_full_historical_key_set = true
require_distinct_operator_and_reviewer = true
allow_temporary_local_path = true

required_backup_metadata = "clusterId,memberSet,appliedIndex,revision,schemaVersion,createdAt,checksum,activeKeyId,requiredKeyIds,artifactId"
required_restore_semantics = "representativeValues,revisions,casSuccess,casFailure,authKeyRecords,tokenRevocations,rotationState,encryptionKeyIds"
required_scenarios = "single-member-loss,single-member-replacement,interrupted-migration-rollback,clean-room-restore,missing-historical-key-fails-closed"
required_proofs = "storage-class,application-snapshot,external-backup,backup-monitoring,clean-room-restore,key-custody,deletion-control"
