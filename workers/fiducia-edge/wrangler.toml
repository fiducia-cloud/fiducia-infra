# Cloudflare Wrangler config: Worker name, entry point, and deploy settings.
name = "fiducia-edge"
main = "src/worker.mjs"
compatibility_date = "2026-06-01"

[vars]
FIDUCIA_REGIONS = '[{"name":"us-east","url":"https://us-east.lb.fiducia.cloud"},{"name":"eu-west","url":"https://eu-west.lb.fiducia.cloud"}]'
FIDUCIA_DEPLOYMENT_MODE = "production"
FIDUCIA_CROSS_ORIGIN_RESOURCE_POLICY = "same-site"
FIDUCIA_AUTH_REQUIRED = "true"
FIDUCIA_AUTH_URL = "https://auth.fiducia.cloud"
FIDUCIA_AUTH_CACHE_TTL_SECONDS = "60"
FIDUCIA_AUTH_NEGATIVE_CACHE_TTL_SECONDS = "5"
FIDUCIA_AUTH_JWKS_TTL_SECONDS = "600"
FIDUCIA_AUTH_JWT_CACHE_TTL_SECONDS = "60"
FIDUCIA_JWT_ISSUER = "fiducia-auth"
FIDUCIA_JWT_AUDIENCE = "fiducia-api"
FIDUCIA_REVOCATION_CHECK_URL = "https://auth.fiducia.cloud/v1/revocations/check"
FIDUCIA_REVOCATION_CACHE_TTL_SECONDS = "30"
FIDUCIA_REVOCATION_CACHE_CAPACITY = "10000"
FIDUCIA_REVOCATION_TIMEOUT_MS = "2000"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1-rate-limiter"
new_sqlite_classes = ["RateLimiter"]
