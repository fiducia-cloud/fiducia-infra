# Rendered-contract reference for the platform repository that owns External
# Secrets Operator. This file is intentionally NOT included by base/kustomization
# because the Fiducia data-plane repo does not own ESO or its bootstrap token.
#
# The consuming repository must preserve the full authorization, namespace,
# admission, and bootstrap controls around this store. Only the transport and
# CA-pinning contract is canonical here.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: dd-fiducia-kv
  labels:
    fiducia.cloud/secret-backend: fiducia-kv
    fiducia.cloud/transport: verified-https
    fiducia.cloud/contract: den-438
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          fiducia.cloud/kv-secrets: enabled
  provider:
    webhook:
      method: GET
      timeout: 5s
      url: 'https://fiducia-load-balance-tls.fiducia.svc.cluster.local:8443/v1/kv?key={{ .remoteRef.key }}'
      # ESO reads only the public CA from the serving Secret. The TLS private key
      # remains mounted exclusively in the load-balancer pods.
      caProvider:
        type: Secret
        name: fiducia-load-balance-tls
        namespace: fiducia
        key: ca.crt
      result:
        jsonPath: '$.entry.value'
      headers:
        Accept: application/json
        Authorization: 'Bearer {{ .auth.token }}'
      secrets:
        - name: auth
          secretRef:
            name: fiducia-eso-reader
            namespace: external-secrets
