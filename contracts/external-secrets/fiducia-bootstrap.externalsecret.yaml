# Reference contract for the platform repository that owns External Secrets
# Operator and ClusterSecretStore/dd-cluster-secrets. This file is not included
# by base/kustomization: the independent cloud recovery root must exist before
# hardened Fiducia workloads can start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fiducia-eso-reader
  namespace: external-secrets
  labels:
    fiducia.cloud/bootstrap-contract: den-434
    fiducia.cloud/trust-domain: eso-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: dd-cluster-secrets
  target:
    name: fiducia-eso-reader
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: dd/remote-dev/fiducia-eso-reader
        property: FIDUCIA_API_KEY
---
