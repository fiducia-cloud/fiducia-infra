apiVersion: v1
kind: ConfigMap
metadata:
  name: fiducia-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        stack: fiducia-managed-beta

    rule_files:
      - /etc/prometheus/cron-rules.yml
      - /etc/prometheus/managed-beta-rules.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]
      - job_name: otel-gateway-cron-metrics
        static_configs:
          - targets: ["fiducia-otel-gateway:8889"]
      - job_name: otel-gateway-self
        static_configs:
          - targets: ["fiducia-otel-gateway:8888"]
      - job_name: loki
        static_configs:
          - targets: ["fiducia-loki:3100"]
      - job_name: tempo
        static_configs:
          - targets: ["fiducia-tempo:3200"]
