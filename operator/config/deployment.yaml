apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiducia-operator
  namespace: fiducia
  labels:
    app: fiducia-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fiducia-operator
  template:
    metadata:
      labels:
        app: fiducia-operator
    spec:
      serviceAccountName: fiducia-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # Prototype only. Digest-pin the published image before an overlay
          # includes this Deployment.
          image: ghcr.io/fiducia-cloud/fiducia-operator:v0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FIDUCIA_OPERATOR_HTTP_ADDR
              value: "0.0.0.0:8080"
            - name: RUST_LOG
              value: "fiducia_operator=info,kube=info"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
