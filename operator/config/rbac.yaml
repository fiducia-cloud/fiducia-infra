apiVersion: v1
kind: ServiceAccount
metadata:
  name: fiducia-operator
  namespace: fiducia
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fiducia-operator-observer
  namespace: fiducia
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operator.fiducia.cloud"]
    resources: ["fiduciaclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operator.fiducia.cloud"]
    resources: ["fiduciaclusters/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fiducia-operator-observer
  namespace: fiducia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fiducia-operator-observer
subjects:
  - kind: ServiceAccount
    name: fiducia-operator
    namespace: fiducia
