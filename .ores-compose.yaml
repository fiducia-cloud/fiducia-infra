schema_version: ores.compose.v1
project: fiducia-cloud
allow_lazy_start: false
services:
  redis:
    runtime: host
    build: [["mkdir", "-p", "tmp/redis"]]
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--appendonly", "yes", "--dir", "tmp/redis"]
    healthcheck: { command: ["redis-cli", "-h", "127.0.0.1", "-p", "6379", "ping"], interval_ms: 1000, timeout_ms: 500, retries: 20 }
  nats:
    runtime: host
    build: [["mkdir", "-p", "tmp/nats"]]
    command: ["nats-server", "-js", "-sd", "tmp/nats", "-a", "127.0.0.1", "-p", "4222", "-m", "8222"]
    healthcheck: { command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8222/healthz"], interval_ms: 1000, timeout_ms: 500, retries: 20 }
  s3-local:
    runtime: host
    build: [["mkdir", "-p", "tmp/minio-s3"]]
    command: ["minio", "server", "tmp/minio-s3", "--address", "127.0.0.1:9000", "--console-address", "127.0.0.1:9001"]
    healthcheck: { command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9000/minio/health/live"], interval_ms: 1000, timeout_ms: 500, retries: 20 }
  r2-local:
    runtime: host
    build: [["mkdir", "-p", "tmp/minio-r2"]]
    command: ["minio", "server", "tmp/minio-r2", "--address", "127.0.0.1:9100", "--console-address", "127.0.0.1:9101"]
    healthcheck: { command: ["curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9100/minio/health/live"], interval_ms: 1000, timeout_ms: 500, retries: 20 }
