# Dedicated single-node K3s cluster overlay. gcp is a synthetic provider
# label used for multi-cloud behavior tests; this machine is not hosted by gcp.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fiducia
resources:
  - ../../../base
  - tailnet-ingress.yaml
components:
  - ../../../base/components/brain
  - ../../components/substrate
  - ../../components/connectivity
configMapGenerator:
  - name: fiducia-cluster
    envs:
      - topology.env
generatorOptions:
  disableNameSuffixHash: true
commonAnnotations:
  fiducia.cloud/substrate: laptop-k3s
  fiducia.cloud/synthetic-provider: gcp
  fiducia.cloud/site: site-b
patches:
  - path: patches.yaml
