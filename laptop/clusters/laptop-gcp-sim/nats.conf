# GENERATED by tools/render-laptop-messaging.mjs from laptop/topology.toml — do not edit.
# Three independent single-node K3s clusters form one three-server JetStream
# cluster over the private mesh. Client and monitoring planes remain local.
server_name: fiducia-nats-laptop-gcp-sim
port: 4222
http: 8222

max_payload: 8MB
ping_interval: "20s"
write_deadline: "10s"

jetstream {
  store_dir: "/data/jetstream"
  max_mem_store: 512MB
  max_file_store: 8GB
  max_buffered_msgs: 10000
  max_buffered_size: 64MB
  request_queue_limit: 5000
  strict: true

  limits {
    max_ack_pending: 10000
    duplicate_window: 600s
  }
}

cluster {
  name: fiducia-laptop-production
  listen: "0.0.0.0:6222"

  # All two peer routes are explicit through cluster-local Tailscale egress
  # Services. Suppress client advertisements so a pod IP or unreachable
  # tailnet address is never sent to in-cluster clients.
  no_advertise: true
  pool_size: 1

  tls {
    cert_file: "/etc/nats/route-tls/tls.crt"
    key_file: "/etc/nats/route-tls/tls.key"
    ca_file: "/etc/nats/route-tls/ca.crt"
    min_version: "1.3"
    verify: true
    verify_cert_and_check_known_urls: true
    timeout: 5
  }

  routes = [
      nats://fiducia-nats-route-laptop-aws-sim-tailnet.fiducia.svc.cluster.local:6222
      nats://fiducia-nats-route-laptop-azure-sim-tailnet.fiducia.svc.cluster.local:6222
  ]
}

# Client accounts and subject permissions remain fail-closed and are delivered
# independently from the route CA/certificate Secret.
include ./auth/auth.conf
