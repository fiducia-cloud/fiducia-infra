# Dedicated single-node K3s overlay with a synthetic Azure provider label.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fiducia
resources:
  - ../../../base
components:
  - ../../../base/components/brain
  - ../../components/substrate
  - ../../components/runtime
configMapGenerator:
  - name: fiducia-cluster
    envs:
      - topology.env
generatorOptions:
  disableNameSuffixHash: true
commonAnnotations:
  fiducia.cloud/substrate: laptop-k3s
  fiducia.cloud/synthetic-provider: azure
  fiducia.cloud/site: site-c
patches:
  - path: patches.yaml
