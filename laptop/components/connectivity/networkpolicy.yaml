# cloudflared needs only local-origin/DNS access (granted by the base policies)
# plus Cloudflare edge connectivity on TCP/UDP 7844. These /32s are the published
# region 1 and region 2 endpoints used by Cloudflare Tunnel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-edge-egress
  namespace: fiducia
spec:
  podSelector:
    matchLabels:
      app: cloudflared
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 198.41.192.167/32 }
        - ipBlock: { cidr: 198.41.192.67/32 }
        - ipBlock: { cidr: 198.41.192.57/32 }
        - ipBlock: { cidr: 198.41.192.107/32 }
        - ipBlock: { cidr: 198.41.192.27/32 }
        - ipBlock: { cidr: 198.41.192.7/32 }
        - ipBlock: { cidr: 198.41.192.227/32 }
        - ipBlock: { cidr: 198.41.192.47/32 }
        - ipBlock: { cidr: 198.41.192.37/32 }
        - ipBlock: { cidr: 198.41.192.77/32 }
        - ipBlock: { cidr: 198.41.200.13/32 }
        - ipBlock: { cidr: 198.41.200.193/32 }
        - ipBlock: { cidr: 198.41.200.33/32 }
        - ipBlock: { cidr: 198.41.200.233/32 }
        - ipBlock: { cidr: 198.41.200.53/32 }
        - ipBlock: { cidr: 198.41.200.63/32 }
        - ipBlock: { cidr: 198.41.200.113/32 }
        - ipBlock: { cidr: 198.41.200.73/32 }
        - ipBlock: { cidr: 198.41.200.43/32 }
        - ipBlock: { cidr: 198.41.200.23/32 }
      ports:
        - { protocol: TCP, port: 7844 }
        - { protocol: UDP, port: 7844 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-metrics-ingress
  namespace: fiducia
spec:
  podSelector:
    matchLabels:
      app: cloudflared
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fiducia
      ports:
        - { protocol: TCP, port: 2000 }
