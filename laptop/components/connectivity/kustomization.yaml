# Laptop-only cross-cluster peer policy. The runtime component owns the single
# TLS-verified cloudflared connector; this component must not deploy a duplicate.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: fiducia-node-ingress
      namespace: fiducia
    patch: |-
      - op: add
        path: /spec/ingress/1/from
        value:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: tailscale
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: fiducia-node-peer-egress
      namespace: fiducia
    patch: |-
      - op: add
        path: /spec/egress/0/to
        value:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: tailscale
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: fiducia-brain-ingress
      namespace: fiducia
    patch: |-
      - op: add
        path: /spec/ingress/1/from
        value:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: tailscale
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: fiducia-brain-peer-egress
      namespace: fiducia
    patch: |-
      - op: add
        path: /spec/egress/0/to
        value:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: tailscale
