# One connector runs in each independent laptop cluster. The tunnel is remotely
# managed; every public hostname must route to:
#
#   https://fiducia-load-balance-tls.fiducia.svc.cluster.local:8443
#
# with origin certificate verification enabled. The token is materialized
# out-of-band as cloudflare-tunnel-token/token. The mounted CA is public trust
# material only; the load-balancer private key never enters this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiducia-cloudflared
  namespace: fiducia
  labels:
    app: fiducia-cloudflared
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fiducia-cloudflared
  template:
    metadata:
      labels:
        app: fiducia-cloudflared
      annotations:
        fiducia.cloud/public-origin: outbound-cloudflare-tunnel
        fiducia.cloud/origin-url: https://fiducia-load-balance-tls.fiducia.svc.cluster.local:8443
        fiducia.cloud/origin-trust: fiducia-load-balance-tls/ca.crt
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # Official multi-architecture 2026.7.3 image pinned by digest.
          image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          imagePullPolicy: IfNotPresent
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - --origin-ca-pool
            - /etc/fiducia/origin-ca/ca.crt
            - --edge-ip-version
            - "4"
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
                  optional: false
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          startupProbe:
            httpGet: { path: /ready, port: metrics }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            failureThreshold: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            failureThreshold: 3
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: origin-ca, mountPath: /etc/fiducia/origin-ca, readOnly: true }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: origin-ca
          secret:
            secretName: fiducia-load-balance-tls
            optional: false
            defaultMode: 0444
            items:
              - { key: ca.crt, path: ca.crt }
---
# Prevent voluntary disruption of the laptop's only connector. Physical host or
# ISP loss is handled by the connectors in the other independent clusters.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fiducia-cloudflared
  namespace: fiducia
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: fiducia-cloudflared
---
# The namespace baseline already provides DNS. This policy adds only the local
# verified-HTTPS origin and the documented Cloudflare Tunnel edge endpoints. The
# connector is forced to IPv4 so the allowlist and transport mode agree.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fiducia-cloudflared
  namespace: fiducia
spec:
  podSelector:
    matchLabels:
      app: fiducia-cloudflared
  policyTypes: [Ingress, Egress]
  ingress:
    # In-namespace metrics/health scraping.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fiducia
      ports:
        - { protocol: TCP, port: 2000 }
    # K3s kubelet probes originate from the node network, not a selected pod.
    - from:
        - ipBlock: { cidr: 10.0.0.0/8 }
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 192.168.0.0/16 }
        - ipBlock: { cidr: 100.64.0.0/10 }
      ports:
        - { protocol: TCP, port: 2000 }
  egress:
    # Remote tunnel routes must target only this in-cluster TLS origin.
    - to:
        - podSelector:
            matchLabels:
              app: fiducia-load-balance
      ports:
        - { protocol: TCP, port: 8443 }
    # Cloudflare Tunnel transport endpoints, region 1 and region 2. Review this
    # list against Cloudflare's published endpoint document during upgrades.
    - to:
        - ipBlock: { cidr: 198.41.192.167/32 }
        - ipBlock: { cidr: 198.41.192.67/32 }
        - ipBlock: { cidr: 198.41.192.57/32 }
        - ipBlock: { cidr: 198.41.192.107/32 }
        - ipBlock: { cidr: 198.41.192.27/32 }
        - ipBlock: { cidr: 198.41.192.7/32 }
        - ipBlock: { cidr: 198.41.192.227/32 }
        - ipBlock: { cidr: 198.41.192.47/32 }
        - ipBlock: { cidr: 198.41.192.37/32 }
        - ipBlock: { cidr: 198.41.192.77/32 }
        - ipBlock: { cidr: 198.41.200.13/32 }
        - ipBlock: { cidr: 198.41.200.193/32 }
        - ipBlock: { cidr: 198.41.200.33/32 }
        - ipBlock: { cidr: 198.41.200.233/32 }
        - ipBlock: { cidr: 198.41.200.53/32 }
        - ipBlock: { cidr: 198.41.200.63/32 }
        - ipBlock: { cidr: 198.41.200.113/32 }
        - ipBlock: { cidr: 198.41.200.73/32 }
        - ipBlock: { cidr: 198.41.200.43/32 }
        - ipBlock: { cidr: 198.41.200.23/32 }
      ports:
        - { protocol: TCP, port: 7844 }
        - { protocol: UDP, port: 7844 }
