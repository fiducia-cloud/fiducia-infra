[workspace]
resolver = "2"
members = [
  "crates/fiducia-commercial-contracts",
  "crates/fiducia-commercial-diesel",
  "crates/fiducia-commercial-models",
  "crates/fiducia-commercial-seaorm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/fiducia-cloud/fiducia-infra"

[workspace.dependencies]
bigdecimal = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
diesel = { version = "~2.2", features = [
  "postgres",
  "chrono",
  "serde_json",
  "numeric",
] }
sea-orm = { version = "1.1", default-features = false, features = [
  "macros",
  "with-chrono",
  "with-json",
  "with-rust_decimal",
] }
serde_json = "1"
