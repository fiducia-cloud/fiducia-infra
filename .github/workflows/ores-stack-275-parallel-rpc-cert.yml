name: ores-stack #275 hardened parallel RPC certification

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ores-stack-275-parallel-rpc-cert.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  STACK_BASE: '253382da3634ce9fde62704e79e42160cee66838'
  STACK_BRANCH: 'feat/parallel-rpc-runtime-client-lane'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch and bind current PR branch head
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=20 origin main "$STACK_BRANCH"
          test "$(git -C ores-stack rev-parse origin/main)" = "$STACK_BASE"
          source_head="$(git -C ores-stack rev-parse origin/$STACK_BRANCH)"
          echo "SOURCE_HEAD=$source_head" >> "$GITHUB_ENV"
          git -C ores-stack checkout --detach "$source_head"
          test "$(git -C ores-stack merge-base HEAD "$STACK_BASE")" = "$STACK_BASE"
          test "$(git -C ores-stack diff --name-only "$STACK_BASE"..HEAD | sort | tr '\n' ' ')" = "crates/ores-stack-cli/src/legacy/mod.rs crates/ores-stack-core/src/lib.rs crates/ores-stack-core/src/rpc_http_client_lane.rs crates/ores-stack-core/src/rpc_http_client_lane_post.rs "
          test -z "$(git -C ores-stack status --porcelain)"
          git -C ores-stack diff --check "$STACK_BASE"..HEAD
      - name: Rust 1.88
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
      - name: PR-owned formatting
        working-directory: ores-stack
        run: |
          rustfmt --edition 2024 --config skip_children=true --check \
            crates/ores-stack-cli/src/legacy/mod.rs \
            crates/ores-stack-core/src/lib.rs \
            crates/ores-stack-core/src/rpc_http_client_lane.rs \
            crates/ores-stack-core/src/rpc_http_client_lane_post.rs
      - name: Locked metadata
        working-directory: ores-stack
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null
      - name: Compile exact head
        working-directory: ores-stack
        run: cargo check --locked -p ores-stack-core -p ores-stack-cli --all-targets
      - name: Focused parallel lane tests
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-core rpc_http_client_lane -- --nocapture
      - name: Focused post-sync lane tests
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-core rpc_http_client_lane_post -- --nocapture
      - name: Prove zero new Clippy diagnostics versus base
        run: |
          set -uo pipefail
          set +e
          CARGO_TARGET_DIR=/tmp/head-target cargo clippy --manifest-path ores-stack/Cargo.toml --locked -p ores-stack-core -p ores-stack-cli --all-targets --message-format=json > /tmp/head.jsonl
          head_rc=$?
          git -C ores-stack worktree add --detach /tmp/ores-stack-base "$STACK_BASE"
          CARGO_TARGET_DIR=/tmp/base-target cargo clippy --manifest-path /tmp/ores-stack-base/Cargo.toml --locked -p ores-stack-core -p ores-stack-cli --all-targets --message-format=json > /tmp/base.jsonl
          base_rc=$?
          set -e
          export HEAD_CLIPPY_RC="$head_rc" BASE_CLIPPY_RC="$base_rc"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          owned = {'crates/ores-stack-core/src/rpc_http_client_lane.rs','crates/ores-stack-core/src/rpc_http_client_lane_post.rs','crates/ores-stack-core/src/lib.rs','crates/ores-stack-cli/src/legacy/mod.rs'}
          def norm(v):
              v = str(v or '').replace('\\','/')
              for marker in ('/ores-stack-base/','/ores-stack/'):
                  if marker in v: return v.split(marker,1)[1]
              return v
          def diags(path):
              out=set()
              for raw in Path(path).read_text().splitlines():
                  try: obj=json.loads(raw)
                  except json.JSONDecodeError: continue
                  if obj.get('reason')!='compiler-message': continue
                  msg=obj.get('message') or {}
                  if msg.get('level') not in {'warning','error'}: continue
                  spans=msg.get('spans') or []
                  primary=next((s for s in spans if s.get('is_primary')),spans[0] if spans else {})
                  out.add((msg.get('level') or '',(msg.get('code') or {}).get('code') or '',norm(primary.get('file_name')),(msg.get('message') or '').strip()))
              return out
          base, head = diags('/tmp/base.jsonl'), diags('/tmp/head.jsonl')
          owned_findings=sorted(d for d in head if d[2] in owned)
          new_findings=sorted(head-base)
          print(f"Clippy exit codes: base={os.environ['BASE_CLIPPY_RC']} head={os.environ['HEAD_CLIPPY_RC']}")
          print(f"Clippy diagnostics: base={len(base)} head={len(head)}")
          if owned_findings: print('owned-file Clippy findings:', *owned_findings, sep='\n')
          if new_findings: print('new Clippy findings versus base:', *new_findings, sep='\n')
          if owned_findings or new_findings: raise SystemExit(1)
          if int(os.environ['HEAD_CLIPPY_RC']) != 0 and int(os.environ['BASE_CLIPPY_RC']) == 0: raise SystemExit(1)
          PY
      - name: Verify fluent and hardening contracts
        working-directory: ores-stack
        run: |
          set -euo pipefail
          grep -q 'makeCall()' crates/ores-stack-core/src/rpc_http_client_lane.rs
          grep -q 'doStream()' crates/ores-stack-core/src/rpc_http_client_lane.rs
          grep -q 'make_call' crates/ores-stack-core/src/rpc_http_client_lane.rs
          grep -q 'do_stream' crates/ores-stack-core/src/rpc_http_client_lane.rs
          ! grep -Eq '\.stream\(' crates/ores-stack-core/src/rpc_http_client_lane.rs
          grep -q 'generated_ores_http' crates/ores-stack-core/src/rpc_http_client_lane.rs
          grep -q 'validate_existing_parallel_lane_state' crates/ores-stack-core/src/rpc_http_client_lane_post.rs
          grep -q 'outside owned generated_ores_http roots' crates/ores-stack-core/src/rpc_http_client_lane_post.rs
          grep -q 'is a symlink; refusing generated writes' crates/ores-stack-core/src/rpc_http_client_lane_post.rs
          grep -q 'contract_sha256' crates/ores-stack-core/src/rpc_http_client_lane_post.rs
          grep -q 'does not admit handlers audience' crates/ores-stack-core/src/rpc_http_client_lane_post.rs
      - name: Final immutable-head guard
        working-directory: ores-stack
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin "refs/heads/$STACK_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"
          git diff --check "$STACK_BASE"..HEAD
          echo ORES_STACK_275_HARDENED_PARALLEL_RPC_CERT_PASS
