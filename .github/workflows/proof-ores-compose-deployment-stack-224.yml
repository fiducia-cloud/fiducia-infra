name: proof ORES compose deployment stack 224

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-compose-deployment-stack-224.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 8224d53542d739b9ad9fc85af58361bc7e3845fd

jobs:
  deployment-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout current-main integration merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact integration head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile all targets and features
        run: cargo check --locked --all-targets --all-features

      - name: Execute full test suite
        run: cargo test --locked --all-targets --all-features

      - name: Verify deployment modules are present
        run: |
          test -f src/deployment.rs
          test -f src/deployment_adapter.rs
          test -f src/service_artifact.rs
          test -f src/deployment_control.rs
          test -f src/deployment_rollback.rs
          grep -q 'pub mod deployment' src/lib.rs
          grep -q 'pub mod deployment_adapter' src/lib.rs
          grep -q 'pub mod deployment_control' src/lib.rs
          grep -q 'pub mod deployment_rollback' src/lib.rs

      - name: Final exact-head guard
        if: always()
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Remove private credential rewrite
        if: always()
        shell: bash
        run: git config --global --unset-all "url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf" >/dev/null 2>&1 || true
