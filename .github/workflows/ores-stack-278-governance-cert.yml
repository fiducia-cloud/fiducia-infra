name: ores-stack #278 governance certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-278-governance-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  STACK_PR: '278'
  STACK_BRANCH: 'feat/cli-contract-governance-v1-20260922'
  STACK_BASE: 'd46c07e0f91c2dbda9b2fee64bdd82f6d52fc1ef'
  STACK_HEAD: 'a673b93cb728c5d9c23d9ea59c0baffc9705f36e'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch immutable PR head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --no-tags origin "+refs/pull/${STACK_PR}/head:refs/remotes/origin/pr-${STACK_PR}-head"
          actual_head="$(git -C ores-stack rev-parse "refs/remotes/origin/pr-${STACK_PR}-head")"
          printf 'expected head: %s\nactual head:   %s\n' "$STACK_HEAD" "$actual_head"
          test "$actual_head" = "$STACK_HEAD"
          git -C ores-stack checkout --detach "$actual_head"
          git -C ores-stack cat-file -e "$STACK_BASE^{commit}"
          test "$(git -C ores-stack merge-base HEAD "$STACK_BASE")" = "$STACK_BASE"
          git -C ores-stack diff --check "$STACK_BASE"..HEAD

      - name: Repair malformed Cargo.toml test fixture only
        id: repair
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ores-stack-cli/src/contract_cli.rs')
          text = path.read_text()
          start = text.index('    fn cargo(root: &Path, role: &str) {')
          end = text.index('    fn web_contract()', start)
          before = text[start:end]
          after = before.replace('\\\\n', '\\n')
          if before == after:
              raise SystemExit('expected double-escaped newline fixture was not found')
          if after.count('\\\\n'):
              raise SystemExit('double-escaped newline remains in cargo fixture helper')
          path.write_text(text[:start] + after + text[end:])
          PY
          changed="$(git diff --name-only)"
          test "$changed" = 'crates/ores-stack-cli/src/contract_cli.rs'
          git diff --check
          git diff -- crates/ores-stack-cli/src/contract_cli.rs

          remote_head="$(git ls-remote origin "refs/heads/${STACK_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$STACK_HEAD"
          git config user.name 'ORESoftware CI certification'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-cli/src/contract_cli.rs
          git commit -m 'test(governance): write valid Cargo.toml fixture'
          git push origin HEAD:"refs/heads/${STACK_BRANCH}"
          echo 'pushed=true' >> "$GITHUB_OUTPUT"

      - name: Stop so certification is repinned to repaired immutable head
        if: steps.repair.outputs.pushed == 'true'
        run: |
          echo 'repaired source #278; repin STACK_HEAD and rerun exact-head certification' >&2
          exit 1
