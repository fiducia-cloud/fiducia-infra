name: ores-compose #175 locked exact-head certification

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ores-compose-175-locked-cert.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SOURCE_REPO: ORESoftware/ores-compose
  SOURCE_BRANCH: formal/exhaustive-dependency-waves-20260922
  SOURCE_SHA: 2b67eb3307132acbaaa4641f0a7eaeb8bb6f45eb
  SOURCE_BASE: 2e0d1488ca32371e4f410f95cf6886674b86876c

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Checkout exact source head
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/ores-compose.git
          git -C source fetch --depth=20 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_BASE"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          test "$(git -C source diff --name-only "$SOURCE_BASE"..HEAD | sort | tr '\n' ' ')" = "Cargo.lock tests/formal_dependency_graph_exhaustive.rs "
          git -C source diff --check "$SOURCE_BASE"..HEAD
          test -z "$(git -C source status --porcelain)"
      - name: Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.98.1
      - name: PR-owned formatting
        working-directory: source
        run: rustfmt --edition 2021 --check tests/formal_dependency_graph_exhaustive.rs
      - name: Locked graph
        working-directory: source
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Differential Clippy against normalized base graph
        run: |
          set -uo pipefail
          set +e
          CARGO_TARGET_DIR=/tmp/head-target cargo clippy --manifest-path source/Cargo.toml --locked --all-targets --all-features --message-format=json -- -D warnings > /tmp/head.jsonl
          head_rc=$?
          git -C source worktree add --detach /tmp/compose-base "$SOURCE_BASE"
          cargo metadata --manifest-path /tmp/compose-base/Cargo.toml --format-version 1 >/dev/null
          test "$(git -C /tmp/compose-base diff --name-only | tr '\n' ' ')" = "Cargo.lock "
          CARGO_TARGET_DIR=/tmp/base-target cargo clippy --manifest-path /tmp/compose-base/Cargo.toml --locked --all-targets --all-features --message-format=json -- -D warnings > /tmp/base.jsonl
          base_rc=$?
          set -e
          export HEAD_RC="$head_rc" BASE_RC="$base_rc"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def norm(v):
              v=str(v or '').replace('\\','/')
              for marker in ('/compose-base/','/source/'):
                  if marker in v: return v.split(marker,1)[1]
              return v
          def ds(path):
              out=set()
              for raw in Path(path).read_text().splitlines():
                  try: obj=json.loads(raw)
                  except json.JSONDecodeError: continue
                  if obj.get('reason')!='compiler-message': continue
                  m=obj.get('message') or {}
                  if m.get('level') not in {'warning','error'}: continue
                  spans=m.get('spans') or []
                  p=next((x for x in spans if x.get('is_primary')),spans[0] if spans else {})
                  out.add((m.get('level') or '',(m.get('code') or {}).get('code') or '',norm(p.get('file_name')),(m.get('message') or '').strip()))
              return out
          base, head = ds('/tmp/base.jsonl'), ds('/tmp/head.jsonl')
          new=sorted(head-base)
          print(f"exit base={os.environ['BASE_RC']} head={os.environ['HEAD_RC']}")
          print(f"diagnostics base={len(base)} head={len(head)} new={len(new)}")
          for item in new: print(item)
          if new or (int(os.environ['HEAD_RC']) != 0 and int(os.environ['BASE_RC']) == 0): raise SystemExit(1)
          PY
      - name: Run locked bounded exhaustive proof
        working-directory: source
        run: cargo test --locked --test formal_dependency_graph_exhaustive -- --nocapture
      - name: Final immutable source guard
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          git diff --check "$SOURCE_BASE"..HEAD
          echo ORES_COMPOSE_175_LOCKED_CERT_PASS
