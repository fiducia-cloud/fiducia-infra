name: ORESoftware ores-lambda #9 exact-head proof

on:
  pull_request:
    paths:
      - '.github/workflows/ores-lambda-9-proof.yml'

permissions:
  contents: read

jobs:
  rust:
    name: ores-lambda#9 Rust/conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_REPO: ORESoftware/ores-lambda
      SOURCE_BRANCH: hardening/consumer-authority-20260920
      SOURCE_SHA: ba01ae2f3ec291c08b7b52c98f88d07189439260
      SOURCE_MAIN_SHA: cc7e5da3b42a75f8b172d85bf13a0c2844c2d431
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-lambda
          ref: ba01ae2f3ec291c08b7b52c98f88d07189439260
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
      - name: Guard source identity
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Resolve exact dependency lock
        run: cargo generate-lockfile
      - name: Verify repository lifecycle wiring
        run: cargo run --locked --quiet -p ores-lambda-conformance -- lifecycle .
      - name: Run dependency-independent lifecycle bootstrap
        run: sh scripts/check-bootstrap.sh
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Run top-level conformance fixtures
        run: cargo run --locked --quiet -p ores-lambda-conformance -- self-test .
      - name: Admit repository ingress config
        run: cargo run --locked --quiet -p ores-lambda-ingress -- --check-config .ores-lambda.toml
      - name: Prove packaged authority survives publish layout
        run: sh scripts/check-package.sh
      - name: Generated output policy
        run: test -f generated/README.md
      - name: Final immutable source guard
        if: always()
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_SHA" >/dev/null
          git clean -ffd >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"

  contracts:
    name: ores-lambda#9 TypeSpec/JSON Schema parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-lambda
          ref: ba01ae2f3ec291c08b7b52c98f88d07189439260
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
      - name: Ingress config parity
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/ores-lambda-ingress-config.tsp
          schema: contracts/ores-lambda-ingress-config.schema.json
          report: .conformance/ingress-config-report.json
          output_dir: .conformance/ingress-config-generated
      - name: Lambda repository parity
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/ores-lambda-repository.tsp
          schema: contracts/ores-lambda-repository.schema.json
          report: .conformance/lambda-repository-report.json
          output_dir: .conformance/lambda-repository-generated
      - name: Lambda fleet manifest parity
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/ores-lambda-manifest.tsp
          schema: contracts/ores-lambda-manifest.schema.json
          report: .conformance/lambda-manifest-report.json
          output_dir: .conformance/lambda-manifest-generated
      - name: Ingress receipt parity
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/ores-lambda-ingress-receipt.tsp
          schema: contracts/ores-lambda-ingress-receipt.schema.json
          report: .conformance/ingress-receipt-report.json
          output_dir: .conformance/ingress-receipt-generated
      - name: Conformance receipt parity
        uses: ORESoftware/typespec-json-schema-validator@bd503465dab8c5148fee722b443ed04ff126c9bf
        with:
          typespec: contracts/ores-lambda-conformance-receipt.tsp
          schema: contracts/ores-lambda-conformance-receipt.schema.json
          report: .conformance/conformance-receipt-report.json
          output_dir: .conformance/conformance-receipt-generated
