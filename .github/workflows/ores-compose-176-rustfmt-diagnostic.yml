name: ores-compose #176 rustfmt diagnostic

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ores-compose-176-rustfmt-diagnostic.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SOURCE_BRANCH: fix/command-spec-static-program-test-20260922
  SOURCE_SHA: 40a772267ce407205c37aceae536bdeb0b8dcd04
  SOURCE_BASE: 2e0d1488ca32371e4f410f95cf6886674b86876c

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Checkout exact source head
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/ores-compose.git
          git -C source fetch --depth=20 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_BASE"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source diff --name-only "$SOURCE_BASE"..HEAD | tr '\n' ' ')" = "tests/source_filter_execution_regressions.rs "
      - name: Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --no-self-update
          rustup default 1.98.1
      - name: Capture exact changed-file rustfmt delta
        working-directory: source
        run: |
          set -euo pipefail
          rustfmt --edition 2021 tests/source_filter_execution_regressions.rs
          test "$(git diff --name-only | tr '\n' ' ')" = "tests/source_filter_execution_regressions.rs "
          git diff -- tests/source_filter_execution_regressions.rs | tee /tmp/ores-compose-176-rustfmt.patch
          test -s /tmp/ores-compose-176-rustfmt.patch
      - name: Upload diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ores-compose-176-rustfmt
          path: /tmp/ores-compose-176-rustfmt.patch
      - name: Final remote-head guard
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
