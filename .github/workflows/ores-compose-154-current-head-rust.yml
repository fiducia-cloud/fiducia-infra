name: ores-compose #154 exact-head Rust certification

on:
  push:
    branches:
      - test/ores-compose-154-service-env-cert-20260922
    paths:
      - .github/workflows/ores-compose-154-current-head-rust.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-compose
  SOURCE_HEAD: fafea34be8d8ff768231c88bd77d545bc79185ce
  SOURCE_BASE: fb6d0b2aeb7d87c598e006bed050162b55e0c9f0
  SOURCE_BRANCH: feat/service-environment-isolation

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact ores-compose source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_HEAD }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact PR head and review scope
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          remote_head="$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/pull/154/head | cut -f1)"
          test "$remote_head" = "$SOURCE_HEAD"
          git cat-file -e "${SOURCE_BASE}^{commit}"
          mapfile -t changed < <(git diff --name-only "$SOURCE_BASE" "$SOURCE_HEAD")
          printf '%s\n' "${changed[@]}"
          expected=(
            contracts/json-schema/contract.schema.json
            contracts/typespec/main.tsp
            src/config_loader.rs
            src/local_up_process.rs
            src/service_environment.rs
            src/up_orchestrator.rs
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          git diff --check "$SOURCE_BASE" "$SOURCE_HEAD"

      - name: Install Rust 1.98.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Check changed Rust formatting without traversing baseline child modules
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --check --edition 2021 --config skip_children=true \
            src/config_loader.rs \
            src/local_up_process.rs \
            src/service_environment.rs \
            src/up_orchestrator.rs

      - name: Locked metadata
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Compile all targets and features
        run: cargo check --locked --all-targets --all-features

      - name: Full test suite
        run: cargo test --locked --all-targets --all-features

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Reconfirm immutable exact head
        if: always()
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          remote_head="$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/pull/154/head | cut -f1)"
          test "$remote_head" = "$SOURCE_HEAD"
          echo ORES_COMPOSE_154_RUST_CERT_PASS
