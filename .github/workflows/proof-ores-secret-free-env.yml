name: proof secret-free isolated env

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-secret-free-env.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_SHA: 9ffbfedbea763278103de46d5cd081fa963c7649
  PROC_SHA: dec93fae475810b45fbb3e5353a6bf1cd7879dd0

jobs:
  rust-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact compose candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: compose
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact isolation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ env.PROC_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: isolation
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact heads
        run: |
          test "$(git -C compose rev-parse HEAD)" = "$COMPOSE_SHA"
          test "$(git -C isolation rev-parse HEAD)" = "$PROC_SHA"
      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Install reviewed Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      - name: Verify isolation stdin boundary
        run: |
          cargo clippy --manifest-path isolation/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path isolation/Cargo.toml --all-targets
      - name: Verify compose secret-free adapter
        run: |
          cargo check --manifest-path compose/Cargo.toml --all-targets --all-features
          cargo test --manifest-path compose/Cargo.toml --all-targets --all-features
      - name: Final exact-head guards
        if: always()
        run: |
          test "$(git -C compose rev-parse HEAD)" = "$COMPOSE_SHA"
          test "$(git -C isolation rev-parse HEAD)" = "$PROC_SHA"

  macos-secret-free-e2e:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact compose candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: compose
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact isolation candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ env.PROC_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: isolation
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact heads
        run: |
          test "$(git -C compose rev-parse HEAD)" = "$COMPOSE_SHA"
          test "$(git -C isolation rev-parse HEAD)" = "$PROC_SHA"
      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Build exact candidates
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          cargo build --manifest-path isolation/Cargo.toml --bin ores-proc-isolation
          cargo build --manifest-path compose/Cargo.toml --bin ores-compose
      - name: Prove admitted secret reaches target but not generated policy
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ores-compose-secret-free-proof"
          mkdir -p "$root/service"
          cat >"$root/.ores-compose.yaml" <<'YAML'
          schema_version: ores.compose.v1
          project: secret-free-proof
          allow_lazy_start: false
          services:
            sleeper:
              runtime: host
              command: ["/bin/sh", "-c", "test \"$APP_SECRET\" = carrier-secret && exec /bin/sleep 30"]
              working_dir: service
              environment:
                APP_SECRET: carrier-secret
          YAML
          export ORES_COMPOSE_PROCESS_ISOLATION=required
          export ORES_PROC_ISOLATION_BIN="$GITHUB_WORKSPACE/isolation/target/debug/ores-proc-isolation"
          "$GITHUB_WORKSPACE/compose/target/debug/ores-compose"             --skip-zed-pkg             --skip-rpc-gen             --skip-source-sync             up "$root/.ores-compose.yaml" >"$RUNNER_TEMP/secret-free-proof.log" 2>&1 &
          compose_pid=$!
          cleanup() {
            kill -INT "$compose_pid" 2>/dev/null || true
            wait "$compose_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in {1..60}; do
            if grep -q '"event":"compose_ready"' "$RUNNER_TEMP/secret-free-proof.log"; then
              ready=1
              break
            fi
            if ! kill -0 "$compose_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/secret-free-proof.log" >&2
              exit 1
            fi
            sleep 1
          done
          test "$ready" = 1
          grep -q '"event":"process_isolation_enabled"' "$RUNNER_TEMP/secret-free-proof.log"
          policies=(${TMPDIR:-/tmp}/ores-compose-isolation-*.yaml)
          test -e "${policies[0]}"
          for policy in "${policies[@]}"; do
            ! grep -q 'carrier-secret' "$policy"
            grep -q 'APP_SECRET' "$policy"
            grep -q 'environment:' "$policy"
          done
          kill -INT "$compose_pid"
          wait "$compose_pid"
          trap - EXIT
      - name: Final exact-head guards
        if: always()
        run: |
          test "$(git -C compose rev-parse HEAD)" = "$COMPOSE_SHA"
          test "$(git -C isolation rev-parse HEAD)" = "$PROC_SHA"
