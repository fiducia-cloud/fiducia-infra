name: ORESoftware 3fa-backend checkout-v7 proof

on:
  pull_request:
    paths:
      - '.github/workflows/ores-3fa-checkout-proof.yml'

permissions:
  contents: read

jobs:
  checkout-v7:
    name: 3fa-backend.rs#39 exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_REPO: ORESoftware/3fa-backend.rs
      SOURCE_BRANCH: dependabot/github_actions/actions/checkout-7.0.1
      SOURCE_SHA: e1152ef13193524f56cc45ad7cd55223b2ce9d3c
      SOURCE_MAIN_SHA: f2a81af9947be5a2f19964de0780490b61467897
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
      - name: Exercise checkout v7 against exact private source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/3fa-backend.rs
          ref: e1152ef13193524f56cc45ad7cd55223b2ce9d3c
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Guard exact workflow-only delta
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_MAIN_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/ores-lint-hook-contract.yml"
          git diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
      - name: Validate workflow syntax and hook contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
          sh -n .ores-lint/install-git-hooks.sh
          sh -n .ores-lint/test-install-git-hooks.sh
          sh .ores-lint/test-install-git-hooks.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: Locked Rust source suite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --quiet --locked --all-targets --all-features
          cargo test --quiet --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Final immutable source guard
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_SHA" >/dev/null
          git clean -ffd >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
