name: ores-stack P2 final ingress authority current-main cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-p2-246-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET_SHA: '482bc044976bb9067149424814aa527d9bc5737f'
  TARGET_BRANCH: 'salvage/p2-strict-authority-current-main-20260922'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact current-main restack
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$TARGET_SHA"
          git -C ores-stack checkout -b certify FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C ores-stack status --porcelain)" = ""
      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
      - name: Format regression and refresh final middleware lock
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ores-stack-p2-edge-minimal/tests/ingress_authority.rs
          rustfmt --edition 2024 --check crates/ores-stack-p2-edge-minimal/src/lib.rs crates/ores-stack-p2-edge-minimal/tests/ingress_authority.rs
          cargo check -p ores-stack-p2-edge-minimal --all-targets
          test -f Cargo.lock
          git diff --check
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' Cargo.lock crates/ores-stack-p2-edge-minimal/tests/ingress_authority.rs | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Certify final P2 ingress authority with frozen lock
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked -p ores-stack-p2-edge-minimal --all-targets
          cargo test --locked -p ores-stack-p2-edge-minimal -- --nocapture
          cargo clippy --locked -p ores-stack-p2-edge-minimal --all-targets -- -D warnings
          git diff --check
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' Cargo.lock crates/ores-stack-p2-edge-minimal/tests/ingress_authority.rs | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
      - name: Commit certified formatting and lock evidence
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA" || { echo "source branch moved: expected $TARGET_SHA got $remote_head"; exit 1; }
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' Cargo.lock crates/ores-stack-p2-edge-minimal/tests/ingress_authority.rs | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          git config user.name 'ores-stack certification'
          git config user.email 'actions@users.noreply.github.com'
          git add Cargo.lock crates/ores-stack-p2-edge-minimal/tests/ingress_authority.rs
          git commit -m 'test(p2): freeze final ingress authority evidence'
          git push origin HEAD:"$TARGET_BRANCH"
