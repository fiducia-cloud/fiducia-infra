name: proof-beamscale-promotion-suites

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supervisor-cowboy-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SUPERVISOR_SHA: e6924c658467a065c81da5035fd8510d54aadfed
      UPGRADE_SUITE_SHA: 028d183ce941dc4cdb51d394329eee2cd37fdcff
      BASELINE_SHA: 9c8492fa261ccba8fb4a34688412dea9b1240737
      CURRENT_SHA: e1300bb973d002b7f6221b7c57da14b90ac9f782
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-supervisor
          ref: ${{ env.SUPERVISOR_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: supervisor
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale-test/bmscl-test-upgrade-compatibility-tests
          ref: ${{ env.UPGRADE_SUITE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: suite
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-compiler
          ref: ${{ env.BASELINE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: compiler-baseline
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-compiler
          ref: ${{ env.CURRENT_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: compiler-current
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact candidate and harness identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C supervisor rev-parse HEAD)" = "$SUPERVISOR_SHA"
          test "$(git -C suite rev-parse HEAD)" = "$UPGRADE_SUITE_SHA"
          test "$(git -C compiler-baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C compiler-current rev-parse HEAD)" = "$CURRENT_SHA"
          grep -Fq '{cowboy, "2.19.0"}' supervisor/rebar.config
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27.3"
          gleam-version: "1.18.0"
          rebar3-version: "3.27.0"
          version-type: strict
      - name: Supervisor compile, EUnit and xref
        working-directory: supervisor
        run: |
          rebar3 compile
          rebar3 eunit
          rebar3 xref
      - name: Run full signed-artifact upgrade proof against candidate supervisor
        env:
          BMSCL_COMPILER_BASELINE_DIR: ${{ github.workspace }}/compiler-baseline
          BMSCL_COMPILER_CURRENT_DIR: ${{ github.workspace }}/compiler-current
          BMSCL_SUPERVISOR_DIR: ${{ github.workspace }}/supervisor
        run: bash suite/scripts/run_compat.sh
      - name: Prove exact source checkouts stayed clean
        run: |
          git -C supervisor diff --exit-code
          git -C suite diff --exit-code
          git -C compiler-baseline diff --exit-code
          git -C compiler-current diff --exit-code

  chaos-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUITE_SHA: 1e037c893a5fcb4f0268712c8994b9022a8e65d5
      INFRA_SHA: 1c7699c12f53f088b493d0a07018082bb5ce8477
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale-test/bmscl-test-chaos-recovery-tests
          ref: ${{ env.SUITE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: suite
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-infra
          ref: ${{ env.INFRA_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: infra
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact identities and harness syntax
        run: |
          set -euo pipefail
          test "$(git -C suite rev-parse HEAD)" = "$SUITE_SHA"
          test "$(git -C infra rev-parse HEAD)" = "$INFRA_SHA"
          bash -n suite/scripts/churn_mock_runtime.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Churn runtime lifecycle and epochs
        working-directory: suite
        env:
          BMSCL_RUNTIME_HOST_DIR: ${{ github.workspace }}/infra/modules/tenant_runtime/runtime-host
        run: bash scripts/churn_mock_runtime.sh
      - name: Re-run runtime-host tests after churn
        working-directory: infra
        env:
          BMSCL_RUNTIME_BACKEND: mock
        run: cargo test --manifest-path modules/tenant_runtime/runtime-host/Cargo.toml --all-targets
      - name: Prove exact source checkouts stayed clean
        run: |
          git -C suite diff --exit-code
          git -C infra diff --exit-code

  cold-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUITE_SHA: 48bbbfac7503dcd97be4abbebedfda4de1c9955d
      INFRA_SHA: 1c7699c12f53f088b493d0a07018082bb5ce8477
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale-test/bmscl-test-cold-start-performance-e2e
          ref: ${{ env.SUITE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: suite
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-infra
          ref: ${{ env.INFRA_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: infra
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact identities and harness syntax
        run: |
          set -euo pipefail
          test "$(git -C suite rev-parse HEAD)" = "$SUITE_SHA"
          test "$(git -C infra rev-parse HEAD)" = "$INFRA_SHA"
          bash -n suite/scripts/mock_cold_start.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Probe mock cold-start control plane
        working-directory: suite
        env:
          BMSCL_RUNTIME_HOST_DIR: ${{ github.workspace }}/infra/modules/tenant_runtime/runtime-host
          BMSCL_MOCK_COLD_START_MAX_MS: "2000"
        run: bash scripts/mock_cold_start.sh
      - name: Verify cold-start evidence shape
        working-directory: suite
        run: |
          python3 - <<'PY'
          import json
          evidence = json.load(open('cold-start-evidence.json'))
          assert evidence['schema'] == 'bmscl.mock-cold-start.v1'
          assert isinstance(evidence['elapsed_ms'], int) and evidence['elapsed_ms'] >= 0
          PY
      - name: Prove exact source checkouts stayed clean
        run: |
          git -C suite diff --exit-code
          git -C infra diff --exit-code

  cli-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUITE_SHA: 0ae687fae73a049724cbe8b1b2daeef4601d782b
      RUST_SHA: 7a1f2706e1265c0cf3db7de723d9fbe45f5c3695
      GLEAM_SHA: 7b4daa4d71101ef54af4c42bdb665686685829a4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale-test/bmscl-test-cli-user-journey-e2e
          ref: ${{ env.SUITE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: suite
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-cli
          ref: ${{ env.RUST_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: rust-cli
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-cli-gleam
          ref: ${{ env.GLEAM_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: gleam-cli
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact suite and CLI identities
        run: |
          set -euo pipefail
          test "$(git -C suite rev-parse HEAD)" = "$SUITE_SHA"
          test "$(git -C rust-cli rev-parse HEAD)" = "$RUST_SHA"
          test "$(git -C gleam-cli rev-parse HEAD)" = "$GLEAM_SHA"
          rustc --edition=2021 -D warnings suite/scripts/verify_source_lock.rs -o /tmp/verify-cli-source-lock
          (cd suite && /tmp/verify-cli-source-lock)
          rustc --edition=2021 -D warnings suite/scripts/compare_help.rs -o /tmp/compare-cli-help
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27.3"
          gleam-version: "1.15.0"
          rebar3-version: "3.24.0"
          version-type: strict
      - name: Rust CLI strict gates and help
        working-directory: rust-cli
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
          cargo run --quiet -- --help > ../suite/rust-help.txt
      - name: Gleam CLI build, EUnit regressions and help
        working-directory: gleam-cli
        run: |
          set -euo pipefail
          gleam deps download
          gleam format --check src
          gleam check
          gleam build
          ebin="$RUNNER_TEMP/bmscl-cli-gleam-eunit"
          mkdir -p "$ebin"
          erlc -DTEST -o "$ebin" src/bmscl_dev_ffi.erl
          erlc -o "$ebin" test/bmscl_dev_state_tests.erl
          erl -noshell -pa "$ebin" -eval 'case eunit:test(bmscl_dev_state_tests, [verbose]) of ok -> halt(0); _ -> halt(1) end.'
          erlc -o "$ebin" src/bmscl_deploy_ffi.erl src/bmscl_provider_deploy_ffi.erl src/bmscl_provider_bundle_ffi.erl test/bmscl_provider_deploy_tests.erl
          erl -noshell -pa "$ebin" build/dev/erlang/*/ebin -eval 'case eunit:test(bmscl_provider_deploy_tests, [verbose]) of ok -> halt(0); _ -> halt(1) end.'
          gleam run -- --help > ../suite/gleam-help.txt
      - name: Compare actual command surfaces
        working-directory: suite
        run: /tmp/compare-cli-help
      - name: Prove exact source checkouts stayed clean
        run: |
          git -C rust-cli diff --exit-code
          git -C gleam-cli diff --exit-code


  umbrella-rust-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUITE_SHA: 821ad95dc9f3f873e0863845b76d6f8a7dafa466
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale-test/bmscl-test-e2e
          ref: ${{ env.SUITE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: suite
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact suite identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C suite rev-parse HEAD)" = "$SUITE_SHA"
          test -f suite/scripts/verify_baseline.rs
          test ! -e suite/scripts/verify_baseline.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Compile and run Rust promotion baseline
        working-directory: suite
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings scripts/verify_baseline.rs -o /tmp/verify-baseline
          /tmp/verify-baseline
      - name: Prove exact suite checkout stayed clean
        run: git -C suite diff --exit-code

  api-contract-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUITE_SHA: 42426c3c9ab9ec838e7b4d66a6f53ff14d8ec1df
      API_SHA: c41a310b5c9374e1e2adb0460268a7e0940a13cf
      INFRA_SHA: 8212ebc70d85676a21b50657589b10f6a69fb1f7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale-test/bmscl-test-api-contract-e2e
          ref: ${{ env.SUITE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: suite
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-api-server.rs
          ref: ${{ env.API_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: api
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-infra
          ref: ${{ env.INFRA_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: infra
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact suite and production identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C suite rev-parse HEAD)" = "$SUITE_SHA"
          test "$(git -C api rev-parse HEAD)" = "$API_SHA"
          test "$(git -C infra rev-parse HEAD)" = "$INFRA_SHA"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Validate immutable source lock in Rust
        working-directory: suite
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings scripts/verify_source_lock.rs -o /tmp/verify-source-lock
          /tmp/verify-source-lock
      - name: Run activation consumer/provider assertion
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings suite/scripts/assert_activate_contract.rs -o /tmp/assert-activate-contract
          /tmp/assert-activate-contract
      - name: API strict gates
        working-directory: api
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
      - name: Runtime-host tests
        working-directory: infra
        env:
          BMSCL_RUNTIME_BACKEND: mock
        run: cargo test --manifest-path modules/tenant_runtime/runtime-host/Cargo.toml --all-targets
      - name: Prove exact source checkouts stayed clean
        run: |
          git -C suite diff --exit-code
          git -C api diff --exit-code
          git -C infra diff --exit-code
