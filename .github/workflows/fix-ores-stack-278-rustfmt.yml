name: fix ores-stack 278 rustfmt

on:
  push:
    branches:
      - proof/ores-stack-278-governance-20260924
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-stack
  SOURCE_BRANCH: feat/cli-contract-governance-v1-20260922
  SOURCE_SHA: a673b93cb728c5d9c23d9ea59c0baffc9705f36e

jobs:
  format-source-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
      - name: Check out exact source branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-stack
          ref: feat/cli-contract-governance-v1-20260922
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
      - name: Guard immutable preimage
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply only PR-owned rustfmt delta
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          test -n "$(git diff -- crates/ores-stack-cli/src/contract_cli.rs)"
          test -z "$(git diff -- crates/ores-stack-cli/src/entry.rs)"
          git add -- crates/ores-stack-cli/src/contract_cli.rs
          test "$(git diff --cached --name-only)" = 'crates/ores-stack-cli/src/contract_cli.rs'
          git config user.name ORESoftware
          git config user.email alexander.d.mills@gmail.com
          git commit -m 'style(cli): rustfmt governance contract checker'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = 'crates/ores-stack-cli/src/contract_cli.rs'
      - name: Push with exact-head lease
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git push "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "HEAD:refs/heads/${SOURCE_BRANCH}" --force-with-lease="refs/heads/${SOURCE_BRANCH}:${SOURCE_SHA}"
