name: pmap-crossborder-schema-inline-cert

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pmap-crossborder-schema-inline-cert.yml"

permissions:
  contents: read

jobs:
  certify-and-land:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
      LIB_CORE_MAIN_SHA: e4228ff170530b032e6781e04ee967ef54ba5df4
      INTERFACES_MAIN_SHA: 7f6974339e89f8fa9de1ec480300dcbc2613cd1b
      API_MAIN_SHA: f32ab9072da6299149f41e2003aac2add6a61905
      ORES_API_DOCS_SHA: 2dbd222872a93a6fac02521f8b8d982dc406f146
      CROSSBORDER_SCHEMA_ID: https://premarital-asset-protection.oresoftware.dev/schemas/crossborder-report.schema.json
    steps:
      - name: Require cross-org source authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"

      - name: Check out exact PMAP repositories
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: premarital-asset-protection/pmap-lib-core
          ref: ${{ env.LIB_CORE_MAIN_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: pmap-lib-core
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: premarital-asset-protection/pmap-interfaces
          ref: ${{ env.INTERFACES_MAIN_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: pmap-interfaces
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: premarital-asset-protection/pmap-api-server.rs
          ref: ${{ env.API_MAIN_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: pmap-api
          persist-credentials: false

      - name: Inline the authoritative crossborder response schema
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pmap-lib-core rev-parse HEAD)" = "$LIB_CORE_MAIN_SHA"
          test "$(git -C pmap-interfaces rev-parse HEAD)" = "$INTERFACES_MAIN_SHA"
          test "$(git -C pmap-api rev-parse HEAD)" = "$API_MAIN_SHA"
          schema=pmap-interfaces/json-schema/crossborder-report.schema.json
          test "$(jq -r '."$id"' "$schema")" = "$CROSSBORDER_SCHEMA_ID"

          jq --slurpfile schema "$schema" \
            '.map.assess_crossborder.response_schema = $schema[0]' \
            pmap-lib-core/route-maps/api.route-map.json \
            > pmap-lib-core/route-maps/api.route-map.json.next
          mv pmap-lib-core/route-maps/api.route-map.json.next pmap-lib-core/route-maps/api.route-map.json
          cp pmap-lib-core/route-maps/api.route-map.json pmap-interfaces/route-maps/api.route-map.json

          cmp pmap-lib-core/route-maps/api.route-map.json pmap-interfaces/route-maps/api.route-map.json
          test "$(jq -r '.map.assess_crossborder.response_schema."$id"' pmap-lib-core/route-maps/api.route-map.json)" = "$CROSSBORDER_SCHEMA_ID"
          test "$(jq -r '.map.assess_crossborder.response_schema."$ref" // empty' pmap-lib-core/route-maps/api.route-map.json)" = ""
          jq -S '.map.assess_crossborder.response_schema' pmap-lib-core/route-maps/api.route-map.json > /tmp/embedded.json
          jq -S . "$schema" > /tmp/authority.json
          cmp /tmp/embedded.json /tmp/authority.json
          test "$(git -C pmap-lib-core diff --name-only)" = "route-maps/api.route-map.json"
          test "$(git -C pmap-interfaces diff --name-only)" = "route-maps/api.route-map.json"

      - name: Validate lib-core with the offline response schema
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path pmap-lib-core/Cargo.toml --locked
          cargo clippy --manifest-path pmap-lib-core/Cargo.toml --all-targets --locked -- -D warnings

      - name: Validate current API fully against candidate lib-core
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/"
          sed -i '/^ores-api-docs = /c\ores-api-docs = { git = "https://github.com/ORESoftware/api-docs", rev = "'"$ORES_API_DOCS_SHA"'", features = ["axum"] }' pmap-api/Cargo.toml
          sed -i '/^pmap-lib-core = /c\pmap-lib-core = { path = "../pmap-lib-core", features = ["http"] }' pmap-api/Cargo.toml
          sed -i '/^pmap-crossborder = /c\pmap-crossborder = { path = "../pmap-lib-core/crossborder", features = ["serde"] }' pmap-api/Cargo.toml
          (cd pmap-api && cargo generate-lockfile)
          cargo fmt --manifest-path pmap-api/Cargo.toml --package pmap-api-server -- --check
          cargo test --manifest-path pmap-api/Cargo.toml --package pmap-api-server --locked
          cargo clippy --manifest-path pmap-api/Cargo.toml --package pmap-api-server --all-targets --locked -- -D warnings

      - name: Guard exact shared remote heads
        shell: bash
        run: |
          set -euo pipefail
          auth="url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf=https://github.com/"
          test "$(git -C pmap-lib-core -c "$auth" ls-remote origin refs/heads/main | awk '{print $1}')" = "$LIB_CORE_MAIN_SHA"
          test "$(git -C pmap-interfaces -c "$auth" ls-remote origin refs/heads/main | awk '{print $1}')" = "$INTERFACES_MAIN_SHA"

      - name: Publish lib-core offline-schema repair
        shell: bash
        run: |
          set -euo pipefail
          auth="url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf=https://github.com/"
          git -C pmap-lib-core config user.name "ORESoftware"
          git -C pmap-lib-core config user.email "alex@oresoftware.com"
          git -C pmap-lib-core add route-maps/api.route-map.json
          git -C pmap-lib-core commit -m "fix(routes): inline crossborder response schema" -m "Keep v1 route admission deterministic and offline by embedding the existing authoritative Draft 2020-12 crossborder report schema instead of resolving its public URL at runtime."
          git -C pmap-lib-core -c "$auth" push origin HEAD:main

      - name: Publish interfaces mirror repair
        shell: bash
        run: |
          set -euo pipefail
          auth="url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf=https://github.com/"
          git -C pmap-interfaces config user.name "ORESoftware"
          git -C pmap-interfaces config user.email "alex@oresoftware.com"
          git -C pmap-interfaces add route-maps/api.route-map.json
          git -C pmap-interfaces commit -m "fix(routes): inline crossborder response schema" -m "Mirror the validated v1 API route map exactly so contract admission never depends on a runtime network fetch."
          git -C pmap-interfaces -c "$auth" push origin HEAD:main
