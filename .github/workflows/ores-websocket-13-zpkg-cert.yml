name: ores-websocket #13 funded Zed certification

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ores-websocket-13-zpkg-cert.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SOURCE_REPO: ORESoftware/ores-websocket
  SOURCE_BRANCH: fix/zpkg-universal-language-20260922
  SOURCE_SHA: 6d36f70197c0b047c8d7b12d5ad44e861716a8b7
  SOURCE_MAIN_SHA: 8cceeaf7142c469bc7ef55c16dc51ae0f9aeb43e
  ZED_CLI_SHA: 69fce161e456d758459cab5d3a6441f599769bfa

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Checkout exact source head
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/ores-websocket.git
          git -C source fetch --depth=20 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_MAIN_SHA"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source merge-base HEAD "$SOURCE_MAIN_SHA")" = "$SOURCE_MAIN_SHA"
          mapfile -t changed < <(git -C source diff --name-only "$SOURCE_MAIN_SHA"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = .zpkg.toml
          diff_text="$(git -C source diff --unified=0 "$SOURCE_MAIN_SHA"..HEAD -- .zpkg.toml)"
          printf '%s\n' "$diff_text"
          printf '%s\n' "$diff_text" | grep -F -- '-language = "multi"'
          printf '%s\n' "$diff_text" | grep -F -- '+language = "universal"'
          test "$(printf '%s\n' "$diff_text" | grep -Ec '^[+-][^+-]')" -eq 2
          test -z "$(git -C source status --porcelain)"
      - name: Install current pinned Zed CLI authority
        run: cargo install --git https://github.com/zed-pkg/zed-cli --rev "$ZED_CLI_SHA" --locked zed-cli
      - name: Validate corrected manifest with retained diagnostics
        working-directory: source
        run: |
          set -uo pipefail
          set +e
          zed validate 2>&1 | tee /tmp/zed-validate.log
          rc=${PIPESTATUS[0]}
          set -e
          if test "$rc" -eq 0; then echo pass > /tmp/zed-validate-status; else echo fail > /tmp/zed-validate-status; fi
          exit 0
      - name: Materialize dependency graph
        if: ${{ always() }}
        working-directory: source
        run: |
          set -euo pipefail
          test "$(cat /tmp/zed-validate-status 2>/dev/null || echo missing)" = pass
          zed install --allow-build --install-mode copy 2>&1 | tee /tmp/zed-install.log
      - name: Validate generated lock
        if: ${{ always() }}
        working-directory: source
        run: |
          set -euo pipefail
          test "$(cat /tmp/zed-validate-status 2>/dev/null || echo missing)" = pass
          zed validate --require-lock 2>&1 | tee /tmp/zed-lock-validate.log
      - name: Upload Zed diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ores-websocket-13-zed-diagnostics
          path: |
            /tmp/zed-validate.log
            /tmp/zed-validate-status
            /tmp/zed-install.log
            /tmp/zed-lock-validate.log
          if-no-files-found: warn
      - name: Final exact-source decision
        if: ${{ always() }}
        working-directory: source
        run: |
          set -euo pipefail
          test "$(cat /tmp/zed-validate-status 2>/dev/null || echo missing)" = pass
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
          git diff --exit-code -- .zpkg.toml
          echo ORES_WEBSOCKET_13_ZPKG_CERT_PASS
