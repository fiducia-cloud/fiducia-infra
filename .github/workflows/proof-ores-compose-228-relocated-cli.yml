name: proof ores-compose 228 relocated CLI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-compose-228-relocated-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_SHA: f6bf74ecb9b77348471d5be0480617faafb8536a

jobs:
  relocated-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact ores-compose head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$COMPOSE_SHA"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.90"

      - name: Configure scoped private dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global "url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf" "https://github.com/"

      - name: Test embedded contract helper
        run: |
          set -euo pipefail
          cargo test --locked --bin ores-compose embedded_flag_contract_is_runtime_portable_and_cleaned_up

      - name: Install binary from exact source
        run: |
          set -euo pipefail
          cargo install --locked --path . --root "$RUNNER_TEMP/ores-compose-install" --bin ores-compose
          test -x "$RUNNER_TEMP/ores-compose-install/bin/ores-compose"

      - name: Delete source and prove relocated binary
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/ores-compose-install/bin/ores-compose"
          proof_root="$RUNNER_TEMP/relocated-proof"
          mkdir -p "$proof_root"
          cat > "$proof_root/compose.yaml" <<'YAML'
          schema_version: ores.compose.v1
          project: relocated-cli-proof
          allow_lazy_start: false
          services:
            app:
              runtime: host
              command: ["/bin/true"]
          YAML

          cd "$proof_root"
          rm -rf "$GITHUB_WORKSPACE"
          test ! -e "$GITHUB_WORKSPACE"

          "$binary" --help > help.txt
          grep -q 'ores-compose' help.txt
          "$binary" check compose.yaml
          "$binary" plan compose.yaml

      - name: Remove private credential rewrite
        if: always()
        shell: bash
        run: |
          git config --global --unset-all "url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf" >/dev/null 2>&1 || true
