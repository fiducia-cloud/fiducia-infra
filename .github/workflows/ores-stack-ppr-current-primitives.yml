name: ores-stack-ppr-current-primitives

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-ppr-current-primitives.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  FRAMING_SHA: '55cd3a6adaf840561c8ff50059bfd606d5398171'
  PROCESS_TREE_SHA: 'cfbad0c0583db82d2796b04badfff86db6cf8fb0'

jobs:
  framing-214:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact merged framing head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$FRAMING_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$FRAMING_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Bootstrap lock evidence
        shell: bash
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure

      - name: Framing rustfmt
        shell: bash
        working-directory: ores-stack
        run: cargo fmt --all -- --check

      - name: Framing diff check
        shell: bash
        working-directory: ores-stack
        run: git diff --check

      - name: Framing cargo check
        shell: bash
        working-directory: ores-stack
        run: cargo check --locked -p ores-stack-ppr-http --all-targets

      - name: Framing tests
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-ppr-http -- --nocapture

      - name: Framing clippy
        shell: bash
        working-directory: ores-stack
        run: cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings

  process-tree-218:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack process-tree head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$PROCESS_TREE_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$PROCESS_TREE_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Bootstrap lock evidence
        shell: bash
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure

      - name: Process-tree rustfmt
        shell: bash
        working-directory: ores-stack
        run: cargo fmt --all -- --check

      - name: Process-tree diff check
        shell: bash
        working-directory: ores-stack
        run: git diff --check

      - name: Process-tree cargo check
        shell: bash
        working-directory: ores-stack
        run: cargo check --locked -p ores-stack-process-tree --all-targets

      - name: Process-tree tests
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-process-tree -- --nocapture

      - name: Process-tree clippy
        shell: bash
        working-directory: ores-stack
        run: cargo clippy --locked -p ores-stack-process-tree --all-targets -- -D warnings
