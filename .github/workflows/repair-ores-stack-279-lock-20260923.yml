name: repair ores-stack 279 Cargo lock exact head

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/repair-ores-stack-279-lock-20260923.yml']

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-stack
  SOURCE_BRANCH: feat/stack-dev-build-deploy-ppr-20260923
  SOURCE_SHA: 178c31b3343245a93098ec73b3c07ea44c4b3772

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact failing source head
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C source fetch --depth=2 origin "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout -B "$SOURCE_BRANCH" "$SOURCE_SHA"

      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustc --version | grep -F 'rustc 1.88.0'

      - name: Regenerate and constrain lockfile repair
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          old_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          cargo generate-lockfile
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "Cargo.lock"
          new_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          test "$new_sha" != "$old_sha"
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          echo "old Cargo.lock sha256=$old_sha"
          echo "new Cargo.lock sha256=$new_sha"

      - name: Commit exact lockfile repair
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          remote="$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote" = "$SOURCE_SHA"
          git config user.name "ORESoftware CI repair"
          git config user.email "ci-repair@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(stack): refresh Cargo lockfile"
          git push "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "HEAD:refs/heads/${SOURCE_BRANCH}"
