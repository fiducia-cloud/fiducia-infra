name: proof ores-compose Clippy tranche

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-compose-clippy-tranche.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_SHA: 8bd3477581b25bc24e29a117e76d477776726fd4

jobs:
  clippy-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact ores-compose head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$COMPOSE_SHA"
      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Install reviewed Rust components
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup default 1.98.1
      - name: Full tests
        run: cargo test --all-targets --all-features
      - name: Full Clippy debt frontier
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Final exact-head guard
        if: always()
        run: test "$(git rev-parse HEAD)" = "$COMPOSE_SHA"
