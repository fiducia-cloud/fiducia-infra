name: proof-ores-stack-305

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-stack-305.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 8993ca5e471d56914724207f8e0065d8e332bafc

jobs:
  lambda-build-manifest-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact ORES Stack head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact source and layer boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          grep -F '@minValue(0)' contracts/route-manifest.tsp
          grep -F '"minimum": 0' contracts/route-manifest.schema.json
          grep -F -- '--mapping=contracts/ores-lambda-callable-registry.mapping.json' package.json
          grep -F -- '--mapping=contracts/ores-lambda-build-manifest.mapping.json' package.json
          grep -F 'ores.typespec-json-schema-validator.mapping/v1' contracts/ores-lambda-build-manifest.mapping.json
          grep -F '"manifest"' contracts/ores-lambda-build-manifest.schema.json
          grep -F '@uniqueItems' contracts/ores-lambda-build-manifest.tsp
          grep -F '@extension(' contracts/ores-lambda-build-manifest.tsp
          test ! -e contracts/ores-lambda-artifact-receipt.mapping.json

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install pinned contract toolchain
        shell: bash
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Verify pinned TJSV executable
        shell: bash
        run: |
          set -euo pipefail
          test -x node_modules/.bin/tjsv
          node_modules/.bin/tjsv --help >/dev/null

      - name: Prove prior callable-registry layer remains green
        shell: bash
        run: npm run check:lambda-callable-registry

      - name: Prove lambda-build-manifest peer-authority parity
        shell: bash
        run: |
          set -uo pipefail
          if npm run check:lambda-build-manifest; then
            exit 0
          fi
          report=.ores-stack/lambda-build-manifest-schema-parity.json
          if [[ -f "$report" ]]; then
            echo '--- TJSV lambda build manifest report ---'
            cat "$report"
          fi
          exit 1

      - name: Prove base contracts remain green
        shell: bash
        run: |
          set -euo pipefail
          npm run check:route-manifest
          npm run check:config
          npm run check:web-config
          npm run check:web-admission
          npm run check:web-plan
          npm run check:web-lambda-build-unit
          npm run check:lambda-callable-id

      - name: Prove tracked source unchanged
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
