# Audits .cli-flags.toml against the flags-2-env submodule so documented CLI flags
# stay in sync. Triggers only when the flag config or its tooling changes.
name: CLI flags

on:
  pull_request:
    paths:
      - ".github/workflows/cli-flags.yml"
      - ".cli-flags.toml"
      - ".gitmodules"
      - "vendor/flags-2-env"
      - "scripts/with-flags2env.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cli-flags.yml"
      - ".cli-flags.toml"
      - ".gitmodules"
      - "vendor/flags-2-env"
      - "scripts/with-flags2env.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # Builds and runs submodule code — never for PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: make -B -C vendor/flags-2-env all
      - run: vendor/flags-2-env/build/flags2env audit .cli-flags.toml

  repair-compose-policy-test:
    if: github.event_name == 'pull_request' && github.head_ref == 'proof/ores-local-isolation-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_SHA: d9b46da154de350ea21760f1c61d9bc85981ab02
      COMPOSE_BRANCH: hardening/stream-isolation-env-20260926
    steps:
      - name: Checkout exact compose candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact clean source head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPOSE_SHA"
          test -z "$(git status --porcelain)"

      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Replace representation-sensitive assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/local_up_process.rs')
          text = path.read_text()
          old = '        assert!(contents.contains("Example_Key: \\\"\\\""));\n'
          new = (
              '        let policy_document: serde_yaml::Value = serde_yaml::from_str(&contents).unwrap();\n'
              '        assert_eq!(\n'
              '            policy_document["processes"]["target"]["environment"]["Example_Key"].as_str(),\n'
              '            Some("")\n'
              '        );\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one representation-sensitive assertion, found {count}')
          path.write_text(text.replace(old, new))
          PY
          test "$(git diff --name-only)" = "src/local_up_process.rs"
          git diff --check

      - name: Install reviewed Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Prove semantic assertion and full library
        run: |
          cargo test --lib generated_isolation_policy_is_private_same_user_local_profile
          cargo test --lib

      - name: Recheck confined diff
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "src/local_up_process.rs"
          git diff --check

      - name: Publish repair if source branch is unchanged
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git fetch "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-compose.git" "$COMPOSE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$COMPOSE_SHA"
          git config user.name "ORESoftware CI Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local_up_process.rs
          git commit -m "test: assert isolation environment semantically"
          git push "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-compose.git" "HEAD:refs/heads/${COMPOSE_BRANCH}"
