name: ores-stack #283 exact-head certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-283-governance-cert.yml'
  push:
    branches:
      - test/ores-stack-283-governance-cert-20260923
    paths:
      - '.github/workflows/ores-stack-283-governance-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  STACK_BASE: 'a673b93cb728c5d9c23d9ea59c0baffc9705f36e'
  STACK_HEAD: '6e537d73eebc786ad4bd6cbc072509b6a569fe6c'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact ores-stack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: ${{ env.STACK_HEAD }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify immutable source identity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STACK_HEAD"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Configure authenticated GitHub dependency access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.88.0 rustfmt clippy

      - name: Apply deterministic rustfmt repair to #283 candidate files
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$STACK_BASE"
          cargo +1.88.0 fmt --all
          mapfile -t fmt_changed < <(git diff --name-only | sort)
          mapfile -t candidate_changed < <(git diff --name-only "$STACK_BASE"..HEAD | sort)
          printf '%s\n' "${fmt_changed[@]}" > "$RUNNER_TEMP/fmt-changed"
          printf '%s\n' "${candidate_changed[@]}" > "$RUNNER_TEMP/candidate-changed"
          mapfile -t candidate_fmt_changed < <(comm -12 "$RUNNER_TEMP/fmt-changed" "$RUNNER_TEMP/candidate-changed")
          expected=(
            crates/ores-stack-cli/src/contract_cli.rs
            crates/ores-stack-cli/src/stack_cli_hardened.rs
          )
          if (( ${#candidate_fmt_changed[@]} != 2 )) || [[ "${candidate_fmt_changed[0]}" != "${expected[0]}" ]] || [[ "${candidate_fmt_changed[1]}" != "${expected[1]}" ]]; then
            echo "refusing unexpected candidate formatting set" >&2
            printf '%s\n' "${candidate_fmt_changed[@]}" >&2
            exit 1
          fi
          for path in "${fmt_changed[@]}"; do
            keep=0
            for candidate in "${candidate_fmt_changed[@]}"; do
              [[ "$path" == "$candidate" ]] && keep=1
            done
            (( keep == 1 )) || git restore --source="$STACK_HEAD" -- "$path"
          done
          git diff --check
          git diff -- "${candidate_fmt_changed[@]}"
          git add -- "${candidate_fmt_changed[@]}"
          test -z "$(git diff --name-only)"
          git config user.name "ores-stack-ci"
          git config user.email "ores-stack-ci@users.noreply.github.com"
          git commit --no-gpg-sign -m "style(governance): rustfmt candidate repairs"
          git push origin "HEAD:refs/heads/feat/governance-v2-scaffold-admission-20260923"

      - name: Install pinned contract tooling
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run exact-head governance certification
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STACK_HEAD"
          cargo +1.88.0 metadata --locked --format-version 1 --no-deps >/dev/null
          cargo +1.88.0 check -p ores-stack-cli --all-targets --locked
          cargo +1.88.0 check -p ores-stack-cli --all-targets --all-features --locked
          cargo +1.88.0 test -p ores-stack-cli --all-targets --locked
          cargo +1.88.0 test -p ores-stack-cli --all-targets --all-features --locked
          cargo +1.88.0 clippy -p ores-stack-cli --all-targets --all-features --locked -- -D warnings
          node --check scripts/check-contracts.mjs
          npm run check:contracts
          mkdir -p .ores-stack
          node --check conformance/check.mjs
          node conformance/check.mjs > .ores-stack/conformance-check.json
          cat .ores-stack/conformance-check.json
