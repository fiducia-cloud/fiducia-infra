name: ores-stack #283 exact-head certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-283-governance-cert.yml'
  push:
    branches:
      - test/ores-stack-283-governance-cert-20260923
    paths:
      - '.github/workflows/ores-stack-283-governance-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  STACK_HEAD: '6e537d73eebc786ad4bd6cbc072509b6a569fe6c'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact ores-stack source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: ${{ env.STACK_HEAD }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify immutable source identity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STACK_HEAD"
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Configure authenticated GitHub dependency access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup component add --toolchain 1.88.0 rustfmt clippy

      - name: Install pinned contract tooling
        working-directory: source
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run exact-head governance certification
        working-directory: source
        shell: bash
        run: ./scripts/certify-governance.sh "$STACK_HEAD"
