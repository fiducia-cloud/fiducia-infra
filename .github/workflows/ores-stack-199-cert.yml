name: ores-stack-199-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-199-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_STACK_SHA: '10d66ec5c159182fb51ea8add396133f7dc6e3a6'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack merged commit
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt

      - name: Format-check changed production files
        shell: bash
        working-directory: ores-stack
        run: |
          rustfmt --edition 2024 --check \
            crates/ores-stack-cli/src/lambda_generate_cli.rs \
            crates/ores-stack-cli/src/stack_dev_hardened.rs

      - name: Bootstrap repository lock evidence
        shell: bash
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure

      - name: Cargo check CLI
        shell: bash
        working-directory: ores-stack
        run: cargo check --locked -p ores-stack-cli --all-targets

      - name: Callable registry contract tests
        shell: bash
        working-directory: ores-stack
        run: |
          cargo test --locked -p ores-stack-core \
            --test lambda_callable_registry_contract \
            --test callable_registry_module_mount \
            -- --nocapture
