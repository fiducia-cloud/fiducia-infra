name: repair ores-stack 279 rustfmt exact head

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/repair-ores-stack-279-rustfmt-20260923.yml']

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-stack
  SOURCE_BRANCH: feat/stack-dev-build-deploy-ppr-20260923
  SOURCE_SHA: d1b2e56a57bc994fc853f695c9b49c2f1b7735cd

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact failing source head
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C source fetch --depth=2 origin "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout -B "$SOURCE_BRANCH" "$SOURCE_SHA"

      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --no-self-update
          rustup default 1.88.0

      - name: Format and constrain repair delta
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed
          printf '%s\n' \
            crates/ores-stack-cli/src/ppr_web_dispatch.rs \
            crates/ores-stack-cli/src/stack_dev_hardened.rs | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          cargo fmt --all -- --check

      - name: Commit exact formatting repair
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          remote=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          test "$remote" = "$SOURCE_SHA"
          git config user.name "ORESoftware CI repair"
          git config user.email "ci-repair@users.noreply.github.com"
          git add crates/ores-stack-cli/src/ppr_web_dispatch.rs crates/ores-stack-cli/src/stack_dev_hardened.rs
          git commit -m "style(stack): apply Rust 1.88 formatting"
          git push "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "HEAD:refs/heads/${SOURCE_BRANCH}"
