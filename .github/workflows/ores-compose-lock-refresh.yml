name: ores-compose Cargo lock refresh proof

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ores-compose-lock-refresh.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  BASE_SHA: '2e0d1488ca32371e4f410f95cf6886674b86876c'
  TARGET_BRANCH: 'fix/refresh-cargo-lock-rust-1-98-20260922'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact baseline branch
        shell: bash
        run: |
          set -euo pipefail
          git init ores-compose
          git -C ores-compose remote add origin https://github.com/ORESoftware/ores-compose.git
          git -C ores-compose fetch --depth=10 origin main "$TARGET_BRANCH"
          test "$(git -C ores-compose rev-parse origin/main)" = "$BASE_SHA"
          test "$(git -C ores-compose rev-parse origin/$TARGET_BRANCH)" = "$BASE_SHA"
          git -C ores-compose checkout -b repair "$BASE_SHA"
          test "$(git -C ores-compose status --porcelain)" = ""
      - name: Install repository-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          cd ores-compose
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'
      - name: Refresh only Cargo.lock
        shell: bash
        working-directory: ores-compose
        run: |
          set -euo pipefail
          cargo generate-lockfile
          git diff --check
          test "$(git diff --name-only)" = 'Cargo.lock'
      - name: Certify refreshed lock
        shell: bash
        working-directory: ores-compose
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked --all-targets
          cargo test --locked --lib -- --nocapture
          git diff --check
          test "$(git diff --name-only)" = 'Cargo.lock'
      - name: Commit and fast-forward lock repair
        shell: bash
        working-directory: ores-compose
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$BASE_SHA" || { echo "target branch moved: expected $BASE_SHA got $remote_head"; exit 1; }
          test "$(git diff --name-only)" = 'Cargo.lock'
          git config user.name 'ORESoftware funded certification'
          git config user.email 'noreply@oresoftware.com'
          git add Cargo.lock
          git commit -m 'chore: refresh Cargo.lock for Rust 1.98.1'
          git push origin HEAD:"$TARGET_BRANCH"
