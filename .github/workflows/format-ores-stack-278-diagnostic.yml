name: diagnose ores-stack 278 rustfmt

on:
  push:
    branches:
      - proof/ores-stack-278-governance-20260924
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: a673b93cb728c5d9c23d9ea59c0baffc9705f36e
  SOURCE_MAIN_SHA: d46c07e0f91c2dbda9b2fee64bdd82f6d52fc1ef

jobs:
  head-rustfmt-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-stack
          ref: a673b93cb728c5d9c23d9ea59c0baffc9705f36e
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Print exact PR-head rustfmt patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo fmt --all
          git diff --no-ext-diff -- crates/ores-stack-cli/src/contract_cli.rs crates/ores-stack-cli/src/entry.rs > /tmp/rustfmt.patch
          test -s /tmp/rustfmt.patch
          test "$(wc -c </tmp/rustfmt.patch)" -lt 60000
          echo '----- BEGIN ORES-STACK-278 RUSTFMT PATCH -----'
          cat /tmp/rustfmt.patch
          echo '----- END ORES-STACK-278 RUSTFMT PATCH -----'
          echo 'all rustfmt-modified files:'
          git diff --name-only

  base-rustfmt-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-stack
          ref: d46c07e0f91c2dbda9b2fee64bdd82f6d52fc1ef
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Control-check base rustfmt state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_MAIN_SHA"
          cargo fmt --all
          echo 'base rustfmt-modified files:'
          git diff --name-only
          echo 'base diff for PR-touched Rust files:'
          git diff --no-ext-diff -- crates/ores-stack-cli/src/contract_cli.rs crates/ores-stack-cli/src/entry.rs
