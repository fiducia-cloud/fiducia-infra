name: Align quote TypeSpec and JSON Schema

on:
  push:
    branches:
      - feat/den-4058-quote-intake-contract

permissions:
  contents: write

concurrency:
  group: repair-quote-contract-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  align-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Align public payload names and nested shapes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('quote-system/contracts/main.tsp')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '''model VersionedPolicyReference {
            id: OpaqueId;
            version: int32;
            contentSha256: Sha256Digest;
          }
          ''',
              '''model SupportPlanReference {
            support_plan_id: OpaqueId;
            version: int32;
            content_sha256: Sha256Digest;
          }

          model SlaPolicyReference {
            sla_policy_id: OpaqueId;
            version: int32;
            content_sha256: Sha256Digest;
          }
          ''',
              1,
          )

          text = text.replace(
              '''  authorizedToSubmit: true;
            informationAccurate: true;
            privacyPolicyVersion: string;
          ''',
              '''  attestations: ApplicationAttestations;
          ''',
              1,
          )

          attachment_model = '''model ApplicationAttestations {
            authorized_to_submit: true;
            information_accurate: true;
            privacy_policy_version: string;
          }

          '''
          marker = 'model ApplicationDocument {'
          if 'model ApplicationAttestations {' not in text:
              text = text.replace(marker, attachment_model + marker, 1)

          milestone_model = '''model ImplementationMilestone {
            name: string;
            target_date: CalendarDate;
            acceptance_criteria: string[];
          }

          '''
          quote_marker = 'model QuoteDocument {'
          if 'model ImplementationMilestone {' not in text:
              text = text.replace(quote_marker, milestone_model + quote_marker, 1)

          replacements = {
              'minorUnits': 'minor_units',
              'postalCode': 'postal_code',
              'contactId': 'contact_id',
              'fullName': 'full_name',
              'workEmail': 'work_email',
              'preferredLanguage': 'preferred_language',
              'timeZone': 'time_zone',
              'preferredChannel': 'preferred_channel',
              'organizationId': 'organization_id',
              'legalName': 'legal_name',
              'doingBusinessAs': 'doing_business_as',
              'verifiedEmailDomains': 'verified_email_domains',
              'entityType': 'entity_type',
              'registrationNumber': 'registration_number',
              'taxIdentifier': 'tax_identifier',
              'operatingCountries': 'operating_countries',
              'employeeBand': 'employee_band',
              'annualRevenueBand': 'annual_revenue_band',
              'parentOrganization': 'parent_organization',
              'subsidiariesInScope': 'subsidiaries_in_scope',
              'problemStatement': 'problem_statement',
              'desiredOutcomes': 'desired_outcomes',
              'useCases': 'use_cases',
              'currentSystems': 'current_systems',
              'currentVendors': 'current_vendors',
              'businessImpact': 'business_impact',
              'targetLaunchDate': 'target_launch_date',
              'decisionDeadline': 'decision_deadline',
              'procurementStage': 'procurement_stage',
              'successMetrics': 'success_metrics',
              'monthlyActiveUsers': 'monthly_active_users',
              'peakConcurrency': 'peak_concurrency',
              'requestsPerMonth': 'requests_per_month',
              'storageGib': 'storage_gib',
              'egressGib': 'egress_gib',
              'eventsPerSecondPeak': 'events_per_second_peak',
              'dataGrowthPercentMonthly': 'data_growth_percent_monthly',
              'seasonalityNotes': 'seasonality_notes',
              'ssoRequired': 'sso_required',
              'scimRequired': 'scim_required',
              'mfaRequired': 'mfa_required',
              'auditEvents': 'audit_events',
              'otelRequired': 'otel_required',
              'deploymentModels': 'deployment_models',
              'kubernetesDistributions': 'kubernetes_distributions',
              'messageBuses': 'message_buses',
              'networkConnectivity': 'network_connectivity',
              'clientPlatforms': 'client_platforms',
              'apiStyles': 'api_styles',
              'customRequirements': 'custom_requirements',
              'atRest': 'at_rest',
              'inTransit': 'in_transit',
              'customerManagedKeys': 'customer_managed_keys',
              'hsmRequired': 'hsm_required',
              'keyRotationDays': 'key_rotation_days',
              'defaultDays': 'default_days',
              'deletionSlaDays': 'deletion_sla_days',
              'legalHoldRequired': 'legal_hold_required',
              'backupRetentionDays': 'backup_retention_days',
              'regulatedData': 'regulated_data',
              'residencyCountries': 'residency_countries',
              'complianceFrameworks': 'compliance_frameworks',
              'securityAssessments': 'security_assessments',
              'incidentNotificationHours': 'incident_notification_hours',
              'migrationRequired': 'migration_required',
              'sourceSystems': 'source_systems',
              'dataVolumeGib': 'data_volume_gib',
              'cutoverStrategy': 'cutover_strategy',
              'downtimeBudgetMinutes': 'downtime_budget_minutes',
              'rollbackRequired': 'rollback_required',
              'validationPlan': 'validation_plan',
              'professionalServicesRequested': 'professional_services_requested',
              'budgetBand': 'budget_band',
              'termMonths': 'term_months',
              'billingFrequency': 'billing_frequency',
              'paymentTermsDays': 'payment_terms_days',
              'purchaseOrderRequired': 'purchase_order_required',
              'invoicePortal': 'invoice_portal',
              'taxExempt': 'tax_exempt',
              'minimumCommitmentAcceptable': 'minimum_commitment_acceptable',
              'pilotRequested': 'pilot_requested',
              'pilotDurationDays': 'pilot_duration_days',
              'initialResponseMinutes': 'initial_response_minutes',
              'updateIntervalMinutes': 'update_interval_minutes',
              'mitigationTargetMinutes': 'mitigation_target_minutes',
              'restorationTargetMinutes': 'restoration_target_minutes',
              'coverageTimeZones': 'coverage_time_zones',
              'namedTam': 'named_tam',
              'onboardingHours': 'onboarding_hours',
              'trainingHours': 'training_hours',
              'severityTargets': 'severity_targets',
              'rtoMinutes': 'rto_minutes',
              'rpoMinutes': 'rpo_minutes',
              'maintenanceWindowPreferences': 'maintenance_window_preferences',
              'serviceCreditExpected': 'service_credit_expected',
              'msaRequired': 'msa_required',
              'dpaRequired': 'dpa_required',
              'baaRequired': 'baa_required',
              'securityAddendumRequired': 'security_addendum_required',
              'subprocessorReviewRequired': 'subprocessor_review_required',
              'accessibilityStandard': 'accessibility_standard',
              'governingLawPreferences': 'governing_law_preferences',
              'liabilityCapPreference': 'liability_cap_preference',
              'indemnityRequirements': 'indemnity_requirements',
              'insuranceRequirements': 'insurance_requirements',
              'exportControlRequirements': 'export_control_requirements',
              'signatureMethod': 'signature_method',
              'attachmentId': 'attachment_id',
              'mediaType': 'media_type',
              'sizeBytes': 'size_bytes',
              'contentSha256': 'content_sha256',
              'malwareScanStatus': 'malware_scan_status',
              'createdAt': 'created_at',
              'privacyPolicyVersion': 'privacy_policy_version',
              'termsVersion': 'terms_version',
              'contactConsent': 'contact_consent',
              'marketingConsent': 'marketing_consent',
              'submittedAt': 'submitted_at',
              'documentType': 'document_type',
              'submissionId': 'submission_id',
              'idempotencyKey': 'idempotency_key',
              'usageForecast': 'usage_forecast',
              'referralSource': 'referral_source',
              'verificationRequired': 'verification_required',
              'applicationId': 'application_id',
              'dataSecurity': 'data_security',
              'updatedAt': 'updated_at',
              'templateId': 'template_id',
              'lineItemId': 'line_item_id',
              'unitPrice': 'unit_price',
              'extendedPrice': 'extended_price',
              'minimumQuantity': 'minimum_quantity',
              'maximumQuantity': 'maximum_quantity',
              'supportPlan': 'support_plan',
              'slaPolicy': 'sla_policy',
              'quoteId': 'quote_id',
              'issuedAt': 'issued_at',
              'validUntil': 'valid_until',
              'billingStart': 'billing_start',
              'lineItems': 'line_items',
              'discountTotal': 'discount_total',
              'taxTotal': 'tax_total',
              'minimumCommitment': 'minimum_commitment',
              'contractReferences': 'contract_references',
              'supersedesQuoteVersion': 'supersedes_quote_version',
              'acceptanceId': 'acceptance_id',
              'quoteVersion': 'quote_version',
              'quoteSha256': 'quote_sha256',
              'signatureProvider': 'signature_provider',
              'signatureEvidenceId': 'signature_evidence_id',
              'acceptedAt': 'accepted_at',
              'sourceIpHash': 'source_ip_hash',
              'userAgentHash': 'user_agent_hash',
              'requestId': 'request_id',
              'fieldErrors': 'field_errors',
              'targetStatus': 'target_status',
              'reasonCode': 'reason_code',
              'assignedContactIds': 'assigned_contact_ids',
              'ifMatch': 'if_match',
          }
          for old, new in replacements.items():
              text = re.sub(rf'\b{re.escape(old)}\b', new, text)

          text = text.replace(
              '  support_plan: VersionedPolicyReference;\n  sla_policy: VersionedPolicyReference;\n',
              '  support_plan: SupportPlanReference;\n  sla_policy: SlaPolicyReference;\n',
              1,
          )
          text = text.replace(
              '  dependencies?: string[];\n  supersedes_quote_version?: int32;\n',
              '  dependencies?: string[];\n  implementation_milestones?: ImplementationMilestone[];\n  supersedes_quote_version?: int32;\n',
              1,
          )
          text = text.replace(
              '  user_agent_hash: Sha256Digest;\n}\n\nmodel ApiError',
              '  user_agent_hash: Sha256Digest;\n  withdrawal_rights?: string;\n}\n\nmodel ApiError',
              1,
          )

          required_fragments = (
              'model ApplicationAttestations {',
              'attestations: ApplicationAttestations;',
              'model SupportPlanReference {',
              'support_plan_id: OpaqueId;',
              'model SlaPolicyReference {',
              'sla_policy_id: OpaqueId;',
              'implementation_milestones?: ImplementationMilestone[];',
              '@route("/v1/applications/{application_id}")',
              '@route("/v1/quotes/{quote_id}")',
          )
          missing = [fragment for fragment in required_fragments if fragment not in text]
          if missing:
              raise SystemExit(f'failed to align TypeSpec fragments: {missing}')

          forbidden = [name for name in replacements if re.search(rf'\b{re.escape(name)}\b', text)]
          if forbidden:
              raise SystemExit(f'camelCase payload identifiers remain: {forbidden}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add permanent cross-contract shape checks
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('quote-system/tests/test_contracts.py')
          text = path.read_text(encoding='utf-8')
          addition = '''
    def test_typespec_payload_names_align_with_json_schema(self) -> None:
        required_markers = (
            'document_type: "pre_interest";',
            'submission_id: OpaqueId;',
            'organization_id: OpaqueId;',
            'usage_forecast: UsageForecast;',
            'data_security: DataSecurityRequirements;',
            'attestations: ApplicationAttestations;',
            'support_plan_id: OpaqueId;',
            'sla_policy_id: OpaqueId;',
            'line_items: QuoteLineItem[];',
            'contract_references: ContractReference[];',
            'implementation_milestones?: ImplementationMilestone[];',
            'quote_sha256: Sha256Digest;',
            'source_ip_hash: Sha256Digest;',
            'user_agent_hash: Sha256Digest;',
            '@route("/v1/applications/{application_id}")',
            '@route("/v1/quotes/{quote_id}")',
        )
        for marker in required_markers:
            self.assertIn(marker, self.typespec)

        forbidden_camel_case = (
            'documentType',
            'submissionId',
            'organizationId',
            'applicationId',
            'usageForecast',
            'dataSecurity',
            'supportPlan',
            'slaPolicy',
            'lineItems',
            'contractReferences',
            'quoteSha256',
            'sourceIpHash',
            'userAgentHash',
        )
        for identifier in forbidden_camel_case:
            self.assertNotRegex(self.typespec, rf'\\b{identifier}\\b')

'''
          needle = '\n    @staticmethod\n    def _walk_items(value):\n'
          if 'test_typespec_payload_names_align_with_json_schema' not in text:
              if needle not in text:
                  raise SystemExit('unable to locate test insertion point')
              text = text.replace(needle, '\n' + addition + needle, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run structural contracts and compile when the lock exists
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile quote-system/tests/test_contracts.py
          python3 -m unittest -v quote-system/tests/test_contracts.py
          if [[ -f quote-system/package-lock.json ]]; then
            (
              cd quote-system
              npm ci --ignore-scripts --no-audit --no-fund
              output_dir="${RUNNER_TEMP}/fiducia-typespec"
              ./node_modules/.bin/tsp compile \
                contracts/main.tsp \
                --config tspconfig.yaml \
                --output-dir "${output_dir}" \
                --warn-as-error
              test -s "${output_dir}/openapi3/fiducia-commercial-intake.openapi.yaml"
            )
          fi

      - name: Remove this one-shot workflow and publish aligned contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/align-quote-typespec-json-schema.yml
          git config user.name 'fiducia-contract-bot'
          git config user.email 'fiducia-contract-bot@users.noreply.github.com'
          git add \
            quote-system/contracts/main.tsp \
            quote-system/tests/test_contracts.py \
            .github/workflows/align-quote-typespec-json-schema.yml
          if ! git diff --cached --quiet; then
            git commit -m 'fix(DEN-4058): align TypeSpec and JSON Schema payloads'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
