name: proof ORES comparisons all 18

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-comparisons-all18.yml'
      - '.github/workflows/proof-ores-comparisons-runtime-project.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPARISONS_SHA: 5c839040dfb222684991271dc6f9034281043649

jobs:
  cached-rpc:
    name: wave 1 cached-rpc / ${{ matrix.stack }}
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/proof-ores-comparisons-runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: cached-rpc
      comparisons_sha: 5c839040dfb222684991271dc6f9034281043649
    secrets: inherit

  http-observability:
    name: wave 2 http-observability / ${{ matrix.stack }}
    needs: cached-rpc
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/proof-ores-comparisons-runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: http-observability
      comparisons_sha: 5c839040dfb222684991271dc6f9034281043649
    secrets: inherit

  forms-chat-workflow:
    name: wave 3 forms-chat-workflow / ${{ matrix.stack }}
    needs: http-observability
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/proof-ores-comparisons-runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: forms-chat-workflow
      comparisons_sha: 5c839040dfb222684991271dc6f9034281043649
    secrets: inherit

  big-org-example-commerce:
    name: wave 4 big-org-example-commerce / ${{ matrix.stack }}
    needs: forms-chat-workflow
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/proof-ores-comparisons-runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: big-org-example-commerce
      comparisons_sha: 5c839040dfb222684991271dc6f9034281043649
    secrets: inherit

  big-org-example-collaboration:
    name: wave 5 big-org-example-collaboration / ${{ matrix.stack }}
    needs: big-org-example-commerce
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/proof-ores-comparisons-runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: big-org-example-collaboration
      comparisons_sha: 5c839040dfb222684991271dc6f9034281043649
    secrets: inherit

  big-org-example-operations:
    name: wave 6 big-org-example-operations / ${{ matrix.stack }}
    needs: big-org-example-collaboration
    strategy:
      fail-fast: false
      matrix:
        stack: [beamscale, scintilla-run, ores-stack]
    uses: ./.github/workflows/proof-ores-comparisons-runtime-project.yml
    with:
      stack: ${{ matrix.stack }}
      scenario: big-org-example-operations
      comparisons_sha: 5c839040dfb222684991271dc6f9034281043649
    secrets: inherit

  aggregate:
    name: aggregate 18/18 proof
    needs: big-org-example-operations
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact ores-comparisons head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-comparisons
          ref: 5c839040dfb222684991271dc6f9034281043649
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.88"
          components: rustfmt

      - name: Download all receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: runtime-proof-*
          path: artifacts/runtime-18
          merge-multiple: true

      - name: Verify exact 18-project receipt set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          rustfmt --edition 2024 --check tools/json_value.rs tools/runtime_receipt_set.rs
          rustc --edition 2024 tools/runtime_receipt_set.rs -o tmp/runtime-receipt-set
          ./tmp/runtime-receipt-set

      - name: Upload aggregate proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-proof-set-18
          path: artifacts/runtime-18-summary.json
          if-no-files-found: error
          retention-days: 30
