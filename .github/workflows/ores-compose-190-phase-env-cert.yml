name: ores-compose #190 phase-env certification

on:
  push:
    branches: [test/ores-compose-190-phase-env-cert]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-compose-190-phase-env-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_HEAD: 7c6b3488a28c86431e4a2c83cea4da3a471363b7
  COMPOSE_BASE: 48bb3a014d4d53b26160936761ea146a8f6722f9
  TJSV_SHA: adda967063b6b52da803cb7c66243aab0f0ebef8

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact ores-compose source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_HEAD }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact PR head and Task 5 scope
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPOSE_HEAD"
          actual="$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-compose.git" refs/pull/190/head | cut -f1)"
          test "$actual" = "$COMPOSE_HEAD"
          git cat-file -e "${COMPOSE_BASE}^{commit}"
          mapfile -t changed < <(git diff --name-only "$COMPOSE_BASE" "$COMPOSE_HEAD")
          expected=(
            contracts/instances/ComposeDocument/invalid/phase-environment-unknown-field.json
            contracts/instances/ComposeDocument/valid/phase-environments.json
            contracts/json-schema/contract.schema.json
            contracts/typespec/main.tsp
            src/config_loader.rs
            src/local_up_process.rs
            src/service_environment.rs
            tests/cli_config_contract.rs
            tests/phase_environment_executor_e2e.rs
            tests/phase_environment_security.rs
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          git diff --check "$COMPOSE_BASE" "$COMPOSE_HEAD"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Check changed Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --check --edition 2021 --config skip_children=true \
            src/config_loader.rs \
            src/local_up_process.rs \
            src/service_environment.rs \
            tests/cli_config_contract.rs \
            tests/phase_environment_executor_e2e.rs \
            tests/phase_environment_security.rs

      - name: Locked metadata
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Compile all targets and features
        run: cargo check --locked --all-targets --all-features

      - name: Run phase policy and executor security tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test phase_environment_security -- --nocapture
          cargo test --locked --test phase_environment_executor_e2e -- --nocapture
          cargo test --locked --lib -- --nocapture environment_admission_is_phase_scoped_and_preserves_replica_identity

      - name: Strict Clippy differential
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings
          head_status=$?
          set -e
          if [[ "$head_status" -eq 0 ]]; then
            exit 0
          fi
          git worktree add --detach /tmp/ores-compose-190-base "$COMPOSE_BASE"
          set +e
          (cd /tmp/ores-compose-190-base && cargo clippy --locked --all-targets --all-features -- -D warnings)
          base_status=$?
          set -e
          if [[ "$base_status" -eq 0 ]]; then
            echo 'base clippy passes but Task 5 head fails' >&2
            exit 41
          fi
          echo 'Task 5 head and its exact base both have strict-Clippy failures; compile/tests remain separately gated.'

      - name: Reconfirm immutable exact head
        if: always()
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPOSE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          actual="$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-compose.git" refs/pull/190/head | cut -f1)"
          test "$actual" = "$COMPOSE_HEAD"

  contract-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: test -n "$ORE_SOURCE_PAT"

      - name: Check out exact ores-compose source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_HEAD }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.0'

      - name: Compare independent TypeSpec and JSON Schema authorities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          npx --yes \
            --package="https://github.com/ORESoftware/typespec-json-schema-validator/archive/${TJSV_SHA}.tar.gz" \
            tjsv check \
            --typespec=contracts/typespec/main.tsp \
            --schema=contracts/json-schema/contract.schema.json \
            --instances=contracts/instances \
            --report=target/phase-env-contract-parity.json
          cat target/phase-env-contract-parity.json
