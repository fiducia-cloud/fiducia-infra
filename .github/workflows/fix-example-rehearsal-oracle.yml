name: fix example rehearsal oracle

on:
  push:
    branches:
      - agent/fix-example-rehearsal-oracle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'fiducia-cloud/fiducia-infra' && github.ref == 'refs/heads/agent/fix-example-rehearsal-oracle'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/fix-example-rehearsal-oracle
          persist-credentials: true
          show-progress: false
          submodules: false

      - name: Apply and verify the one-line test-oracle correction
        shell: bash
        run: |
          set -euo pipefail
          file=tools/laptop-acceptance-campaign.test.mjs
          before='assert.throws(() => validateAcceptanceResults(plan, results), /requires --allow-example/);'
          after='assert.throws(() => validateAcceptanceResults(plan, results), /require(?:s)? --allow-example/);'
          test "$(grep -Fxc "$before" "$file")" = "1"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/laptop-acceptance-campaign.test.mjs')
          before = 'assert.throws(() => validateAcceptanceResults(plan, results), /requires --allow-example/);'
          after = 'assert.throws(() => validateAcceptanceResults(plan, results), /require(?:s)? --allow-example/);'
          text = path.read_text()
          assert text.count(before) == 1
          path.write_text(text.replace(before, after))
          PY
          git diff --check
          test "$(git diff --name-only)" = "$file"
          node --test "$file"

      - name: Commit only the corrected test oracle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/laptop-acceptance-campaign.test.mjs
          test "$(git diff --cached --name-only)" = "tools/laptop-acceptance-campaign.test.mjs"
          git commit -m "test: accept singular or plural rehearsal guard wording"
          git push origin HEAD:agent/fix-example-rehearsal-oracle
