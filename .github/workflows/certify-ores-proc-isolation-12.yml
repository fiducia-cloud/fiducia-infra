name: certify ORESoftware ores-proc-isolation-cli 12

on:
  push:
    branches:
      - proof/ores-proc-isolation-12-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_REPO: ORESoftware/ores-proc-isolation-cli
      SOURCE_SHA: 7361ddbb527eb34dba1b6fdc1266fe3466e55f73
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check HEAD^ HEAD

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Install sandbox helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles apparmor-utils bubblewrap slirp4netns iproute2 iptables shellcheck curl
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || printf '0')" == '1' ]]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$profile"
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Static and Rust checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/linux/ores-proc-isolate.sh
          shellcheck scripts/linux/ores-proc-isolate.sh scripts/macos/ores-proc-isolate.sh
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo run --quiet -- check --config .ores-proc-isolation.yaml
          cargo run --quiet -- doctor --config .ores-proc-isolation.yaml
          cargo build --quiet --examples --bins

      - name: Write strict smoke policy
        shell: bash
        run: |
          cat > /tmp/ores-pi-smoke.yaml <<'YAML'
          version: 1
          defaults:
            group: no-net
          groups:
            no-net:
              network:
                mode: none
            external:
              network:
                mode: external
                deny_loopback: true
                deny_private_networks: true
          processes:
            true:
              group: no-net
              command: [/usr/bin/true]
            passwd:
              group: no-net
              command: [/usr/bin/cat, /etc/passwd]
            internet:
              group: external
              command: [/usr/bin/curl, --fail, --silent, --show-error, --head, https://example.com]
            curl-flex:
              group: external
              command: [/usr/bin/curl, --fail, --silent, --show-error]
          YAML

      - name: Synthetic filesystem works
        run: target/debug/ores-proc-isolation run true --config /tmp/ores-pi-smoke.yaml

      - name: Host file read denied
        shell: bash
        run: |
          if target/debug/ores-proc-isolation run passwd --config /tmp/ores-pi-smoke.yaml; then
            echo 'sandbox unexpectedly read /etc/passwd' >&2
            exit 1
          fi

      - name: External internet egress works
        run: target/debug/ores-proc-isolation run internet --config /tmp/ores-pi-smoke.yaml

      - name: Host loopback denied
        shell: bash
        run: |
          target/debug/examples/loopback_fixture 127.0.0.1:18080 >/tmp/ores-pi-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:18080 >/dev/null
          if target/debug/ores-proc-isolation run curl-flex --config /tmp/ores-pi-smoke.yaml -- http://127.0.0.1:18080; then
            echo 'sandbox unexpectedly reached host loopback' >&2
            exit 1
          fi

      - name: Host non-loopback interface denied
        shell: bash
        run: |
          host_ip=''
          while read -r _ _ family cidr _; do
            if [[ "$family" == 'inet' ]]; then host_ip=${cidr%%/*}; break; fi
          done < <(ip -o -4 addr show scope global)
          test -n "$host_ip"
          target/debug/examples/loopback_fixture 0.0.0.0:18081 >/tmp/ores-pi-host-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          curl --fail --silent "http://${host_ip}:18081" >/dev/null
          if target/debug/ores-proc-isolation run curl-flex --config /tmp/ores-pi-smoke.yaml -- "http://${host_ip}:18081"; then
            echo "sandbox unexpectedly reached host interface ${host_ip}" >&2
            exit 1
          fi

      - name: Final exact-head guard
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
