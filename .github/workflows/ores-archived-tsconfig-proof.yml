name: ORESoftware archived-data dependency proof

on:
  pull_request:
    paths:
      - '.github/workflows/ores-archived-tsconfig-proof.yml'

permissions:
  contents: read

jobs:
  archived-node-types:
    name: ores-archived-and-delete-data#14 exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_REPO: ORESoftware/ores-archived-and-delete-data
      SOURCE_BRANCH: dependabot/npm_and_yarn/src/typescript/types/node-26.6.2
      SOURCE_SHA: e5f214dd988b310c125f18d46e363f6a1b7abff2
      SOURCE_MAIN_SHA: 40b43bff25978ed6ad85ea7a760e97279de91a13
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
      - name: Checkout exact private source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-archived-and-delete-data
          ref: e5f214dd988b310c125f18d46e363f6a1b7abff2
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Guard exact one-file dependency delta
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_MAIN_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "src/typescript/package.json"
          git diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
          git diff --quiet "$SOURCE_MAIN_SHA" "$SOURCE_SHA" -- package.json package-lock.json contracts conformance scripts src/rust src/golang src/gleam src/typescript/tsconfig.json src/typescript/test
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
      - name: Root layout and safety
        working-directory: source
        run: |
          set -euo pipefail
          npm install
          npm run layout:check
          npm run safety:audit
      - name: TypeScript dependency build and tests
        working-directory: source/src/typescript
        run: |
          set -euo pipefail
          npm install
          npm test
      - name: Final immutable source guard
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_SHA" >/dev/null
          git clean -ffd >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
