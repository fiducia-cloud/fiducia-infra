name: ores-stack-247-249-repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-247-249-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  repair_247:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: '80173862ecffc4fee18fd2dd8b261418e7628048'
      TARGET_BRANCH: 'salvage/rpc-http-adapter-main-20260922'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Configure authenticated GitHub access
        shell: bash
        env: { ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}' }
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact #247 branch
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$TARGET_BRANCH"
          git -C ores-stack checkout -b repair FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$TARGET_SHA"
      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
      - name: Run repaired #247 source checks and retain evidence
        shell: bash
        working-directory: ores-stack
        run: |
          set -u
          OUT="$RUNNER_TEMP/repair-247"
          mkdir -p "$OUT"
          set +e
          rustfmt --edition 2024 crates/ores-fn-adapters/src/lib.rs crates/ores-fn-adapters/src/rpc_http.rs >"$OUT/rustfmt.log" 2>&1
          fmt_rc=$?
          git diff --name-only | sort >"$OUT/changed-files.txt"
          git diff --binary >"$OUT/rustfmt.patch"
          if [ "$fmt_rc" -eq 0 ]; then
            cargo check --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets >"$OUT/check.log" 2>&1
            check_rc=$?
          else check_rc=99; fi
          if [ "$check_rc" -eq 0 ]; then
            cargo test --manifest-path crates/ores-fn-adapters/Cargo.toml >"$OUT/test.log" 2>&1
            test_rc=$?
          else test_rc=99; fi
          if [ "$test_rc" -eq 0 ]; then
            cargo clippy --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets -- -D warnings >"$OUT/clippy.log" 2>&1
            clippy_rc=$?
          else clippy_rc=99; fi
          printf 'fmt=%s\ncheck=%s\ntest=%s\nclippy=%s\n' "$fmt_rc" "$check_rc" "$test_rc" "$clippy_rc" >"$OUT/result.txt"
          git status --short >"$OUT/status.txt"
          exit 0
      - name: Upload #247 repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ores-stack-247-repair-evidence
          path: ${{ runner.temp }}/repair-247
          if-no-files-found: error
          retention-days: 7
      - name: Gate and push #247 repair
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/repair-247"
          cat "$OUT/result.txt"
          grep -qx 'fmt=0' "$OUT/result.txt"
          grep -qx 'check=0' "$OUT/result.txt"
          grep -qx 'test=0' "$OUT/result.txt"
          grep -qx 'clippy=0' "$OUT/result.txt"
          git diff --check
          mapfile -t changed < "$OUT/changed-files.txt"
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              crates/ores-fn-adapters/src/lib.rs|crates/ores-fn-adapters/src/rpc_http.rs) ;;
              *) echo "unexpected repair path: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-fn-adapters/src/lib.rs crates/ores-fn-adapters/src/rpc_http.rs
          git commit -m 'style(lambda): apply canonical rustfmt to RPC HTTP adapter'
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$TARGET_SHA"
          git push origin HEAD:"$TARGET_BRANCH"

  repair_249:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: 'e2d9d2403c74ce54ece823f6d552af13315fb8e9'
      TARGET_BRANCH: 'feat/ppr-request-ingress-20260922'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Configure authenticated GitHub access
        shell: bash
        env: { ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}' }
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact #249 branch
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$TARGET_BRANCH"
          git -C ores-stack checkout -b repair FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$TARGET_SHA"
      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
      - name: Bootstrap workspace lock
        shell: bash
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure
      - name: Run repaired #249 source checks and retain evidence
        shell: bash
        working-directory: ores-stack
        run: |
          set -u
          OUT="$RUNNER_TEMP/repair-249"
          mkdir -p "$OUT"
          set +e
          rustfmt --edition 2024 crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs >"$OUT/rustfmt.log" 2>&1
          fmt_rc=$?
          git diff --name-only | sort >"$OUT/changed-files.txt"
          git diff --binary >"$OUT/rustfmt.patch"
          if [ "$fmt_rc" -eq 0 ]; then
            cargo check --locked -p ores-stack-ppr-http --all-targets >"$OUT/check.log" 2>&1
            check_rc=$?
          else check_rc=99; fi
          if [ "$check_rc" -eq 0 ]; then
            cargo test --locked -p ores-stack-ppr-http >"$OUT/test.log" 2>&1
            test_rc=$?
          else test_rc=99; fi
          if [ "$test_rc" -eq 0 ]; then
            cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings >"$OUT/clippy.log" 2>&1
            clippy_rc=$?
          else clippy_rc=99; fi
          printf 'fmt=%s\ncheck=%s\ntest=%s\nclippy=%s\n' "$fmt_rc" "$check_rc" "$test_rc" "$clippy_rc" >"$OUT/result.txt"
          git status --short >"$OUT/status.txt"
          exit 0
      - name: Upload #249 repair evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ores-stack-249-repair-evidence
          path: ${{ runner.temp }}/repair-249
          if-no-files-found: error
          retention-days: 7
      - name: Gate and push #249 repair
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/repair-249"
          cat "$OUT/result.txt"
          grep -qx 'fmt=0' "$OUT/result.txt"
          grep -qx 'check=0' "$OUT/result.txt"
          grep -qx 'test=0' "$OUT/result.txt"
          grep -qx 'clippy=0' "$OUT/result.txt"
          git diff --check
          mapfile -t changed < "$OUT/changed-files.txt"
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              crates/ores-stack-ppr-http/src/lib_strict.rs|crates/ores-stack-ppr-http/src/request.rs) ;;
              *) echo "unexpected repair path: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          git commit -m 'style(ppr): apply canonical rustfmt to request ingress'
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$TARGET_SHA"
          git push origin HEAD:"$TARGET_BRANCH"
