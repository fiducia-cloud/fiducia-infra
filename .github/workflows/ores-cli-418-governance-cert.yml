name: ores-cli #418 exact-head certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-cli-418-governance-cert.yml'
  push:
    branches:
      - test/ores-cli-418-governance-cert-20260925
    paths:
      - '.github/workflows/ores-cli-418-governance-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLI_HEAD: '61d4301a40d4e6ead2f7dcc30d8c2380c7653007'
  TJSV_SHA: 'bd503465dab8c5148fee722b443ed04ff126c9bf'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact ores-cli source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ env.CLI_HEAD }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned TJSV authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: tjsv
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$CLI_HEAD"
          test "$(git -C tjsv rev-parse HEAD)" = "$TJSV_SHA"
          git -C source diff --check
          test -z "$(git -C source status --porcelain)"
          jq -e \
            --arg sha "$TJSV_SHA" \
            '.schema == "ores.tjsv-source-lock/v1" and .repository == "ORESoftware/typespec-json-schema-validator" and .revision == $sha' \
            source/tjsv/source-lock.json >/dev/null

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.2'
          cache: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.12.2'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Enforce source-AST governance on exact head
        working-directory: source
        env:
          GITHUB_REPOSITORY: ORESoftware/ores-cli
        run: |
          set -euo pipefail
          node --check scripts/check-source-ast-governance.mjs
          node scripts/check-source-ast-governance.mjs

      - name: Prove Go participant
        working-directory: source
        run: |
          set -euo pipefail
          test -z "$(gofmt -d tools/ast/go/main.go)"
          go vet tools/ast/go/main.go
          mkdir -p .source-audit-bin .source-audit-evidence
          go build -o .source-audit-bin/ores-ast-go tools/ast/go/main.go
          .source-audit-bin/ores-ast-go --root tools/ast/fixtures/go --format json > .source-audit-evidence/go.json
          jq -e '.schemaVersion == "ores.code-config-audit.v1" and .language == "go" and .parser == "go/parser+go/ast" and (.files | length) >= 1' .source-audit-evidence/go.json >/dev/null

      - name: Prove TypeScript participant
        working-directory: source
        run: |
          set -euo pipefail
          test -f tools/ast/typescript/package-lock.json
          npm ci --prefix tools/ast/typescript --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- tools/ast/typescript/package-lock.json
          node --check tools/ast/typescript/index.mjs
          node tools/ast/typescript/index.mjs --root tools/ast/fixtures/typescript --format json > .source-audit-evidence/typescript.json
          jq -e '.schemaVersion == "ores.code-config-audit.v1" and .language == "typescript" and .parser == "ts-morph" and (.files | length) >= 1' .source-audit-evidence/typescript.json >/dev/null

      - name: Prove Rust and Gleam participants
        working-directory: source
        run: |
          set -euo pipefail
          test -f tools/ast/rust/Cargo.lock
          test -f tools/ast/gleam/Cargo.lock
          cargo fmt --manifest-path tools/ast/rust/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/ast/rust/Cargo.toml --all-targets -- -D warnings
          cargo run --quiet --locked --manifest-path tools/ast/rust/Cargo.toml -- --root tools/ast/fixtures/rust --format json > .source-audit-evidence/rust.json
          cargo fmt --manifest-path tools/ast/gleam/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/ast/gleam/Cargo.toml --all-targets -- -D warnings
          cargo run --quiet --locked --manifest-path tools/ast/gleam/Cargo.toml -- --root tools/ast/fixtures/gleam --format json > .source-audit-evidence/gleam.json
          jq -e '.language == "rust" and .parser == "syn" and (.files | length) >= 1' .source-audit-evidence/rust.json >/dev/null
          jq -e '.language == "gleam" and .parser == "tree-sitter-gleam" and (.files | length) >= 1' .source-audit-evidence/gleam.json >/dev/null

      - name: Prove Dart participant
        working-directory: source/tools/ast/dart
        run: |
          set -euo pipefail
          test -f pubspec.lock
          dart pub get
          git diff --exit-code -- pubspec.lock
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos --fatal-warnings
          dart run bin/ores_ast_dart.dart --root ../fixtures/dart --format json > ../../../.source-audit-evidence/dart.json
          jq -e '.language == "dart" and .parser == "package:analyzer" and (.files | length) >= 1' ../../../.source-audit-evidence/dart.json >/dev/null

      - name: Require exact five-language receipt set
        working-directory: source
        run: |
          set -euo pipefail
          test "$(find .source-audit-evidence -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')" = 5
          for language in rust typescript go dart gleam; do
            test -f ".source-audit-evidence/${language}.json"
          done

      - name: Install pinned TJSV dependencies
        working-directory: tjsv
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Compare peer source-audit authorities
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/source-audit-generated"
          node tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=source/contracts/source-audit/main.tsp \
            --schema=source/contracts/source-audit/authored.schema.json \
            --report="$RUNNER_TEMP/source-audit-report.json" \
            --contract-ir="$RUNNER_TEMP/source-audit-contract-ir.json" \
            --output-dir="$RUNNER_TEMP/source-audit-generated"
          jq -e '.status == "passed" and .zeroUnexplainedFindings == true' "$RUNNER_TEMP/source-audit-report.json" >/dev/null
          jq -e '.schema == "ores.typespec-json-schema-validator.contract-ir/v1" and .status == "passed" and .admissible == true and .editableAuthority == false' "$RUNNER_TEMP/source-audit-contract-ir.json" >/dev/null

      - name: Prove exact source remains immutable
        working-directory: source
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^?? .source-audit-' || true)"
