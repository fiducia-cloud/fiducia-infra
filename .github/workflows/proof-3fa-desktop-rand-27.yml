name: proof 3fa desktop rand 27

on:
  pull_request:
    paths:
      - .github/workflows/proof-3fa-desktop-rand-27.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/3FA-desktop.rs
  SOURCE_HEAD: 324553001fad5c5ddf40599883e625e28a38dd4d
  SOURCE_BASE: 9f06b1fa533b549b7cbe59efd40ae89938690672

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN"
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_HEAD }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove immutable head and Cargo.lock-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git cat-file -e "${SOURCE_BASE}^{commit}"
          test "$(git diff --name-only "$SOURCE_BASE" "$SOURCE_HEAD")" = "Cargo.lock"
          remote_head=$(git ls-remote https://x-access-token:${{ secrets.ORE_SOURCE_PAT }}@github.com/${SOURCE_REPO}.git refs/heads/dependabot/cargo/rand-0.10.3 | cut -f1)
          test "$remote_head" = "$SOURCE_HEAD"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Formal lifecycle and session models
        run: |
          python3 formal/session_model.py
          python3 formal/app_lifecycle_model.py
          printf '%s\n' '{"op":"replay","events":[{"op":"unlock"},{"op":"advance","seconds":90},{"op":"poll"}]}' | python3 formal/session_model.py --json-stdin
      - name: Format
        run: cargo fmt --check
      - name: Headless compile and tests
        run: |
          cargo check --locked --no-default-features
          cargo test --locked --no-default-features
      - name: Interface provenance
        run: |
          python3 scripts/check_vendored_interfaces.py
          cargo test --locked --no-default-features --test interface_pin
      - name: Final source immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"

  gui-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN"
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_HEAD }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git diff --name-only "$SOURCE_BASE" "$SOURCE_HEAD")" = "Cargo.lock"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: GUI compile, Clippy, tests
        run: |
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Final source immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"
