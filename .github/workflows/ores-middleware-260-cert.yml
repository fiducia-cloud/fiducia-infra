name: ores-middleware-260-cert

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ores-middleware-260-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: 'cd3c8c69475db80f78e38b2ce22d90b3e7f7b60c'
  TARGET_BRANCH: 'fix/export-edge-provider-api-and-local-host-20260922'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub reads
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact middleware head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-middleware
          git -C ores-middleware remote add origin https://github.com/ORESoftware/ores-middleware.git
          git -C ores-middleware fetch --depth=1 origin "$TARGET_BRANCH"
          git -C ores-middleware checkout --detach FETCH_HEAD
          actual="$(git -C ores-middleware rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || { echo "source branch moved: expected $TARGET_SHA got $actual"; exit 1; }
          test -z "$(git -C ores-middleware status --porcelain)"

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Certify exported portable provider API and local edge host
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src/rust/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib --test host_abi_contract -- -D warnings
          cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib provider_api::tests -- --nocapture
          cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib hosts::edge_minimal_local::tests -- --nocapture
          cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --test host_abi_contract -- --nocapture
          cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --test provider_api_public -- --nocapture
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          git diff --check
