name: DEN-3330 one-shot renderer repair

on:
  push:
    branches:
      - alexanderdmills/den-3330-commercial-model-projections
    paths:
      - '.github/workflows/den-3330-one-shot-renderer-fix.yml'

permissions:
  contents: write

concurrency:
  group: den-3330-one-shot-renderer-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-validate-and-clean-up:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the existing PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: alexanderdmills/den-3330-commercial-model-projections
          fetch-depth: 0
          persist-credentials: true

      - name: Select the reviewed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0

      - name: Make the renderer emit canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('quote-system/rust/scripts/model_render.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '        "/// SeaORM entities projected from `db/0001_commercial_intake.sql`.\\n",\n'
                  '        "///\\n",\n'
                  '        "/// Public API payloads remain owned by TypeSpec and JSON Schema. These models\\n",\n'
                  '        "/// intentionally represent encrypted persistence rows only.\\n",',
                  '        "// SeaORM entities projected from `db/0001_commercial_intake.sql`.\\n",\n'
                  '        "//\\n",\n'
                  '        "// Public API payloads remain owned by TypeSpec and JSON Schema. These models\\n",\n'
                  '        "// intentionally represent encrypted persistence rows only.\\n",',
              ),
              (
                  '''        output.append(
                      f'    #[sea_orm(table_name = "{table["table"]}", '
                      'schema_name = "fiducia_commercial")]\\n'
                  )''',
                  '''        sea_orm_attribute = (
                      f'    #[sea_orm(table_name = "{table["table"]}", '
                      'schema_name = "fiducia_commercial")]'
                  )
                  if len(sea_orm_attribute) <= 80:
                      output.append(f"{sea_orm_attribute}\\n")
                  else:
                      output.extend(
                          [
                              "    #[sea_orm(\\n",
                              f'        table_name = "{table["table"]}",\\n',
                              '        schema_name = "fiducia_commercial"\\n',
                              "    )]\\n",
                          ]
                      )''',
              ),
              (
                  '''        output.append("    }\\n")
                  output.append("}\\n\\n")
              return "".join(output)


              def render_diesel_models''',
                  '''        output.append("    }\\n")
                  output.append("}\\n\\n")
              return "".join(output).rstrip() + "\\n"


              def render_diesel_models''',
              ),
              (
                  '''        output.append(f"#[diesel(primary_key({primary_key}))]\\n")''',
                  '''        primary_key_attribute = f"#[diesel(primary_key({primary_key}))]"
                  if len(primary_key_attribute) <= 80:
                      output.append(f"{primary_key_attribute}\\n")
                  else:
                      output.append("#[diesel(primary_key(\\n")
                      for primary_key_column in table["primary_key"]:
                          output.append(f"    {primary_key_column},\\n")
                      output.append("))]\\n")''',
              ),
          ]

          for before, after in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'expected exactly one renderer match, found {count}: {before[:100]!r}')
              text = text.replace(before, after, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate and prove all model gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile quote-system/rust/scripts/model_contract.py quote-system/rust/scripts/model_render.py quote-system/rust/scripts/model_codegen.py
          python3 quote-system/rust/scripts/model_codegen.py --write
          python3 quote-system/rust/scripts/model_codegen.py --check
          cargo fmt --manifest-path quote-system/rust/Cargo.toml --all -- --check
          cargo check --manifest-path quote-system/rust/Cargo.toml --all-targets --all-features
          cargo test --manifest-path quote-system/rust/Cargo.toml --all-features
          cargo clippy --manifest-path quote-system/rust/Cargo.toml --all-targets --all-features -- -D warnings
          if ! git ls-files --error-unmatch quote-system/rust/Cargo.lock >/dev/null 2>&1; then
            rm -f quote-system/rust/Cargo.lock
          fi

      - name: Enforce the bounded renderer diff
        shell: bash
        run: |
          set -euo pipefail
          rm -- '.github/workflows/den-3330-one-shot-renderer-fix.yml'
          allowed='^(\.github/workflows/den-3330-one-shot-renderer-fix\.yml|quote-system/rust/scripts/model_render\.py|quote-system/rust/crates/fiducia-commercial-diesel/src/(models|schema)\.rs|quote-system/rust/crates/fiducia-commercial-seaorm/src/entities/part_0[1-4]\.rs)$'
          unexpected="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | grep -Ev "${allowed}" || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'Unexpected renderer output:\n%s\n' "${unexpected}" >&2
            exit 1
          fi
          git add -- \
            '.github/workflows/den-3330-one-shot-renderer-fix.yml' \
            'quote-system/rust/scripts/model_render.py' \
            'quote-system/rust/crates/fiducia-commercial-diesel/src/models.rs' \
            'quote-system/rust/crates/fiducia-commercial-diesel/src/schema.rs' \
            'quote-system/rust/crates/fiducia-commercial-seaorm/src/entities/part_01.rs' \
            'quote-system/rust/crates/fiducia-commercial-seaorm/src/entities/part_02.rs' \
            'quote-system/rust/crates/fiducia-commercial-seaorm/src/entities/part_03.rs' \
            'quote-system/rust/crates/fiducia-commercial-seaorm/src/entities/part_04.rs'
          git diff --cached --check

      - name: Commit the validated renderer repair to PR 61
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(DEN-3330): emit clippy-clean canonical projections'
          git push origin HEAD:alexanderdmills/den-3330-commercial-model-projections
