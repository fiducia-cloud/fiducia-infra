name: certify ores-compose 176 exact merge candidate

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/cert-ores-compose-176-20260922.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  ores-compose-176:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_REPO: ORESoftware/ores-compose
      SOURCE_BRANCH: fix/command-spec-static-program-test-20260922
      SOURCE_BASE: 2deb9229521acd66f9f14bf858ac6f78c734d106
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Bind exact PR head and current main
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C source fetch --depth=50 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_BASE"
          source_head="$(git -C source rev-parse origin/$SOURCE_BRANCH)"
          echo "SOURCE_HEAD=$source_head" >> "$GITHUB_ENV"
          merge_base="$(git -C source merge-base "$source_head" "$SOURCE_BASE")"
          test "$(git -C source diff --name-only "$merge_base".."$source_head" | tr '\n' ' ')" = "tests/source_filter_execution_regressions.rs "
          git -C source diff --check "$merge_base".."$source_head"
          git -C source checkout --detach "$source_head"
          git -C source -c user.name='ORES certification' -c user.email='cert@example.invalid' merge --no-edit "$SOURCE_BASE"
          test "$(git -C source rev-parse HEAD^1)" = "$source_head"
          test "$(git -C source rev-parse HEAD^2)" = "$SOURCE_BASE"
          test -z "$(git -C source status --porcelain)"
      - name: Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.98.1
      - name: PR-owned formatting
        working-directory: source
        run: rustfmt --edition 2021 --check tests/source_filter_execution_regressions.rs
      - name: Compile all targets and features
        working-directory: source
        run: cargo check --all-targets --all-features --locked
      - name: Run source-filter regression
        working-directory: source
        run: cargo test --locked --test source_filter_execution_regressions -- --nocapture
      - name: Run library tests
        working-directory: source
        run: cargo test --locked --lib
      - name: Clippy source tree
        working-directory: source
        run: cargo clippy --locked --all-targets --all-features
      - name: Exact-source and base decision
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^2)" = "$SOURCE_BASE"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_BASE"
          test -z "$(git status --porcelain)"
          echo ORES_COMPOSE_176_EXACT_MERGE_CANDIDATE_PASS
