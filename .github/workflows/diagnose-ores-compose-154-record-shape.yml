name: diagnose ores-compose 154 record shape

on:
  push:
    branches: [test/ores-compose-154-service-env-cert-20260922]
    paths: ['.github/workflows/diagnose-ores-compose-154-record-shape.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_HEAD: 9a0a3a98db0c266dc2a16ae2b1897521d5a9ca79
  TJSV_SHA: c55b2af2af0b3cdfa39904f1e2504f6bf4b97284

jobs:
  inspect-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: 9a0a3a98db0c266dc2a16ae2b1897521d5a9ca79
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.13.0'
      - name: Generate witness and print record definitions
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx --yes \
            --package="https://github.com/ORESoftware/typespec-json-schema-validator/archive/${TJSV_SHA}.tar.gz" \
            tjsv check \
            --typespec=contracts/typespec/main.tsp \
            --schema=contracts/json-schema/contract.schema.json \
            --instances=contracts/instances \
            --report=/tmp/compose-contract-parity.json
          status=$?
          set -e
          echo "tjsv_status=$status"
          find .typespec-json-schema-validator/generated -type f -maxdepth 3 -print -exec cat {} \;
          exit "$status"
