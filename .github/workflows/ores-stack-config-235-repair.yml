name: ores-stack-config-main-repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-config-235-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET_SHA: '1ee2360737256783e8ba1eec3251119511dc7272'
  REPAIR_BRANCH: 'fix/config-yaml-rustfmt-certified-20260922'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact merged YAML main
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$TARGET_SHA"
          git -C ores-stack checkout -b "$REPAIR_BRANCH" FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git -C ores-stack ls-remote origin "refs/heads/$REPAIR_BRANCH")" || {
            echo "repair branch already exists; refusing to overwrite"
            exit 1
          }

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Apply rustfmt to config source
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ores-stack-core/src/config.rs
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf 'changed files:\n%s\n' "$changed"
          test "$changed" = 'crates/ores-stack-core/src/config.rs'

      - name: Repaired rustfmt gate
        shell: bash
        working-directory: ores-stack
        run: rustfmt --edition 2024 --check crates/ores-stack-core/src/config.rs

      - name: Bootstrap lock evidence
        shell: bash
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure

      - name: Repaired core check
        shell: bash
        working-directory: ores-stack
        run: cargo check --locked -p ores-stack-core --all-targets

      - name: Repaired workspace check
        shell: bash
        working-directory: ores-stack
        run: cargo check --locked --workspace --all-targets

      - name: Repaired config tests
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-core config::tests -- --nocapture

      - name: Repaired full core tests
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test --locked -p ores-stack-core -- --nocapture 2>&1 | tee /tmp/ores-stack-core-tests.log

      - name: Preserve core-test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ores-stack-core-tests
          path: /tmp/ores-stack-core-tests.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Repaired core Clippy
        shell: bash
        working-directory: ores-stack
        run: cargo clippy --locked -p ores-stack-core --all-targets -- -D warnings

      - name: Commit and push guarded repair branch
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = 'crates/ores-stack-core/src/config.rs'
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-core/src/config.rs
          git commit -m 'style(config): rustfmt nested YAML authority'
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_main" = "$TARGET_SHA" || {
            echo "ores-stack main moved from $TARGET_SHA to $current_main; refusing stale repair push"
            exit 1
          }
          test -z "$(git ls-remote origin "refs/heads/$REPAIR_BRANCH")" || {
            echo "repair branch appeared before push; refusing to overwrite"
            exit 1
          }
          git push origin HEAD:"$REPAIR_BRANCH"
