name: ores-websocket #13 whole-repo universal candidate

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ores-websocket-13-whole-repo-candidate.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SOURCE_BRANCH: fix/zpkg-universal-language-20260922
  SOURCE_SHA: 6d36f70197c0b047c8d7b12d5ad44e861716a8b7
  SOURCE_BASE: 8cceeaf7142c469bc7ef55c16dc51ae0f9aeb43e
  ZED_CLI_SHA: 69fce161e456d758459cab5d3a6441f599769bfa

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Checkout exact source head
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/ores-websocket.git
          git -C source fetch --depth=20 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_BASE"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          test -z "$(git -C source status --porcelain)"
      - name: Replace invalid overlapping target model in disposable checkout
        working-directory: source
        run: |
          set -euo pipefail
          cat > .zpkg.toml <<'EOF'
          [package]
          org = "oresoftware"
          name = "ores-websocket"
          version = "0.1.0"
          description = "Shared WebSocket protocol contracts and runtime primitives for ORES"
          language = "universal"

          [package.repository]
          vcs = "git"
          url = "https://github.com/ORESoftware/ores-websocket"

          [dependencies]
          "oresoftware/typespec-json-schema-validator" = "^0.1.0"

          [install]
          dir = ".vendor/.zed"

          [scripts]
          test = "sh conformance/check.sh"
          EOF
          git diff -- .zpkg.toml | tee /tmp/candidate-manifest.patch
          test -s /tmp/candidate-manifest.patch
          grep -F 'language = "universal"' .zpkg.toml
          ! grep -q '^\[targets\.' .zpkg.toml
      - name: Install current pinned Zed CLI authority
        run: cargo install --git https://github.com/zed-pkg/zed-cli --rev "$ZED_CLI_SHA" --locked zed-cli
      - name: Validate candidate manifest
        working-directory: source
        run: zed validate
      - name: Materialize dependency graph
        working-directory: source
        run: zed install --allow-build --install-mode copy
      - name: Validate generated lock
        working-directory: source
        run: zed validate --require-lock
      - name: Verify source branch remained untouched
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".zpkg.lock .zpkg.toml " || test "$(git diff --name-only | sort | tr '\n' ' ')" = ".zpkg.toml "
          echo ORES_WEBSOCKET_13_WHOLE_REPO_CANDIDATE_PASS
      - name: Upload candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ores-websocket-13-whole-repo-candidate
          path: |
            /tmp/candidate-manifest.patch
            source/.zpkg.lock
          if-no-files-found: warn
