name: tmp ores-stack 275 final exact-head cert

on:
  push:
    branches:
      - test/ores-stack-275-final-cert-20260922

permissions:
  contents: read

env:
  STACK_HEAD: 3e22ace5653308aab54abf391d4265656998e950
  STACK_BASE: 253382da3634ce9fde62704e79e42160cee66838
  HTTP_CLIENTS_HEAD: aee4483c8f51154f986a17ccdefdc2d6d7613d05
  INTERFACES_HEAD: a071dbd727418b0483c3d514c862c0bb4f8633c0

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact source and merged contract/runtime authorities
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=20 origin main "$STACK_HEAD"
          git -C ores-stack checkout --detach "$STACK_HEAD"
          test "$(git -C ores-stack rev-parse HEAD)" = "$STACK_HEAD"
          test "$(git -C ores-stack merge-base HEAD "$STACK_BASE")" = "$STACK_BASE"
          test "$(git -C ores-stack diff --name-only "$STACK_BASE"..HEAD | sort | tr '\n' ' ')" = "crates/ores-stack-cli/src/legacy/mod.rs crates/ores-stack-core/src/lib.rs crates/ores-stack-core/src/rpc_http_client_lane.rs crates/ores-stack-core/src/rpc_http_client_lane_post.rs "
          test -z "$(git -C ores-stack status --porcelain)"
          git -C ores-stack diff --check "$STACK_BASE"..HEAD

          git init ores-http-clients
          git -C ores-http-clients remote add origin https://github.com/ORESoftware/ores-http-clients.git
          git -C ores-http-clients fetch --depth=1 origin "$HTTP_CLIENTS_HEAD"
          git -C ores-http-clients checkout --detach FETCH_HEAD
          test "$(git -C ores-http-clients rev-parse HEAD)" = "$HTTP_CLIENTS_HEAD"

          git init ores-interfaces
          git -C ores-interfaces remote add origin https://github.com/ORESoftware/ores-interfaces.git
          git -C ores-interfaces fetch --depth=1 origin "$INTERFACES_HEAD"
          git -C ores-interfaces checkout --detach FETCH_HEAD
          test "$(git -C ores-interfaces rev-parse HEAD)" = "$INTERFACES_HEAD"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt

      - name: Frozen metadata
        shell: bash
        working-directory: ores-stack
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: PR-owned rustfmt gate against dirty baseline
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --exit-code -- \
            crates/ores-stack-cli/src/legacy/mod.rs \
            crates/ores-stack-core/src/lib.rs \
            crates/ores-stack-core/src/rpc_http_client_lane.rs \
            crates/ores-stack-core/src/rpc_http_client_lane_post.rs; then
            echo 'PR-owned files are not rustfmt-clean' >&2
            exit 1
          fi
          git reset --hard "$STACK_HEAD"
          test -z "$(git status --porcelain)"

      - name: Compile changed crates
        shell: bash
        working-directory: ores-stack
        run: cargo check --locked -p ores-stack-core -p ores-stack-cli --all-targets

      - name: Focused parallel lane tests
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-core rpc_http_client_lane -- --nocapture

      - name: Focused post-sync lane tests
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-core rpc_http_client_lane_post -- --nocapture

      - name: Verify generated builder boundary binds merged fluent runtime
        shell: bash
        run: |
          set -euo pipefail
          lane=ores-stack/crates/ores-stack-core/src/rpc_http_client_lane.rs
          post=ores-stack/crates/ores-stack-core/src/rpc_http_client_lane_post.rs

          # ores-stack owns generated operation methods. Those methods must return
          # the shared runtime builders; terminal I/O belongs to ores-http-clients.
          grep -q 'RpcUnaryCallBuilder' "$lane"
          grep -q 'RpcServerStreamCallBuilder' "$lane"
          grep -q '@oresoftware/ores-http-clients/fluent' "$lane"
          grep -q 'package:ores_http_clients/ores_http_clients.dart' "$lane"
          grep -q '::ores_http_clients::' "$lane"
          grep -q 'ores_http_clients/fluent' "$lane"
          grep -q 'generated_ores_http' "$lane"

          # The merged shared authority defines terminal intent independently.
          test -f ores-interfaces/contracts/rpc-client-call/v1/main.tsp
          test -f ores-interfaces/contracts/rpc-client-call/v1/authored.schema.json
          grep -Rq 'make_call' ores-interfaces/contracts/rpc-client-call/v1
          grep -Rq 'do_stream' ores-interfaces/contracts/rpc-client-call/v1

          # The merged runtime provides the actual fluent execution terminals.
          grep -Rq 'makeCall' ores-http-clients/src/ts/src ores-http-clients/src/dart/lib
          grep -Rq 'doStream' ores-http-clients/src/ts/src ores-http-clients/src/dart/lib
          grep -q 'pub fn make_call' ores-http-clients/src/rust/src/fluent.rs
          grep -q 'pub fn do_stream' ores-http-clients/src/rust/src/fluent.rs
          grep -q 'pub fn make_call' ores-http-clients/src/gleam/src/ores_http_clients/fluent.gleam
          grep -q 'pub fn do_stream' ores-http-clients/src/gleam/src/ores_http_clients/fluent.gleam
          ! grep -Eq '(^|[^A-Za-z])stream\(' ores-http-clients/src/ts/src/fluent.ts

          grep -q 'validate_existing_parallel_lane_state' "$post"
          grep -q 'outside owned generated_ores_http roots' "$post"
          grep -q 'is a symlink; refusing generated writes' "$post"

          test "$(git -C ores-stack rev-parse HEAD)" = "$STACK_HEAD"
          test -z "$(git -C ores-stack status --porcelain)"
          git -C ores-stack diff --check "$STACK_BASE"..HEAD
          echo ORES_STACK_275_FINAL_EXACT_HEAD_CERT_PASS
