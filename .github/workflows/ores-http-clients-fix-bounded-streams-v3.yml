name: ores-http-clients bounded-stream remediation v3

on:
  pull_request:
    paths:
      - ".github/workflows/ores-http-clients-fix-bounded-streams-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false

      - name: Check out source fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ORESoftware/ores-http-clients
          ref: fix/bounded-response-streams
          path: source
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply literal-safe remediation
        working-directory: source
        run: |
          python3 <<'PY'
          from pathlib import Path

          harness = Path('../harness/.github/workflows/ores-http-clients-fix-bounded-streams-v2.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = harness.index(marker) + len(marker)
          end = harness.index("\n          PY\n", start)
          script = harness[start:end]
          script = script.replace(
              'updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)',
              'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)',
          )
          exec(compile(script, 'bounded-stream-remediation.py', 'exec'), {})
          PY

      - name: Structural conformance
        working-directory: source
        run: sh scripts/check.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: TypeScript tests
        working-directory: source/src/ts
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - name: Dart checks
        working-directory: source/src/dart
        run: |
          dart pub get
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - name: Rust checks
        working-directory: source/src/rust
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo test --all-targets --features rxrust-support
          cargo clippy --all-targets --features rxrust-support -- -D warnings
          cargo check --target wasm32-unknown-unknown

      - name: Commit and push verified source fix
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git config user.name "ORESoftware"
          git config user.email "alex@oresoftware.com"
          git add src/ts/src/index.ts src/ts/test/client.test.ts \
            src/dart/lib/src/client.dart src/dart/test/client_test.dart \
            src/rust/src/lib.rs src/rust/tests/client.rs src/rust/Cargo.toml src/rust/Cargo.lock
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "fix: bound streamed response bodies incrementally"
            git push origin HEAD:fix/bounded-response-streams
          fi
          if ! gh pr view fix/bounded-response-streams --repo ORESoftware/ores-http-clients >/dev/null 2>&1; then
            gh pr create \
              --repo ORESoftware/ores-http-clients \
              --base main \
              --head fix/bounded-response-streams \
              --title "fix: bound streamed response bodies incrementally" \
              --body "Fixes #7. Enforces maxResponseBytes while chunked/no-Content-Length bodies are consumed in TypeScript, Dart, and Rust; adds early-cancellation/early-return regression coverage; preserves the existing Content-Length preflight and native/wasm gates. External reproducer: fiducia-cloud/fiducia-infra#106."
          fi
