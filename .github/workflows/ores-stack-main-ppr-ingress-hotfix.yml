name: ores-stack-main-ppr-ingress-hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-main-ppr-ingress-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  OUTPUT_BRANCH: 'fix/ppr-request-ingress-compile-current-main-20260922'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Configure authenticated GitHub access
        shell: bash
        env: { ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}' }
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch current ores-stack main
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin main
          git -C ores-stack checkout -b "$OUTPUT_BRANCH" FETCH_HEAD
          printf 'base=%s\n' "$(git -C ores-stack rev-parse HEAD)"
      - name: Apply narrow lifetime repair
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          file='crates/ores-stack-ppr-http/src/request.rs'
          old='with_tcp_deadline(stream, deadline, read_request_head)'
          new='with_tcp_deadline(stream, deadline, |reader| read_request_head(reader))'
          test "$(grep -F -c "$old" "$file")" = '1'
          sed -i "s#${old}#${new}#" "$file"
          test "$(grep -F -c "$new" "$file")" = '1'
      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
      - name: Canonical format merged request authority
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          rustfmt --edition 2024 --check crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          for path in "${changed[@]}"; do
            case "$path" in
              crates/ores-stack-ppr-http/src/lib_strict.rs|crates/ores-stack-ppr-http/src/request.rs) ;;
              *) echo "unexpected hotfix path: $path" >&2; exit 1 ;;
            esac
          done
      - name: Verify repaired mainline authority
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo check --locked -p ores-stack-ppr-http --all-targets
          cargo test --locked -p ores-stack-ppr-http
          cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings
      - name: Push certified hotfix branch
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'crates/ores-stack-ppr-http/src/lib_strict.rs\ncrates/ores-stack-ppr-http/src/request.rs'
          test "$changed" = "$expected"
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          git commit -m 'fix(ppr): make request-head TCP deadline reader lifetime-generic'
          test -z "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" || {
            echo 'hotfix branch already exists; refusing overwrite' >&2
            exit 1
          }
          git push origin HEAD:"$OUTPUT_BRANCH"
