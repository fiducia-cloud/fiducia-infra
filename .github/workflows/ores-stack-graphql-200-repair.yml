name: ores-stack-graphql-200-repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-graphql-200-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET_SHA: '43447a4b89c47082d7c88b1769c002cea1d60c5c'
  TARGET_BRANCH: 'fix/graphql-resolvers-plural-authority-20260922'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact GraphQL authority branch
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$TARGET_BRANCH"
          git -C ores-stack checkout -b repair FETCH_HEAD
          actual="$(git -C ores-stack rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || { echo "branch moved: expected $TARGET_SHA got $actual"; exit 1; }

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Repair only stale callable inventory fixtures
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          file='crates/ores-stack-core/src/lambda_callable_inventory.rs'
          before="$(grep -F -c '"resolver.rs"' "$file" || true)"
          test "$before" = '2' || { echo "expected exactly 2 stale fixture literals, found $before"; exit 1; }
          sed -i 's/"resolver\.rs"/"resolvers.rs"/g' "$file"
          test "$(grep -F -c '"resolver.rs"' "$file" || true)" = '0'
          rustfmt --edition 2024 "$file"
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "$file" || { echo "unexpected changed files: $changed"; exit 1; }

      - name: Verify GraphQL authority migration
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check --locked -p ores-stack-core --all-targets
          cargo clippy --locked -p ores-stack-core --all-targets -- -D warnings
          cargo test --locked -p ores-stack-core lambda_callable_inventory::tests
          cargo test --locked -p ores-stack-core --test callable_registry_module_mount
          cargo test --locked -p ores-stack-core --test lambda_callable_registry_contract

      - name: Commit and push guarded repair
        shell: bash
        working-directory: ores-stack
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-core/src/lambda_callable_inventory.rs
          git commit -m 'test(graphql): use plural resolver authority in inventory fixtures'
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA" || { echo "source branch moved before push: $remote_head"; exit 1; }
          git push origin HEAD:"$TARGET_BRANCH"
