name: certify ores-websocket 13 exact head

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/cert-ores-websocket-13-20260923.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-websocket
  SOURCE_BRANCH: fix/zpkg-universal-language-20260922
  SOURCE_SHA: 7e080a1e0c5f4eb7d471b4bfd59e2869f4ae6cc3
  SOURCE_MAIN_SHA: 37ff2dc38878dc6e85accb562ec5c07652853c65
  ZED_CLI_SHA: 344d432a6f94d4b1cfa02228ec36623c7484177a
  EXPECTED_BLOCKER: oresoftware/typespec-json-schema-validator@0.1.0

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch immutable base and candidate
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C source fetch --depth=50 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_MAIN_SHA"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source merge-base HEAD "$SOURCE_MAIN_SHA")" = "$SOURCE_MAIN_SHA"
          mapfile -t changed < <(git -C source diff --name-only "$SOURCE_MAIN_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".zpkg.toml"
          git -C source diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
          grep -F 'language = "universal"' source/.zpkg.toml
          ! grep -F 'language = "multi"' source/.zpkg.toml
          ! grep -Eq '^\[targets\.' source/.zpkg.toml
          grep -F 'test = "sh conformance/check.sh"' source/.zpkg.toml
          git -C source worktree add --detach ../source-main "$SOURCE_MAIN_SHA"

      - name: Prove dependency declaration is unchanged from main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          base = tomllib.loads(Path('source-main/.zpkg.toml').read_text())
          head = tomllib.loads(Path('source/.zpkg.toml').read_text())
          name = 'typespec-json-schema-validator'
          assert base['dependencies'][name] == head['dependencies'][name], (base['dependencies'][name], head['dependencies'][name])
          assert head['dependencies'][name] == {'scope': 'oresoftware', 'version': '0.1.0'}
          PY

      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.88.0
          rustc --version | grep -F 'rustc 1.88.0'

      - name: Source Rust gates
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --all-features
          cargo clippy --all-targets --all-features -- -D warnings

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Source TypeScript and contract gates
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm rebuild @oresoftware/f2e --ignore-scripts=false
          test -f node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node
          npm run check
          sh conformance/check.sh

      - name: Install pinned Zed CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/zed-pkg/zed-cli --rev "$ZED_CLI_SHA" --locked zed-cli

      - name: Validate base and candidate manifests
        shell: bash
        run: |
          set -euo pipefail
          (cd source-main && zed validate)
          (cd source && zed validate)

      - name: Differential zed install proof
        shell: bash
        run: |
          set -uo pipefail
          (cd source-main && unset ZED_PKG_GITHUB_TOKEN || true; zed install --allow-build --install-mode copy) >base-install.log 2>&1
          base_status=$?
          (cd source && unset ZED_PKG_GITHUB_TOKEN || true; zed install --allow-build --install-mode copy) >head-install.log 2>&1
          head_status=$?
          set -e
          echo "base_status=$base_status head_status=$head_status"
          cat base-install.log
          cat head-install.log

          if [ "$head_status" -eq 0 ]; then
            (cd source && zed validate --require-lock)
            echo ZED_INSTALL_HEAD_PASS
            exit 0
          fi

          # The candidate may only inherit the known package-distribution blocker
          # when the exact pinned main commit exhibits the same blocker.
          test "$base_status" -ne 0
          grep -F "$EXPECTED_BLOCKER" base-install.log
          grep -F "$EXPECTED_BLOCKER" head-install.log
          grep -Eq '404|not found|Not Found|failed to resolve|could not resolve|unable to resolve' base-install.log
          grep -Eq '404|not found|Not Found|failed to resolve|could not resolve|unable to resolve' head-install.log

          # Reject evidence that points at a different package as the terminal blocker.
          base_terminal=$(grep -Ei 'failed to resolve|could not resolve|unable to resolve|not found|Not Found' base-install.log | tail -n 1 || true)
          head_terminal=$(grep -Ei 'failed to resolve|could not resolve|unable to resolve|not found|Not Found' head-install.log | tail -n 1 || true)
          printf 'base terminal: %s\nhead terminal: %s\n' "$base_terminal" "$head_terminal"
          echo "$base_terminal" | grep -F 'typespec-json-schema-validator'
          echo "$head_terminal" | grep -F 'typespec-json-schema-validator'
          echo ZED_INSTALL_PREEXISTING_DEPENDENCY_BLOCKER_CONFIRMED

      - name: Final immutable source guard
        if: ${{ always() }}
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "::add-mask::$ORE_SOURCE_PAT"
          remote_branch=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          remote_main=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)
          test "$remote_branch" = "$SOURCE_SHA"
          test "$remote_main" = "$SOURCE_MAIN_SHA"
          git diff --check
          echo ORES_WEBSOCKET_13_EXACT_HEAD_GUARD_PASS
