name: certify ores-websocket 13 exact head

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/cert-ores-websocket-13-20260923.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-websocket
  SOURCE_BRANCH: fix/zpkg-universal-language-20260922
  SOURCE_SHA: 7e080a1e0c5f4eb7d471b4bfd59e2869f4ae6cc3
  SOURCE_MAIN_SHA: 37ff2dc38878dc6e85accb562ec5c07652853c65
  ZED_CLI_SHA: 44fcc6649464fe0b7a4a59e6d14485bed6907086

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Verify source-access credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Fetch immutable base and candidate
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git init source
          git -C source remote add origin "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git"
          git -C source fetch --depth=50 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_MAIN_SHA"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source merge-base HEAD "$SOURCE_MAIN_SHA")" = "$SOURCE_MAIN_SHA"
          mapfile -t changed < <(git -C source diff --name-only "$SOURCE_MAIN_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".zpkg.toml"
          git -C source diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
          grep -F 'language = "universal"' source/.zpkg.toml
          ! grep -F 'language = "multi"' source/.zpkg.toml
          ! grep -Eq '^\[targets\.' source/.zpkg.toml
          grep -F 'test = "sh conformance/check.sh"' source/.zpkg.toml
          git -C source worktree add --detach ../source-main "$SOURCE_MAIN_SHA"

      - name: Prove dependency declaration is unchanged from main
        shell: bash
        run: |
          set -euo pipefail
          base_dep=$(sed -n '/^\[dependencies\]/,/^\[/p' source-main/.zpkg.toml | grep -F 'oresoftware/typespec-json-schema-validator' | tr -d '[:space:]')
          head_dep=$(sed -n '/^\[dependencies\]/,/^\[/p' source/.zpkg.toml | grep -F 'oresoftware/typespec-json-schema-validator' | tr -d '[:space:]')
          test -n "$base_dep"
          test "$base_dep" = "$head_dep"
          grep -Fq '^0.1.0' <<<"$head_dep"

      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.88.0
          rustc --version | grep -F 'rustc 1.88.0'

      - name: Source Rust gates
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --all-features
          cargo clippy --all-targets --all-features -- -D warnings

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install pinned Zed CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/zed-pkg/zed-cli --rev "$ZED_CLI_SHA" --locked zed-cli

      - name: Prove manifest migration
        shell: bash
        run: |
          set -euo pipefail
          set +e
          base_output=$(cd source-main && zed validate 2>&1)
          base_status=$?
          set -e
          test "$base_status" -ne 0
          grep -F 'unknown language `multi`' <<<"$base_output"
          (cd source && zed validate)
          echo ZED_MANIFEST_MIGRATION_PASS

      - name: Attribute candidate install blocker to unchanged upstream dependency
        shell: bash
        run: |
          set -euo pipefail
          unset ZED_PKG_GITHUB_TOKEN GITHUB_TOKEN GH_TOKEN || true
          rm -rf source/.vendor source/.zed source/zed.lock source/.zpkg.lock
          set +e
          (cd source && zed install --allow-build --install-mode copy) >"$RUNNER_TEMP/head-install.log" 2>&1
          head_status=$?
          set -e
          test "$head_status" -ne 0
          cat "$RUNNER_TEMP/head-install.log"
          grep -F 'oresoftware/typespec-json-schema-validator@0.1.0' "$RUNNER_TEMP/head-install.log"
          grep -Eq '404 Not Found|no GitHub/R2/GHCR fallback succeeded|registry download failed|failed to resolve|not found' "$RUNNER_TEMP/head-install.log"
          echo ZED_INSTALL_UNCHANGED_DEPENDENCY_BLOCKER_PASS

      - name: Source TypeScript and contract gates
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm rebuild @oresoftware/f2e --ignore-scripts=false
          test -f node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node
          npm run check
          sh conformance/check.sh

      - name: Final immutable source guard
        if: ${{ always() }}
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "::add-mask::$ORE_SOURCE_PAT"
          remote_branch=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          remote_main=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)
          test "$remote_branch" = "$SOURCE_SHA"
          test "$remote_main" = "$SOURCE_MAIN_SHA"
          git diff --check
          echo ORES_WEBSOCKET_13_EXACT_HEAD_GUARD_PASS
