name: proof-ores-stack-304

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-stack-304.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 7683acf498815916198249e12797176672bcda77

jobs:
  callable-registry-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact ORES Stack stacked head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact source and mapping policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          grep -F 'typespec-json-schema-validator/archive/2f6a5e1564c2a52af0e61e5b47a983b145b28884.tar.gz' package.json
          grep -F -- '--mapping=contracts/ores-lambda-callable-registry.mapping.json' package.json
          grep -F 'ores.typespec-json-schema-validator.mapping/v1' contracts/ores-lambda-callable-registry.mapping.json
          grep -F '"RecordString"' contracts/ores-lambda-callable-registry.mapping.json
          grep -F '"registry"' contracts/ores-lambda-callable-registry.schema.json

      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install pinned contract toolchain
        shell: bash
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Verify pinned TJSV executable
        shell: bash
        run: |
          set -euo pipefail
          test -x node_modules/.bin/tjsv
          node_modules/.bin/tjsv --help >/dev/null

      - name: Prove callable-registry peer-authority parity
        shell: bash
        run: |
          set -uo pipefail
          if npm run check:lambda-callable-registry; then
            exit 0
          fi
          report=.ores-stack/lambda-callable-registry-schema-parity.json
          if [[ -f "$report" ]]; then
            echo '--- TJSV callable registry report ---'
            cat "$report"
          fi
          exit 1

      - name: Run full contract parity suite
        shell: bash
        run: npm run check:contracts

      - name: Prove tracked source unchanged
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
