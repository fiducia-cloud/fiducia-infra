name: Fiducia quote TypeSpec

on:
  pull_request:
    paths:
      - 'quote-system/contracts/**'
      - 'quote-system/package.json'
      - 'quote-system/package-lock.json'
      - 'quote-system/tspconfig.yaml'
      - '.github/workflows/quote-system-typespec.yml'
  push:
    branches:
      - main
    paths:
      - 'quote-system/contracts/**'
      - 'quote-system/package.json'
      - 'quote-system/package-lock.json'
      - 'quote-system/tspconfig.yaml'
      - '.github/workflows/quote-system-typespec.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiducia-quote-typespec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Require the reviewed stable TypeSpec package family
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          expected = {
              '@typespec/compiler': '1.15.0',
              '@typespec/http': '1.15.0',
              '@typespec/openapi3': '1.15.0',
              '@typespec/rest': '0.85.0',
          }
          if package.get('devDependencies') != expected:
              raise SystemExit('TypeSpec dependencies differ from the reviewed stable package family')
          PY

      - name: Install exact lockfile without lifecycle scripts
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile and inspect generated OpenAPI
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/fiducia-typespec"
          ./node_modules/.bin/tsp compile \
            contracts/main.tsp \
            --config tspconfig.yaml \
            --output-dir "${output_dir}" \
            --warn-as-error
          output="${output_dir}/openapi3/fiducia-commercial-intake.openapi.yaml"
          test -s "${output}"
          grep -q '/v1/pre-interest' "${output}"
          grep -q '/v1/admin/quotes' "${output}"
