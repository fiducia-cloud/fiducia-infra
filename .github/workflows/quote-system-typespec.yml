name: Fiducia quote TypeSpec and interface generation

on:
  pull_request:
    paths:
      - 'quote-system/contracts/**'
      - 'quote-system/tools/**'
      - 'quote-system/generated/README.md'
      - 'quote-system/package.json'
      - 'quote-system/package-lock.json'
      - 'quote-system/tspconfig.yaml'
      - '.github/workflows/quote-system-typespec.yml'
  push:
    branches:
      - main
    paths:
      - 'quote-system/contracts/**'
      - 'quote-system/tools/**'
      - 'quote-system/generated/README.md'
      - 'quote-system/package.json'
      - 'quote-system/package-lock.json'
      - 'quote-system/tspconfig.yaml'
      - '.github/workflows/quote-system-typespec.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiducia-quote-typespec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-lint-generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Require the reviewed stable TypeSpec package family
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          expected = {
              '@typespec/compiler': '1.15.0',
              '@typespec/http': '1.15.0',
              '@typespec/openapi3': '1.15.0',
              '@typespec/rest': '0.85.0',
          }
          if package.get('devDependencies') != expected:
              raise SystemExit('TypeSpec dependencies differ from the reviewed stable package family')
          PY

      - name: Install exact lockfile without lifecycle scripts
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run generator unit and negative-policy tests
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          npm run contracts:test

      - name: Compile TypeSpec with warnings denied
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/fiducia-typespec"
          npm run typespec:compile -- --output-dir "${output_dir}"
          output="${output_dir}/openapi3/fiducia-commercial-intake.openapi.json"
          test -s "${output}"
          python3 -m json.tool "${output}" >/dev/null
          grep -q '"/v1/pre-interest"' "${output}"
          grep -q '"/v1/admin/quotes"' "${output}"

      - name: Lint both authorities and generate deterministic interfaces
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          openapi="${RUNNER_TEMP}/fiducia-typespec/openapi3/fiducia-commercial-intake.openapi.json"
          first="${RUNNER_TEMP}/fiducia-generated-first"
          second="${RUNNER_TEMP}/fiducia-generated-second"

          node tools/generate-contract-interfaces.mjs \
            --schema contracts/commercial-intake.schema.json \
            --openapi "${openapi}" \
            --output-dir "${first}"
          node tools/generate-contract-interfaces.mjs \
            --schema contracts/commercial-intake.schema.json \
            --openapi "${openapi}" \
            --output-dir "${second}"
          node tools/generate-contract-interfaces.mjs \
            --schema contracts/commercial-intake.schema.json \
            --openapi "${openapi}" \
            --output-dir "${RUNNER_TEMP}/unused-check-output" \
            --check

          diff --recursive --unified "${first}" "${second}"
          test -s "${first}/payload-types.ts"
          test -s "${first}/api-operations.ts"
          test -s "${first}/contract-manifest.json"
          grep -q 'export interface PreInterest' "${first}/payload-types.ts"
          grep -q 'export interface Quote' "${first}/payload-types.ts"
          grep -q '/v1/pre-interest' "${first}/api-operations.ts"
          grep -q '/v1/admin/quotes' "${first}/api-operations.ts"

          GENERATED_DIR="${first}" python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import stat

          generated = Path(os.environ['GENERATED_DIR'])
          manifest = json.loads((generated / 'contract-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('format') != 'fiducia.contract-generation-manifest.v1':
              raise SystemExit('unexpected generation manifest format')
          operations = manifest['openapi']['operations']
          if not any(item['audience'] == 'public' for item in operations):
              raise SystemExit('generated operation manifest lacks public operations')
          if not any(item['audience'] == 'admin' for item in operations):
              raise SystemExit('generated operation manifest lacks admin operations')
          for name in ('payload-types.ts', 'api-operations.ts', 'contract-manifest.json'):
              mode = stat.S_IMODE((generated / name).stat().st_mode)
              if mode != 0o444:
                  raise SystemExit(f'{name} mode is {oct(mode)}, expected 0o444')
          PY
