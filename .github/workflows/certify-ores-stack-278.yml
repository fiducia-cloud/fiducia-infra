name: certify ores-stack 278 governance

on:
  push:
    branches:
      - proof/ores-stack-278-governance-20260924
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/certify-ores-stack-278.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-stack
  SOURCE_BRANCH: feat/cli-contract-governance-v1-20260922
  SOURCE_SHA: 655c1766858099f38ea28499c9a67e80d3604c48
  SOURCE_MAIN_SHA: d46c07e0f91c2dbda9b2fee64bdd82f6d52fc1ef

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
      - name: Check out exact ores-stack source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-stack
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
      - name: Guard exact source identity and remote immutability
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base "$SOURCE_MAIN_SHA" "$SOURCE_SHA")" = "$SOURCE_MAIN_SHA"
          git diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.9.0
      - name: Reject rustfmt debt in PR-touched Rust files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff -- crates/ores-stack-cli/src/contract_cli.rs crates/ores-stack-cli/src/stack_cli_hardened.rs crates/ores-stack-cli/src/entry.rs
          test -z "$(git diff -- crates/ores-stack-cli/src/contract_cli.rs crates/ores-stack-cli/src/stack_cli_hardened.rs crates/ores-stack-cli/src/entry.rs)"
          git reset --hard "$SOURCE_SHA" >/dev/null
          git clean -ffd >/dev/null
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Configure scoped Cargo git authentication
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global net.git-fetch-with-cli true
      - name: Prefetch locked Cargo graph under scoped authentication
        run: cargo fetch --locked
      - name: Remove Cargo git authentication
        if: always()
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global --unset-all url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf || true
          git config --global --unset-all net.git-fetch-with-cli || true
      - name: Check CLI with prefetched locked graph
        run: cargo check -p ores-stack-cli --all-targets --locked --offline
      - name: Prove inherited RPC fixture failures on exact base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_MAIN_SHA"
          set +e
          cargo test -p ores-stack-cli source_only_sync_and_check_need_no_client_fanout_arguments --locked --offline 2>&1 | tee "$RUNNER_TEMP/base-rpc-source-only.log"
          rc1=${PIPESTATUS[0]}
          cargo test -p ores-stack-cli sync_check_detects_generated_rpc_drift --locked --offline 2>&1 | tee "$RUNNER_TEMP/base-rpc-drift.log"
          rc2=${PIPESTATUS[0]}
          set -e
          test "$rc1" -ne 0
          test "$rc2" -ne 0
          grep -F 'REST route authority moved under src/routes/rest/**' "$RUNNER_TEMP/base-rpc-source-only.log"
          grep -F 'REST route authority moved under src/routes/rest/**' "$RUNNER_TEMP/base-rpc-drift.log"
          git checkout --detach "$SOURCE_SHA"
      - name: Test CLI excluding only proven inherited RPC fixture failures
        run: |
          cargo test -p ores-stack-cli --locked --offline -- \
            --skip source_only_sync_and_check_need_no_client_fanout_arguments \
            --skip sync_check_detects_generated_rpc_drift
      - name: Install contract tooling
        run: npm ci
      - name: Check TypeSpec and JSON Schema governance parity
        run: npm run check:contracts
      - name: Final immutable source guard
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_SHA" >/dev/null
          git clean -ffd >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
