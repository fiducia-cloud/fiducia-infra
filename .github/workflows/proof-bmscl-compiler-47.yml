name: proof-bmscl-compiler-47

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-bmscl-compiler-47.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 147f1a31cde048fcea7a58c81494288bb7400723

jobs:
  exact-head-rust-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact BeamScale compiler head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-compiler
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          test -f Cargo.toml
          test ! -e Cargo.lock

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.1.1"
          gleam-version: "1.18.1"
          version-type: strict

      - name: Generate deterministic dependency lock for proof
        run: cargo generate-lockfile

      - name: Check exact-head formatting
        id: fmt_check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Generate rustfmt remediation patch
        if: steps.fmt_check.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary > /tmp/bmscl-compiler-47-rustfmt.patch
          test -s /tmp/bmscl-compiler-47-rustfmt.patch

      - name: Preserve rustfmt remediation patch
        if: steps.fmt_check.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bmscl-compiler-47-rustfmt-patch
          path: /tmp/bmscl-compiler-47-rustfmt.patch
          if-no-files-found: error
          retention-days: 7

      - name: Clippy
        id: clippy_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/bmscl-compiler-47-clippy.txt

      - name: Preserve Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bmscl-compiler-47-clippy
          path: /tmp/bmscl-compiler-47-clippy.txt
          if-no-files-found: error
          retention-days: 7

      - name: Full Rust test suite
        run: cargo test --locked --all-targets

      - name: Run dependency safety cache regressions explicitly
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test safety_cache_path_isolation
          cargo test --locked --test dependency_safety_vectors

      - name: Preserve generated lock as review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bmscl-compiler-47-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7

      - name: Fail exact-head proof if formatting was not clean
        if: steps.fmt_check.outcome == 'failure'
        run: |
          echo 'Exact source head is not rustfmt-clean; apply the retained remediation patch and re-run this proof.' >&2
          exit 1

      - name: Fail exact-head proof if Clippy was not clean
        if: steps.clippy_check.outcome == 'failure'
        run: |
          echo 'Exact source head failed strict Clippy; inspect the retained diagnostics artifact and fix source.' >&2
          exit 1
