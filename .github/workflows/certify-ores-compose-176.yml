name: certify ores-compose 176

on:
  push:
    branches:
      - certify/ores-compose-176-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require private source credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          test -n "$ORE_SOURCE_PAT" || { echo 'ORE_SOURCE_PAT is required' >&2; exit 1; }

      - name: Check out exact ores-compose head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ORESoftware/ores-compose
          ref: c261240732383b45b22b18b9c2db3dd6143325b5
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false

      - name: Install Rust 1.88
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
