name: ores-http-clients Rust bounded-stream debug

on:
  pull_request:
    paths:
      - ".github/workflows/ores-http-clients-rust-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ORESoftware/ores-http-clients
          ref: fix/bounded-response-streams
          path: source
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
      - name: Apply candidate and instrument result
        working-directory: source
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          harness = Path('../harness/.github/workflows/ores-http-clients-fix-bounded-streams-v2.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = harness.index(marker) + len(marker)
          end = harness.index("\n          PY\n", start)
          script = textwrap.dedent(harness[start:end])
          script = script.replace(
              'updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)',
              'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)',
          )
          exec(compile(script, 'bounded-stream-remediation.py', 'exec'), {})

          test = Path('src/rust/tests/client.rs')
          text = test.read_text()
          text, count = re.subn(
              r'(\.expect\("client should reject before the server finishes the response"\);\n)',
              r'\1              eprintln!("bounded-stream result: {result:?}");\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one debug insertion point, got {count}')
          test.write_text(text)
          PY
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.0
      - name: Run focused Rust canary
        working-directory: source/src/rust
        run: |
          cargo test --test client chunked_response_limit_returns_before_body_finishes -- --nocapture
