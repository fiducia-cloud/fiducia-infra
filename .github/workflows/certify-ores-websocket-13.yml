name: certify ores-websocket 13

on:
  push:
    branches:
      - proof/ores-websocket-13-zpkg-fiducia-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_REPO: ORESoftware/ores-websocket
      SOURCE_BRANCH: fix/zpkg-universal-language-20260922
      SOURCE_SHA: 9c0391cf4e62921d557aec86eecedbdbd54ce8dd
      SOURCE_MAIN_SHA: 8cceeaf7142c469bc7ef55c16dc51ae0f9aeb43e
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-websocket
          ref: 9c0391cf4e62921d557aec86eecedbdbd54ce8dd
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard manifest-only delta
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_MAIN_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".zpkg.toml"
          git diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
          grep -F 'language = "universal"' .zpkg.toml
          ! grep -F 'language = "multi"' .zpkg.toml
          ! grep -Eq '^\[targets\.' .zpkg.toml
          grep -F 'test = "sh conformance/check.sh"' .zpkg.toml
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"

      - name: Install pinned Zed CLI
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          cargo install --git https://github.com/zed-pkg/zed-cli --rev 344d432a6f94d4b1cfa02228ec36623c7484177a --locked zed-cli
          git config --global --unset-all url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf || true

      - name: Validate and materialize Zed package
        shell: bash
        run: |
          set -euo pipefail
          zed validate
          unset ZED_PKG_GITHUB_TOKEN || true
          zed install --allow-build --install-mode copy
          zed validate --require-lock

      - name: Rust 1.88 source checks
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Node 22.9 checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.9.0
      - name: TypeScript checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run check

      - name: Final immutable source guard
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
          git diff --check
