name: ores-stack-247-249-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-247-249-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  rpc_adapter_247:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORES_STACK_SHA: '80173862ecffc4fee18fd2dd8b261418e7628048'
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact #247 head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Format adapter delta
        shell: bash
        working-directory: ores-stack
        run: rustfmt --edition 2024 --check crates/ores-fn-adapters/src/lib.rs crates/ores-fn-adapters/src/rpc_http.rs

      - name: Check standalone provider adapter
        shell: bash
        working-directory: ores-stack
        run: cargo check --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets

      - name: Test standalone provider adapter
        shell: bash
        working-directory: ores-stack
        run: cargo test --manifest-path crates/ores-fn-adapters/Cargo.toml

      - name: Clippy standalone provider adapter
        shell: bash
        working-directory: ores-stack
        run: cargo clippy --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets -- -D warnings

  ppr_request_ingress_249:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORES_STACK_SHA: 'e2d9d2403c74ce54ece823f6d552af13315fb8e9'
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact #249 head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Bootstrap workspace lock
        shell: bash
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure

      - name: Format strict PPR HTTP authority
        shell: bash
        working-directory: ores-stack
        run: rustfmt --edition 2024 --check crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs

      - name: Check strict PPR HTTP crate
        shell: bash
        working-directory: ores-stack
        run: cargo check --locked -p ores-stack-ppr-http --all-targets

      - name: Test strict PPR HTTP crate
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-ppr-http

      - name: Clippy strict PPR HTTP crate
        shell: bash
        working-directory: ores-stack
        run: cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings
