name: funding-catalog

on:
  pull_request:
    paths:
      - "funding/**"
      - "tools/validate-funding.mjs"
      - "tools/validate-funding.test.mjs"
      - "tools/validate-funding-candidates.mjs"
      - "tools/validate-funding-candidates.test.mjs"
      - ".github/workflows/funding-catalog.yml"
  push:
    branches: [main]
    paths:
      - "funding/**"
      - "tools/validate-funding.mjs"
      - "tools/validate-funding.test.mjs"
      - "tools/validate-funding-candidates.mjs"
      - "tools/validate-funding-candidates.test.mjs"
      - ".github/workflows/funding-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funding-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Validate provider catalog
        run: node tools/validate-funding.mjs
      - name: Validate every opportunity candidate snapshot
        run: node tools/validate-funding-candidates.mjs funding
      - name: Run fail-closed validator tests
        run: node --test tools/validate-funding.test.mjs tools/validate-funding-candidates.test.mjs
