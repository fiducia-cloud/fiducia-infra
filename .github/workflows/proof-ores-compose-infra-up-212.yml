name: proof ORES compose infra up 212

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-compose-infra-up-212.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_SHA: 4e790084f09bc5e69a91859e86810070897ec6f9

jobs:
  rust-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact ores-compose head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$COMPOSE_SHA"

      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install reviewed Rust toolchain and PostgreSQL client
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Compile exact head
        run: cargo check --locked --all-targets --all-features

      - name: Run focused Rust and contract tests
        run: |
          cargo test --locked --lib --all-features
          cargo test --locked --test contract_authority

      - name: Build ores-compose
        run: cargo build --locked --bin ores-compose

      - name: Prove Postgres infra plus app orchestration
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/ores-compose-oci-postgres.log"
          : > "$log"

          ./target/debug/ores-compose             --skip-zed-pkg             --skip-rpc-gen             up tests/fixtures/oci-postgres/.ores-compose.yaml             >"$log" 2>&1 &
          pid=$!

          cleanup() {
            kill -INT "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            docker ps -aq --filter 'ancestor=postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea' | xargs -r docker rm -f || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 120); do
            if grep -q '"event":"compose_ready"' "$log"; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              echo "ores-compose exited before compose_ready" >&2
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != 1 ]]; then
            cat "$log"
            echo "timed out waiting for compose_ready" >&2
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:18088/healthz | tee "$RUNNER_TEMP/app-health.json"
          grep -q '"event":"service_completed".*"service":"bootstrap"' "$log"

          kill -INT "$pid"
          wait "$pid"
          trap - EXIT

          cat "$log"
          if docker ps -a --format '{{.Image}} {{.Names}}' | grep -q 'postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea'; then
            echo "PostgreSQL OCI resource leaked after clean shutdown" >&2
            docker ps -a
            exit 1
          fi

      - name: Final exact-head guard
        if: always()
        run: test "$(git rev-parse HEAD)" = "$COMPOSE_SHA"
