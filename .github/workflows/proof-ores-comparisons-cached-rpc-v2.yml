name: proof ORES comparisons cached-rpc v2 manifests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-comparisons-cached-rpc-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_SHA: 4e790084f09bc5e69a91859e86810070897ec6f9
  CACHED_BEAM_SHA: fbc7dc213997a8478678f298e8900aa7fb792e59
  CACHED_ORES_SHA: 0a455fb18a8d2012da5aacd34a44b7bb12f35f96
  CACHED_SCINT_SHA: 702330b84d0b6daa95a59e6c6266941368981524

jobs:
  validate-cached-rpc-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact ores-compose head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: compose
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout cached-rpc BeamScale authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-dummy-org-4/.github
          ref: ${{ env.CACHED_BEAM_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: manifests/cached-rpc/beamscale
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout cached-rpc ORES Stack authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-dummy-org-4/.github
          ref: ${{ env.CACHED_ORES_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: manifests/cached-rpc/ores-stack
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout cached-rpc Scintilla authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-dummy-org-4/.github
          ref: ${{ env.CACHED_SCINT_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: manifests/cached-rpc/scintilla-run
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable source heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compose rev-parse HEAD)" = "$COMPOSE_SHA"
          test "$(git -C manifests/cached-rpc/beamscale rev-parse HEAD)" = "$CACHED_BEAM_SHA"
          test "$(git -C manifests/cached-rpc/ores-stack rev-parse HEAD)" = "$CACHED_ORES_SHA"
          test "$(git -C manifests/cached-rpc/scintilla-run rev-parse HEAD)" = "$CACHED_SCINT_SHA"

      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install reviewed Rust toolchain and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build exact ores-compose
        working-directory: compose
        run: cargo build --locked --bin ores-compose

      - name: Check and plan cached-rpc v2 authorities
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/compose/target/debug/ores-compose"
          for manifest in \
            manifests/cached-rpc/beamscale/.ores-compose.yaml \
            manifests/cached-rpc/ores-stack/.ores-compose.yaml \
            manifests/cached-rpc/scintilla-run/.ores-compose.yaml
          do
            echo "=== check $manifest ==="
            "$binary" check "$manifest"
            echo "=== plan $manifest ==="
            "$binary" plan "$manifest"
          done

      - name: Final exact-head guards
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C compose rev-parse HEAD)" = "$COMPOSE_SHA"
          test "$(git -C manifests/cached-rpc/beamscale rev-parse HEAD)" = "$CACHED_BEAM_SHA"
          test "$(git -C manifests/cached-rpc/ores-stack rev-parse HEAD)" = "$CACHED_ORES_SHA"
          test "$(git -C manifests/cached-rpc/scintilla-run rev-parse HEAD)" = "$CACHED_SCINT_SHA"
