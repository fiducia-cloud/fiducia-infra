name: One-shot lock Fiducia quote TypeSpec

on:
  push:
    branches:
      - alexanderdmills/den-608-typespec-compile-gate
    paths:
      - '.github/workflows/one-shot-lock-quote-typespec-den-608.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-lock-fiducia-typespec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock-compile-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Materialize exact npm lockfile
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --save-exact
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile TypeSpec and inspect OpenAPI
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/fiducia-typespec"
          rm -rf -- "${output_dir}"
          ./node_modules/.bin/tsp compile \
            contracts/main.tsp \
            --config tspconfig.yaml \
            --output-dir "${output_dir}" \
            --warn-as-error
          output="${output_dir}/openapi3/fiducia-commercial-intake.openapi.yaml"
          test -s "${output}"
          grep -q '/v1/pre-interest' "${output}"
          grep -q '/v1/admin/quotes' "${output}"

      - name: Install permanent read-only TypeSpec verification
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/quote-system-typespec.yml <<'WORKFLOW'
          name: Fiducia quote TypeSpec

          on:
            pull_request:
              paths:
                - 'quote-system/contracts/**'
                - 'quote-system/package.json'
                - 'quote-system/package-lock.json'
                - 'quote-system/tspconfig.yaml'
                - '.github/workflows/quote-system-typespec.yml'
            push:
              branches:
                - main
              paths:
                - 'quote-system/contracts/**'
                - 'quote-system/package.json'
                - 'quote-system/package-lock.json'
                - 'quote-system/tspconfig.yaml'
                - '.github/workflows/quote-system-typespec.yml'
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: fiducia-quote-typespec-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            compile:
              runs-on: ubuntu-24.04
              timeout-minutes: 15
              steps:
                - name: Check out exact revision
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                  with:
                    persist-credentials: false

                - name: Install repository Node version
                  uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                  with:
                    node-version-file: '.nvmrc'

                - name: Require one exact aligned official TypeSpec release
                  working-directory: quote-system
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 <<'PY'
                    import json
                    import re
                    from pathlib import Path

                    exact = re.compile(r'^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$')
                    package = json.loads(Path('package.json').read_text(encoding='utf-8'))
                    dependencies = package.get('devDependencies')
                    required = {
                        '@typespec/compiler',
                        '@typespec/http',
                        '@typespec/openapi3',
                        '@typespec/rest',
                    }
                    if not isinstance(dependencies, dict) or set(dependencies) != required:
                        raise SystemExit('TypeSpec devDependencies must contain exactly the reviewed official package set')
                    versions = set(dependencies.values())
                    if len(versions) != 1 or not all(isinstance(value, str) and exact.fullmatch(value) for value in versions):
                        raise SystemExit('TypeSpec packages must use one aligned exact version without ranges')
                    PY

                - name: Install exact lockfile without lifecycle scripts
                  working-directory: quote-system
                  shell: bash
                  run: |
                    set -euo pipefail
                    npm ci --ignore-scripts --no-audit --no-fund

                - name: Compile and inspect generated OpenAPI
                  working-directory: quote-system
                  shell: bash
                  run: |
                    set -euo pipefail
                    output_dir="${RUNNER_TEMP}/fiducia-typespec"
                    ./node_modules/.bin/tsp compile \
                      contracts/main.tsp \
                      --config tspconfig.yaml \
                      --output-dir "${output_dir}" \
                      --warn-as-error
                    output="${output_dir}/openapi3/fiducia-commercial-intake.openapi.yaml"
                    test -s "${output}"
                    grep -q '/v1/pre-interest' "${output}"
                    grep -q '/v1/admin/quotes' "${output}"
          WORKFLOW

      - name: Re-run dependency-free contract oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile quote-system/tests/test_contracts.py
          python3 -m unittest -v quote-system/tests/test_contracts.py

      - name: Commit lock and permanent gate, then remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-lock-quote-typespec-den-608.yml
          git config user.name 'fiducia-contract-bot'
          git config user.email 'fiducia-contract-bot@users.noreply.github.com'
          git add -A
          git commit -m 'build(DEN-608): lock and compile Fiducia TypeSpec contract'
          git push origin "HEAD:${GITHUB_REF_NAME}"
