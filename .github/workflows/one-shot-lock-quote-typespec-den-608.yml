name: One-shot lock Fiducia quote TypeSpec

on:
  push:
    branches:
      - alexanderdmills/den-608-typespec-compile-gate
    paths:
      - '.github/workflows/one-shot-lock-quote-typespec-den-608.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-lock-fiducia-typespec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock-compile-and-persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Materialize exact npm lockfile
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --save-exact
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile TypeSpec and inspect OpenAPI
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/fiducia-typespec"
          rm -rf -- "${output_dir}"
          ./node_modules/.bin/tsp compile \
            contracts/main.tsp \
            --config tspconfig.yaml \
            --output-dir "${output_dir}" \
            --warn-as-error
          output="${output_dir}/openapi3/fiducia-commercial-intake.openapi.yaml"
          test -s "${output}"
          grep -q '/v1/pre-interest' "${output}"
          grep -q '/v1/admin/quotes' "${output}"

      - name: Re-run dependency-free contract oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile quote-system/tests/test_contracts.py
          python3 -m unittest -v quote-system/tests/test_contracts.py

      - name: Commit only the verified npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'fiducia-contract-bot'
          git config user.email 'fiducia-contract-bot@users.noreply.github.com'
          git add -- quote-system/package-lock.json
          git diff --cached --quiet && {
            echo 'Expected a newly generated package-lock.json' >&2
            exit 1
          }
          git commit -m 'build(DEN-608): lock Fiducia TypeSpec dependencies'
          git push origin "HEAD:${GITHUB_REF_NAME}"
