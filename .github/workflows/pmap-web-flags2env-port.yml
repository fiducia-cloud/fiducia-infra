name: pmap-web-flags2env-port

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pmap-web-flags2env-port.yml"

permissions:
  contents: read

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
      PMAP_MAIN_SHA: 5f8087db093810b22f6a3acb0902a39cc0ad4119
      PR_BASE_SHA: 49ecbc670dcacb50a8211d7250554947d9b565ad
      PR_HEAD_SHA: fe66eafadba7ba4a64582d24b6004d052bc73767
      PMAP_LIB_CORE_SHA: e4228ff170530b032e6781e04ee967ef54ba5df4
      ORES_API_DOCS_SHA: 2dbd222872a93a6fac02521f8b8d982dc406f146
      PMAP_PACKAGE: pmap-web-server
    steps:
      - name: Require cross-org source authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"

      - name: Check out exact current PMAP web main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: premarital-asset-protection/pmap-web-server.rs
          ref: ${{ env.PMAP_MAIN_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: pmap-web
          persist-credentials: false
          fetch-depth: 0

      - name: Apply focused PR 20 diff semantically
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pmap-web rev-parse HEAD)" = "$PMAP_MAIN_SHA"
          auth="url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf=https://github.com/"
          git -C pmap-web -c "$auth" fetch origin "$PR_BASE_SHA" "$PR_HEAD_SHA"
          git -C pmap-web switch -c direct-main-flags-port
          (
            cd pmap-web
            git diff "$PR_BASE_SHA" "$PR_HEAD_SHA" -- \
              .cli-flags.toml \
              .github/workflows/flags-contract.yml \
              Cargo.toml \
              src/flags.rs \
              src/intake.rs \
              src/main.rs \
              tools/flags-contract-check/Cargo.lock \
              tools/flags-contract-check/Cargo.toml \
              tools/flags-contract-check/src/lib.rs \
              | git apply --3way --index

            sed -i "s#ores-api-docs = { git = \"https://github.com/ORESoftware/api-docs\" }#ores-api-docs = { git = \"https://github.com/ORESoftware/api-docs\", rev = \"${ORES_API_DOCS_SHA}\" }#" Cargo.toml
            grep -Fq "rev = \"${ORES_API_DOCS_SHA}\"" Cargo.toml

            # PR #20 mounts intake at the top level so docs must no longer compile/merge
            # a second copy of the same module/router.
            sed -i '/^#\[path = "intake.rs"\]$/,+1d' src/docs.rs
            sed -i 's/axum_router::router(catalog)\.merge(intake::router())/axum_router::router(catalog)/' src/docs.rs
            test "$(grep -c 'mod intake;' src/main.rs)" = "1"
            ! grep -Fq 'merge(intake::router())' src/docs.rs

            sed -i "s/^ARG PMAP_LIB_CORE_REV=.*/ARG PMAP_LIB_CORE_REV=${PMAP_LIB_CORE_SHA}/" Dockerfile
            grep -Fq "ARG PMAP_LIB_CORE_REV=${PMAP_LIB_CORE_SHA}" Dockerfile
            git add Cargo.toml Dockerfile src/docs.rs
          )

      - name: Materialize exact repaired private sibling
        shell: bash
        run: |
          set -euo pipefail
          auth="url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf=https://github.com/"
          git init pmap-lib-core
          git -C pmap-lib-core remote add origin https://github.com/premarital-asset-protection/pmap-lib-core.git
          git -C pmap-lib-core -c "$auth" fetch --depth=1 origin "$PMAP_LIB_CORE_SHA"
          git -C pmap-lib-core checkout --detach FETCH_HEAD
          test "$(git -C pmap-lib-core rev-parse HEAD)" = "$PMAP_LIB_CORE_SHA"

      - name: Regenerate lock, format candidate, and constrain paths
        shell: bash
        run: |
          set -euo pipefail
          cd pmap-web
          cargo generate-lockfile
          cargo fmt --package "$PMAP_PACKAGE"
          git add Cargo.lock src/docs.rs src/flags.rs src/intake.rs src/main.rs
          changed="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              .cli-flags.toml|.github/workflows/flags-contract.yml|Cargo.toml|Cargo.lock|Dockerfile|src/docs.rs|src/flags.rs|src/intake.rs|src/main.rs|tools/flags-contract-check/Cargo.lock|tools/flags-contract-check/Cargo.toml|tools/flags-contract-check/src/lib.rs) ;;
              *) echo "unexpected path in semantic port: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Rust tests, warning-free Clippy, and flags contract
        shell: bash
        run: |
          set -euo pipefail
          cd pmap-web
          cargo fmt --package "$PMAP_PACKAGE" -- --check
          cargo test --package "$PMAP_PACKAGE" --locked
          cargo clippy --package "$PMAP_PACKAGE" --all-targets --locked -- -D warnings
          cargo metadata --manifest-path tools/flags-contract-check/Cargo.toml --locked --no-deps --format-version 1 >/dev/null
          cargo test --manifest-path tools/flags-contract-check/Cargo.toml --locked

      - name: Build real standalone image from committed candidate inputs
        shell: bash
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          docker build \
            --secret id=github_token,env=ORE_SOURCE_PAT \
            --build-arg TARGETARCH=amd64 \
            --tag pmap-web-flags-cert:latest \
            --file pmap-web/Dockerfile \
            pmap-web

      - name: Commit and fast-forward PMAP main only if unchanged
        shell: bash
        run: |
          set -euo pipefail
          auth="url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf=https://github.com/"
          remote_main="$(git -C pmap-web -c "$auth" ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$PMAP_MAIN_SHA"
          git -C pmap-web config user.name "ORESoftware"
          git -C pmap-web config user.email "alex@oresoftware.com"
          git -C pmap-web commit -m "feat(config): mount intake behind current flags2env runtime contract" -m "Semantic port of focused PR #20 onto the post-image-certification mainline. Mount intake once, pin shared runtime authorities, regenerate the root lock, and preserve the strict locked Docker build."
          git -C pmap-web -c "$auth" push origin HEAD:main
