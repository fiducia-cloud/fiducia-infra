name: ores-stack PPR request HRTB repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-ppr-request-restack.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET_SHA: '1b2eda561882a38bc30f434810520d9c970810d2'
  TARGET_BRANCH: 'fix/ppr-request-deadline-hrtb-20260922'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact merged-main repair base
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$TARGET_SHA"
          git -C ores-stack checkout -b repair FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$TARGET_SHA"
          remote_head="$(git -C ores-stack ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA" || { echo "target branch moved: expected $TARGET_SHA got $remote_head"; exit 1; }
      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
      - name: Apply only Rust-1.88 deadline lifetime repair
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ores-stack-ppr-http/src/request.rs')
          text = path.read_text()
          old = '    with_tcp_deadline(stream, deadline, read_request_head)'
          new = '    with_tcp_deadline(stream, deadline, |reader| read_request_head(reader))'
          assert text.count(old) == 1, f'unexpected source count: {text.count(old)}'
          path.write_text(text.replace(old, new, 1))
          PY
          rustfmt --edition 2024 crates/ores-stack-ppr-http/src/request.rs
          rustfmt --edition 2024 --check crates/ores-stack-ppr-http/src/request.rs
          git diff --check
          test "$(git diff --name-only)" = 'crates/ores-stack-ppr-http/src/request.rs'
      - name: Certify merged request authority
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked -p ores-stack-ppr-http --all-targets
          cargo test --locked -p ores-stack-ppr-http -- --nocapture
          cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings
          git diff --check
          test "$(git diff --name-only)" = 'crates/ores-stack-ppr-http/src/request.rs'
      - name: Commit and fast-forward guarded repair
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA" || { echo "target branch moved: expected $TARGET_SHA got $remote_head"; exit 1; }
          test "$(git diff --name-only)" = 'crates/ores-stack-ppr-http/src/request.rs'
          git config user.name 'ores-stack certification'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/ores-stack-ppr-http/src/request.rs
          git commit -m 'fix(ppr): satisfy request deadline reader lifetime'
          git push origin HEAD:"$TARGET_BRANCH"
