name: ores-stack PPR request clean restack

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-ppr-request-restack.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SOURCE_SHA: '8c8632950cee3c1ed0b7230e73f40dc01c3e8d71'
  TARGET_BASE: 'bd4f6fcd352830bb55f13661468fb7f464420bd8'
  TARGET_BRANCH: 'salvage/ppr-request-ingress-current-main-20260922'

jobs:
  restack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch immutable source and target base
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$TARGET_BASE"
          git -C ores-stack checkout -b restack FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$TARGET_BASE"
          remote_head="$(git -C ores-stack ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_BASE" || { echo "target branch moved: expected $TARGET_BASE got $remote_head"; exit 1; }
          git -C ores-stack fetch --depth=1 origin "$SOURCE_SHA"

      - name: Reapply request ingress authority onto canonical response writer
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          git show "$SOURCE_SHA:crates/ores-stack-ppr-http/src/request.rs" > crates/ores-stack-ppr-http/src/request.rs
          cat >/tmp/restack_request.py <<'PY'
          from pathlib import Path

          request = Path('crates/ores-stack-ppr-http/src/request.rs')
          text = request.read_text()
          old = '    with_tcp_deadline(stream, deadline, read_request_head)'
          new = '    with_tcp_deadline(stream, deadline, |reader| read_request_head(reader))'
          assert text.count(old) == 1, text.count(old)
          request.write_text(text.replace(old, new, 1))

          strict = Path('crates/ores-stack-ppr-http/src/lib_strict.rs')
          text = strict.read_text()
          assert 'mod request;' not in text
          text = text.replace('mod framing;\n', 'mod framing;\nmod request;\n', 1)
          marker = '/// Write one already-validated P3 response head through the canonical P1\n'
          assert marker in text
          export = '''pub use request::{
              MAX_REQUEST_BODY_BYTES, MAX_REQUEST_CHUNK_LINE_BYTES, MAX_REQUEST_CHUNKS,
              MAX_REQUEST_HEADER_COUNT, MAX_REQUEST_HEAD_BYTES, MAX_REQUEST_METHOD_BYTES,
              MAX_REQUEST_TARGET_BYTES, MAX_REQUEST_TRAILER_BYTES, RequestBodyFraming, RequestHead,
              read_request_head, read_tcp_request_head_before, relay_request_body,
              relay_tcp_request_body_before,
          };

          '''
          strict.write_text(text.replace(marker, export + marker, 1))
          PY
          python3 /tmp/restack_request.py
          git diff --check
          git status --porcelain=v1 | cut -c4- | sort -u > /tmp/changed
          printf '%s\n' crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Format and certify request ingress authority
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          rustfmt --edition 2024 --check crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked -p ores-stack-ppr-http --all-targets
          cargo test --locked -p ores-stack-ppr-http -- --nocapture
          cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings
          git diff --check
          git status --porcelain=v1 | cut -c4- | sort -u > /tmp/changed
          printf '%s\n' crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed

      - name: Commit and fast-forward certified restack
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_BASE" || { echo "target branch moved: expected $TARGET_BASE got $remote_head"; exit 1; }
          git config user.name 'ores-stack certification'
          git config user.email 'actions@users.noreply.github.com'
          git add crates/ores-stack-ppr-http/src/lib_strict.rs crates/ores-stack-ppr-http/src/request.rs
          git commit -m 'feat(ppr): add bounded request ingress authority'
          git push origin HEAD:"$TARGET_BRANCH"
