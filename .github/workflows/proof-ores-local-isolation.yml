name: proof ores local process isolation

on:
  push:
    branches:
      - proof/ores-local-isolation-20260925
  workflow_dispatch:

permissions:
  contents: read

env:
  PROC_SHA: 48b88f85767f016639f82870a72b52c6238ad481
  COMPOSE_SHA: b93aea165f097fd01b53afe00ecccbcf9dcb421d

jobs:
  proc-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout exact ores-proc-isolation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ env.PROC_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source head
        run: |
          test "$(git rev-parse HEAD)" = "$PROC_SHA"
          test -f Cargo.lock
          git ls-files --error-unmatch Cargo.lock >/dev/null
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Static and Rust checks
        run: |
          set -euo pipefail
          bash -n scripts/linux/ores-proc-isolate.sh
          bash -n scripts/macos/ores-proc-isolate.sh
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --quiet --examples --bins
      - name: Prove same-user local Seatbelt containment and stdin environment boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ores-proof-work /tmp/ores-proof-outside /tmp/ores-proof-outside.txt
          mkdir -p /tmp/ores-proof-work /tmp/ores-proof-outside
          ln -s /tmp/ores-proof-outside /tmp/ores-proof-work/escape
          cat >/tmp/ores-proof-policy.yaml <<'YAML'
          version: 1
          defaults:
            group: local
          groups:
            local:
              filesystem:
                read_only:
                  - /usr/bin
                  - /bin
                read_write:
                  - /tmp/ores-proof-work
              network:
                mode: local
                deny_loopback: false
                deny_private_networks: false
            none:
              filesystem:
                read_only:
                  - /usr/bin
                  - /bin
              network:
                mode: none
          processes:
            identity:
              group: none
              command: [/usr/bin/id, -u]
            host-probe:
              group: none
              command: [/bin/kill, -0]
            env-overlay:
              group: none
              command: [/usr/bin/printenv, APP_MODE]
              environment:
                APP_MODE: placeholder
            inside:
              group: local
              command: [/bin/sh, -c, "printf ok > inside.txt"]
              working_directory: /tmp/ores-proof-work
            outside:
              group: local
              command: [/bin/sh, -c, "printf denied > /tmp/ores-proof-outside.txt"]
              working_directory: /tmp/ores-proof-work
            symlink:
              group: local
              command: [/bin/sh, -c, "printf denied > escape/escaped.txt"]
              working_directory: /tmp/ores-proof-work
          YAML
          actual="$(target/debug/ores-proc-isolation run identity --config /tmp/ores-proof-policy.yaml)"
          test "$actual" = "$(id -u)"

          overlay="$(printf '%s' '{"APP_MODE":"worker"}' | target/debug/ores-proc-isolation --target-env-stdin run env-overlay --config /tmp/ores-proof-policy.yaml)"
          test "$overlay" = worker

          if printf '%s' '{"UNDECLARED":"x"}' | target/debug/ores-proc-isolation --target-env-stdin run env-overlay --config /tmp/ores-proof-policy.yaml; then
            echo "undeclared stdin environment key unexpectedly succeeded" >&2
            exit 1
          fi

          dry="$(printf '%s' '{"APP_MODE":"super-secret-value"}' | target/debug/ores-proc-isolation --target-env-stdin --dry-run --json run env-overlay --config /tmp/ores-proof-policy.yaml)"
          printf '%s' "$dry" | grep -q 'APP_MODE'
          if printf '%s' "$dry" | grep -q 'super-secret-value'; then
            echo "dry-run leaked stdin environment value" >&2
            exit 1
          fi

          if target/debug/ores-proc-isolation --target-env-stdin check --config /tmp/ores-proof-policy.yaml </dev/null; then
            echo "run-only stdin environment flag unexpectedly accepted by check" >&2
            exit 1
          fi

          target/debug/ores-proc-isolation run inside --config /tmp/ores-proof-policy.yaml
          test "$(cat /tmp/ores-proof-work/inside.txt)" = ok
          if target/debug/ores-proc-isolation run outside --config /tmp/ores-proof-policy.yaml; then
            echo "outside workspace write unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -e /tmp/ores-proof-outside.txt
          if target/debug/ores-proc-isolation run symlink --config /tmp/ores-proof-policy.yaml; then
            echo "symlink workspace escape unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -e /tmp/ores-proof-outside/escaped.txt
          sleep 30 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          if target/debug/ores-proc-isolation run host-probe --config /tmp/ores-proof-policy.yaml -- "$host_pid"; then
            echo "same-uid sandbox unexpectedly probed host process" >&2
            exit 1
          fi
          kill -0 "$host_pid"
      - name: Reject replaceable policy paths
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/ores-proof-policy.yaml /tmp/ores-proof-policy-real.yaml
          ln -s /tmp/ores-proof-policy-real.yaml /tmp/ores-proof-policy-link.yaml
          if target/debug/ores-proc-isolation check --config /tmp/ores-proof-policy-link.yaml; then
            echo "symlink policy unexpectedly admitted" >&2
            exit 1
          fi
          cp /tmp/ores-proof-policy.yaml /tmp/ores-proof-policy-writable.yaml
          chmod 666 /tmp/ores-proof-policy-writable.yaml
          if target/debug/ores-proc-isolation check --config /tmp/ores-proof-policy-writable.yaml; then
            echo "group/world-writable policy unexpectedly admitted" >&2
            exit 1
          fi
      - name: Final exact-head guard
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$PROC_SHA"
          git diff --exit-code
          git diff --cached --exit-code

  proc-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact ores-proc-isolation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ env.PROC_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source head
        run: |
          test "$(git rev-parse HEAD)" = "$PROC_SHA"
          test -f Cargo.lock
          git ls-files --error-unmatch Cargo.lock >/dev/null
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Install Linux sandbox helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles apparmor-utils bubblewrap slirp4netns iproute2 iptables curl shellcheck
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || printf '0')" == '1' ]]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$profile"
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
      - name: Static and Rust checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/linux/ores-proc-isolate.sh
          bash -n scripts/macos/ores-proc-isolate.sh
          shellcheck scripts/linux/ores-proc-isolate.sh scripts/macos/ores-proc-isolate.sh
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --quiet --examples --bins
      - name: Prove Linux namespace boundary and stdin environment overlay
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ores-proof-linux.yaml <<'YAML'
          version: 1
          defaults:
            group: no-net
          groups:
            no-net:
              network:
                mode: none
            external:
              network:
                mode: external
                deny_loopback: true
                deny_private_networks: true
          processes:
            true:
              group: no-net
              command: [/usr/bin/true]
            passwd:
              group: no-net
              command: [/usr/bin/cat, /etc/passwd]
            env-overlay:
              group: no-net
              command: [/usr/bin/printenv, APP_MODE]
              environment:
                APP_MODE: placeholder
            curl-flex:
              group: external
              command: [/usr/bin/curl, --fail, --silent, --show-error]
          YAML
          target/debug/ores-proc-isolation run true --config /tmp/ores-proof-linux.yaml
          if target/debug/ores-proc-isolation run passwd --config /tmp/ores-proof-linux.yaml; then
            echo "sandbox unexpectedly read host /etc/passwd" >&2
            exit 1
          fi
          overlay="$(printf '%s' '{"APP_MODE":"linux-worker"}' | target/debug/ores-proc-isolation --target-env-stdin run env-overlay --config /tmp/ores-proof-linux.yaml)"
          test "$overlay" = linux-worker
          target/debug/examples/loopback_fixture 127.0.0.1:18080 >/tmp/ores-proof-linux-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:18080 >/dev/null
          if target/debug/ores-proc-isolation run curl-flex --config /tmp/ores-proof-linux.yaml -- http://127.0.0.1:18080; then
            echo "sandbox unexpectedly reached host loopback" >&2
            exit 1
          fi
      - name: Reject replaceable Linux policy paths
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/ores-proof-linux.yaml /tmp/ores-proof-linux-real.yaml
          ln -s /tmp/ores-proof-linux-real.yaml /tmp/ores-proof-linux-link.yaml
          if target/debug/ores-proc-isolation check --config /tmp/ores-proof-linux-link.yaml; then
            echo "symlink policy unexpectedly admitted" >&2
            exit 1
          fi
          cp /tmp/ores-proof-linux.yaml /tmp/ores-proof-linux-writable.yaml
          chmod 666 /tmp/ores-proof-linux-writable.yaml
          if target/debug/ores-proc-isolation check --config /tmp/ores-proof-linux-writable.yaml; then
            echo "group/world-writable policy unexpectedly admitted" >&2
            exit 1
          fi
      - name: Final exact-head guard
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$PROC_SHA"
          git diff --exit-code
          git diff --cached --exit-code

  compose-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact ores-compose head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$COMPOSE_SHA"
      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Install reviewed Rust components
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - name: Format exact branch
        run: cargo fmt --all --check
      - name: Clippy exact branch
        if: always()
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test exact branch
        if: always()
        run: cargo test --all-targets --all-features
      - name: Final exact-head guard
        if: always()
        run: |
          git reset --hard "$COMPOSE_SHA" >/dev/null
          git clean -ffd >/dev/null
          test "$(git rev-parse HEAD)" = "$COMPOSE_SHA"

  compose-macos-e2e:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout exact ores-compose head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: compose
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact process-isolation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ env.PROC_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: isolation
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact heads
        run: |
          test "$(git -C compose rev-parse HEAD)" = "$COMPOSE_SHA"
          test "$(git -C isolation rev-parse HEAD)" = "$PROC_SHA"
      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Build both exact heads
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          cargo build --locked --manifest-path isolation/Cargo.toml --bin ores-proc-isolation
          cargo build --manifest-path compose/Cargo.toml --bin ores-compose
      - name: Reject attacker-controlled PATH helper selection
        shell: bash
        run: |
          set -euo pipefail
          fake_bin="$RUNNER_TEMP/fake-isolation-bin"
          root="$RUNNER_TEMP/ores-compose-path-proof"
          marker="$RUNNER_TEMP/fake-helper-ran"
          mkdir -p "$fake_bin" "$root/service"
          cat >"$fake_bin/ores-proc-isolation" <<EOF
          #!/bin/sh
          touch "$marker"
          cat >/dev/null
          exit 0
          EOF
          chmod 755 "$fake_bin/ores-proc-isolation"
          cat >"$root/.ores-compose.yaml" <<'YAML'
          schema_version: ores.compose.v1
          project: path-proof
          allow_lazy_start: false
          services:
            sleeper:
              runtime: host
              command: ["/bin/sleep", "1"]
              working_dir: service
          YAML
          if PATH="$fake_bin:$PATH" \
             ORES_COMPOSE_PROCESS_ISOLATION=required \
             ORES_PROC_ISOLATION_BIN=ores-proc-isolation \
             "$GITHUB_WORKSPACE/compose/target/debug/ores-compose" \
               --skip-zed-pkg --skip-rpc-gen --skip-source-sync \
               up "$root/.ores-compose.yaml" >"$RUNNER_TEMP/path-proof.log" 2>&1; then
            cat "$RUNNER_TEMP/path-proof.log" >&2
            echo "relative isolation helper override unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -e "$marker"
          grep -q 'ORES_PROC_ISOLATION_BIN must be an absolute path' "$RUNNER_TEMP/path-proof.log"

      - name: Run ores-compose through required same-user isolation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ores-compose-local-proof"
          mkdir -p "$root/service"
          cat >"$root/.ores-compose.yaml" <<'YAML'
          schema_version: ores.compose.v1
          project: local-proof
          allow_lazy_start: false
          services:
            sleeper:
              runtime: host
              command: ["/bin/sleep", "30"]
              working_dir: service
          YAML
          attacker_temp="$RUNNER_TEMP/attacker-controlled-tmp"
          mkdir -p "$attacker_temp"
          export TMPDIR="$attacker_temp"
          export ORES_COMPOSE_PROCESS_ISOLATION=required
          export ORES_PROC_ISOLATION_BIN="$GITHUB_WORKSPACE/isolation/target/debug/ores-proc-isolation"
          "$GITHUB_WORKSPACE/compose/target/debug/ores-compose" \
            --skip-zed-pkg \
            --skip-rpc-gen \
            --skip-source-sync \
            up "$root/.ores-compose.yaml" >"$RUNNER_TEMP/compose-proof.log" 2>&1 &
          compose_pid=$!
          cleanup() {
            kill -INT "$compose_pid" 2>/dev/null || true
            wait "$compose_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in {1..60}; do
            if grep -q '"event":"compose_ready"' "$RUNNER_TEMP/compose-proof.log"; then
              ready=1
              break
            fi
            if ! kill -0 "$compose_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/compose-proof.log" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$RUNNER_TEMP/compose-proof.log" >&2
            echo "compose did not become ready through ores-proc-isolation" >&2
            exit 1
          fi
          grep -q '"event":"process_isolation_enabled"' "$RUNNER_TEMP/compose-proof.log"
          if find "$attacker_temp" -maxdepth 1 -name 'ores-compose-isolation-*.yaml' -print -quit | grep -q .; then
            echo "generated isolation policy followed attacker-controlled TMPDIR" >&2
            find "$attacker_temp" -maxdepth 1 -name 'ores-compose-isolation-*.yaml' -print >&2
            exit 1
          fi
          kill -INT "$compose_pid"
          wait "$compose_pid"
          trap - EXIT
      - name: Final exact-head guards
        if: always()
        run: |
          test "$(git -C compose rev-parse HEAD)" = "$COMPOSE_SHA"
          test "$(git -C isolation rev-parse HEAD)" = "$PROC_SHA"
