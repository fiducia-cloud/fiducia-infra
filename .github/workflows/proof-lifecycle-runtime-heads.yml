name: proof-lifecycle-runtime-heads

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-lifecycle-runtime-heads.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BEAMSCALE_SOURCE_SHA: 7f1e631e2f2739f4c3b4c77888a1c47e3199678e
  SCINTILLA_SOURCE_SHA: a72ae4f31f46a626a65692289eefd91d0b7a2b00

jobs:
  beamscale-supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact BeamScale main head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-supervisor
          ref: ${{ env.BEAMSCALE_SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: beamscale
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact immutable BeamScale source
        working-directory: beamscale
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BEAMSCALE_SOURCE_SHA"
          git diff --check

      - name: Install BeamScale toolchain
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27.3'
          rebar3-version: '3.24.0'
          gleam-version: '1.18.0'
          version-type: strict

      - name: Compile BeamScale supervisor
        working-directory: beamscale
        run: rebar3 compile

      - name: Run BeamScale EUnit
        working-directory: beamscale
        run: rebar3 eunit

      - name: Run BeamScale xref
        working-directory: beamscale
        run: rebar3 xref

  scintilla-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Scintilla PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: scintilla-run/gleam-lambda-runner
          ref: ${{ env.SCINTILLA_SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: scintilla
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact immutable Scintilla source
        working-directory: scintilla
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCINTILLA_SOURCE_SHA"
          git diff --check

      - name: Install Scintilla toolchain
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27.3'
          gleam-version: '1.17.0'
          version-type: strict

      - name: Check changed Gleam formatting
        working-directory: scintilla
        run: gleam format --check src/gleam_lambda_runner/actors.gleam

      - name: Prove durable workflow activity uses lifecycle admission
        working-directory: scintilla
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'lambda_invocation_observer:invoke(' src/workflow_engine.erl
          if grep -F 'lambda_child_runner:invoke(' src/workflow_engine.erl; then
            echo 'workflow_engine must not bypass lifecycle admission for durable activities' >&2
            exit 1
          fi
          grep -F 'FOR UPDATE SKIP LOCKED' src/workflow_store.erl

      - name: Compile changed lifecycle and durable-work surfaces with warnings as errors
        working-directory: scintilla
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scintilla-lifecycle-proof
          erlc +warnings_as_errors -o /tmp/scintilla-lifecycle-proof \
            src/lambda_actor_alarm.erl \
            src/lambda_actor_lifecycle.erl \
            src/lambda_host_lifecycle.erl \
            src/lambda_host_lifecycle_socket.erl \
            src/lambda_invocation_observer.erl \
            src/lambda_runtime_supervisor.erl \
            src/workflow_engine.erl \
            test/lambda_host_lifecycle_tests.erl \
            test/lambda_host_lifecycle_socket_tests.erl

      - name: Run focused lifecycle and peer-credential EUnit
        shell: bash
        run: |
          set -euo pipefail
          erl -noshell -pa /tmp/scintilla-lifecycle-proof -eval '
            ok = case eunit:test(
                [lambda_host_lifecycle_tests, lambda_host_lifecycle_socket_tests],
                [verbose]
            ) of
                ok -> ok;
                error -> erlang:error(lifecycle_eunit_failed)
            end,
            halt(0).'
