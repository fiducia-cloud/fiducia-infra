name: ores-compose #154 default-feature Rust differential

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-compose-154-default-rust-diff.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_HEAD: 48bb3a014d4d53b26160936761ea146a8f6722f9
  COMPOSE_BASE: fb6d0b2aeb7d87c598e006bed050162b55e0c9f0

jobs:
  default-rust:
    strategy:
      fail-fast: false
      matrix:
        revision:
          - name: base
            sha: fb6d0b2aeb7d87c598e006bed050162b55e0c9f0
          - name: head
            sha: 48bb3a014d4d53b26160936761ea146a8f6722f9
    name: default-rust-${{ matrix.revision.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ matrix.revision.sha }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact immutable revision
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.revision.sha }}"
          if [[ "${{ matrix.revision.name }}" == head ]]; then
            remote_head="$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-compose.git" refs/pull/154/head | cut -f1)"
            test "$remote_head" = "$COMPOSE_HEAD"
            mapfile -t changed < <(git diff --name-only "$COMPOSE_BASE" "$COMPOSE_HEAD")
            expected=(
              contracts/json-schema/contract.schema.json
              contracts/typespec/main.tsp
              src/config_loader.rs
              src/local_up_process.rs
              src/service_environment.rs
              src/up_orchestrator.rs
            )
            test "${#changed[@]}" -eq "${#expected[@]}"
            diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
            git diff --check "$COMPOSE_BASE" "$COMPOSE_HEAD"
          fi

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Locked metadata
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Compile default features
        run: cargo check --locked --all-targets

      # Run lint independently of the known baseline unit-test failures so the
      # differential records whether #154 adds warning debt on either revision.
      - name: Strict Clippy default features
        continue-on-error: true
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test default features
        run: cargo test --locked --all-targets

      - name: Reconfirm immutable revision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.revision.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "ORES_COMPOSE_154_DEFAULT_${{ matrix.revision.name }}_COMPLETE"
