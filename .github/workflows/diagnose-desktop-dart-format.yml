name: diagnose desktop Dart formatter

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-desktop-dart-format.yml'

permissions:
  contents: read

jobs:
  dart-format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-desktop-bg-procs
          ref: dcb6107c53d1271dc6e5569070fc02bef796b428
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: '3.13.4'
      - name: Emit canonical formatter diff
        shell: bash
        run: |
          dart format clients/dart/desktop_bg_client.dart
          git diff -- clients/dart/desktop_bg_client.dart
          git diff --quiet -- clients/dart/desktop_bg_client.dart
