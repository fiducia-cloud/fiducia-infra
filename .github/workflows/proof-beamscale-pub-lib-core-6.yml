name: proof-beamscale-pub-lib-core-6

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 0f184a7425d5db72cd429e98d5aa263c8776fc0f

jobs:
  gleam-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact BeamScale pub-lib head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-pub-lib-core
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.1.1"
          gleam-version: "1.18.1"
          version-type: strict
      - name: Assert dependency-free trusted SDK
        run: |
          set -euo pipefail
          if grep -Eq '^\[(dev_)?dependencies\]' gleam.toml; then
            echo "::error::trusted SDK must remain dependency-free"
            exit 1
          fi
      - run: gleam format --check src
      - run: gleam check --target erlang
      - run: gleam build --target erlang
      - name: Prove source unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
