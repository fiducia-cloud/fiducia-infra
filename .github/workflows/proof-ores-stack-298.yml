name: proof-ores-stack-298

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-stack-298.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 6b9eb3e72e4771b46dd0861a9d33ead6f0886f57

jobs:
  contract-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact ORES Stack head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          grep -F 'typespec-json-schema-validator/archive/2f6a5e1564c2a52af0e61e5b47a983b145b28884.tar.gz' package.json
          grep -F 'check:route-manifest' package.json | grep -F -- '--int64-strategy=number'
          grep -F '@minValue(0)' contracts/route-manifest.tsp
          grep -F '@maxValue(9007199254740991)' contracts/route-manifest.tsp
          grep -F '"minimum": 0' contracts/route-manifest.schema.json
          grep -F '"maximum": 9007199254740991' contracts/route-manifest.schema.json
          grep -F '"CallableName"' contracts/ores-lambda-callable-id.schema.json
          grep -F '"CallableId"' contracts/ores-lambda-callable-id.schema.json
          grep -F '"LambdaCallableIdentityV1"' contracts/ores-lambda-callable-id.schema.json
      - name: Install Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install pinned contract toolchain
        shell: bash
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify pinned TJSV executable
        shell: bash
        run: |
          set -euo pipefail
          test -x node_modules/.bin/tjsv
          node_modules/.bin/tjsv --help >/dev/null
      - name: Run all contract parity checks
        shell: bash
        run: |
          set -uo pipefail
          if npm run check:contracts; then
            exit 0
          fi
          for report in \
            route-manifest-schema-parity.json \
            config-schema-parity.json \
            web-config-schema-parity.json \
            web-admission-schema-parity.json \
            web-plan-schema-parity.json \
            web-lambda-build-unit-schema-parity.json \
            lambda-callable-id-schema-parity.json \
            lambda-callable-registry-schema-parity.json \
            lambda-build-manifest-schema-parity.json \
            lambda-artifact-receipt-schema-parity.json; do
            if [[ -f ".ores-stack/$report" ]]; then
              echo "--- TJSV $report ---"
              cat ".ores-stack/$report"
            fi
          done
          exit 1
      - name: Prove tracked source unchanged
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
