name: ores-compose #187 exact-head certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-compose-187-yaml-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_HEAD: 6b5d8d06887f67a0e9a4316e6ebb6acad685e378
  COMPOSE_BASE: fbfad966f9770a9a8d3895880523280324b4ddc6

jobs:
  certify-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact ores-compose source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_HEAD }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact PR head and review scope
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPOSE_HEAD"
          actual="$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-compose.git" refs/pull/187/head | cut -f1)"
          test "$actual" = "$COMPOSE_HEAD"
          git cat-file -e "${COMPOSE_BASE}^{commit}"
          mapfile -t changed < <(git diff --name-only "$COMPOSE_BASE" "$COMPOSE_HEAD")
          expected=(src/config_loader.rs)
          test "${#changed[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}" | sort)
          git diff --check "$COMPOSE_BASE" "$COMPOSE_HEAD"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify pinned toolchain
        run: rustc --version | grep -F 'rustc 1.98.1'

      - name: Check changed Rust formatting
        run: rustfmt --check --edition 2021 --config skip_children=true src/config_loader.rs

      - name: Locked metadata
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Compile all targets and features
        run: cargo check --locked --all-targets --all-features

      - name: Focused config-loader regressions
        run: cargo test --locked --all-features config_loader -- --nocapture

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Full test suite
        run: cargo test --locked --all-targets --all-features

      - name: Reconfirm immutable exact head
        if: always()
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPOSE_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          actual="$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-compose.git" refs/pull/187/head | cut -f1)"
          test "$actual" = "$COMPOSE_HEAD"
          echo ORES_COMPOSE_187_EXACT_HEAD_CERT_COMPLETE
