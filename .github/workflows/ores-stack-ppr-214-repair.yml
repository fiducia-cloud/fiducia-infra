name: ores-stack ppr #214 guarded repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-ppr-214-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET_SHA: '55cd3a6adaf840561c8ff50059bfd606d5398171'
  TARGET_BRANCH: 'feat/ppr-http-framing-current-20260922'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact PPR branch
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$TARGET_BRANCH"
          git -C ores-stack checkout -b repair FETCH_HEAD
          actual="$(git -C ores-stack rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || { echo "branch moved: expected $TARGET_SHA got $actual"; exit 1; }

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt

      - name: Format only framing crate and verify
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ores-stack-ppr-http/src/lib.rs crates/ores-stack-ppr-http/src/lib_strict.rs
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo check --locked -p ores-stack-ppr-http --all-targets
          cargo test --locked -p ores-stack-ppr-http -- --nocapture
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf 'tracked changed files:\n%s\n' "$changed"
          test "$changed" = $'crates/ores-stack-ppr-http/src/lib.rs\ncrates/ores-stack-ppr-http/src/lib_strict.rs' || {
            echo 'refusing guarded repair because unexpected tracked files changed'
            git status --short
            exit 1
          }

      - name: Commit and push guarded repair
        shell: bash
        working-directory: ores-stack
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-ppr-http/src/lib.rs crates/ores-stack-ppr-http/src/lib_strict.rs
          git commit -m 'style(ppr): format strict framing crate'
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA" || { echo "source branch moved before push: $remote_head"; exit 1; }
          git push origin HEAD:"$TARGET_BRANCH"
