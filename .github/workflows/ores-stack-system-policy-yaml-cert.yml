name: ores-stack system-policy YAML migration

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ores-stack-system-policy-yaml-cert.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_BASE: d46c07e0f91c2dbda9b2fee64bdd82f6d52fc1ef
  SOURCE_BRANCH: feat/system-policy-yaml-20260922

jobs:
  certify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out guarded source branch
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          auth="url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf=https://github.com/"
          git -c "$auth" clone --no-tags --branch "$SOURCE_BRANCH" https://github.com/ORESoftware/ores-stack.git ores-stack
          test "$(git -C ores-stack rev-parse HEAD)" = "$SOURCE_BASE"
          test "$(git -C ores-stack -c "$auth" ls-remote origin refs/heads/main | awk '{print $1}')" = "$SOURCE_BASE"
          test "$(git -C ores-stack -c "$auth" ls-remote origin refs/heads/$SOURCE_BRANCH | awk '{print $1}')" = "$SOURCE_BASE"

      - name: Apply YAML authority migration
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(p): return Path(p).read_text()
          def save(p, s): Path(p).write_text(s)

          policy = '''schema_version: ores.stack.system.v1
          owner: ORESoftware
          default_branch: main
          repositories:
            web_server: "{prefix}-web-server.rs"
            api_server: "{prefix}-api-server.rs"
            lambdas: "{prefix}-lambdas"
            infra: "{prefix}-infra"
            monorepo: "{prefix}-monorepo"
          templates:
            web_server:
              repository: "https://github.com/ORESoftware/ores-web-server.template.rs.git"
              commit: "e63123e9d16d426198ea0b77c362c77688c8314f"
            api_server:
              repository: "https://github.com/ORESoftware/ores-api-server.template.rs.git"
              commit: "29ef90a2ddefc943b6632d61ca2a10ece330305a"
            lambdas:
              repository: "https://github.com/ORESoftware/ores-lambdas-template.git"
              commit: "f9194e4d61c102f41e970c813e31e27ae1b192aa"
          dev:
            compose_file: ".ores-compose.yaml"
            compose_program: ores-compose
            local_workspace_env: ORES_COMPOSE_LOCAL_WORKSPACE_ROOT'''

          cli = 'crates/ores-stack-cli/src/stack_cli_hardened.rs'
          s = load(cli)
          s = s.replace('.github/.ores-stack.toml', '.github/.ores-stack.yaml')
          s = s.replace('.ores-stack.toml', '.ores-stack.yaml')
          s = s.replace('toml::from_str(&text)', 'serde_yaml::from_str(&text)')
          s = s.replace('toml::from_str(POLICY)', 'serde_yaml::from_str(POLICY)')
          s = s.replace('toml::from_str::<SystemPolicy>(&missing)', 'serde_yaml::from_str::<SystemPolicy>(&missing)')
          s = s.replace('toml::from_str(&wrong)', 'serde_yaml::from_str(&wrong)')
          s = s.replace('"local_workspace_env = \\"ORES_COMPOSE_LOCAL_WORKSPACE_ROOT\\"\\n",', '"  local_workspace_env: ORES_COMPOSE_LOCAL_WORKSPACE_ROOT\\n",')
          s, n = re.subn(r'    const POLICY: &str = r#".*?"#;', '    const POLICY: &str = r#"\\n' + policy + '\\n"#;', s, count=1, flags=re.S)
          assert n == 1
          pat = re.compile(r'fn render_role_config\(prefix: &str, role: &str, names: &StackNames\) -> String \{.*?\n\}\n\nfn write_monorepo_files', re.S)
          replacement = '''fn render_role_config(prefix: &str, role: &str, names: &StackNames) -> String {
              format!(
                  "{GENERATED_CONFIG_HEADER}# stack_prefix = \\\"{prefix}\\\"\\n# stack_role = \\\"{role}\\\"\\n# canonical_system_policy = \\\"../.github/.ores-stack.yaml\\\"\\n# web_server_repo = \\\"{}\\\"\\n# api_server_repo = \\\"{}\\\"\\n# lambdas_repo = \\\"{}\\\"\\n# infra_repo = \\\"{}\\\"\\n# monorepo_repo = \\\"{}\\\"\\nschema_version: ores.stack.v2\\nproject:\\n  version: 1\\n",
                  names.web_server, names.api_server, names.lambdas, names.infra, names.monorepo
              )
          }

          fn write_monorepo_files'''
          s, n = pat.subn(replacement, s, count=1)
          assert n == 1
          s = s.replace('assert!(config.ends_with("version = 1\\n"));', 'assert!(config.ends_with("project:\\n  version: 1\\n"));\\n        assert!(config.contains("schema_version: ores.stack.v2"));')
          save(cli, s)

          test = 'crates/ores-stack-cli/tests/create_stack_cli.rs'
          s = load(test)
          s, n = re.subn(r'const POLICY: &str = r#".*?"#;', 'const POLICY: &str = r#"' + policy + '\\n"#;', s, count=1, flags=re.S)
          assert n == 1
          save(test, s.replace('policy.toml', 'policy.yaml'))

          for p in ['crates/ores-stack-cli/src/stack_post_create.rs', 'crates/ores-stack-cli/src/stack_post_verify.rs']:
              s = load(p).replace('.github/.ores-stack.toml', '.github/.ores-stack.yaml').replace('.ores-stack.toml', '.ores-stack.yaml').replace('toml::from_str(&text)', 'serde_yaml::from_str(&text)')
              save(p, s)
          p = 'crates/ores-stack-cli/src/stack_dev_hardened.rs'
          save(p, load(p).replace('.github/.ores-stack.toml', '.github/.ores-stack.yaml').replace('.ores-stack.toml', '.ores-stack.yaml'))

          wf = '.github/workflows/test-org-certification.yml'
          s = load(wf).replace('.ores-stack.toml', '.ores-stack.yaml').replace('/tmp/ores-stack-good.toml', '/tmp/ores-stack-good.yaml')
          s = s.replace('''          version = 1
                    out_dir = "../escape"''', '''          schema_version: ores.stack.v2
                    project:
                      version: 1
                      out_dir: ../escape''')
          s = s.replace('''          version = 1
                    [dev]
                    reload_bind = "0.0.0.0:35729"''', '''          schema_version: ores.stack.v2
                    project:
                      version: 1
                      dev:
                        reload_bind: "0.0.0.0:35729"''')
          s = s.replace('''          version = 1
                    out_dir = "generated"''', '''          schema_version: ores.stack.v2
                    project:
                      version: 1
                      out_dir: generated''')
          save(wf, s)

          for p in ['README.md','docs/create-stack.md','docs/local-stack-validation.md','docs/local-generated-stack-validation.md','scripts/local-generated-stack-smoke.sh']:
              s = load(p).replace('.github/.ores-stack.toml', '.github/.ores-stack.yaml').replace('.ores-stack.toml', '.ores-stack.yaml')
              if p == 'docs/create-stack.md': s = s.replace('typed TOML', 'typed YAML')
              save(p, s)

          p = 'docs/ores-stack-yaml-authority.md'
          s = load(p)
          s = s.replace('The organization policy is migrating separately from `.github/.ores-stack.toml` to `.github/.ores-stack.yaml`, while retaining the independently versioned `ores.stack.system.v1` schema. Generated repositories must reference the YAML policy and must themselves contain `.ores-stack.yaml`, never `.ores-stack.toml`.', 'The canonical organization policy is `.github/.ores-stack.yaml`, using the independently versioned `ores.stack.system.v1` schema. Generated repositories reference that YAML policy and themselves contain `.ores-stack.yaml`; TOML is legacy input and is not a second authority.')
          save(p, s)
          p = 'crates/ores-stack-core/src/web.rs'
          save(p, load(p).replace('existing `.ores-stack.toml` v1 schema', 'strict `.ores-stack.yaml` v2 project schema'))
          PY

          python3 - <<'PY'
          from pathlib import Path
          allowed = {'crates/ores-stack-core/src/config.rs','crates/ores-stack-cli/tests/infra_cross_check_yaml.rs','docs/ores-stack-yaml-authority.md'}
          bad=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or 'target' in p.parts: continue
              try: s=p.read_text()
              except UnicodeDecodeError: continue
              if '.ores-stack.toml' in s and p.as_posix() not in allowed: bad.append(p.as_posix())
          assert not bad, bad
          PY

      - name: Rust 1.88 compile and migration tests
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt
          cargo fmt --all
          bash scripts/bootstrap-cargo-lock.sh ensure
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked -p ores-stack-cli --all-targets
          cargo test --locked -p ores-stack-cli generated_role_config_stays_valid_for_existing_stack_config_loader
          cargo test --locked -p ores-stack-cli typed_policy_requires_the_reserved_local_workspace_field
          cargo test --locked -p ores-stack-cli --test create_stack_cli
          cargo test --locked -p ores-stack-cli --test infra_cross_check_yaml
          git diff --check
          test -z "$(git diff --name-only | grep '^Cargo.lock$' || true)"

      - name: Guard and publish source branch
        working-directory: ores-stack
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          auth="url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf=https://github.com/"
          test "$(git -c "$auth" ls-remote origin refs/heads/main | awk '{print $1}')" = "$SOURCE_BASE"
          test "$(git -c "$auth" ls-remote origin refs/heads/$SOURCE_BRANCH | awk '{print $1}')" = "$SOURCE_BASE"
          git config user.name ORESoftware
          git config user.email alex@oresoftware.com
          git add README.md docs scripts crates .github/workflows/test-org-certification.yml
          git commit -m 'feat(config): finish system-policy YAML migration'
          sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_BASE"
          git -c "$auth" push origin HEAD:refs/heads/$SOURCE_BRANCH
          test "$(git -c "$auth" ls-remote origin refs/heads/$SOURCE_BRANCH | awk '{print $1}')" = "$sha"
          echo "ORES_STACK_SYSTEM_POLICY_YAML_PASS $sha"
