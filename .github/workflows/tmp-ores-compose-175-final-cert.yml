name: tmp ores-compose 175 final exact-head cert

on:
  push:
    branches:
      - test/ores-compose-175-final-cert-20260922

permissions:
  contents: read

env:
  COMPOSE_HEAD: 73bf0cccff26301dce0266a4729aa02ac5c9899d
  COMPOSE_BASE: 2e0d1488ca32371e4f410f95cf6886674b86876c

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact source head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-compose
          git -C ores-compose remote add origin https://github.com/ORESoftware/ores-compose.git
          git -C ores-compose fetch --depth=20 origin main "$COMPOSE_HEAD"
          git -C ores-compose checkout --detach "$COMPOSE_HEAD"
          test "$(git -C ores-compose rev-parse HEAD)" = "$COMPOSE_HEAD"
          test "$(git -C ores-compose merge-base HEAD "$COMPOSE_BASE")" = "$COMPOSE_BASE"
          test "$(git -C ores-compose diff --name-only "$COMPOSE_BASE"..HEAD)" = "tests/formal_dependency_graph_exhaustive.rs"
          test -z "$(git -C ores-compose status --porcelain)"
          git -C ores-compose diff --check "$COMPOSE_BASE"..HEAD

      - name: Install repository Rust toolchain
        shell: bash
        working-directory: ores-compose
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup component add rustfmt

      - name: PR-file rustfmt gate against dirty baseline
        shell: bash
        working-directory: ores-compose
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --exit-code -- tests/formal_dependency_graph_exhaustive.rs
          git reset --hard "$COMPOSE_HEAD"
          test -z "$(git status --porcelain)"

      - name: Prove lock refresh is identical on base and head
        shell: bash
        working-directory: ores-compose
        run: |
          set -euo pipefail
          git checkout --detach "$COMPOSE_BASE"
          cargo generate-lockfile
          cp Cargo.lock /tmp/compose-base.generated.lock
          git reset --hard "$COMPOSE_BASE"

          git checkout --detach "$COMPOSE_HEAD"
          cargo generate-lockfile
          cp Cargo.lock /tmp/compose-head.generated.lock
          cmp /tmp/compose-base.generated.lock /tmp/compose-head.generated.lock
          test "$(git diff --name-only)" = "Cargo.lock"
          test "$(git rev-parse HEAD)" = "$COMPOSE_HEAD"
          echo ORES_COMPOSE_175_BASE_HEAD_LOCK_REFRESH_IDENTICAL

      - name: Compile all targets with baseline-equivalent generated lock
        shell: bash
        working-directory: ores-compose
        run: cargo check --locked --all-targets

      - name: Run all targets including exhaustive proof
        shell: bash
        working-directory: ores-compose
        run: cargo test --locked --all-targets -- --nocapture

      - name: Verify exhaustive proof ran and source remained exact
        shell: bash
        working-directory: ores-compose
        run: |
          set -euo pipefail
          cargo test --locked --test formal_dependency_graph_exhaustive -- --exact exhaustively_checks_every_directed_dependency_graph_through_four_services --nocapture
          test "$(git rev-parse HEAD)" = "$COMPOSE_HEAD"
          test "$(git diff --name-only)" = "Cargo.lock"
          git diff --check "$COMPOSE_BASE"..HEAD
          echo ORES_COMPOSE_175_FINAL_EXACT_HEAD_CERT_PASS
