name: certify ores-websocket 15 CI bootstrap

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/cert-ores-websocket-15-ci-bootstrap-20260923.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-websocket
  SOURCE_BRANCH: fix/ci-flags2env-native-bootstrap-20260923
  SOURCE_SHA: 48c66152a6a7ce0b35ff30a00eea9a3d66e49928
  SOURCE_MAIN_SHA: a30bb1462459785bba7fc1b71f1e30221f48f224

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch immutable CI repair
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C source fetch --depth=30 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_MAIN_SHA"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source merge-base HEAD "$SOURCE_MAIN_SHA")" = "$SOURCE_MAIN_SHA"
          mapfile -t changed < <(git -C source diff --name-only "$SOURCE_MAIN_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/ci.yml"
          git -C source diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"

      - name: Admit reviewed workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          wf=source/.github/workflows/ci.yml
          grep -F "node-version: '22.23.1'" "$wf"
          grep -F 'npm install --ignore-scripts --no-audit --no-fund' "$wf"
          grep -F 'npm rebuild @oresoftware/f2e --ignore-scripts=false --no-audit --no-fund' "$wf"
          grep -F 'test -s node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node' "$wf"
          test "$(grep -Fc -- '--ignore-scripts=false' "$wf")" -eq 1
          ! grep -Eq 'npm (install|ci).*--ignore-scripts=false' "$wf"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Execute exact dependency bootstrap and TypeScript/contracts gate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          test ! -e node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node
          npm rebuild @oresoftware/f2e --ignore-scripts=false --no-audit --no-fund
          test -s node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node
          npm run check

      - name: Final immutable source guard
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
          echo ORES_WEBSOCKET_15_CI_BOOTSTRAP_PASS
