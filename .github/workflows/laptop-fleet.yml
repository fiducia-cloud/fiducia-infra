name: laptop-fleet
on:
  pull_request:
    paths:
      - "base/messaging/**"
      - "laptop/**"
      - "migration/**"
      - "nix/**"
      - "docs/laptop-*.md"
      - "scripts/*laptop*.sh"
      - "tools/render-laptop-*.mjs"
      - "tools/plan-laptop-*.mjs"
      - "tools/verify-etcd-*.mjs"
      - "tools/validate-laptop-*.mjs"
      - "tools/laptop-*.test.mjs"
      - "tools/render.mjs"
      - "topology.toml"
      - "clusters/**"
      - "package.json"
      - ".github/workflows/laptop-fleet.yml"
  push:
    branches: [main]
    paths:
      - "base/messaging/**"
      - "laptop/**"
      - "migration/**"
      - "nix/**"
      - "docs/laptop-*.md"
      - "scripts/*laptop*.sh"
      - "tools/render-laptop-*.mjs"
      - "tools/plan-laptop-*.mjs"
      - "tools/verify-etcd-*.mjs"
      - "tools/validate-laptop-*.mjs"
      - "tools/laptop-*.test.mjs"
      - "tools/render.mjs"
      - "topology.toml"
      - "clusters/**"
      - "package.json"
      - ".github/workflows/laptop-fleet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/laptop-fleet.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Verify generated laptop profile and messaging configs
        run: |
          npm run check:laptop
          node tools/render-laptop-messaging.mjs --check
      - name: Test laptop topology, GitOps, networking, messaging, backup evidence, host, and migration contracts
        run: |
          node --test \
            tools/laptop-fleet.test.mjs \
            tools/laptop-gitops.test.mjs \
            tools/laptop-networking.test.mjs \
            tools/laptop-messaging-ha.test.mjs \
            tools/laptop-host-inventory.test.mjs \
            tools/laptop-cloud-migration.test.mjs
      - name: Validate laptop operation shell syntax
        run: |
          bash -n \
            scripts/bootstrap-laptop-gitops.sh \
            scripts/promote-laptop-cluster.sh \
            scripts/apply-laptop-runtime-secrets.sh \
            scripts/apply-laptop-nats-route-tls.sh \
            scripts/capture-laptop-etcd-snapshot-evidence.sh \
            scripts/restore-laptop-k3s-snapshot.sh \
            scripts/capture-laptop-host-evidence.sh \
            scripts/test-laptop-nats-configs.sh
      - name: Validate generated NATS configs with pinned server image
        run: bash scripts/test-laptop-nats-configs.sh
      - name: Rehearse strict fleet inventory validation
        run: |
          set -euo pipefail
          node tools/validate-laptop-inventory.mjs \
            --inventory laptop/inventory/fleet.example.json \
            --allow-example \
            --now 2026-08-03T18:00:00Z \
            >/tmp/fiducia-laptop-fleet-inventory.json
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("/tmp/fiducia-laptop-fleet-inventory.json", "utf8"));
            if (report.status !== "passed") process.exit(1);
            if (report.evidenceMode !== "example") process.exit(1);
            if (!report.nonClaims.some((claim) => claim.includes("not production evidence"))) process.exit(1);
            if (!report.failureDomains.distinctIsps) process.exit(1);
          '
      - name: Rehearse strict JetStream evidence validation
        run: |
          set -euo pipefail
          node tools/validate-laptop-jetstream-evidence.mjs \
            --evidence laptop/messaging/jetstream-evidence.example.json \
            --allow-example \
            --now 2026-08-03T18:05:00Z \
            >/tmp/fiducia-laptop-jetstream-evidence.json
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("/tmp/fiducia-laptop-jetstream-evidence.json", "utf8"));
            if (report.status !== "passed") process.exit(1);
            if (report.evidenceMode !== "example") process.exit(1);
            if (report.serverVersion !== "2.11.17") process.exit(1);
            if (report.serverCount !== 3 || report.quorum !== 2) process.exit(1);
            if (report.stream.replicas !== 3 || report.stream.maximumFollowerLag !== 0) process.exit(1);
            if (!report.nonClaims.some((claim) => claim.includes("never production proof"))) process.exit(1);
          '
      - name: Render every immutable root application
        run: |
          set -euo pipefail
          revision=0000000000000000000000000000000000000000
          for cluster in laptop-aws-sim laptop-gcp-sim laptop-azure-sim; do
            node tools/render-laptop-gitops.mjs \
              --cluster "$cluster" \
              --revision "$revision" >/dev/null
          done
      - name: Render deny-by-default tailnet policy and every cluster adapter
        run: |
          set -euo pipefail
          node tools/render-laptop-tailnet.mjs \
            --operator operator@example.com \
            --tailnet-domain example.ts.net \
            --policy-only >/tmp/fiducia-tailnet-policy.json
          for cluster in laptop-aws-sim laptop-gcp-sim laptop-azure-sim; do
            node tools/render-laptop-tailnet.mjs \
              --operator operator@example.com \
              --tailnet-domain example.ts.net \
              --cluster "$cluster" >/tmp/"$cluster"-tailnet.json
          done
      - name: Rehearse laptop-to-cloud member migration
        run: |
          set -euo pipefail
          node tools/plan-laptop-cloud-migration.mjs \
            --observations migration/rehearsal-observations.example.json \
            --allow-example > /tmp/laptop-cloud-migration.json
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("/tmp/laptop-cloud-migration.json", "utf8"));
            if (result.report.status !== "passed") process.exit(1);
            if (!result.report.everyStableCheckpointSurvivesOneMemberLoss) process.exit(1);
            if (result.report.rollbackExercises !== 1) process.exit(1);
          '
      - name: Build all laptop and canonical cloud overlays
        run: |
          set -euo pipefail
          for cluster in laptop/clusters/*/ clusters/*/; do
            echo "== $cluster =="
            kubectl kustomize "$cluster" >/dev/null
          done
