name: laptop-fleet
on:
  pull_request:
    paths:
      - "laptop/**"
      - "migration/**"
      - "docs/laptop-*.md"
      - "scripts/*laptop*.sh"
      - "tools/render-laptop-*.mjs"
      - "tools/plan-laptop-*.mjs"
      - "tools/laptop-*.test.mjs"
      - "tools/render.mjs"
      - "topology.toml"
      - "clusters/**"
      - "package.json"
      - ".github/workflows/laptop-fleet.yml"
  push:
    branches: [main]
    paths:
      - "laptop/**"
      - "migration/**"
      - "docs/laptop-*.md"
      - "scripts/*laptop*.sh"
      - "tools/render-laptop-*.mjs"
      - "tools/plan-laptop-*.mjs"
      - "tools/laptop-*.test.mjs"
      - "tools/render.mjs"
      - "topology.toml"
      - "clusters/**"
      - "package.json"
      - ".github/workflows/laptop-fleet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/laptop-fleet.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Verify generated laptop profile
        run: npm run check:laptop
      - name: Test laptop topology, GitOps, networking, and migration contracts
        run: |
          node --test \
            tools/laptop-fleet.test.mjs \
            tools/laptop-gitops.test.mjs \
            tools/laptop-networking.test.mjs \
            tools/laptop-cloud-migration.test.mjs
      - name: Validate laptop operation shell syntax
        run: |
          bash -n \
            scripts/bootstrap-laptop-gitops.sh \
            scripts/promote-laptop-cluster.sh \
            scripts/apply-laptop-runtime-secrets.sh \
            scripts/restore-laptop-k3s-snapshot.sh
      - name: Render every immutable root application
        run: |
          set -euo pipefail
          revision=0000000000000000000000000000000000000000
          for cluster in laptop-aws-sim laptop-gcp-sim laptop-azure-sim; do
            node tools/render-laptop-gitops.mjs \
              --cluster "$cluster" \
              --revision "$revision" >/dev/null
          done
      - name: Render deny-by-default tailnet policy and every cluster adapter
        run: |
          set -euo pipefail
          node tools/render-laptop-tailnet.mjs \
            --operator operator@example.com \
            --tailnet-domain example.ts.net \
            --policy-only >/tmp/fiducia-tailnet-policy.json
          for cluster in laptop-aws-sim laptop-gcp-sim laptop-azure-sim; do
            node tools/render-laptop-tailnet.mjs \
              --operator operator@example.com \
              --tailnet-domain example.ts.net \
              --cluster "$cluster" >/tmp/"$cluster"-tailnet.json
          done
      - name: Rehearse laptop-to-cloud member migration
        run: |
          set -euo pipefail
          node tools/plan-laptop-cloud-migration.mjs \
            --observations migration/rehearsal-observations.example.json \
            --allow-example > /tmp/laptop-cloud-migration.json
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("/tmp/laptop-cloud-migration.json", "utf8"));
            if (result.report.status !== "passed") process.exit(1);
            if (!result.report.everyStableCheckpointSurvivesOneMemberLoss) process.exit(1);
            if (result.report.rollbackExercises !== 1) process.exit(1);
          '
      - name: Build all laptop and canonical cloud overlays
        run: |
          set -euo pipefail
          for cluster in laptop/clusters/*/ clusters/*/; do
            echo "== $cluster =="
            kubectl kustomize "$cluster" >/dev/null
          done
