name: Coordination checkpoint offline verification
on:
  pull_request:
    paths:
      - 'tools/verify-coordination-checkpoint.mjs'
      - 'tools/verify-coordination-checkpoint.test.mjs'
      - '.github/workflows/coordination-checkpoint-verifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-signed-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify read-only signed checkpoint tamper matrix
        run: node --test tools/verify-coordination-checkpoint.test.mjs
