name: proof-beamscale-supervisor-79

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: f6a572cd0d4509ecb2268bc815fc8c20c4926877

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact BeamScale supervisor hardening head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-supervisor
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27.3'
          rebar3-version: '3.24.0'
          gleam-version: '1.18.0'
      - name: Compile
        run: rebar3 compile
      - name: EUnit
        run: rebar3 eunit
      - name: Xref
        run: rebar3 xref
      - name: Prove source unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
