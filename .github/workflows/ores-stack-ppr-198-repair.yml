name: ores-stack-ppr-198-repair

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ores-stack-ppr-198-repair.yml'
      - '.github/scripts/repair-ores-stack-ppr-198.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET_SHA: 'cfd776d02920938f579d5869d6a8c7434fff0495'
  TARGET_BRANCH: 'feat/ppr-supervisor-framing-integration-20260922'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack PPR head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$TARGET_BRANCH"
          git -C ores-stack checkout -b repair FETCH_HEAD
          actual="$(git -C ores-stack rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || { echo "source branch moved: expected $TARGET_SHA got $actual"; exit 1; }

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Apply guarded source repair
        shell: bash
        run: |
          set -euo pipefail
          cd ores-stack
          python3 ../.github/scripts/repair-ores-stack-ppr-198.py
          cargo fmt --all
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf 'tracked changed files:\n%s\n' "$changed"
          test "$changed" = 'crates/ores-stack-cli/src/ppr_supervisor_process.rs'

      - name: Bootstrap repository lock evidence
        shell: bash
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure

      - name: Compile and test exact repaired tree
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check --locked -p ores-stack-ppr-http --all-targets
          cargo test --locked -p ores-stack-ppr-http -- --nocapture
          cargo check --locked -p ores-stack-cli --all-targets
          cargo test --locked -p ores-stack-cli ppr -- --nocapture
          cargo clippy --locked -p ores-stack-ppr-http -p ores-stack-cli --all-targets -- -D warnings
          cargo fmt --all -- --check
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = 'crates/ores-stack-cli/src/ppr_supervisor_process.rs'

      - name: Commit and push guarded repair
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-cli/src/ppr_supervisor_process.rs
          git commit -m 'fix(ppr): reuse framing and middleware authorities'
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA" || { echo "source branch moved before push: expected $TARGET_SHA got $remote_head"; exit 1; }
          git push origin HEAD:"$TARGET_BRANCH"
