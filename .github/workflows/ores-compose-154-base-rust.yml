name: ores-compose #154 base Rust control

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-compose-154-base-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_BASE: fb6d0b2aeb7d87c598e006bed050162b55e0c9f0

jobs:
  base-rust-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact ores-compose base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_BASE }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPOSE_BASE"
          git diff --check "${COMPOSE_BASE}^" "$COMPOSE_BASE"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify pinned toolchain
        run: rustc --version | grep -F 'rustc 1.98.1'

      - name: Locked metadata
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Compile all targets and features
        run: cargo check --locked --all-targets --all-features

      - name: Full test suite
        run: cargo test --locked --all-targets --all-features

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Reconfirm immutable exact base
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMPOSE_BASE"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo ORES_COMPOSE_154_BASE_CONTROL_COMPLETE
