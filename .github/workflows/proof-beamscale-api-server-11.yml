name: proof-beamscale-api-server-11

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: c2854214c9c6d8687da2f49519a48c8985bbbf49

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact BeamScale API server head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamscale/bmscl-api-server.rs
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Prove source unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
