name: infra-layout-validate
on:
  pull_request:
    paths: [".ores-infra.toml", "modules/**", "environments/**", ".github/workflows/infra-layout-validate.yml"]
  push:
    branches: [main]
    paths: [".ores-infra.toml", "modules/**", "environments/**"]
permissions: { contents: read }
concurrency: { group: "infra-layout-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  terraform:
    runs-on: ubuntu-24.04
    strategy: { fail-fast: false, matrix: { environment: [preview, staging, production] } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.16.2, terraform_wrapper: false }
      - run: terraform fmt -check -recursive modules/cloudflare/terraform modules/terraform
      - run: terraform fmt -check -recursive "environments/${{ matrix.environment }}"
      - working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false
      - working-directory: environments/${{ matrix.environment }}
        run: terraform validate -no-color
  cloudflare-worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: { node-version: "22.22.1" }
      - working-directory: modules/cloudflare/durable-coordinator
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - working-directory: modules/cloudflare/durable-coordinator
        run: npm run check
