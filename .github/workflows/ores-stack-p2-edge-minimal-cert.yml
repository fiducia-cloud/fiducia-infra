name: ores-stack-p2-edge-minimal-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-p2-edge-minimal-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_STACK_SHA: 'a0fa9d96ec30d79b129d28c267d6103d6f365ff9'
  ORES_STACK_BRANCH: 'feat/p2-edge-minimal-protocol-current-main-20260922'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack PR head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"
          test "$(git -C ores-stack status --porcelain)" = ""

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Guarded rustfmt repair
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo fmt --package ores-stack-p2-edge-minimal
          rustfmt --edition 2024 --check crates/ores-stack-p2-edge-minimal/src/lib.rs
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "crates/ores-stack-p2-edge-minimal/src/lib.rs"

      - name: Refresh only required workspace lock evidence
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check -p ores-stack-p2-edge-minimal --all-targets
          git diff --check
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' Cargo.lock crates/ores-stack-p2-edge-minimal/src/lib.rs | sort > /tmp/allowed
          test ! -s <(comm -23 /tmp/changed /tmp/allowed)
          grep -qx 'Cargo.lock' /tmp/changed
          grep -qx 'crates/ores-stack-p2-edge-minimal/src/lib.rs' /tmp/changed

      - name: Check portable P2 crate and workspace with lock frozen
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked -p ores-stack-p2-edge-minimal --all-targets
          cargo check --locked --workspace --all-targets

      - name: Clippy portable P2 crate
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo clippy --locked -p ores-stack-p2-edge-minimal --all-targets -- -D warnings

      - name: Test portable P2 protocol
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo test --locked -p ores-stack-p2-edge-minimal -- --nocapture
          git diff --check
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' Cargo.lock crates/ores-stack-p2-edge-minimal/src/lib.rs | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed

      - name: Fast-forward certified repair to ores-stack PR branch
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORES_STACK_SHA"
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' Cargo.lock crates/ores-stack-p2-edge-minimal/src/lib.rs | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          git config user.name "ores-stack certification"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock crates/ores-stack-p2-edge-minimal/src/lib.rs
          git commit -m "style(p2): certify edge_minimal runtime"
          git push origin "HEAD:refs/heads/${ORES_STACK_BRANCH}"
