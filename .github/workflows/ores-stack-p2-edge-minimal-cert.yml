name: ores-stack-p2-edge-minimal-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-p2-edge-minimal-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_STACK_SHA: '4af528f8bcca463669367e36935e2151f2870d48'
  ORES_STACK_BRANCH: 'fix/workspace-lock-certified-current-main-20260922'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack current main
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"
          test "$(git -C ores-stack status --porcelain)" = ""

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Prove P2 source already formatted
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo fmt --package ores-stack-p2-edge-minimal -- --check
          rustfmt --edition 2024 --check crates/ores-stack-p2-edge-minimal/src/lib.rs
          test "$(git status --porcelain)" = ""

      - name: Generate current-main workspace lock
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check -p ores-stack-p2-edge-minimal --all-targets
          test -f Cargo.lock
          git diff --check
          git status --porcelain=v1 | cut -c4- | sort -u > /tmp/changed
          printf '%s\n' Cargo.lock > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed

      - name: Check current workspace with lock frozen
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked -p ores-stack-p2-edge-minimal --all-targets
          cargo check --locked --workspace --all-targets

      - name: Clippy portable P2 crate
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo clippy --locked -p ores-stack-p2-edge-minimal --all-targets -- -D warnings

      - name: Test portable P2 protocol
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo test --locked -p ores-stack-p2-edge-minimal -- --nocapture
          git diff --check
          git status --porcelain=v1 | cut -c4- | sort -u > /tmp/changed
          printf '%s\n' Cargo.lock > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed

      - name: Fast-forward certified lock to clean ores-stack branch
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORES_STACK_SHA"
          remote_head="$(git ls-remote origin "refs/heads/${ORES_STACK_BRANCH}" | cut -f1)"
          test "$remote_head" = "$ORES_STACK_SHA" || { echo "target branch moved: $remote_head"; exit 1; }
          git status --porcelain=v1 | cut -c4- | sort -u > /tmp/changed
          printf '%s\n' Cargo.lock > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed
          git config user.name "ores-stack certification"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: freeze certified workspace lock"
          git push origin "HEAD:refs/heads/${ORES_STACK_BRANCH}"
