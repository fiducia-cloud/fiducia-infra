name: proof-ores-lambdas-template-50

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: e094a32ecc4f1c33f732c970fd594c1345fc039f
  ORESC_REV: 6388131c1c93d3f8b096cd22aca1556d6d30b5c7
  ORESC_BASE_SHA: 5409f3f169990bb7c7e6ac149a050201a7136f48
  RUST_TOOLCHAIN: 1.95.0

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact consumer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-lambdas-template
          ref: e094a32ecc4f1c33f732c970fd594c1345fc039f
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact consumer head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Require funded cross-repository read credential
        shell: bash
        env:
          CROSS_REPO_READ_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
        run: test -n "$CROSS_REPO_READ_TOKEN"
      - name: Check out exact ores-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-cli
          ref: 6388131c1c93d3f8b096cd22aca1556d6d30b5c7
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: .ci/ores-cli
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Certify exact ores-cli candidate
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/.ci/ores-cli"
          test "$(git -C "$tool" rev-parse HEAD)" = "$ORESC_REV"
          test -z "$(git -C "$tool" status --porcelain)"
          (
            cd "$tool"
            git cat-file -e "$ORESC_BASE_SHA^{commit}"
            mapfile -t changed < <(git diff --name-only "$ORESC_BASE_SHA" "$ORESC_REV")
            printf 'changed: %s\n' "${changed[@]}"
            test "${#changed[@]}" -eq 2
            printf '%s\n' "${changed[@]}" | grep -Fxq 'src/audit/runtime_toml_registry.rs'
            printf '%s\n' "${changed[@]}" | grep -Fxq 'src/audit/runtime_toml_registry_tests.rs'
            git diff --check "$ORESC_BASE_SHA" "$ORESC_REV" -- "${changed[@]}"
          )
          export CARGO_TARGET_DIR="$RUNNER_TEMP/oresc-target"
          cargo +"$RUST_TOOLCHAIN" build --locked --manifest-path "$tool/Cargo.toml" --bin oresc
          install -d "$RUNNER_TEMP/oresc-bin"
          install -m 0755 "$CARGO_TARGET_DIR/debug/oresc" "$RUNNER_TEMP/oresc-bin/oresc"
          install -m 0644 "$tool/.cli-flags.toml" "$RUNNER_TEMP/oresc-bin/.cli-flags.toml"
          echo "$RUNNER_TEMP/oresc-bin" >> "$GITHUB_PATH"
          echo "FLAGS2ENV_CONFIG=$RUNNER_TEMP/oresc-bin/.cli-flags.toml" >> "$GITHUB_ENV"
          echo "FLAGS2ENV_DOTENV=0" >> "$GITHUB_ENV"
          rm -rf "$GITHUB_WORKSPACE/.ci"
      - name: Audit repository and root TOML contracts
        run: oresc --no-json audit repo
      - name: Audit environment declaration/reference coverage
        run: oresc --no-json audit env
      - name: Prove tracked source remains unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
