name: ores-middleware-273-restack

on:
  push:
    branches: [ci/ores-http-clients-certification]
    paths:
      - '.github/workflows/ores-middleware-273-restack.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_BRANCH: feat/edge-minimal-constrained-request-20260922
  SOURCE_SHA: 211a5d1ed7c3f454c1d56f08adf138f72ad3935c
  MAIN_SHA: d66da34cd9b8131b8fe5d2039267f97abdece9d3
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  restack:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact source and current main
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/ores-middleware.git
          git -C source fetch origin "$SOURCE_BRANCH" main
          test "$(git -C source rev-parse "origin/$SOURCE_BRANCH")" = "$SOURCE_SHA"
          test "$(git -C source rev-parse origin/main)" = "$MAIN_SHA"
          git -C source checkout -b restack "origin/$SOURCE_BRANCH"

      - name: Merge current main without discarding either authority
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware CI restack'
          git config user.email 'noreply@oresoftware.com'
          if ! git merge --no-ff --no-edit origin/main; then
            echo 'Semantic merge conflict; refusing automatic resolution.'
            git status --short
            git diff --cc
            exit 1
          fi

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt,clippy

      - name: Verify constrained request plus ingress authority
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src/rust/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib -- -D warnings
          cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib provider_api
          cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib edge_minimal_local
          cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --test host_abi_contract
          git diff --check
          git status --porcelain

      - name: Push only if both remote authorities are unchanged
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          git push origin HEAD:"$SOURCE_BRANCH"
