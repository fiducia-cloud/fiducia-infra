name: ORE archived-data exact-head certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-governance-batch-cert-20260925b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Check out exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-archived-and-delete-data
          ref: 8deb6266a43644fdf683590f4f5314c609d1ddca
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = '8deb6266a43644fdf683590f4f5314c609d1ddca'
          git diff --check
      - name: Contract and governance admission
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run layout:check
          env -u GITHUB_REPOSITORY node scripts/check-polyglot-governance.mjs
          npm run safety:audit
          npm run contracts:check
      - name: Prove checkout unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
