name: proof my-ai shared policy hardening

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-my-ai-shared-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MY_AI_SHA: 4d2921da1bc9c46d4d6797d5440e732a8e632105

jobs:
  shared-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact my-ai head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/my-ai
          ref: ${{ env.MY_AI_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$MY_AI_SHA"
      - name: Run canonical shared-policy and secret gates
        run: |
          set -euo pipefail
          bash scripts/test-shared-policy.sh
          bash scripts/test-scan-secrets.sh
          bash scripts/check-agent-policy.sh
          bash scripts/scan-secrets.sh
      - name: Final exact-head guard
        if: always()
        run: test "$(git rev-parse HEAD)" = "$MY_AI_SHA"
