name: proof-shared-auth-provider-jwt

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-shared-auth-provider-jwt.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SHARED_AUTH_SOURCE_SHA: c720f19ea974ed57a5d562813edb23f81c6eb37d

jobs:
  provider-jwt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Shared Auth PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: shared-auth/shared-auth-lib
          ref: ${{ env.SHARED_AUTH_SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: shared-auth
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact immutable source
        working-directory: shared-auth
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHARED_AUTH_SOURCE_SHA"
          git diff --check

      - name: Install Node 22
        uses: actions/setup-node@1e60f620b9541d14bece96c5465dc8ee9832be0b
        with:
          node-version: '22'

      - name: Verify package export and syntax
        working-directory: shared-auth/langs/js
        shell: bash
        run: |
          set -euo pipefail
          node --check provider-jwt.mjs
          node --check provider-jwt.test.mjs
          node -e 'const p=require("./package.json"); if (p.exports?.["./provider-jwt"] !== "./provider-jwt.mjs") process.exit(1)'

      - name: Run adversarial provider JWT tests
        working-directory: shared-auth/langs/js
        run: node --test provider-jwt.test.mjs
