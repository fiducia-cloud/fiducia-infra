name: ores-stack-main-ppr-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-218-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_STACK_SHA: '029d499318707e5ac7b84c0784a8513b49c795a0'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack main commit
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Format-check exact PPR safety crates
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            crates/ores-stack-ppr-http/src/lib.rs \
            crates/ores-stack-ppr-http/src/lib_strict.rs \
            crates/ores-stack-process-tree/src/lib.rs
          git diff --exit-code

      - name: Bootstrap repository lock evidence
        shell: bash
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure

      - name: Check PPR crates and workspace
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check --locked -p ores-stack-ppr-http --all-targets
          cargo check --locked -p ores-stack-process-tree --all-targets
          cargo check --locked --workspace --all-targets

      - name: Clippy exact PPR crates
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings
          cargo clippy --locked -p ores-stack-process-tree --all-targets -- -D warnings

      - name: Test strict framing and process-tree ownership
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo test --locked -p ores-stack-ppr-http -- --nocapture
          cargo test --locked -p ores-stack-process-tree -- --nocapture
          git diff --exit-code
