name: patch ores-stack CLI once

on:
  push:
    branches:
      - ci/ores-stack-web-surface-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out ores-stack feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-stack
          ref: feat/web-surface-routing-20260921
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply asserted compile fixes
        shell: bash
        env:
          BUILD_RS_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}")
              p.write_text(text.replace(old, new, count))

          Path("crates/ores-stack-cli/build.rs").write_bytes(base64.b64decode(os.environ["BUILD_RS_B64"]))
          replace_exact("crates/ores-stack-cli/src/main.rs", "#[allow(non_snake_case, dead_code)]\nmod generated_flag_contract {\n    include!(concat!(env!(\"OUT_DIR\"), \"/cli_config.rs\"));\n}\n\n", "")
          replace_exact("crates/ores-stack-cli/src/stack_dev_hardened.rs", "use ores_compose::{ComposeSdk, ComposeUpOptions};", "use ores_compose::sdk::{ComposeSdk, ComposeUpOptions};")
          replace_exact("crates/ores-stack-cli/src/dev.rs", "use crate::{\n    final_build_env, prepare_client_output, read_page_manifest, resolve, route_client_steps,", "use super::{\n    final_build_env, prepare_client_output, read_page_manifest, resolve, route_client_steps,")
          replace_exact("crates/ores-stack-cli/src/legacy/dev.rs", "use crate::{\n    final_build_env, prepare_client_output, read_page_manifest, resolve, route_client_steps,", "use super::{\n    final_build_env, prepare_client_output, read_page_manifest, resolve, route_client_steps,")
          replace_exact("crates/ores-stack-cli/Cargo.toml", "[build-dependencies]\nflags2env-build = { package = \"flags2env-build\", git = \"https://github.com/flags-2-env/flags-2-env.git\", rev = \"3414281ed8d7339d5bfabf951048bff31aa3349e\" }\n\n", "")
          PY
          git diff --check

      - name: Commit and push exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ores-stack-cli/build.rs crates/ores-stack-cli/Cargo.toml crates/ores-stack-cli/src/main.rs crates/ores-stack-cli/src/dev.rs crates/ores-stack-cli/src/legacy/dev.rs crates/ores-stack-cli/src/stack_dev_hardened.rs
          git diff --cached --quiet && { echo 'No patch required.'; exit 0; }
          git commit -m 'fix(cli): restore canonical compile path'
          git push origin HEAD:feat/web-surface-routing-20260921
