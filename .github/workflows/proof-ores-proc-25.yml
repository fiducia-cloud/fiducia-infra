name: proof-ores-proc-25

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-proc-25.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 08918cff8a2be2779274f7c1dd4dee7aa565a23a

jobs:
  full-rust-and-linux-attestation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact production head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - name: Verify exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          grep -F 'unsafe_code = "forbid"' Cargo.toml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Full test suite including live attestation negative
        run: cargo test --locked --all-targets -- --nocapture
      - name: Run attestation and runtime-binding tests explicitly
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test linux_attestation_live -- --nocapture
          cargo test --locked --test linux_runtime_admission_contract -- --nocapture
          cargo test --locked --test hostile_tenant_lifecycle_binding -- --nocapture
          cargo test --locked --test hostile_tenant_security_boundary -- --nocapture
      - name: Prove checkout unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
