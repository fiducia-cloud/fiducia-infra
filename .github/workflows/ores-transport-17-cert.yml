name: ores-transport #17 exact-head certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-transport-17-cert.yml'
  push:
    branches:
      - test/ores-transport-17-cert-20260928
    paths:
      - '.github/workflows/ores-transport-17-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_HEAD: '8821736e6bc84c09d0549e39979913500665d927'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact ores-transport source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-transport
          ref: ${{ env.SOURCE_HEAD }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify immutable source identity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup component add --toolchain 1.98.1 rustfmt clippy

      - name: Formatting
        working-directory: source
        run: cargo +1.98.1 fmt --all -- --check

      - name: Strict Clippy
        id: clippy
        working-directory: source
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo +1.98.1 clippy --all-targets --all-features -- -D warnings 2>&1 | tee ../ores-transport-17-clippy.log

      - name: Upload Clippy diagnostics
        if: steps.clippy.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ores-transport-17-clippy
          path: ores-transport-17-clippy.log
          if-no-files-found: error
          retention-days: 7

      - name: Require Clippy clean
        if: steps.clippy.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: All-feature tests
        if: steps.clippy.outcome == 'success'
        working-directory: source
        run: cargo +1.98.1 test --all-targets --all-features

      - name: Feature isolation compile
        if: steps.clippy.outcome == 'success'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.1 check --no-default-features
          cargo +1.98.1 check --no-default-features --features http
          cargo +1.98.1 check --no-default-features --features tcp
          cargo +1.98.1 check --no-default-features --features nats

      - name: Prove source remained immutable
        if: steps.clippy.outcome == 'success'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
