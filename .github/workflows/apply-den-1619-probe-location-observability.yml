name: Apply DEN-1619 probe location observability

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-den-1619-probe-location-observability.yml
      - observability/managed-beta-stack/external-probe-scrape.example.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-den-1619-probe-location-observability
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'fiducia-cloud/fiducia-infra' && github.head_ref == 'agent/den-1619-probe-location-observability'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1619-probe-location-observability
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.1"

      - name: Update dashboard, contracts, and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          dashboard_path = Path('observability/managed-beta-stack/managed-beta-overview.json')
          dashboard = json.loads(dashboard_path.read_text())
          variables = dashboard['templating']['list']
          if any(variable['name'] == 'probe_location' for variable in variables):
              raise SystemExit('probe_location dashboard variable already exists')
          variables.insert(0, {
              'allValue': '.*',
              'current': {'selected': False, 'text': 'All', 'value': '$__all'},
              'datasource': {'type': 'prometheus', 'uid': 'prometheus'},
              'definition': 'label_values(fiducia_external_probe_total, probe_location)',
              'hide': 0,
              'includeAll': True,
              'label': 'Probe location',
              'multi': True,
              'name': 'probe_location',
              'options': [],
              'query': {
                  'query': 'label_values(fiducia_external_probe_total, probe_location)',
                  'refId': 'PrometheusVariableQueryEditor-ProbeLocation'
              },
              'refresh': 2,
              'regex': '',
              'skipUrlSync': False,
              'sort': 1,
              'type': 'query'
          })

          replacements = {
              'fiducia:sli:external_probe_freshness_seconds{cell=~"$cell",operation_class=~"$operation_class"}':
                  'fiducia:sli:external_probe_freshness_seconds{probe_location=~"$probe_location",cell=~"$cell",operation_class=~"$operation_class"}',
              'fiducia:sli:external_probe_last_success_age_seconds{cell=~"$cell",operation_class=~"$operation_class"}':
                  'fiducia:sli:external_probe_last_success_age_seconds{probe_location=~"$probe_location",cell=~"$cell",operation_class=~"$operation_class"}',
              'sum by (cell, result) (rate(fiducia_external_probe_total{cell=~"$cell",operation_class=~"$operation_class"}[$__rate_interval]))':
                  'sum by (probe_location, cell, result) (rate(fiducia_external_probe_total{probe_location=~"$probe_location",cell=~"$cell",operation_class=~"$operation_class"}[$__rate_interval]))',
              'fiducia_external_probe_total{cell=~"$cell",operation_class=~"$operation_class"}':
                  'fiducia_external_probe_total{probe_location=~"$probe_location",cell=~"$cell",operation_class=~"$operation_class"}'
          }
          replaced = {key: 0 for key in replacements}
          for panel in dashboard['panels']:
              for target in panel.get('targets', []):
                  expression = target.get('expr')
                  if expression in replacements:
                      target['expr'] = replacements[expression]
                      replaced[expression] += 1
                  if 'external_probe' in target.get('expr', ''):
                      legend = target.get('legendFormat', '')
                      if '{{probe_location}}' not in legend and '{{cell}}' in legend:
                          target['legendFormat'] = '{{probe_location}} / ' + legend
          missing = [key for key, count in replaced.items() if count == 0]
          if missing:
              raise SystemExit(f'dashboard expressions not found: {missing}')

          dashboard['panels'].append({
              'datasource': {'type': 'prometheus', 'uid': 'prometheus'},
              'fieldConfig': {
                  'defaults': {
                      'decimals': 0,
                      'min': 0,
                      'noValue': 'NO DATA',
                      'thresholds': {
                          'mode': 'absolute',
                          'steps': [
                              {'color': 'red', 'value': None},
                              {'color': 'green', 'value': 2}
                          ]
                      },
                      'unit': 'short'
                  },
                  'overrides': []
              },
              'gridPos': {'h': 6, 'w': 6, 'x': 0, 'y': 22},
              'id': max(panel['id'] for panel in dashboard['panels']) + 1,
              'options': {
                  'colorMode': 'value',
                  'graphMode': 'area',
                  'justifyMode': 'auto',
                  'orientation': 'auto',
                  'reduceOptions': {'calcs': ['lastNotNull'], 'fields': '', 'values': False},
                  'textMode': 'auto',
                  'wideLayout': True
              },
              'targets': [{
                  'expr': 'fiducia:sli:external_probe_location_count{cell=~"$cell"}',
                  'legendFormat': '{{cell}}',
                  'refId': 'A'
              }],
              'title': 'Trusted probe locations per cell',
              'type': 'stat'
          })
          dashboard['version'] = int(dashboard.get('version', 1)) + 1
          dashboard_path.write_text(json.dumps(dashboard, indent=2) + '\n')

          test_path = Path('tools/managed-beta-slo.test.mjs')
          tests = test_path.read_text()
          tests = tests.replace(
              '"fiducia:sli:public_availability_error_budget_remaining_ratio:28d",\n      "fiducia:sli:external_probe_freshness_seconds",',
              '"fiducia:sli:public_availability_error_budget_remaining_ratio:28d",\n      "fiducia:sli:external_probe_location_count",\n      "fiducia:sli:external_probe_freshness_seconds",'
          )
          tests = tests.replace(
              '"FiduciaPublicAvailabilitySlowBurn",\n      "FiduciaExternalProbeSourceStale",',
              '"FiduciaPublicAvailabilitySlowBurn",\n      "FiduciaExternalProbeIndependenceLost",\n      "FiduciaExternalProbeSourceStale",'
          )
          tests = tests.replace(
              'assert.match(rules, /count by \\(cell, operation_class, result\\)/u);',
              'assert.match(rules, /count by \\(probe_location, cell, operation_class, result\\)/u);\n    assert.match(rules, /external_probe_location_count < 2/u);'
          )
          tests = tests.replace(
              '"public_availability_samples:28d",\n      "external_probe_freshness_seconds",',
              '"public_availability_samples:28d",\n      "external_probe_location_count",\n      "external_probe_freshness_seconds",'
          )
          tests = tests.replace(
              'assert.deepEqual(variables, new Set(["cell", "operation_class"]));',
              'assert.deepEqual(variables, new Set(["probe_location", "cell", "operation_class"]));'
          )
          insertion = '''\n\n  it("injects probe location only at the trusted scrape boundary", async () => {\n    const scrape = await text("external-probe-scrape.example.yml");\n    assert.match(scrape, /honor_labels: false/u);\n    assert.match(scrape, /probe_location: probe-a/u);\n    assert.match(scrape, /probe_location: probe-b/u);\n    assert.ok(!scrape.includes("honor_labels: true"));\n    assert.ok(!scrape.includes("tenant_id"));\n  });'''
          tests = tests.replace('\n});\n', insertion + '\n});\n')
          test_path.write_text(tests)

          readme_path = Path('observability/managed-beta-stack/README.md')
          readme = readme_path.read_text()
          readme = readme.replace(
              'fast/slow burn, no-data, stale-source, no-recent-success, counter-reset, and\n  duplicate-series alerts;',
              'fast/slow burn, no-data, fewer-than-two-location, stale-source, no-recent-success,\n  counter-reset, and duplicate-series alerts;'
          )
          readme = readme.replace(
              'sample count, freshness, last-success age, result rate, burn rate, and current\n  series inventory.',
              'sample count, trusted location count, per-location freshness, last-success age,\n  result rate, burn rate, and current series inventory.'
          )
          readme = readme.replace(
              'The package groups only by reviewed `cell`, `operation_class`, and `result`\nlabels.',
              'The package groups only by reviewed `probe_location`, `cell`, `operation_class`,\nand `result` labels. `probe_location` is injected by trusted Prometheus scrape\nconfiguration with `honor_labels: false`; the probe does not self-assert it.'
          )
          readme += '''\n\n## Trusted probe-location identity\n\nUse `external-probe-scrape.example.yml` as the reviewed shape for central scrape\ntargets. Every independent target receives one bounded `probe_location` label at\nthe monitoring boundary. A cell with fewer than two currently observed locations\nraises `FiduciaExternalProbeIndependenceLost` and is ineligible for availability\nevidence even when the aggregate ratio appears healthy.\n'''
          readme_path.write_text(readme)
          PY
          node --test tools/managed-beta-slo.test.mjs
          git diff --check
          git config user.name 'ORESoftware Automation'
          git config user.email 'noreply@github.com'
          git add \
            observability/managed-beta-stack/managed-beta-overview.json \
            observability/managed-beta-stack/README.md \
            tools/managed-beta-slo.test.mjs
          git commit -m 'infra(DEN-1619): surface trusted probe locations end to end'

      - name: Remove the one-shot applicator and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-den-1619-probe-location-observability.yml
          git commit -m 'chore: remove one-shot probe location observability applicator'
          git push origin HEAD:refs/heads/agent/den-1619-probe-location-observability
