name: proof-ores-supabase-6

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-supabase
          ref: c78adb1e5b4b00206d3ebc24bbd0a305b859ba79
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "c78adb1e5b4b00206d3ebc24bbd0a305b859ba79"
      - name: Set up Node 22.16
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install pinned validation dependencies
        run: npm ci --ignore-scripts
      - name: Validate JSON Schema, catalog, targets, paths, and secret boundaries
        run: npm run validate
      - name: Prove validation is read-only
        run: test -z "$(git status --porcelain)"
