name: ores-stack-ppr-196-repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-ppr-196-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET_SHA: '91aeb44c6301e87f0e6844e8ee34b2a791f188f4'
  TARGET_BRANCH: 'feat/ppr-http-framing-current-20260921'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact PPR branch
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$TARGET_BRANCH"
          git -C ores-stack checkout -b repair FETCH_HEAD
          actual="$(git -C ores-stack rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA" || { echo "branch moved: expected $TARGET_SHA got $actual"; exit 1; }

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Run rustfmt and capture exact delta
        shell: bash
        working-directory: ores-stack
        run: |
          set -u
          OUT="$RUNNER_TEMP/ppr-196-rustfmt"
          mkdir -p "$OUT"
          set +e
          cargo fmt --all >"$OUT/rustfmt.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/rustfmt-exit.txt"
          git diff --name-only | sort > "$OUT/changed-files.txt"
          git diff --binary > "$OUT/rustfmt.patch"
          git status --short > "$OUT/git-status.txt"
          exit 0

      - name: Upload rustfmt diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ores-stack-ppr-196-rustfmt
          path: ${{ runner.temp }}/ppr-196-rustfmt
          if-no-files-found: error
          retention-days: 7

      - name: Guard formatted paths
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ppr-196-rustfmt"
          test "$(cat "$OUT/rustfmt-exit.txt")" = '0' || {
            cat "$OUT/rustfmt.log" >&2
            exit 1
          }
          cargo fmt --all -- --check
          git diff --check
          mapfile -t changed < "$OUT/changed-files.txt"
          printf 'rustfmt changed files:\n'
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0 || { echo 'no rustfmt repair needed'; exit 1; }
          for path in "${changed[@]}"; do
            case "$path" in
              crates/ores-stack-cli/src/ppr_public_dev.rs|\
              crates/ores-stack-process-tree/src/lib.rs|\
              crates/ores-stack-middleware-runner/src/lib.rs|\
              crates/ores-stack-middleware-runner/src/main.rs|\
              crates/ores-stack-ppr-http/src/lib.rs)
                ;;
              *)
                echo "refusing guarded repair: rustfmt changed unexpected path $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Verify repaired PPR stack
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check --locked -p ores-stack-process-tree --all-targets
          cargo check --locked -p ores-stack-middleware-runner --all-targets
          cargo check --locked -p ores-stack-ppr-http --all-targets
          cargo clippy --locked -p ores-stack-process-tree --all-targets -- -D warnings
          cargo clippy --locked -p ores-stack-middleware-runner --all-targets -- -D warnings
          cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings
          cargo test --locked -p ores-stack-process-tree
          cargo test --locked -p ores-stack-middleware-runner
          cargo test --locked -p ores-stack-ppr-http
          cargo check --locked -p ores-stack-cli --all-targets

      - name: Commit and push guarded repair
        shell: bash
        working-directory: ores-stack
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add crates/ores-stack-cli/src/ppr_public_dev.rs \
                  crates/ores-stack-process-tree/src/lib.rs \
                  crates/ores-stack-middleware-runner/src/lib.rs \
                  crates/ores-stack-middleware-runner/src/main.rs \
                  crates/ores-stack-ppr-http/src/lib.rs
          git commit -m 'style(ppr): apply canonical rustfmt'
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA" || { echo "source branch moved before push: $remote_head"; exit 1; }
          git push origin HEAD:"$TARGET_BRANCH"
