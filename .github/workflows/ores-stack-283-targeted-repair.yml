name: ores-stack #283 targeted repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-283-targeted-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  STACK_PR: '283'
  STACK_HEAD: '5756f81ebc34983fe557569a83f2a93c3ef4d8b3'
  STACK_BRANCH: 'feat/governance-v2-scaffold-admission-20260923'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact source head
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/ORESoftware/ores-stack.git source
          git -C source fetch --no-tags origin "+refs/pull/${STACK_PR}/head:refs/remotes/origin/pr-${STACK_PR}-head"
          actual="$(git -C source rev-parse refs/remotes/origin/pr-${STACK_PR}-head)"
          printf 'expected: %s\nactual:   %s\n' "$STACK_HEAD" "$actual"
          test "$actual" = "$STACK_HEAD"
          git -C source checkout --detach "$actual"

      - name: Apply the two deterministic repairs
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          contract = Path('crates/ores-stack-cli/src/contract_cli.rs')
          text = contract.read_text()
          old = '''            let value: toml::Value = text
                .parse()
                .map_err(|error: toml::de::Error| format!("parse Cargo.toml: {error}"))?;'''
          new = '''            let value: toml::Value = toml::from_str(text)
                .map_err(|error| format!("parse Cargo.toml: {error}"))?;'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Cargo.toml parser site, found {text.count(old)}')
          contract.write_text(text.replace(old, new, 1))

          stack = Path('crates/ores-stack-cli/src/stack_cli_hardened.rs')
          text = stack.read_text()
          old = '''        let from = stage_root.join(name);
        let to = workspace.join(name);
        if let Err(error) = fs::rename(&from, &to) {'''
          new = '''        let from = stage_root.join(name);
        let to = workspace.join(name);
        let publish_result = match fs::symlink_metadata(&to) {
            Ok(_) => Err(std::io::Error::new(
                std::io::ErrorKind::AlreadyExists,
                "destination already exists",
            )),
            Err(error) if error.kind() == std::io::ErrorKind::NotFound => fs::rename(&from, &to),
            Err(error) => Err(error),
        };
        if let Err(error) = publish_result {'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one staged publish site, found {text.count(old)}')
          stack.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'crates/ores-stack-cli/src/contract_cli.rs'
          test "${changed[1]}" = 'crates/ores-stack-cli/src/stack_cli_hardened.rs'

      - name: Install Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt

      - name: Format only repaired files
        working-directory: source
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/ores-stack-cli/src/contract_cli.rs crates/ores-stack-cli/src/stack_cli_hardened.rs
          git diff --check

      - name: Prove both formerly failing tests
        working-directory: source
        run: |
          set -euo pipefail
          cargo test --locked -p ores-stack-cli --bin ores-stack contract_cli::tests::web_governance_admits_disjoint_authority_and_commands -- --exact
          cargo test --locked -p ores-stack-cli --bin ores-stack stack_cli_hardened::tests::publication_rolls_back_when_a_later_destination_collides -- --exact

      - name: Run complete CLI tests
        working-directory: source
        run: |
          set -euo pipefail
          cargo test --locked -p ores-stack-cli --all-targets
          cargo test --locked -p ores-stack-cli --all-targets --all-features

      - name: Commit and push only the proven repair
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STACK_HEAD"
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'crates/ores-stack-cli/src/contract_cli.rs'
          test "${changed[1]}" = 'crates/ores-stack-cli/src/stack_cli_hardened.rs'
          git config user.name 'ORESoftware'
          git config user.email 'oresoftware@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'fix(governance): repair document parsing and publish collision guard'
          git push origin "HEAD:refs/heads/${STACK_BRANCH}"
