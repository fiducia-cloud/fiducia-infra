name: proof ores-compose 181 exact head

on:
  push:
    branches:
      - proof/ores-compose-180-exact-20260922

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Certify exact ores-compose 181 source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          set -Eeuo pipefail
          SOURCE_REPO='ORESoftware/ores-compose'
          SOURCE_BRANCH='fix/pin-trusted-working-directory-inodes-current-main-20260922'
          SOURCE_SHA='422266ec38564293a69954894b9cb710cf8a7427'
          BASE_SHA='c505136a2ed01dc9d3d428dff89557261b219922'
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          git clone --filter=blob:none "https://github.com/${SOURCE_REPO}.git" ores-compose
          cd ores-compose
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git merge-base "$SOURCE_SHA" "$BASE_SHA")" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'src/trusted_working_directory.rs'
          git diff --check "$BASE_SHA" "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          remote_head=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          remote_main=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)
          test "$remote_head" = "$SOURCE_SHA"
          test "$remote_main" = "$BASE_SHA"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'
          rustfmt --edition 2024 --check src/trusted_working_directory.rs
          cargo check --locked --all-targets --all-features
          cargo test --locked --lib trusted_working_directory::tests:: -- --nocapture --test-threads=1
          for i in $(seq 1 100); do
            cargo test --locked --lib trusted_working_directory::tests::replacement_after_admission_is_detected -- --exact --test-threads=1 >/tmp/replacement.log 2>&1 || { cat /tmp/replacement.log; exit 1; }
          done
          echo ORES_COMPOSE_181_REPLACEMENT_100X_PASS
          cargo test --locked --all-targets --all-features --no-fail-fast
          cargo clippy --locked --lib --no-deps -- -D warnings
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          remote_head=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          remote_main=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)
          test "$remote_head" = "$SOURCE_SHA"
          test "$remote_main" = "$BASE_SHA"
          echo ORES_COMPOSE_181_EXACT_HEAD_PASS
