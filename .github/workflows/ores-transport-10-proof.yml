name: ORESoftware ores-transport #10 exact-head proof

on:
  pull_request:
    paths:
      - '.github/workflows/ores-transport-10-proof.yml'

permissions:
  contents: read

jobs:
  rust:
    name: ores-transport#10 Rust matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 7f1d8d1b1c024d50c4b179441ed076d15f241074
      SOURCE_MAIN_SHA: 1fb45fe0f954440dfc8eaa56ba1c4cf002e17ff7
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-transport
          ref: 7f1d8d1b1c024d50c4b179441ed076d15f241074
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Verify formatting
        run: cargo fmt --check

      - name: Lint all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test all targets and features
        run: cargo test --all-targets --all-features

      - name: Compile transport opt-out matrix
        shell: bash
        run: |
          set -euo pipefail
          cargo check --no-default-features
          cargo check --no-default-features --features http
          cargo check --no-default-features --features tcp
          cargo check --no-default-features --features nats

      - name: Prove admission is read-only
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
