name: ores-stack-deploy-190-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-deploy-190-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_STACK_SHA: 'cd15cc117290f335aa09e30581a0e5fa9aeb6e0a'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack deploy head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Cargo format
        shell: bash
        working-directory: ores-stack
        run: cargo fmt --all -- --check

      - name: Cargo check CLI
        shell: bash
        working-directory: ores-stack
        run: cargo check --locked -p ores-stack-cli --all-targets

      - name: Cargo clippy CLI
        shell: bash
        working-directory: ores-stack
        run: cargo clippy --locked -p ores-stack-cli --all-targets -- -D warnings

      - name: Shared JSON propagation regression
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-cli deploy_receives_resolved_shared_json_output_mode

      - name: Deploy integrity regressions
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-cli --test deploy_artifact_integrity --test deploy_generated_env
