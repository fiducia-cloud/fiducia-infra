name: ores-middleware-edge-minimal-264

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-middleware-edge-minimal-264.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_MIDDLEWARE_SHA: '31bc7dbbaf5a10aa1a466eeeaae4e9148b049a31'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-middleware #264 head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-middleware
          git -C ores-middleware remote add origin https://github.com/ORESoftware/ores-middleware.git
          git -C ores-middleware fetch --depth=1 origin "$ORES_MIDDLEWARE_SHA"
          git -C ores-middleware checkout --detach FETCH_HEAD
          test "$(git -C ores-middleware rev-parse HEAD)" = "$ORES_MIDDLEWARE_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Exact portable-source format gate
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            src/rust/src/provider_api.rs \
            src/rust/src/hosts/edge_minimal_local.rs
          git diff --exit-code

      - name: Portable core Clippy
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          cargo clippy --locked -p ores-middleware --no-default-features --lib -- -D warnings

      - name: Edge provider and local-host tests
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          cargo test --locked -p ores-middleware --no-default-features provider_api::tests -- --nocapture
          cargo test --locked -p ores-middleware --no-default-features hosts::edge_minimal_local::tests -- --nocapture
          git diff --exit-code

      - name: Portable core check
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          cargo check --locked -p ores-middleware --no-default-features --all-targets
          git diff --exit-code
