# Certification harness for the latest cancellation-safe scheduler/Rx branch.
name: ores-http-clients certification

on:
  push:
    branches: [ci/ores-http-clients-certification]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-http-clients
  SOURCE_REF: fix/scheduler-cancellation-accounting

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - working-directory: source
        run: sh scripts/check.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: source/src/ts
        run: npm install --ignore-scripts --no-audit --no-fund
      - working-directory: source/src/ts
        run: npm test

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: source/src/dart
        run: dart pub get
      - working-directory: source/src/dart
        run: dart analyze --fatal-infos
      - working-directory: source/src/dart
        run: dart test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - working-directory: source/src/rust
        run: cargo fmt --all -- --check
      - working-directory: source/src/rust
        run: cargo test --all-targets
      - working-directory: source/src/rust
        run: cargo test --all-targets --features rxrust-support
      - working-directory: source/src/rust
        run: cargo clippy --all-targets --features rxrust-support -- -D warnings
      - working-directory: source/src/rust
        run: cargo check --target wasm32-unknown-unknown

  ores-stack-pr143:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact ores-stack PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-stack
          ref: 71eb5eae18739ffff0bc58a1687db49b1f4e52d4
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-stack
          persist-credentials: false
          show-progress: false
      - name: Configure private Git dependency auth
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Bootstrap lockfile
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure
      - name: Format exact source and fast-forward PR branch
        working-directory: ores-stack
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'ORESoftware automation'
            git config user.email 'noreply@oresoftware.com'
            git add -u
            git commit -m 'style(ppr): apply rustfmt after direct API child wiring'
            git remote set-url origin "https://x-access-token:${ORE_SOURCE_PAT}@github.com/ORESoftware/ores-stack.git"
            git push origin HEAD:feat/server-stream-lambda-ppr-20260921
          fi
      - name: Clippy
        working-directory: ores-stack
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: ores-stack
        run: cargo test --workspace --all-targets --locked
