name: ores-http-clients certification

on:
  push:
    branches: [ci/ores-http-clients-certification]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-http-clients
  SOURCE_REF: ci/harden-polyglot-gates

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - working-directory: source
        run: sh scripts/check.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: source/src/ts
        run: npm install --ignore-scripts --no-audit --no-fund
      - working-directory: source/src/ts
        run: npm test

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: source/src/dart
        run: dart pub get
      - working-directory: source/src/dart
        run: dart analyze --fatal-infos
      - working-directory: source/src/dart
        run: dart test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy
      - working-directory: source/src/rust
        run: cargo fmt --all -- --check
      - working-directory: source/src/rust
        run: cargo test --all-targets
      - working-directory: source/src/rust
        run: cargo test --all-targets --features rxrust-support
      - working-directory: source/src/rust
        run: cargo clippy --all-targets --features rxrust-support -- -D warnings
      - working-directory: source/src/rust
        run: cargo check --target wasm32-unknown-unknown
