name: ores-http-clients certification

on:
  push:
    branches: [ci/ores-http-clients-certification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ORESoftware/ores-http-clients
          ref: audit/harden-representations
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: true
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply compiler-driven TS and Dart fixes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('src/ts/src/index.ts')
          s = index.read_text()
          s = s.replace('let body: Uint8Array | undefined;', 'let body: BodyInit | undefined;')
          s = s.replace(
              'body = options.requestCodec.encode(options.body);',
              'body = Uint8Array.from(options.requestCodec.encode(options.body)).buffer;'
          )
          old = 'return client.request<TData, TVariables>(document, variables as TVariables);'
          new = '''return (client.request as unknown as (\n      document: string,\n      variables?: TVariables,\n    ) => Promise<TData>)(document, variables);'''
          if old not in s:
              raise SystemExit('expected graphql-request call not found')
          s = s.replace(old, new)
          index.write_text(s)

          ws = Path('src/ts/src/websockets.ts')
          s = ws.read_text()
          s = s.replace('onopen: ((event: unknown) => void) | null;', 'onopen: ((event: any) => void) | null;')
          s = s.replace('onmessage: ((event: { data?: unknown }) => void) | null;', 'onmessage: ((event: any) => void) | null;')
          s = s.replace('onerror: ((event: unknown) => void) | null;', 'onerror: ((event: any) => void) | null;')
          s = s.replace('onclose: ((event: unknown) => void) | null;', 'onclose: ((event: any) => void) | null;')
          ws.write_text(s)

          test = Path('src/ts/test/client.test.ts')
          s = test.read_text()
          marker = 'import {DEFAULT_PATHS, OresHttpClients, ResponseTooLargeError, messagePackCodec, protobufCodec} from "../src/index.js";\n'
          helper = marker + '\nconst bodyFromBytes = (bytes: Uint8Array): ArrayBuffer => Uint8Array.from(bytes).buffer;\n'
          if 'const bodyFromBytes' not in s:
              if marker not in s:
                  raise SystemExit('expected TS test import marker not found')
              s = s.replace(marker, helper)
          s = s.replace('new Response(Uint8Array.from([137, 80, 78, 71])', 'new Response(bodyFromBytes(Uint8Array.from([137, 80, 78, 71]))')
          s = s.replace('new Response(codec.encode({value: 9})', 'new Response(bodyFromBytes(codec.encode({value: 9}))')
          s = s.replace('new Response(Uint8Array.of(7)', 'new Response(bodyFromBytes(Uint8Array.of(7))')
          s = s.replace('new Response(Uint8Array.of(1, 2, 3)', 'new Response(bodyFromBytes(Uint8Array.of(1, 2, 3))')
          test.write_text(s)

          dart_test = Path('src/dart/test/websocket_hub_test.dart')
          s = dart_test.read_text()
          import_line = "import 'package:stream_channel/stream_channel.dart';\n"
          anchor = "import 'package:test/test.dart';\n"
          if import_line not in s:
              if anchor not in s:
                  raise SystemExit('expected Dart test import anchor not found')
              s = s.replace(anchor, anchor + import_line)
          s = s.replace(
              'final class _FakeChannel implements WebSocketChannel {',
              'final class _FakeChannel with StreamChannelMixin<dynamic> implements WebSocketChannel {'
          )
          dart_test.write_text(s)

          pubspec = Path('src/dart/pubspec.yaml')
          s = pubspec.read_text()
          if '  stream_channel:' not in s:
              s = s.replace('dev_dependencies:\n', 'dev_dependencies:\n  stream_channel: ^2.1.4\n')
          pubspec.write_text(s)
          PY
      - name: Format Dart and Rust
        working-directory: source
        run: |
          set -euo pipefail
          dart format src/dart/lib src/dart/test
          cargo fmt --manifest-path src/rust/Cargo.toml --all
      - name: Push repaired source branch
        working-directory: source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No repair changes to push.'
            exit 0
          fi
          git config user.name 'ORESoftware CI Repair'
          git config user.email 'ci-repair@oresoftware.com'
          git add src/ts src/dart src/rust
          git commit -m 'fix: compiler-driven polyglot client hardening'
          git push origin HEAD:audit/harden-representations

  typescript:
    needs: repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ORESoftware/ores-http-clients
          ref: audit/harden-representations
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: source/src/ts
        run: npm install --no-audit --no-fund
      - working-directory: source/src/ts
        run: npm test

  dart:
    needs: repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ORESoftware/ores-http-clients
          ref: audit/harden-representations
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: source/src/dart
        run: dart pub get
      - working-directory: source/src/dart
        run: dart analyze --fatal-infos
      - working-directory: source/src/dart
        run: dart test

  rust:
    needs: repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ORESoftware/ores-http-clients
          ref: audit/harden-representations
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - working-directory: source/src/rust
        run: cargo fmt --all -- --check
      - working-directory: source/src/rust
        run: cargo test --all-targets
      - working-directory: source/src/rust
        run: cargo test --all-targets --features rxrust-support
      - working-directory: source/src/rust
        run: cargo clippy --all-targets --features rxrust-support -- -D warnings

  contract-shape:
    needs: repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ORESoftware/ores-http-clients
          ref: audit/harden-representations
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: source
          persist-credentials: false
      - run: |
          set -euo pipefail
          test -f source/src/ts/src/websockets.ts
          test -f source/src/dart/lib/src/websocket_hub.dart
          test -f source/src/rust/src/websocket_hub.rs
          test -f source/.contracts/runtime-config.schema.json
          test -f source/.contracts/runtime-config.tsp
          grep -q 'supabase' source/src/ts/src/websockets.ts
          grep -q 'supabase' source/src/dart/lib/src/websocket_hub.dart
          grep -q 'supabase' source/src/rust/src/websocket_hub.rs
