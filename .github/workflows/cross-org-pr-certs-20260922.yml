name: cross-org exact-head PR certifications

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/cross-org-pr-certs-20260922.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  ores-compose-175:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_REPO: ORESoftware/ores-compose
      SOURCE_BRANCH: formal/exhaustive-dependency-waves-20260922
      SOURCE_HEAD: 11d753448edae184642e52a4f1f5ef0b2dfd316d
      SOURCE_BASE: 2e0d1488ca32371e4f410f95cf6886674b86876c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact PR head
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C source fetch --depth=20 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_BASE"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_HEAD"
          git -C source checkout --detach "$SOURCE_HEAD"
          test "$(git -C source merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          test "$(git -C source diff --name-only "$SOURCE_BASE"..HEAD | tr '\n' ' ')" = "tests/formal_dependency_graph_exhaustive.rs "
          test -z "$(git -C source status --porcelain)"
          git -C source diff --check "$SOURCE_BASE"..HEAD
      - name: Rust 1.98.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'
      - name: PR-owned formatting
        working-directory: source
        run: rustfmt --edition 2021 --check tests/formal_dependency_graph_exhaustive.rs
      - name: Clippy
        working-directory: source
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests including bounded exhaustive planner proof
        working-directory: source
        run: cargo test --all-targets --all-features
      - name: Immutable exact-head guard
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"
          echo ORES_COMPOSE_175_EXACT_HEAD_PASS

  ores-cli-413:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_REPO: ORESoftware/ores-cli
      SOURCE_BRANCH: DEN-390-rust-tjsv-ci-fixtures-20260922
      SOURCE_HEAD: 40daac105e1e0ca76b4c086426f81bd70024887b
      SOURCE_BASE: a8cc237e058acfda2a9dcb4afea76458808a5988
      TJSV_SHA: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact PR head and TJSV authority
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C source fetch --depth=20 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_BASE"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_HEAD"
          git -C source checkout --detach "$SOURCE_HEAD"
          test "$(git -C source merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          test "$(git -C source diff --name-only "$SOURCE_BASE"..HEAD | sort | tr '\n' ' ')" = ".github/workflows/ci.yml .github/workflows/source-audit-tjsv.yml tests/tjsv_ci_fixture.rs "
          git init tjsv
          git -C tjsv remote add origin https://github.com/ORESoftware/typespec-json-schema-validator.git
          git -C tjsv fetch --depth=1 origin "$TJSV_SHA"
          git -C tjsv checkout --detach "$TJSV_SHA"
          test "$(git -C tjsv rev-parse HEAD)" = "$TJSV_SHA"
          test -z "$(git -C source status --porcelain)"
          test -z "$(git -C tjsv status --porcelain)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.16.0'
      - name: Install immutable TJSV dependencies
        working-directory: tjsv
        run: npm ci --omit=dev
      - name: Rust 1.95.0
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.95.0
      - name: Locked dependency graph
        working-directory: source
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: PR-owned Rust formatting
        working-directory: source
        run: rustfmt --edition 2024 --check tests/tjsv_ci_fixture.rs
      - name: Clippy
        working-directory: source
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Rust tests
        working-directory: source
        run: cargo test --all-targets --all-features --locked
      - name: Full TypeSpec and authored JSON Schema admission
        working-directory: source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/tjsv-generated"
          node ../tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=contracts/infra-gitops/main.tsp \
            --schema=contracts/infra-gitops/authored.schema.json \
            --report="$RUNNER_TEMP/infra-gitops-parity.json" \
            --contract-ir="$RUNNER_TEMP/infra-gitops-contract-ir.json" \
            --output-dir="$RUNNER_TEMP/tjsv-generated"
          test -s "$RUNNER_TEMP/tjsv-generated/typespec.generated.schema.json"
          ORES_TJSV_REPORT="$RUNNER_TEMP/infra-gitops-parity.json" \
          ORES_TJSV_GENERATED_SCHEMA="$RUNNER_TEMP/tjsv-generated/typespec.generated.schema.json" \
            cargo test --locked --test tjsv_ci_fixture assert_success_evidence -- --exact --ignored --nocapture
      - name: TypeSpec-only drift negative control
        working-directory: source
        run: |
          set -euo pipefail
          cp contracts/infra-gitops/main.tsp "$RUNNER_TEMP/infra-gitops-typespec-drift.tsp"
          ORES_TJSV_FIXTURE="$RUNNER_TEMP/infra-gitops-typespec-drift.tsp" \
          ORES_TJSV_FROM='supabaseRoot: string;' \
          ORES_TJSV_TO='supabaseRoot: int32;' \
            cargo test --locked --test tjsv_ci_fixture mutate_typespec_once -- --exact --ignored --nocapture
          rm -rf "$RUNNER_TEMP/tjsv-typespec-drift-generated"
          set +e
          node ../tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec="$RUNNER_TEMP/infra-gitops-typespec-drift.tsp" \
            --schema=contracts/infra-gitops/authored.schema.json \
            --report="$RUNNER_TEMP/infra-gitops-typespec-drift-report.json" \
            --contract-ir="$RUNNER_TEMP/infra-gitops-typespec-drift-contract-ir.json" \
            --output-dir="$RUNNER_TEMP/tjsv-typespec-drift-generated"
          rc=$?
          set -e
          test "$rc" -ne 0
          ORES_TJSV_REPORT="$RUNNER_TEMP/infra-gitops-typespec-drift-report.json" \
            cargo test --locked --test tjsv_ci_fixture assert_rejection_evidence -- --exact --ignored --nocapture
      - name: JSON-Schema-only drift negative control
        working-directory: source
        run: |
          set -euo pipefail
          cp contracts/infra-gitops/authored.schema.json "$RUNNER_TEMP/infra-gitops-drift.schema.json"
          ORES_TJSV_FIXTURE="$RUNNER_TEMP/infra-gitops-drift.schema.json" \
          ORES_TJSV_JSON_POINTER='/$defs/InfraGitOpsContract/properties/supabaseRoot/type' \
          ORES_TJSV_JSON_VALUE='"integer"' \
            cargo test --locked --test tjsv_ci_fixture mutate_json_schema_value -- --exact --ignored --nocapture
          rm -rf "$RUNNER_TEMP/tjsv-negative-generated"
          set +e
          node ../tjsv/bin/typespec-json-schema-validator.mjs check \
            --typespec=contracts/infra-gitops/main.tsp \
            --schema="$RUNNER_TEMP/infra-gitops-drift.schema.json" \
            --report="$RUNNER_TEMP/infra-gitops-negative-report.json" \
            --contract-ir="$RUNNER_TEMP/infra-gitops-negative-contract-ir.json" \
            --output-dir="$RUNNER_TEMP/tjsv-negative-generated"
          rc=$?
          set -e
          test "$rc" -ne 0
          ORES_TJSV_REPORT="$RUNNER_TEMP/infra-gitops-negative-report.json" \
          ORES_TJSV_CONTRACT_IR="$RUNNER_TEMP/infra-gitops-negative-contract-ir.json" \
            cargo test --locked --test tjsv_ci_fixture assert_rejection_evidence -- --exact --ignored --nocapture
      - name: Immutable exact-head guard
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git -C source status --porcelain)"
          test "$(git -C tjsv rev-parse HEAD)" = "$TJSV_SHA"
          test -z "$(git -C tjsv status --porcelain)"
          echo ORES_CLI_413_EXACT_HEAD_PASS
