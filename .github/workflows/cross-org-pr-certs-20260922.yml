name: cross-org exact-head PR certifications

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/cross-org-pr-certs-20260922.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  ores-compose-175:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REPO: ORESoftware/ores-compose
      SOURCE_BRANCH: formal/exhaustive-dependency-waves-20260922
      SOURCE_BASE: 2e0d1488ca32371e4f410f95cf6886674b86876c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Configure authenticated source access
        env: {ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch and bind current PR head
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C source fetch --depth=20 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_BASE"
          source_head="$(git -C source rev-parse origin/$SOURCE_BRANCH)"
          echo "SOURCE_HEAD=$source_head" >> "$GITHUB_ENV"
          git -C source checkout --detach "$source_head"
          test "$(git -C source merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          test "$(git -C source diff --name-only "$SOURCE_BASE"..HEAD | tr '\n' ' ')" = "tests/formal_dependency_graph_exhaustive.rs "
          test -z "$(git -C source status --porcelain)"
          git -C source diff --check "$SOURCE_BASE"..HEAD
      - name: Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.98.1
      - name: PR-owned formatting
        working-directory: source
        run: rustfmt --edition 2021 --check tests/formal_dependency_graph_exhaustive.rs
      - name: Clippy
        working-directory: source
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests including bounded exhaustive planner proof
        working-directory: source
        run: cargo test --all-targets --all-features
      - name: Exact-source decision
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"
          echo ORES_COMPOSE_175_EXACT_HEAD_PASS

  ores-cli-413:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE_REPO: ORESoftware/ores-cli
      SOURCE_BRANCH: DEN-390-rust-tjsv-ci-fixtures-20260922
      SOURCE_BASE: a8cc237e058acfda2a9dcb4afea76458808a5988
      TJSV_SHA: 93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Configure authenticated source access
        env: {ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch and bind current PR head and TJSV authority
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C source fetch --depth=20 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_BASE"
          source_head="$(git -C source rev-parse origin/$SOURCE_BRANCH)"
          echo "SOURCE_HEAD=$source_head" >> "$GITHUB_ENV"
          git -C source checkout --detach "$source_head"
          test "$(git -C source merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          test "$(git -C source diff --name-only "$SOURCE_BASE"..HEAD | sort | tr '\n' ' ')" = ".github/workflows/ci.yml .github/workflows/source-audit-tjsv.yml tests/tjsv_ci_fixture.rs "
          git init tjsv
          git -C tjsv remote add origin https://github.com/ORESoftware/typespec-json-schema-validator.git
          git -C tjsv fetch --depth=1 origin "$TJSV_SHA"
          git -C tjsv checkout --detach "$TJSV_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22.16.0'}
      - name: Install immutable TJSV dependencies
        working-directory: tjsv
        run: npm ci --omit=dev
      - name: Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.95.0
      - name: Locked dependency graph and PR-owned formatting
        working-directory: source
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          rustfmt --edition 2024 --check tests/tjsv_ci_fixture.rs
      - name: Compare Clippy diagnostics with base
        run: |
          set -uo pipefail
          set +e
          CARGO_TARGET_DIR=/tmp/cli-head-target cargo clippy --manifest-path source/Cargo.toml --all-targets --all-features --locked --message-format=json > /tmp/cli-head.jsonl
          head_rc=$?
          git -C source worktree add --detach /tmp/ores-cli-base "$SOURCE_BASE"
          CARGO_TARGET_DIR=/tmp/cli-base-target cargo clippy --manifest-path /tmp/ores-cli-base/Cargo.toml --all-targets --all-features --locked --message-format=json > /tmp/cli-base.jsonl
          base_rc=$?
          set -e
          export HEAD_RC="$head_rc" BASE_RC="$base_rc"
          python3 - <<'PY' | tee /tmp/cli-clippy-diff.txt
          import json, os
          from pathlib import Path
          def norm(v):
              v=str(v or '').replace('\\','/')
              for marker in ('/ores-cli-base/','/source/'):
                  if marker in v: return v.split(marker,1)[1]
              return v
          def ds(path):
              out=set()
              for raw in Path(path).read_text().splitlines():
                  try: obj=json.loads(raw)
                  except json.JSONDecodeError: continue
                  if obj.get('reason')!='compiler-message': continue
                  m=obj.get('message') or {}
                  if m.get('level') not in {'warning','error'}: continue
                  spans=m.get('spans') or []
                  p=next((x for x in spans if x.get('is_primary')),spans[0] if spans else {})
                  out.add((m.get('level') or '',(m.get('code') or {}).get('code') or '',norm(p.get('file_name')),(m.get('message') or '').strip()))
              return out
          base,head=ds('/tmp/cli-base.jsonl'),ds('/tmp/cli-head.jsonl')
          new=sorted(head-base)
          print(f"exit base={os.environ['BASE_RC']} head={os.environ['HEAD_RC']}")
          print(f"diagnostics base={len(base)} head={len(head)} new={len(new)}")
          for x in new: print(x)
          Path('/tmp/cli-clippy-status').write_text('pass\n' if not new and not (int(os.environ['HEAD_RC']) != 0 and int(os.environ['BASE_RC']) == 0) else 'fail\n')
          PY
      - name: Rust tests with retained diagnostics
        working-directory: source
        run: |
          set -uo pipefail
          set +e
          cargo test --all-targets --all-features --locked 2>&1 | tee /tmp/cli-tests.log
          rc=${PIPESTATUS[0]}
          set -e
          if test "$rc" -eq 0; then echo pass > /tmp/cli-tests-status; else echo fail > /tmp/cli-tests-status; fi
          exit 0
      - name: Full TypeSpec and authored JSON Schema admission
        working-directory: source
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/tjsv-generated"
          node ../tjsv/bin/typespec-json-schema-validator.mjs check --typespec=contracts/infra-gitops/main.tsp --schema=contracts/infra-gitops/authored.schema.json --report="$RUNNER_TEMP/infra-gitops-parity.json" --contract-ir="$RUNNER_TEMP/infra-gitops-contract-ir.json" --output-dir="$RUNNER_TEMP/tjsv-generated"
          test -s "$RUNNER_TEMP/tjsv-generated/typespec.generated.schema.json"
          ORES_TJSV_REPORT="$RUNNER_TEMP/infra-gitops-parity.json" ORES_TJSV_GENERATED_SCHEMA="$RUNNER_TEMP/tjsv-generated/typespec.generated.schema.json" cargo test --locked --test tjsv_ci_fixture assert_success_evidence -- --exact --ignored --nocapture
      - name: TypeSpec-only drift negative control
        working-directory: source
        run: |
          set -euo pipefail
          cp contracts/infra-gitops/main.tsp "$RUNNER_TEMP/typespec-drift.tsp"
          ORES_TJSV_FIXTURE="$RUNNER_TEMP/typespec-drift.tsp" ORES_TJSV_FROM='supabaseRoot: string;' ORES_TJSV_TO='supabaseRoot: int32;' cargo test --locked --test tjsv_ci_fixture mutate_typespec_once -- --exact --ignored --nocapture
          set +e
          node ../tjsv/bin/typespec-json-schema-validator.mjs check --typespec="$RUNNER_TEMP/typespec-drift.tsp" --schema=contracts/infra-gitops/authored.schema.json --report="$RUNNER_TEMP/typespec-drift-report.json" --contract-ir="$RUNNER_TEMP/typespec-drift-ir.json" --output-dir="$RUNNER_TEMP/typespec-drift-out"
          rc=$?
          set -e
          test "$rc" -ne 0
          ORES_TJSV_REPORT="$RUNNER_TEMP/typespec-drift-report.json" cargo test --locked --test tjsv_ci_fixture assert_rejection_evidence -- --exact --ignored --nocapture
      - name: JSON-Schema-only drift negative control
        working-directory: source
        run: |
          set -euo pipefail
          cp contracts/infra-gitops/authored.schema.json "$RUNNER_TEMP/schema-drift.json"
          ORES_TJSV_FIXTURE="$RUNNER_TEMP/schema-drift.json" ORES_TJSV_JSON_POINTER='/$defs/InfraGitOpsContract/properties/supabaseRoot/type' ORES_TJSV_JSON_VALUE='"integer"' cargo test --locked --test tjsv_ci_fixture mutate_json_schema_value -- --exact --ignored --nocapture
          set +e
          node ../tjsv/bin/typespec-json-schema-validator.mjs check --typespec=contracts/infra-gitops/main.tsp --schema="$RUNNER_TEMP/schema-drift.json" --report="$RUNNER_TEMP/schema-drift-report.json" --contract-ir="$RUNNER_TEMP/schema-drift-ir.json" --output-dir="$RUNNER_TEMP/schema-drift-out"
          rc=$?
          set -e
          test "$rc" -ne 0
          ORES_TJSV_REPORT="$RUNNER_TEMP/schema-drift-report.json" ORES_TJSV_CONTRACT_IR="$RUNNER_TEMP/schema-drift-ir.json" cargo test --locked --test tjsv_ci_fixture assert_rejection_evidence -- --exact --ignored --nocapture
      - name: Upload CLI diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ores-cli-413-diagnostics
          path: |
            /tmp/cli-clippy-diff.txt
            /tmp/cli-clippy-status
            /tmp/cli-tests.log
            /tmp/cli-tests-status
          if-no-files-found: warn
      - name: Exact-source decision
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test "$(cat /tmp/cli-clippy-status 2>/dev/null || echo missing)" = pass
          test "$(cat /tmp/cli-tests-status 2>/dev/null || echo missing)" = pass
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C source ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          test -z "$(git -C source status --porcelain)"
          test "$(git -C tjsv rev-parse HEAD)" = "$TJSV_SHA"
          test -z "$(git -C tjsv status --porcelain)"
          echo ORES_CLI_413_EXACT_HEAD_PASS
