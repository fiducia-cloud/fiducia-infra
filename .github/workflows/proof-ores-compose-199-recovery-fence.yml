name: proof-ores-compose-199-recovery-fence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-compose-199-recovery-fence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 600ee0aa6f5a36ae912b0d9bb45fe30a607bd78a

jobs:
  recovery-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact ores-compose head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          grep -F 'LeaseCoordinationError::StaleFence' tests/deep_recovery_fencing.rs

      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1

      - name: Prove recovery takeover fencing
        shell: bash
        run: cargo test --test deep_recovery_fencing

      - name: Run full Rust test suite
        shell: bash
        run: cargo test --all-targets --all-features

      - name: Prove tracked source unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
