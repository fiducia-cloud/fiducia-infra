name: proof ores-proc-isolation 8 9

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-proc-isolation-cli
  SOURCE_MAIN_SHA: 8637b9303a479d17baf436633cf0322397079ee1

jobs:
  rust-and-policy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 8
            os: ubuntu-24.04
            source_branch: hardening/nixos-trusted-helper-paths
            source_sha: 02386f3c1e34b83a9d58b08cc5b7ded744e34b32
          - pr: 8
            os: macos-15
            source_branch: hardening/nixos-trusted-helper-paths
            source_sha: 02386f3c1e34b83a9d58b08cc5b7ded744e34b32
          - pr: 9
            os: ubuntu-24.04
            source_branch: fix/beamscale-userns-proof
            source_sha: 8a83ca481e28b75a53b82765d5cde9399e6a6735
          - pr: 9
            os: macos-15
            source_branch: fix/beamscale-userns-proof
            source_sha: 8a83ca481e28b75a53b82765d5cde9399e6a6735
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ matrix.source_sha }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify immutable source identity
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ matrix.source_sha }}"
          git diff --check "$SOURCE_MAIN_SHA" "${{ matrix.source_sha }}"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${{ matrix.source_branch }}" | cut -f1)" = "${{ matrix.source_sha }}"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Install Linux sandbox helpers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles apparmor-utils bubblewrap slirp4netns iproute2 iptables shellcheck curl
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || printf '0')" == '1' ]]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$profile"
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Shell syntax
        shell: bash
        run: |
          bash -n scripts/linux/ores-proc-isolate.sh
          bash -n scripts/macos/ores-proc-isolate.sh

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/linux/ores-proc-isolate.sh scripts/macos/ores-proc-isolate.sh

      - name: Rust and policy checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo run --quiet -- check --config .ores-proc-isolation.yaml

      - name: Backend doctor Linux
        if: runner.os == 'Linux'
        run: cargo run --quiet -- doctor --config .ores-proc-isolation.yaml

      - name: Backend doctor strict external fails closed on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          cargo run --quiet -- doctor --config .ores-proc-isolation.yaml
          rc=$?
          set -e
          test "$rc" -eq 2

      - name: Final immutable source guard
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${{ matrix.source_branch }}" | cut -f1)" = "${{ matrix.source_sha }}"

  sandbox-smoke-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 8
            source_branch: hardening/nixos-trusted-helper-paths
            source_sha: 02386f3c1e34b83a9d58b08cc5b7ded744e34b32
          - pr: 9
            source_branch: fix/beamscale-userns-proof
            source_sha: 8a83ca481e28b75a53b82765d5cde9399e6a6735
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ matrix.source_sha }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - name: Install helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles apparmor-utils bubblewrap slirp4netns iproute2 iptables curl
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || printf '0')" == '1' ]]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$profile"
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
      - name: Build CLI and fixture
        run: cargo build --quiet --examples --bins
      - name: Write strict smoke policy
        run: |
          cat > /tmp/ores-pi-smoke.yaml <<'YAML'
          version: 1
          defaults:
            group: no-net
          groups:
            no-net:
              network:
                mode: none
            external:
              network:
                mode: external
                deny_loopback: true
                deny_private_networks: true
          processes:
            true:
              group: no-net
              command: [/usr/bin/true]
            passwd:
              group: no-net
              command: [/usr/bin/cat, /etc/passwd]
            internet:
              group: external
              command: [/usr/bin/curl, --fail, --silent, --show-error, --head, https://example.com]
            curl-flex:
              group: external
              command: [/usr/bin/curl, --fail, --silent, --show-error]
          YAML
      - name: Synthetic filesystem works
        run: target/debug/ores-proc-isolation run true --config /tmp/ores-pi-smoke.yaml
      - name: Host file read denied
        run: |
          if target/debug/ores-proc-isolation run passwd --config /tmp/ores-pi-smoke.yaml; then exit 1; fi
      - name: External internet works
        run: target/debug/ores-proc-isolation run internet --config /tmp/ores-pi-smoke.yaml
      - name: Host loopback denied
        shell: bash
        run: |
          target/debug/examples/loopback_fixture 127.0.0.1:18080 >/tmp/ores-pi-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:18080 >/dev/null
          if target/debug/ores-proc-isolation run curl-flex --config /tmp/ores-pi-smoke.yaml -- http://127.0.0.1:18080; then exit 1; fi
      - name: Host non-loopback interface denied
        shell: bash
        run: |
          host_ip=''
          while read -r _ _ family cidr _; do
            if [[ "$family" == 'inet' ]]; then host_ip=${cidr%%/*}; break; fi
          done < <(ip -o -4 addr show scope global)
          test -n "$host_ip"
          target/debug/examples/loopback_fixture 0.0.0.0:18081 >/tmp/ores-pi-host-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          curl --fail --silent "http://${host_ip}:18081" >/dev/null
          if target/debug/ores-proc-isolation run curl-flex --config /tmp/ores-pi-smoke.yaml -- "http://${host_ip}:18081"; then exit 1; fi

  sandbox-smoke-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 8
            source_sha: 02386f3c1e34b83a9d58b08cc5b7ded744e34b32
          - pr: 9
            source_sha: 8a83ca481e28b75a53b82765d5cde9399e6a6735
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ matrix.source_sha }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - name: Build CLI and fixture
        run: cargo build --quiet --examples --bins
      - name: Write strict smoke policy
        run: |
          cat > /tmp/ores-pi-smoke.yaml <<'YAML'
          version: 1
          defaults:
            group: no-net
          groups:
            no-net:
              network:
                mode: none
            external-strict:
              network:
                mode: external
                deny_loopback: true
                deny_private_networks: true
          processes:
            true:
              group: no-net
              command: [/usr/bin/true]
            passwd:
              group: no-net
              command: [/bin/cat, /etc/passwd]
            localhost:
              group: no-net
              command: [/usr/bin/curl, --fail, --silent, --show-error, http://127.0.0.1:18080]
            internet-strict:
              group: external-strict
              command: [/usr/bin/curl, --fail, --silent, --show-error, --head, https://example.com]
          YAML
      - name: Seatbelt can launch no-network isolated process
        run: target/debug/ores-proc-isolation run true --config /tmp/ores-pi-smoke.yaml
      - name: Host file read denied
        run: |
          if target/debug/ores-proc-isolation run passwd --config /tmp/ores-pi-smoke.yaml; then exit 1; fi
      - name: Host loopback denied
        shell: bash
        run: |
          target/debug/examples/loopback_fixture 127.0.0.1:18080 >/tmp/ores-pi-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:18080 >/dev/null
          if target/debug/ores-proc-isolation run localhost --config /tmp/ores-pi-smoke.yaml; then exit 1; fi
      - name: Strict external mode fails closed on macOS
        run: |
          if target/debug/ores-proc-isolation run internet-strict --config /tmp/ores-pi-smoke.yaml; then exit 1; fi
