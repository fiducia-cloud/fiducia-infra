name: storage-fence-reference
on:
  pull_request:
    paths:
      - 'tests/test_storage_fence_reference.py'
      - '.github/workflows/storage-fence-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_storage_fence_reference.py -v
