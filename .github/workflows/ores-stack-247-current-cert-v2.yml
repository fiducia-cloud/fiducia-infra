name: ores-stack-247-current-cert-v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-247-current-cert-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD: 'ce6b14759eea92211c774f1727e8a56acf57051b'
  SOURCE_BRANCH: 'salvage/rpc-http-adapter-main-20260922'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated GitHub access
        shell: bash
        env:
          ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact source head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$EXPECTED_HEAD"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C ores-stack ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          test -z "$(git -C ores-stack status --porcelain)"
      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustc --version
      - name: Format exact adapter package
        working-directory: ores-stack
        run: cargo fmt -p ores-fn-adapters -- --check
      - name: Prove lock stability
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          before="$(git hash-object Cargo.lock)"
          bash scripts/bootstrap-cargo-lock.sh ensure
          after="$(git hash-object Cargo.lock)"
          test "$before" = "$after"
          test -z "$(git status --porcelain)"
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Check adapter package
        working-directory: ores-stack
        run: cargo check --locked -p ores-fn-adapters --all-targets
      - name: Test adapter package
        working-directory: ores-stack
        run: cargo test --locked -p ores-fn-adapters --all-targets
      - name: Strict Clippy adapter package
        working-directory: ores-stack
        run: cargo clippy --locked -p ores-fn-adapters --all-targets -- -D warnings
      - name: Workspace integration check
        working-directory: ores-stack
        run: cargo check --locked --workspace --all-targets
      - name: Final immutable-source proof
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git diff --check
