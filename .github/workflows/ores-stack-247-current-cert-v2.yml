name: ores-stack-247-current-cert-v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-247-current-cert-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD: 'ce6b14759eea92211c774f1727e8a56acf57051b'
  EXPECTED_MAIN: '5c3aec0e8b96afabe95e7213d0d33c056886dff9'
  SOURCE_BRANCH: 'salvage/rpc-http-adapter-main-20260922'
  ADAPTER_MANIFEST: 'crates/ores-fn-adapters/Cargo.toml'
  ADAPTER_LOCK: 'crates/ores-fn-adapters/Cargo.lock'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  repair_and_certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated GitHub access
        shell: bash
        env:
          ORE_SOURCE_PAT: '${{ secrets.ORE_SOURCE_PAT }}'
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch immutable source and current main
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch origin "$SOURCE_BRANCH"
          git -C ores-stack checkout -b repair FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C ores-stack ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git -C ores-stack fetch origin "$EXPECTED_MAIN"
          test "$(git -C ores-stack rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C ores-stack ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
      - name: Restack on current main
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git merge --no-edit --no-ff "$EXPECTED_MAIN"
          test -z "$(git status --porcelain)"
      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
          rustc --version
      - name: Repair only PR-owned formatting
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path "$ADAPTER_MANIFEST"
          changed="$(git diff --name-only)"
          if test -n "$changed"; then
            while IFS= read -r path; do
              case "$path" in
                crates/ores-fn-adapters/src/lib.rs|crates/ores-fn-adapters/src/reply.rs|crates/ores-fn-adapters/src/rpc_http.rs) ;;
                *) echo "refusing unrelated rustfmt delta: $path" >&2; exit 1 ;;
              esac
            done <<< "$changed"
            git diff --check
            git add crates/ores-fn-adapters/src/lib.rs crates/ores-fn-adapters/src/reply.rs crates/ores-fn-adapters/src/rpc_http.rs
            git commit -m 'style(lambda): rustfmt RPC HTTP adapter'
          fi
          test -z "$(git status --porcelain)"
          echo "CERTIFIED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Generate standalone lock evidence
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$ADAPTER_LOCK"
          cargo generate-lockfile --manifest-path "$ADAPTER_MANIFEST"
          test -f "$ADAPTER_LOCK"
          test -z "$(git diff --name-only)"
          test "$(git status --porcelain --untracked-files=all)" = "?? $ADAPTER_LOCK"
      - name: Format exact adapter crate
        working-directory: ores-stack
        run: cargo fmt --manifest-path "$ADAPTER_MANIFEST" -- --check
      - name: Check adapter crate
        working-directory: ores-stack
        run: cargo check --locked --manifest-path "$ADAPTER_MANIFEST" --all-targets
      - name: Test adapter crate
        working-directory: ores-stack
        run: cargo test --locked --manifest-path "$ADAPTER_MANIFEST" --all-targets
      - name: Strict Clippy adapter crate
        working-directory: ores-stack
        run: cargo clippy --locked --manifest-path "$ADAPTER_MANIFEST" --all-targets -- -D warnings
      - name: Root workspace integration check
        working-directory: ores-stack
        run: cargo check --locked --workspace --all-targets
      - name: Remove ephemeral adapter lock and prove clean source
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          rm "$ADAPTER_LOCK"
          test -z "$(git status --porcelain)"
          git diff --check
      - name: Guard and publish exact certified head
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git push origin HEAD:"refs/heads/$SOURCE_BRANCH"
