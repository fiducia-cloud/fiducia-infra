name: ores-stack-203-abi-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-203-abi-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_STACK_SHA: 'f3b72f1cf0743c26fb612c3ef46946f73fa04f35'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack ABI head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Check exact pin regression formatting
        shell: bash
        working-directory: ores-stack
        run: rustfmt --edition 2024 --check crates/ores-stack-core/tests/fn_adapter_api_docs_pin.rs

      - name: Bootstrap workspace lock
        shell: bash
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure

      - name: Compile core and pin regression
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check --locked -p ores-stack-core --all-targets
          cargo test --locked -p ores-stack-core --test fn_adapter_api_docs_pin
          cargo clippy --locked -p ores-stack-core --test fn_adapter_api_docs_pin -- -D warnings

      - name: Compile standalone provider adapters against aligned api-docs
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets
          cargo test --manifest-path crates/ores-fn-adapters/Cargo.toml
          cargo clippy --manifest-path crates/ores-fn-adapters/Cargo.toml --all-targets -- -D warnings

      - name: Prove manifests name one immutable api-docs revision
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          core_rev="$(sed -n 's/.*ores-api-docs.*rev = "\([0-9a-f]\{40\}\)".*/\1/p' crates/ores-stack-core/Cargo.toml)"
          adapter_rev="$(sed -n 's/.*ores-api-docs.*rev = "\([0-9a-f]\{40\}\)".*/\1/p' crates/ores-fn-adapters/Cargo.toml)"
          test -n "$core_rev"
          test "$core_rev" = "$adapter_rev"
          printf 'api-docs operation ABI revision: %s\n' "$core_rev"
