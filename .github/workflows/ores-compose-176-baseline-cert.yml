name: ores-compose #176 baseline regression certification

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ores-compose-176-baseline-cert.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  SOURCE_BRANCH: fix/command-spec-static-program-test-20260922
  SOURCE_SHA: c261240732383b45b22b18b9c2db3dd6143325b5
  SOURCE_BASE: 2e0d1488ca32371e4f410f95cf6886674b86876c

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Checkout exact cleaned source head
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/ORESoftware/ores-compose.git
          git -C source fetch --depth=20 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_BASE"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          test "$(git -C source diff --name-only "$SOURCE_BASE"..HEAD | tr '\n' ' ')" = "tests/source_filter_execution_regressions.rs "
          git -C source diff --check "$SOURCE_BASE"..HEAD
          git -C source diff "$SOURCE_BASE"..HEAD -- tests/source_filter_execution_regressions.rs | tee /tmp/source-diff.txt
          grep -F -- '-        program: "git".to_owned(),' /tmp/source-diff.txt
          grep -F -- '+        program: "git",' /tmp/source-diff.txt
      - name: Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.98.1
      - name: Changed-file formatting
        working-directory: source
        run: rustfmt --edition 2021 --check tests/source_filter_execution_regressions.rs
      - name: Normalize head and base lock graphs only in disposable checkouts
        run: |
          set -euo pipefail
          cargo metadata --manifest-path source/Cargo.toml --format-version 1 >/dev/null
          test "$(git -C source diff --name-only | tr '\n' ' ')" = "Cargo.lock "
          git -C source worktree add --detach /tmp/compose-176-base "$SOURCE_BASE"
          cargo metadata --manifest-path /tmp/compose-176-base/Cargo.toml --format-version 1 >/dev/null
          test "$(git -C /tmp/compose-176-base diff --name-only | tr '\n' ' ')" = "Cargo.lock "
      - name: Compare all-target compile diagnostics
        run: |
          set -uo pipefail
          set +e
          CARGO_TARGET_DIR=/tmp/head-target cargo test --manifest-path source/Cargo.toml --locked --all-targets --all-features --no-run --message-format=json > /tmp/head.jsonl
          head_rc=$?
          CARGO_TARGET_DIR=/tmp/base-target cargo test --manifest-path /tmp/compose-176-base/Cargo.toml --locked --all-targets --all-features --no-run --message-format=json > /tmp/base.jsonl
          base_rc=$?
          set -e
          export HEAD_RC="$head_rc" BASE_RC="$base_rc"
          python3 - <<'PY' | tee /tmp/compile-diff.txt
          import json, os
          from pathlib import Path
          def norm(v):
              v=str(v or '').replace('\\','/')
              for marker in ('/compose-176-base/','/source/'):
                  if marker in v: return v.split(marker,1)[1]
              return v
          def ds(path):
              out=set()
              for raw in Path(path).read_text().splitlines():
                  try: obj=json.loads(raw)
                  except json.JSONDecodeError: continue
                  if obj.get('reason')!='compiler-message': continue
                  m=obj.get('message') or {}
                  if m.get('level') not in {'warning','error'}: continue
                  spans=m.get('spans') or []
                  p=next((x for x in spans if x.get('is_primary')),spans[0] if spans else {})
                  out.add((m.get('level') or '',(m.get('code') or {}).get('code') or '',norm(p.get('file_name')),(m.get('message') or '').strip()))
              return out
          base,head=ds('/tmp/base.jsonl'),ds('/tmp/head.jsonl')
          new=sorted(head-base)
          removed=sorted(base-head)
          print(f"exit base={os.environ['BASE_RC']} head={os.environ['HEAD_RC']}")
          print(f"diagnostics base={len(base)} head={len(head)} new={len(new)} removed={len(removed)}")
          for x in new: print('NEW',x)
          for x in removed: print('REMOVED',x)
          if new: raise SystemExit(1)
          if any(x[2]=='tests/source_filter_execution_regressions.rs' and x[1]=='E0308' for x in head):
              raise SystemExit('stale CommandSpec type mismatch still present')
          PY
      - name: Run focused source-filter regression suite
        working-directory: source
        run: cargo test --locked --test source_filter_execution_regressions -- --nocapture
      - name: Final immutable source guard
        working-directory: source
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only "$SOURCE_BASE"..HEAD | tr '\n' ' ')" = "tests/source_filter_execution_regressions.rs "
          echo ORES_COMPOSE_176_BASELINE_CERT_PASS
