name: ores-stack-ppr-196-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-ppr-196-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_STACK_SHA: 'bcd4f4a55be789514323fea35521db80aab15dfd'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack PPR framing head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Cargo format
        shell: bash
        working-directory: ores-stack
        run: cargo fmt --all -- --check

      - name: Check PPR primitive crates
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check --locked -p ores-stack-process-tree --all-targets
          cargo check --locked -p ores-stack-middleware-runner --all-targets
          cargo check --locked -p ores-stack-ppr-http --all-targets

      - name: Clippy PPR primitive crates
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo clippy --locked -p ores-stack-process-tree --all-targets -- -D warnings
          cargo clippy --locked -p ores-stack-middleware-runner --all-targets -- -D warnings
          cargo clippy --locked -p ores-stack-ppr-http --all-targets -- -D warnings

      - name: Test process-tree containment
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-process-tree

      - name: Test middleware begin-finish protocol
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-middleware-runner

      - name: Test strict HTTP framing
        shell: bash
        working-directory: ores-stack
        run: cargo test --locked -p ores-stack-ppr-http

      - name: Check CLI integration surface
        shell: bash
        working-directory: ores-stack
        run: cargo check --locked -p ores-stack-cli --all-targets
