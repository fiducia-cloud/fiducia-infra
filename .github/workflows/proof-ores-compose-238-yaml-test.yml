name: proof ORES compose YAML test 238

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-compose-238-yaml-test.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 11566c1dc4dffa271c73e3645a5af8cdb7b3599f

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact ores-compose head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"

      - name: Compile all targets and features
        run: cargo check --locked --all-targets --all-features

      - name: Re-run corrected YAML regression
        run: cargo test --locked --lib config_loader::tests::quoted_anchor_alias_and_merge_tokens_remain_strings -- --exact --nocapture

      - name: Full tests
        run: cargo test --locked --all-targets --all-features

      - name: Final exact-head guard
        if: always()
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Remove private credential rewrite
        if: always()
        shell: bash
        run: git config --global --unset-all "url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf" >/dev/null 2>&1 || true
