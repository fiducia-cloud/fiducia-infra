name: ores-middleware #271 exact-head certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-middleware-271-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET_SHA: '346b4963aa5794a10a82a37009c8be6cdc38db58'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact middleware head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-middleware
          git -C ores-middleware remote add origin https://github.com/ORESoftware/ores-middleware.git
          git -C ores-middleware fetch --depth=1 origin "$TARGET_SHA"
          git -C ores-middleware checkout --detach FETCH_HEAD
          test "$(git -C ores-middleware rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C ores-middleware status --porcelain)" = ""
      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
      - name: Certify edge_minimal ingress authority
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check src/rust/src/hosts/edge_minimal_local.rs src/rust/src/provider_api.rs
          cargo check --manifest-path src/rust/Cargo.toml --all-targets
          cargo test --manifest-path src/rust/Cargo.toml edge_minimal -- --nocapture
          cargo clippy --manifest-path src/rust/Cargo.toml --all-targets -- -D warnings
          git diff --check
