# CI that validates the infra without touching real clusters: renderer self-tests,
# a topology staleness check, a kustomize build of every overlay, and terraform
# fmt/validate. The kind e2e job is workflow_dispatch-gated (needs a built image).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/ci.yml ./.github/workflows/cli-flags.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      # renderer self-tests
      - run: node --test tools/*.test.mjs
      # fail if the generated per-cluster inputs are stale vs topology.toml
      - run: node tools/render.mjs --check
      - run: node tools/render-vcluster-hetzner-e2e.mjs --check
      - run: node tools/render-hetzner-e2e.mjs --check
      # every overlay must still build — production, local kind, and the default
      # zero-new-server vCluster proof tier.
      - run: |
          for c in clusters/*/ kind/overlay vcluster/hetzner-e2e/clusters/*/ k3s/hetzner-e2e/clusters/*/; do
            echo "== $c =="
            kubectl kustomize "$c" >/dev/null
          done
      - name: Render opt-in cron observability stack
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/fiducia-cron-observability.yaml"
          kubectl kustomize observability/cron-stack > "$rendered"
          grep -q 'name: fiducia-otel-gateway' "$rendered"
          grep -q 'name: fiducia-prometheus' "$rendered"
          grep -q 'name: fiducia-loki' "$rendered"
          grep -q 'name: fiducia-tempo' "$rendered"
          grep -q 'name: fiducia-grafana' "$rendered"
          grep -q 'secretKeyRef:' "$rendered"
          if grep -nE 'image: .*:latest([[:space:]]|$)' "$rendered"; then
            echo 'cron observability stack must not use latest image tags' >&2
            exit 1
          fi
          if grep -niE '(password|secret):[[:space:]]+(admin|changeme|password)' "$rendered"; then
            echo 'literal bootstrap credentials are forbidden' >&2
            exit 1
          fi
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6
      - name: Render pinned vCluster chart profiles
        run: |
          set -e
          chart="$RUNNER_TEMP/vcluster-0.35.1.tgz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://charts.loft.sh/charts/vcluster-0.35.1.tgz --output "$chart"
          test "$(openssl dgst -sha256 "$chart" | awk '{print $NF}')" = \
            ec1db9e9faf2da674eba5df3594b9d209861ee8e5889be850a9bb60861158c5b
          for c in hetzner-fsn1 hetzner-nbg1 hetzner-hel1; do
            short=${c#hetzner-}
            out="/tmp/$c-vcluster.yaml"
            helm template "fiducia-$c" "$chart" \
              --namespace "fiducia-vc-$short" \
              --values vcluster/hetzner-e2e/values/common.yaml \
              --values "vcluster/hetzner-e2e/values/$c.yaml" \
              --set-string 'sync.fromHost.nodes.selector.labels.kubernetes\.io/hostname=dummy-node' \
              --set-string 'controlPlane.statefulSet.scheduling.nodeSelector.kubernetes\.io/hostname=dummy-node' \
              --include-crds | tee "$out" | openssl dgst -sha256
            if grep -nE '^[[:space:]]*type:[[:space:]]*(NodePort|LoadBalancer)[[:space:]]*$' "$out"; then
              echo "forbidden host-exposed Service in $out" >&2
              exit 1
            fi
            grep -q 'ghcr.io/loft-sh/vcluster-oss:0.35.1@sha256:' "$out"
            node tools/validate-vcluster-manifest.mjs "$out" "fiducia-$c"
          done
      - name: Validate operator scripts
        run: bash -n scripts/hetzner-e2e-*.sh
      - name: Validate R2 scoped credential contract
        run: bash scripts/test-r2-scoped-creds.sh
      # Dependency advisories are a required supply-chain gate.
      - run: npm audit

  operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: operator
      - name: Format
        run: cargo fmt --manifest-path operator/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path operator/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path operator/Cargo.toml --all-targets --locked
      - name: Verify generated CRD
        run: cargo run --quiet --locked --manifest-path operator/Cargo.toml --bin crdgen | diff -u operator/config/crd.yaml -
      - name: Audit dependencies
        working-directory: operator
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  # Tier 2 provisioning IaC is never APPLIED in CI (that spends real money) — it is
  # only format-checked and validated. `terraform validate` needs `terraform init`
  # to fetch provider schemas, which is why this runs with network (GH-hosted).
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
      - name: fmt
        run: terraform -chdir=terraform fmt -recursive -check -diff
      - name: validate modules + Terraform environments
        run: |
          set -e
          for d in terraform/modules/*/ terraform/envs/e2e terraform/envs/hetzner-e2e; do
            echo "== validate $d =="
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

  # Local kind tier (Tier 1). Operator-run: it needs a built fiducia-node image, so
  # it is workflow_dispatch-gated, not on every push. Documents the standing-up
  # path the fiducia-e2e suite consumes; see docs/e2e.md.
  kind-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No `environment:` gate — the repo defines no deployment environments, so a
    # reference here would be ungated scaffolding. Add `environment: e2e` once a
    # protected environment of that name exists in repo settings.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: kind/multizone.yaml
          cluster_name: fiducia
      # A real run then builds+loads the fiducia-node image and applies kind/overlay
      # (FIDUCIA_LOAD_IMAGES=1 tools/kind-up.sh), then checks out fiducia-e2e and runs
      # `npm test` with FIDUCIA_E2E_BASE_URL=http://localhost:8090.
      - name: overlay builds
        run: kubectl kustomize kind/overlay >/dev/null
  prove-ores-err-trace-otel-persistence:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/prove-ores-err-trace-otel-persistence'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROOF_ROOT: tmp/proofs/ores-err-trace-persistence
      UPSTREAM_SHA: 33df304c75b45b4039e0f4ae891cb06b2cfbfed1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ores_err_trace
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ores_err_trace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ores_err_trace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact proof head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify copied upstream Git blobs
        run: |
          set -euo pipefail
          root="$PROOF_ROOT"
          test "$(git hash-object "$root/contracts/typespec/main.tsp")" = "c44a452c72d1024e8401e54436c2c9e5c95c0aa1"
          test "$(git hash-object "$root/contracts/json-schema/contract.schema.json")" = "7b8a1a6aa2f3a1bb439e5c4f42eb9f3f25e1a718"
          test "$(git hash-object "$root/sql/postgres/001_error_tracking.sql")" = "80b2251a0193a423afdcb11a922948881393d6ca"
          test "$(git hash-object "$root/sql/postgres/002_dd_next_parity.sql")" = "0f002709db9f35f615434fee740ec350f901fd7d"
          test "$(git hash-object "$root/sql/postgres/003_ingestion_hardening.sql")" = "af9ef3aef5916b2bd9e2da1347baee69cc002f44"
          test "$(git hash-object "$root/sql/postgres/004_record_error_trace_hardened.sql")" = "23b210755ba4629a0172eb0a7c32714e529f671b"
          test "$(git hash-object "$root/sql/postgres/005_recursive_redaction.sql")" = "153c895025cc219ddad3da90a7359f2f6757a29b"
          test "$(git hash-object "$root/sql/postgres/006_public_dedupe_result.sql")" = "03d3e432b2301ea1bd390cfc12376e7ec7bd73cb"
          test "$(git hash-object "$root/sql/postgres/007_otel_correlation.sql")" = "f6a707c5eba0eddd568ccab9b48de8260a93e287"
          test "$(git hash-object "$root/scripts/test-postgres.sh")" = "c09f47d91238185907944c8dbb2ebf2d166f18f9"
          test "$(git hash-object "$root/tests/postgres/public_dedupe_result.sql")" = "2ac212ef8b6d77d1ad682c960962e6248a1c7ce9"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Prove peer-authority correlation dependency
        uses: ORESoftware/typespec-json-schema-validator@db0f1e66b2a65cad43c909aa558ae00c6a91578c
        with:
          typespec: tmp/proofs/ores-err-trace-persistence/contracts/typespec/main.tsp
          schema: tmp/proofs/ores-err-trace-persistence/contracts/json-schema/contract.schema.json
          report: tmp/proofs/ores-err-trace-persistence/evidence/report.json
          contract_ir: tmp/proofs/ores-err-trace-persistence/evidence/contract-ir.json
          output_dir: tmp/proofs/ores-err-trace-persistence/evidence/generated
          int64_strategy: number

      - name: Install migrations in lexical order
        run: |
          set -euo pipefail
          for migration in "$PROOF_ROOT"/sql/postgres/*.sql; do
            echo "applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Reapply OTel migration to prove idempotent DDL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$PROOF_ROOT/sql/postgres/007_otel_correlation.sql"

      - name: Run hardened ingestion and recurrence tests
        run: bash "$PROOF_ROOT/scripts/test-postgres.sh"

      - name: Run public result boundary test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$PROOF_ROOT/tests/postgres/public_dedupe_result.sql"

      - name: Verify correlation constraints and indexes exist
        run: |
          set -euo pipefail
          constraints="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "select count(*) from pg_constraint where conname in ('error_tracking_parent_trace_shape_check','error_tracking_otel_shape_check')")"
          test "$constraints" = "2"
          indexes="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "select count(*) from pg_indexes where schemaname='public' and indexname in ('error_tracking_last_otel_trace_idx','error_tracking_parent_trace_ids_gin_idx','error_tracking_otel_trace_ids_gin_idx','error_tracking_otel_contexts_gin_idx')")"
          test "$indexes" = "4"

      - name: Retain persistence proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-err-trace-otel-persistence-${{ env.UPSTREAM_SHA }}
          path: tmp/proofs/ores-err-trace-persistence/evidence/
          if-no-files-found: error
