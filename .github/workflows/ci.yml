name: ci
on:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/3fa-backend.rs
  SOURCE_HEAD_SHA: e1152ef13193524f56cc45ad7cd55223b2ce9d3c
  SOURCE_BASE_SHA: 37c10d0217b281fa30f6e4adfb38052cc5ba963e

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out current source base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/3fa-backend.rs
          ref: 37c10d0217b281fa30f6e4adfb38052cc5ba963e
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
          show-progress: false

      - name: Semantically compose PR head onto current main
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git rev-parse HEAD)" = "$SOURCE_BASE_SHA"
          git config user.name 'funded-proof'
          git config user.email 'funded-proof@invalid.local'
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ORE_SOURCE_PAT" | base64 -w0)" fetch origin "$SOURCE_HEAD_SHA"
          git merge --no-ff --no-commit FETCH_HEAD
          changed="$(git diff --cached --name-only "$SOURCE_BASE_SHA")"
          test "$changed" = ".github/workflows/ores-lint-hook-contract.yml"
          git diff --cached --check
          grep -q 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .github/workflows/ores-lint-hook-contract.yml

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Configure scoped Cargo git authentication
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global net.git-fetch-with-cli true

      - name: Prove current-base merged Rust baseline
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo test --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Remove scoped Cargo authentication
        if: always()
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global --unset-all url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf || true
          git config --global --unset-all net.git-fetch-with-cli || true
