# CI that validates the infra without touching real clusters: renderer self-tests,
# a topology staleness check, a kustomize build of every overlay, and terraform
# fmt/validate. The kind e2e job is workflow_dispatch-gated (needs a built image).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/ci.yml ./.github/workflows/cli-flags.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      # renderer self-tests
      - run: node --test tools/*.test.mjs
      # fail if the generated per-cluster inputs are stale vs topology.toml
      - run: node tools/render.mjs --check
      - run: node tools/render-vcluster-hetzner-e2e.mjs --check
      - run: node tools/render-hetzner-e2e.mjs --check
      # every overlay must still build — production, local kind, and the default
      # zero-new-server vCluster proof tier.
      - run: |
          for c in clusters/*/ kind/overlay vcluster/hetzner-e2e/clusters/*/ k3s/hetzner-e2e/clusters/*/; do
            echo "== $c =="
            kubectl kustomize "$c" >/dev/null
          done
      - name: Render opt-in cron observability stack
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/fiducia-cron-observability.yaml"
          kubectl kustomize observability/cron-stack > "$rendered"
          grep -q 'name: fiducia-otel-gateway' "$rendered"
          grep -q 'name: fiducia-prometheus' "$rendered"
          grep -q 'name: fiducia-loki' "$rendered"
          grep -q 'name: fiducia-tempo' "$rendered"
          grep -q 'name: fiducia-grafana' "$rendered"
          grep -q 'secretKeyRef:' "$rendered"
          if grep -nE 'image: .*:latest([[:space:]]|$)' "$rendered"; then
            echo 'cron observability stack must not use latest image tags' >&2
            exit 1
          fi
          if grep -niE '(password|secret):[[:space:]]+(admin|changeme|password)' "$rendered"; then
            echo 'literal bootstrap credentials are forbidden' >&2
            exit 1
          fi
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6
      - name: Render pinned vCluster chart profiles
        run: |
          set -e
          chart="$RUNNER_TEMP/vcluster-0.35.1.tgz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://charts.loft.sh/charts/vcluster-0.35.1.tgz --output "$chart"
          test "$(openssl dgst -sha256 "$chart" | awk '{print $NF}')" = \
            ec1db9e9faf2da674eba5df3594b9d209861ee8e5889be850a9bb60861158c5b
          for c in hetzner-fsn1 hetzner-nbg1 hetzner-hel1; do
            short=${c#hetzner-}
            out="/tmp/$c-vcluster.yaml"
            helm template "fiducia-$c" "$chart" \
              --namespace "fiducia-vc-$short" \
              --values vcluster/hetzner-e2e/values/common.yaml \
              --values "vcluster/hetzner-e2e/values/$c.yaml" \
              --set-string 'sync.fromHost.nodes.selector.labels.kubernetes\.io/hostname=dummy-node' \
              --set-string 'controlPlane.statefulSet.scheduling.nodeSelector.kubernetes\.io/hostname=dummy-node' \
              --include-crds | tee "$out" | openssl dgst -sha256
            if grep -nE '^[[:space:]]*type:[[:space:]]*(NodePort|LoadBalancer)[[:space:]]*$' "$out"; then
              echo "forbidden host-exposed Service in $out" >&2
              exit 1
            fi
            grep -q 'ghcr.io/loft-sh/vcluster-oss:0.35.1@sha256:' "$out"
            node tools/validate-vcluster-manifest.mjs "$out" "fiducia-$c"
          done
      - name: Validate operator scripts
        run: bash -n scripts/hetzner-e2e-*.sh
      - name: Validate R2 scoped credential contract
        run: bash scripts/test-r2-scoped-creds.sh
      # Dependency advisories are a required supply-chain gate.
      - run: npm audit

  operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: operator
      - name: Format
        run: cargo fmt --manifest-path operator/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path operator/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path operator/Cargo.toml --all-targets --locked
      - name: Verify generated CRD
        run: cargo run --quiet --locked --manifest-path operator/Cargo.toml --bin crdgen | diff -u operator/config/crd.yaml -
      - name: Audit dependencies
        working-directory: operator
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  # Tier 2 provisioning IaC is never APPLIED in CI (that spends real money) — it is
  # only format-checked and validated. `terraform validate` needs `terraform init`
  # to fetch provider schemas, which is why this runs with network (GH-hosted).
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
      - name: fmt
        run: terraform -chdir=terraform fmt -recursive -check -diff
      - name: validate modules + Terraform environments
        run: |
          set -e
          for d in terraform/modules/*/ terraform/envs/e2e terraform/envs/hetzner-e2e; do
            echo "== validate $d =="
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

  # Local kind tier (Tier 1). Operator-run: it needs a built fiducia-node image, so
  # it is workflow_dispatch-gated, not on every push. Documents the standing-up
  # path the fiducia-e2e suite consumes; see docs/e2e.md.
  kind-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No `environment:` gate — the repo defines no deployment environments, so a
    # reference here would be ungated scaffolding. Add `environment: e2e` once a
    # protected environment of that name exists in repo settings.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: kind/multizone.yaml
          cluster_name: fiducia
      # A real run then builds+loads the fiducia-node image and applies kind/overlay
      # (FIDUCIA_LOAD_IMAGES=1 tools/kind-up.sh), then checks out fiducia-e2e and runs
      # `npm test` with FIDUCIA_E2E_BASE_URL=http://localhost:8090.
      - name: overlay builds
        run: kubectl kustomize kind/overlay >/dev/null
  prove-ores-err-trace-correlation:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/prove-ores-err-trace-correlation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROOF_ROOT: tmp/proofs/ores-err-trace-correlation
      TJSV_SHA: db0f1e66b2a65cad43c909aa558ae00c6a91578c
      UPSTREAM_SHA: cad7d33b7b24cd33356975a43f37d23032ce742d
    steps:
      - name: Check out exact proof head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify copied upstream Git blobs
        run: |
          set -euo pipefail
          root="$PROOF_ROOT"
          test "$(git hash-object "$root/contracts/json-schema/contract.schema.json")" = "eb6defa50b7809798ff003280e0267959a78063d"
          test "$(git hash-object "$root/contracts/typespec/main.tsp")" = "fb0ef53a990f6a60993bbfdad84e72515015b4dd"
          test "$(git hash-object "$root/scripts/generate-storage-projections.mjs")" = "ab5dc743f2c03f5f84e2a4dd21c2af0a42ff898e"
          test "$(git hash-object "$root/src/gleam/gleam.toml")" = "62ba6202454f8ec09ea514ee23da656e4a39a507"
          test "$(git hash-object "$root/src/gleam/src/ores_err_trace.gleam")" = "55ef4debc40fa09836ab0efad44f8139996c0798"
          test "$(git hash-object "$root/src/gleam/src/ores_err_trace_ffi.erl")" = "97bc4ac384c3a0e6ca4199d428948111e5e9be58"
          test "$(git hash-object "$root/src/gleam/test/ores_err_trace_test.gleam")" = "39d7ff16bb97ef0fff552d8da85178ca35edd598"
          test "$(git hash-object "$root/src/golang/errtrace.go")" = "1cffbf14d574bd113a54e5f8521808b401b3aef5"
          test "$(git hash-object "$root/src/golang/errtrace_test.go")" = "e2961c68c1b9c97479393f2275c8108c6a23d674"
          test "$(git hash-object "$root/src/golang/go.mod")" = "5ab8e82275458a9247a04d59109a743ec7e8901e"
          test "$(git hash-object "$root/src/golang/public_api_test.go")" = "8cc7f398afb49aeab23cae8425969338e1ae62aa"
          test "$(git hash-object "$root/src/rust/Cargo.toml")" = "cc1776f3f1775bc23e0288891bf5541b79e99a7b"
          test "$(git hash-object "$root/src/rust/src/contract.rs")" = "6abb826d9122491b82115eb54f752c7ff657a103"
          test "$(git hash-object "$root/src/rust/src/lib.rs")" = "2acd762283b1a495e8e64a4f3e2907e4dab811fa"
          test "$(git hash-object "$root/src/rust/tests/contract_surface.rs")" = "bd0741d57140f7638b85c45db414805c0066b0e0"
          test "$(git hash-object "$root/src/rust/tests/dd_compat.rs")" = "0c872aed40daa0d612155935abf83f3dd4168d63"
          test "$(git hash-object "$root/src/rust/tests/parity.rs")" = "aae8f2d25bd9c16f2b56535eb53f4de6082e98ef"
          test "$(git hash-object "$root/src/typescript/package.json")" = "69883bc304892d99124bc12a5a1f8ae65bf25f69"
          test "$(git hash-object "$root/src/typescript/src/index.test.ts")" = "8f2a09d92ef4277bec8e78b7e28430c937bd98fb"
          test "$(git hash-object "$root/src/typescript/src/index.ts")" = "a032c467567ab45f2b3ca962f750b5e121132bd4"
          test "$(git hash-object "$root/src/typescript/src/public-surface.typecheck.ts")" = "cdebbf338ea94f04cc86682ab964140d5bf42ad0"
          test "$(git hash-object "$root/src/typescript/tsconfig.json")" = "84cf63f92553d692e53167f3a4ea2188b8f079eb"
          test "$(git hash-object "$root/test/storage-projections.test.mjs")" = "f253fd55782b7fbec3813db13b7bc7160417b1e9"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Build parity receipt and admissible Contract IR
        uses: ORESoftware/typespec-json-schema-validator@db0f1e66b2a65cad43c909aa558ae00c6a91578c
        with:
          typespec: tmp/proofs/ores-err-trace-correlation/contracts/typespec/main.tsp
          schema: tmp/proofs/ores-err-trace-correlation/contracts/json-schema/contract.schema.json
          report: tmp/proofs/ores-err-trace-correlation/evidence/report.json
          contract_ir: tmp/proofs/ores-err-trace-correlation/evidence/contract-ir.json
          output_dir: tmp/proofs/ores-err-trace-correlation/evidence/generated
          int64_strategy: number

      - name: Generate exact contract storage projections
        run: |
          node "$PROOF_ROOT/scripts/generate-storage-projections.mjs"             --contract-ir="$PROOF_ROOT/evidence/contract-ir.json"             --out="$PROOF_ROOT/generated/storage"
          node "$PROOF_ROOT/scripts/generate-storage-projections.mjs"             --contract-ir="$PROOF_ROOT/evidence/contract-ir.json"             --out="$PROOF_ROOT/generated/storage" --check
          grep -q '"parent_trace_id" text' "$PROOF_ROOT/generated/storage/postgres/001_ores_err_trace.sql"
          grep -q '"otel_trace_id" text' "$PROOF_ROOT/generated/storage/postgres/001_ores_err_trace.sql"
          grep -q '"otel_span_id" text' "$PROOF_ROOT/generated/storage/postgres/001_ores_err_trace.sql"
          grep -q 'ores_err_trace_events_otel_trace_idx' "$PROOF_ROOT/generated/storage/postgres/001_ores_err_trace.sql"

      - name: Run storage projection regression suite
        run: node --test "$PROOF_ROOT/test/storage-projections.test.mjs"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Format and test Rust
        working-directory: tmp/proofs/ores-err-trace-correlation/src/rust
        run: |
          cargo fmt --all
          cargo test --all-targets

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23.x'
          cache: false
      - name: Format and test Go
        working-directory: tmp/proofs/ores-err-trace-correlation/src/golang
        run: |
          gofmt -w .
          go vet ./...
          go test ./...

      - name: Test TypeScript
        working-directory: tmp/proofs/ores-err-trace-correlation/src/typescript
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27'
          gleam-version: '1.14.0'
          rebar3-version: '3'
      - name: Test Gleam
        working-directory: tmp/proofs/ores-err-trace-correlation/src/gleam
        run: gleam test

      - name: Retain correlation proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-err-trace-correlation-${{ env.UPSTREAM_SHA }}
          path: |
            tmp/proofs/ores-err-trace-correlation/evidence/
            tmp/proofs/ores-err-trace-correlation/generated/storage/
            tmp/proofs/ores-err-trace-correlation/src/rust/src/
            tmp/proofs/ores-err-trace-correlation/src/rust/tests/
            tmp/proofs/ores-err-trace-correlation/src/golang/
            tmp/proofs/ores-err-trace-correlation/src/golang/
          if-no-files-found: error
