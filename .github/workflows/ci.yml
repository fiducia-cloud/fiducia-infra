name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_REPO: ORESoftware/ores-websocket
      SOURCE_BRANCH: fix/zpkg-universal-language-20260922
      SOURCE_SHA: 4cb985fb2a095c0976276d3a35493ca179f23300
      SOURCE_MAIN_SHA: 37ff2dc38878dc6e85accb562ec5c07652853c65
      ZED_CLI_REVISION: 69fce161e456d758459cab5d3a6441f599769bfa
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Require scoped source credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-websocket
          ref: 4cb985fb2a095c0976276d3a35493ca179f23300
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Guard reviewed package delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")" = "$SOURCE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_MAIN_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.zpkg.toml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'conformance/check.sh'
          git diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
          grep -F 'language = "universal"' .zpkg.toml
          ! grep -F 'language = "multi"' .zpkg.toml
          ! grep -Eq '^\[targets\.' .zpkg.toml
          grep -F 'test = "sh conformance/check.sh"' .zpkg.toml
          grep -F '"oresoftware/typespec-json-schema-validator" = "^0.1.1"' .zpkg.toml
          grep -F 'npm install --ignore-scripts --no-audit --no-fund --package-lock=false' conformance/check.sh
          grep -F 'npm rebuild @oresoftware/f2e --ignore-scripts=false --no-audit --no-fund' conformance/check.sh

      - name: Install certified Zed CLI
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          rewrite="url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf"
          git config --global "$rewrite" "https://github.com/"
          cargo install --git https://github.com/zed-pkg/zed-cli --rev "$ZED_CLI_REVISION" --locked zed-cli
          test "$(zed --version | awk '{print $2}')" = "0.3.0"
          git config --global --unset-all "$rewrite" || true

      - name: Zed package validation and materialization
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
          ZED_PKG_GITHUB_TOKEN: ${{ secrets.ORE_SOURCE_PAT }}
          ZED_PKG_REGISTRY: http://127.0.0.1:9
          ZED_PKG_SOURCE_FALLBACK: 'true'
          ZED_PKG_SOURCE_FALLBACK_ALLOW_LOOPBACK: 'true'
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          rm -rf .vendor .zed zed_modules .zpkg.lock node_modules dist artifacts
          npm install --ignore-scripts --no-audit --no-fund
          zed validate
          zed install --allow-build --install-mode copy
          zed validate --require-lock
          test -x .vendor/.zed/.bin/tjsv || test -x .zed/.bin/tjsv || test -x zed_modules/.bin/tjsv
          zed run tjsv --help >/dev/null
          echo ZED_PACKAGE_MATERIALIZATION_PASS

      - name: Rust 1.88 source checks
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings

      - name: Node 22.9 checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.9.0

      - name: TypeScript and contract checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm rebuild @oresoftware/f2e --ignore-scripts=false --no-audit --no-fund
          test -s node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node
          npm run check
          sh conformance/check.sh

      - name: Final immutable source guard
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          rm -rf .vendor .zed zed_modules .zpkg.lock artifacts node_modules dist
          git reset --hard "$SOURCE_SHA" >/dev/null
          git clean -ffd >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "::add-mask::$ORE_SOURCE_PAT"
          branch_sha=$(curl -fsSL -H "Authorization: Bearer ${ORE_SOURCE_PAT}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${SOURCE_REPO}/git/ref/heads/${SOURCE_BRANCH}" | jq -r '.object.sha')
          main_sha=$(curl -fsSL -H "Authorization: Bearer ${ORE_SOURCE_PAT}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${SOURCE_REPO}/git/ref/heads/main" | jq -r '.object.sha')
          test "$branch_sha" = "$SOURCE_SHA"
          test "$main_sha" = "$SOURCE_MAIN_SHA"
          git diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
