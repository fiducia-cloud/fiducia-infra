name: ci
on:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/3FA-desktop.rs
  SOURCE_BASE: 9f06b1fa533b549b7cbe59efd40ae89938690672
  SOURCE_HEAD: d6e49a1b423efd2da163d80aa70fd456d9ae67da

jobs:
  certify-action-bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure private source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch immutable source head and base
        shell: bash
        run: |
          set -euo pipefail
          git init subject
          git -C subject remote add origin https://github.com/${SOURCE_REPO}.git
          git -C subject fetch --no-tags origin "$SOURCE_HEAD" "$SOURCE_BASE"
          git -C subject checkout --detach "$SOURCE_HEAD"
          test "$(git -C subject rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C subject merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          mapfile -t changed < <(git -C subject diff --name-only "$SOURCE_BASE"..HEAD)
          printf 'changed: %s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/security.yml'
          git -C subject diff --check "$SOURCE_BASE"..HEAD
          git -C subject diff --unified=0 "$SOURCE_BASE"..HEAD -- .github/workflows/security.yml | tee /tmp/security.patch
          grep -Fq -- '-      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2' /tmp/security.patch
          grep -Fq -- '+      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2' /tmp/security.patch
      - name: Validate changed workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./subject/.github/workflows/security.yml
      - name: Execute exact updated install-action pin
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73
        with:
          tool: cargo-audit@0.22.2
      - name: Prove cargo-audit installation
        run: cargo audit --version
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt
      - name: Source smoke
        working-directory: subject
        run: |
          cargo fmt --check
          cargo check --locked --no-default-features
          cargo test --locked --no-default-features
      - name: Final source immutability
        working-directory: subject
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
