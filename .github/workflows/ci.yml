name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-and-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: 16a335e532958b720f206b2bfed713ea5e5141bd
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "16a335e532958b720f206b2bfed713ea5e5141bd"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Install Linux helpers and admit outer user namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo NEEDRESTART_MODE=a apt-get install -y apparmor-profiles apparmor-utils bubblewrap slirp4netns iproute2 iptables shellcheck curl
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || printf '0')" == '1' ]]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$profile"
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            # The source intentionally creates one outer supervisor user namespace
            # before Bubblewrap. Current hosted Ubuntu blocks /usr/bin/unshare at
            # the host AppArmor layer, so admit that documented host prerequisite
            # for the functional proof instead of changing sandbox source behavior.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true
      - name: Shell syntax
        run: |
          bash -n scripts/linux/ores-proc-isolate.sh
          bash -n scripts/macos/ores-proc-isolate.sh
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/linux/ores-proc-isolate.sh scripts/macos/ores-proc-isolate.sh
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo run --quiet -- check --config .ores-proc-isolation.yaml
      - name: Doctor Linux
        if: runner.os == 'Linux'
        run: cargo run --quiet -- doctor --config .ores-proc-isolation.yaml
      - name: Doctor strict external fails closed on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          cargo run --quiet -- doctor --config .ores-proc-isolation.yaml
          rc=$?
          set -e
          test "$rc" -eq 2
      - name: Verify tracked source remained clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  sandbox-smoke-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: 16a335e532958b720f206b2bfed713ea5e5141bd
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "16a335e532958b720f206b2bfed713ea5e5141bd"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - name: Install helpers and admit outer user namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo NEEDRESTART_MODE=a apt-get install -y apparmor-profiles apparmor-utils bubblewrap slirp4netns iproute2 iptables curl
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || printf '0')" == '1' ]]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$profile"
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true
      - name: Build CLI and Rust fixture
        run: cargo build --quiet --examples --bins
      - name: Write strict smoke policy
        run: |
          cat > /tmp/ores-pi-smoke.yaml <<'YAML'
          version: 1
          defaults:
            group: no-net
          groups:
            no-net:
              network:
                mode: none
            external:
              network:
                mode: external
                deny_loopback: true
                deny_private_networks: true
          processes:
            true:
              group: no-net
              command: [/usr/bin/true]
            passwd:
              group: no-net
              command: [/usr/bin/cat, /etc/passwd]
            internet:
              group: external
              command: [/usr/bin/curl, --fail, --silent, --show-error, --head, https://example.com]
            curl-flex:
              group: external
              command: [/usr/bin/curl, --fail, --silent, --show-error]
          YAML
      - name: Synthetic filesystem works
        run: target/debug/ores-proc-isolation run true --config /tmp/ores-pi-smoke.yaml
      - name: Host file read is denied
        run: |
          if target/debug/ores-proc-isolation run passwd --config /tmp/ores-pi-smoke.yaml; then exit 1; fi
      - name: External internet egress works
        run: target/debug/ores-proc-isolation run internet --config /tmp/ores-pi-smoke.yaml
      - name: Host loopback is denied
        shell: bash
        run: |
          target/debug/examples/loopback_fixture 127.0.0.1:18080 >/tmp/ores-pi-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:18080 >/dev/null
          if target/debug/ores-proc-isolation run curl-flex --config /tmp/ores-pi-smoke.yaml -- http://127.0.0.1:18080; then exit 1; fi
      - name: Host non-loopback interface is denied
        shell: bash
        run: |
          host_ip=''
          while read -r _ _ family cidr _; do
            if [[ "$family" == 'inet' ]]; then host_ip=${cidr%%/*}; break; fi
          done < <(ip -o -4 addr show scope global)
          test -n "$host_ip"
          target/debug/examples/loopback_fixture 0.0.0.0:18081 >/tmp/ores-pi-host-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          curl --fail --silent "http://${host_ip}:18081" >/dev/null
          if target/debug/ores-proc-isolation run curl-flex --config /tmp/ores-pi-smoke.yaml -- "http://${host_ip}:18081"; then exit 1; fi

  sandbox-smoke-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: 16a335e532958b720f206b2bfed713ea5e5141bd
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "16a335e532958b720f206b2bfed713ea5e5141bd"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - name: Build CLI and Rust fixture
        run: cargo build --quiet --examples --bins
      - name: Write strict smoke policy
        run: |
          cat > /tmp/ores-pi-smoke.yaml <<'YAML'
          version: 1
          defaults:
            group: no-net
          groups:
            no-net:
              network:
                mode: none
            external-strict:
              network:
                mode: external
                deny_loopback: true
                deny_private_networks: true
          processes:
            true:
              group: no-net
              command: [/usr/bin/true]
            passwd:
              group: no-net
              command: [/bin/cat, /etc/passwd]
            localhost:
              group: no-net
              command: [/usr/bin/curl, --fail, --silent, --show-error, http://127.0.0.1:18080]
            internet-strict:
              group: external-strict
              command: [/usr/bin/curl, --fail, --silent, --show-error, --head, https://example.com]
          YAML
      - name: Seatbelt can launch no-network isolated process
        run: target/debug/ores-proc-isolation run true --config /tmp/ores-pi-smoke.yaml
      - name: Host file read is denied
        run: |
          if target/debug/ores-proc-isolation run passwd --config /tmp/ores-pi-smoke.yaml; then exit 1; fi
      - name: Host loopback is denied in no-network mode
        shell: bash
        run: |
          target/debug/examples/loopback_fixture 127.0.0.1:18080 >/tmp/ores-pi-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:18080 >/dev/null
          if target/debug/ores-proc-isolation run localhost --config /tmp/ores-pi-smoke.yaml; then exit 1; fi
      - name: Strict external mode fails closed on macOS
        run: |
          if target/debug/ores-proc-isolation run internet-strict --config /tmp/ores-pi-smoke.yaml; then exit 1; fi
