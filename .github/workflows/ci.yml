name: ci
on:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/3FA-desktop.rs
  SOURCE_BASE: 9f06b1fa533b549b7cbe59efd40ae89938690672
  SOURCE_HEAD: 324553001fad5c5ddf40599883e625e28a38dd4d

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure private source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch immutable source head and base
        shell: bash
        run: |
          set -euo pipefail
          git init subject
          git -C subject remote add origin https://github.com/${SOURCE_REPO}.git
          git -C subject fetch --no-tags origin "$SOURCE_HEAD" "$SOURCE_BASE"
          git -C subject checkout --detach "$SOURCE_HEAD"
          test "$(git -C subject rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C subject merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          mapfile -t changed < <(git -C subject diff --name-only "$SOURCE_BASE"..HEAD)
          printf 'changed: %s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = Cargo.lock
          git -C subject diff --check "$SOURCE_BASE"..HEAD
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Formal models
        working-directory: subject
        run: |
          python3 formal/session_model.py
          python3 formal/app_lifecycle_model.py
          printf '%s\n' '{"op":"replay","events":[{"op":"unlock"},{"op":"advance","seconds":90},{"op":"poll"}]}' | python3 formal/session_model.py --json-stdin
      - name: Format
        working-directory: subject
        run: cargo fmt --check
      - name: Headless compile and tests
        working-directory: subject
        run: |
          cargo check --locked --no-default-features
          cargo test --locked --no-default-features
      - name: Interface provenance
        working-directory: subject
        run: |
          python3 scripts/check_vendored_interfaces.py
          cargo test --locked --no-default-features --test interface_pin
      - name: SOPS release policy
        working-directory: subject
        run: python3 scripts/verify-sops-release-policy.py .sops.yaml prod
      - name: Final source immutability
        working-directory: subject
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

  gui-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Configure private source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch immutable source head
        shell: bash
        run: |
          set -euo pipefail
          git init subject
          git -C subject remote add origin https://github.com/${SOURCE_REPO}.git
          git -C subject fetch --no-tags origin "$SOURCE_HEAD"
          git -C subject checkout --detach "$SOURCE_HEAD"
          test "$(git -C subject rev-parse HEAD)" = "$SOURCE_HEAD"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy
      - name: GUI compile, Clippy, tests
        working-directory: subject
        run: |
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Final source immutability
        working-directory: subject
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
