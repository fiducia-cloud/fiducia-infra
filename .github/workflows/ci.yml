# CI that validates the infra without touching real clusters: renderer self-tests,
# a topology staleness check, a kustomize build of every overlay, and terraform
# fmt/validate. The kind e2e job is workflow_dispatch-gated (needs a built image).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/ci.yml ./.github/workflows/cli-flags.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      # renderer self-tests
      - run: node --test tools/*.test.mjs
      # fail if the generated per-cluster inputs are stale vs topology.toml
      - run: node tools/render.mjs --check
      - run: node tools/render-vcluster-hetzner-e2e.mjs --check
      - run: node tools/render-hetzner-e2e.mjs --check
      # every overlay must still build — production, local kind, and the default
      # zero-new-server vCluster proof tier.
      - run: |
          for c in clusters/*/ kind/overlay vcluster/hetzner-e2e/clusters/*/ k3s/hetzner-e2e/clusters/*/; do
            echo "== $c =="
            kubectl kustomize "$c" >/dev/null
          done
      - name: Render opt-in cron observability stack
        run: |
          set -euo pipefail
          rendered="$RUNNER_TEMP/fiducia-cron-observability.yaml"
          kubectl kustomize observability/cron-stack > "$rendered"
          grep -q 'name: fiducia-otel-gateway' "$rendered"
          grep -q 'name: fiducia-prometheus' "$rendered"
          grep -q 'name: fiducia-loki' "$rendered"
          grep -q 'name: fiducia-tempo' "$rendered"
          grep -q 'name: fiducia-grafana' "$rendered"
          grep -q 'secretKeyRef:' "$rendered"
          if grep -nE 'image: .*:latest([[:space:]]|$)' "$rendered"; then
            echo 'cron observability stack must not use latest image tags' >&2
            exit 1
          fi
          if grep -niE '(password|secret):[[:space:]]+(admin|changeme|password)' "$rendered"; then
            echo 'literal bootstrap credentials are forbidden' >&2
            exit 1
          fi
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6
      - name: Render pinned vCluster chart profiles
        run: |
          set -e
          chart="$RUNNER_TEMP/vcluster-0.35.1.tgz"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            https://charts.loft.sh/charts/vcluster-0.35.1.tgz --output "$chart"
          test "$(openssl dgst -sha256 "$chart" | awk '{print $NF}')" = \
            ec1db9e9faf2da674eba5df3594b9d209861ee8e5889be850a9bb60861158c5b
          for c in hetzner-fsn1 hetzner-nbg1 hetzner-hel1; do
            short=${c#hetzner-}
            out="/tmp/$c-vcluster.yaml"
            helm template "fiducia-$c" "$chart" \
              --namespace "fiducia-vc-$short" \
              --values vcluster/hetzner-e2e/values/common.yaml \
              --values "vcluster/hetzner-e2e/values/$c.yaml" \
              --set-string 'sync.fromHost.nodes.selector.labels.kubernetes\.io/hostname=dummy-node' \
              --set-string 'controlPlane.statefulSet.scheduling.nodeSelector.kubernetes\.io/hostname=dummy-node' \
              --include-crds | tee "$out" | openssl dgst -sha256
            if grep -nE '^[[:space:]]*type:[[:space:]]*(NodePort|LoadBalancer)[[:space:]]*$' "$out"; then
              echo "forbidden host-exposed Service in $out" >&2
              exit 1
            fi
            grep -q 'ghcr.io/loft-sh/vcluster-oss:0.35.1@sha256:' "$out"
            node tools/validate-vcluster-manifest.mjs "$out" "fiducia-$c"
          done
      - name: Validate operator scripts
        run: bash -n scripts/hetzner-e2e-*.sh
      - name: Validate R2 scoped credential contract
        run: bash scripts/test-r2-scoped-creds.sh
      # Dependency advisories are a required supply-chain gate.
      - run: npm audit

  operator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # pinned action
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: operator
      - name: Format
        run: cargo fmt --manifest-path operator/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path operator/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path operator/Cargo.toml --all-targets --locked
      - name: Verify generated CRD
        run: cargo run --quiet --locked --manifest-path operator/Cargo.toml --bin crdgen | diff -u operator/config/crd.yaml -
      - name: Audit dependencies
        working-directory: operator
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  # Tier 2 provisioning IaC is never APPLIED in CI (that spends real money) — it is
  # only format-checked and validated. `terraform validate` needs `terraform init`
  # to fetch provider schemas, which is why this runs with network (GH-hosted).
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
      - name: fmt
        run: terraform -chdir=terraform fmt -recursive -check -diff
      - name: validate modules + Terraform environments
        run: |
          set -e
          for d in terraform/modules/*/ terraform/envs/e2e terraform/envs/hetzner-e2e; do
            echo "== validate $d =="
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

  # Local kind tier (Tier 1). Operator-run: it needs a built fiducia-node image, so
  # it is workflow_dispatch-gated, not on every push. Documents the standing-up
  # path the fiducia-e2e suite consumes; see docs/e2e.md.
  kind-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No `environment:` gate — the repo defines no deployment environments, so a
    # reference here would be ungated scaffolding. Add `environment: e2e` once a
    # protected environment of that name exists in repo settings.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: kind/multizone.yaml
          cluster_name: fiducia
      # A real run then builds+loads the fiducia-node image and applies kind/overlay
      # (FIDUCIA_LOAD_IMAGES=1 tools/kind-up.sh), then checks out fiducia-e2e and runs
      # `npm test` with FIDUCIA_E2E_BASE_URL=http://localhost:8090.
      - name: overlay builds
        run: kubectl kustomize kind/overlay >/dev/null

  proof-ores-local-isolation:
    if: github.event_name == 'pull_request' && github.head_ref == 'proof/ores-local-isolation-20260925'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PROC_SHA: ddd1ef79ccd4c7ad18567851096f617960883844
      COMPOSE_SHA: 7eb58d3ccba54e5a185a828d22a679cc297caa70
      COMPOSE_BASE_SHA: fbfad966f9770a9a8d3895880523280324b4ddc6
    steps:
      - name: Checkout exact ores-compose base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_BASE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: compose-base
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact ores-compose head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.COMPOSE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: compose
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact process-isolation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ env.PROC_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: isolation
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact heads
        run: |
          test "$(git -C compose-base rev-parse HEAD)" = "$COMPOSE_BASE_SHA"
          test "$(git -C compose rev-parse HEAD)" = "$COMPOSE_SHA"
          test "$(git -C isolation rev-parse HEAD)" = "$PROC_SHA"
      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Verify process-isolation exact head
        working-directory: isolation
        run: |
          set -euo pipefail
          rustup default 1.88.0
          bash -n scripts/linux/ores-proc-isolate.sh
          bash -n scripts/macos/ores-proc-isolate.sh
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --quiet --examples --bins
      - name: Verify compose exact head against repository baselines
        shell: bash
        run: |
          set -euo pipefail
          rustup default 1.98.1

          set +e
          (cd compose-base && cargo fmt --all -- --check) >"$RUNNER_TEMP/compose-base-fmt.log" 2>&1
          base_fmt=$?
          (cd compose && cargo fmt --all -- --check) >"$RUNNER_TEMP/compose-head-fmt.log" 2>&1
          head_fmt=$?
          set -e
          echo "base_fmt=$base_fmt head_fmt=$head_fmt"
          if [[ "$base_fmt" -eq 0 && "$head_fmt" -ne 0 ]]; then
            cat "$RUNNER_TEMP/compose-head-fmt.log" >&2
            echo "PR introduced repo-wide rustfmt failure over a green base" >&2
            exit 1
          fi

          set +e
          (cd compose-base && cargo clippy --all-targets --all-features -- -D warnings) >"$RUNNER_TEMP/compose-base-clippy.log" 2>&1
          base_clippy=$?
          (cd compose && cargo clippy --all-targets --all-features -- -D warnings) >"$RUNNER_TEMP/compose-head-clippy.log" 2>&1
          head_clippy=$?
          set -e
          echo "base_clippy=$base_clippy head_clippy=$head_clippy"
          if [[ "$base_clippy" -eq 0 && "$head_clippy" -ne 0 ]]; then
            cat "$RUNNER_TEMP/compose-head-clippy.log" >&2
            echo "PR introduced strict-Clippy failure over a green base" >&2
            exit 1
          fi

          cd compose
          cargo check --all-targets --all-features
          cargo test --all-targets --all-features --no-run
          cargo test --all-targets --all-features generated_isolation_policy_is_private_same_user_local_profile
          cargo test --all-targets --all-features path_grants_reject_broad_home_entries_but_allow_known_tool_bins
          cargo test --all-targets --all-features revalidates_working_directory
          cargo build --bin ores-compose
      - name: Prove same-user Seatbelt containment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ores-proof-work /tmp/ores-proof-outside /tmp/ores-proof-outside.txt
          mkdir -p /tmp/ores-proof-work /tmp/ores-proof-outside
          ln -s /tmp/ores-proof-outside /tmp/ores-proof-work/escape
          cat >/tmp/ores-proof-policy.yaml <<'YAML'
          version: 1
          defaults:
            group: local
          groups:
            local:
              filesystem:
                read_only:
                  - /usr/bin
                read_write:
                  - /tmp/ores-proof-work
              network:
                mode: local
                deny_loopback: false
                deny_private_networks: false
            none:
              network:
                mode: none
          processes:
            identity:
              group: none
              command: [/usr/bin/id, -u]
            host-probe:
              group: none
              command: [/bin/kill, -0]
            inside:
              group: local
              command: [/bin/sh, -c, "printf ok > inside.txt"]
              working_directory: /tmp/ores-proof-work
            outside:
              group: local
              command: [/bin/sh, -c, "printf denied > /tmp/ores-proof-outside.txt"]
              working_directory: /tmp/ores-proof-work
            symlink:
              group: local
              command: [/bin/sh, -c, "printf denied > escape/escaped.txt"]
              working_directory: /tmp/ores-proof-work
            local-curl:
              group: local
              command: [/usr/bin/curl, --fail, --silent, http://127.0.0.1:18082]
          YAML
          actual="$(isolation/target/debug/ores-proc-isolation run identity --config /tmp/ores-proof-policy.yaml)"
          test "$actual" = "$(id -u)"
          isolation/target/debug/ores-proc-isolation run inside --config /tmp/ores-proof-policy.yaml
          test "$(cat /tmp/ores-proof-work/inside.txt)" = ok
          if isolation/target/debug/ores-proc-isolation run outside --config /tmp/ores-proof-policy.yaml; then
            echo "outside workspace write unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -e /tmp/ores-proof-outside.txt
          if isolation/target/debug/ores-proc-isolation run symlink --config /tmp/ores-proof-policy.yaml; then
            echo "symlink workspace escape unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -e /tmp/ores-proof-outside/escaped.txt
          isolation/target/debug/examples/loopback_fixture 127.0.0.1:18082 >"$RUNNER_TEMP/ores-local-loopback.log" 2>&1 &
          server_pid=$!
          sleep 1
          isolation/target/debug/ores-proc-isolation run local-curl --config /tmp/ores-proof-policy.yaml >/dev/null
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          sleep 30 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          if isolation/target/debug/ores-proc-isolation run host-probe --config /tmp/ores-proof-policy.yaml -- "$host_pid"; then
            echo "same-uid sandbox unexpectedly probed host process" >&2
            exit 1
          fi
          kill -0 "$host_pid"
      - name: Run ores-compose through required process isolation
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ores-compose-local-proof"
          mkdir -p "$root/service"
          cat >"$root/.ores-compose.yaml" <<'YAML'
          schema_version: ores.compose.v1
          project: local-proof
          services:
            sleeper:
              runtime: host
              command: ["/bin/sh", "-c", "echo $ > service.pid; exec /bin/sleep 30"]
              working_dir: service
          YAML
          export ORES_COMPOSE_PROCESS_ISOLATION=required
          export ORES_PROC_ISOLATION_BIN="$GITHUB_WORKSPACE/isolation/target/debug/ores-proc-isolation"
          "$GITHUB_WORKSPACE/compose/target/debug/ores-compose"             --skip-zed-pkg             --skip-rpc-gen             --skip-source-sync             up "$root/.ores-compose.yaml" >"$RUNNER_TEMP/compose-proof.log" 2>&1 &
          compose_pid=$!
          target_pid=''
          cleanup() {
            kill -INT "$compose_pid" 2>/dev/null || true
            wait "$compose_pid" 2>/dev/null || true
            if [[ -n "$target_pid" ]]; then
              kill "$target_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          ready=0
          for _ in {1..60}; do
            if grep -q '"event":"compose_ready"' "$RUNNER_TEMP/compose-proof.log"; then
              ready=1
              break
            fi
            if ! kill -0 "$compose_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/compose-proof.log" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            cat "$RUNNER_TEMP/compose-proof.log" >&2
            echo "compose did not become ready through ores-proc-isolation" >&2
            exit 1
          fi
          grep -q '"event":"process_isolation_enabled"' "$RUNNER_TEMP/compose-proof.log"
          target_pid="$(cat "$root/service/service.pid")"
          kill -0 "$target_pid"
          kill -INT "$compose_pid"
          wait "$compose_pid"
          for _ in {1..20}; do
            if ! kill -0 "$target_pid" 2>/dev/null; then
              target_pid=''
              break
            fi
            sleep 0.1
          done
          if [[ -n "$target_pid" ]] && kill -0 "$target_pid" 2>/dev/null; then
            echo "sandboxed service pid $target_pid survived ores-compose shutdown" >&2
            exit 1
          fi
          trap - EXIT
      - name: Final exact-head guards
        if: always()
        run: |
          git -C compose-base reset --hard "$COMPOSE_BASE_SHA" >/dev/null
          git -C compose-base clean -ffd >/dev/null
          git -C compose reset --hard "$COMPOSE_SHA" >/dev/null
          git -C compose clean -ffd >/dev/null
          git -C isolation reset --hard "$PROC_SHA" >/dev/null
          git -C isolation clean -ffd >/dev/null
          test "$(git -C compose-base rev-parse HEAD)" = "$COMPOSE_BASE_SHA"
          test "$(git -C compose rev-parse HEAD)" = "$COMPOSE_SHA"
          test "$(git -C isolation rev-parse HEAD)" = "$PROC_SHA"

  proof-ores-proc-combined-linux:
    if: github.event_name == 'pull_request' && github.head_ref == 'proof/ores-local-isolation-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: ddd1ef79ccd4c7ad18567851096f617960883844
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-proc-isolation-cli
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prove exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Install sandbox helpers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles apparmor-utils bubblewrap slirp4netns iproute2 iptables shellcheck curl
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || printf '0')" == '1' ]]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$profile"
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
      - name: Static and Rust checks
        run: |
          set -euo pipefail
          bash -n scripts/linux/ores-proc-isolate.sh
          shellcheck scripts/linux/ores-proc-isolate.sh scripts/macos/ores-proc-isolate.sh
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --quiet --examples --bins
      - name: Strict Linux namespace/network smoke
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ores-pi-smoke.yaml <<'YAML'
          version: 1
          defaults:
            group: no-net
          groups:
            no-net:
              network:
                mode: none
            external:
              network:
                mode: external
                deny_loopback: true
                deny_private_networks: true
          processes:
            true:
              group: no-net
              command: [/usr/bin/true]
            passwd:
              group: no-net
              command: [/usr/bin/cat, /etc/passwd]
            internet:
              group: external
              command: [/usr/bin/curl, --fail, --silent, --show-error, --head, https://example.com]
            curl-flex:
              group: external
              command: [/usr/bin/curl, --fail, --silent, --show-error]
          YAML
          target/debug/ores-proc-isolation run true --config /tmp/ores-pi-smoke.yaml
          if target/debug/ores-proc-isolation run passwd --config /tmp/ores-pi-smoke.yaml; then
            echo "sandbox unexpectedly read /etc/passwd" >&2
            exit 1
          fi
          target/debug/ores-proc-isolation run internet --config /tmp/ores-pi-smoke.yaml
          target/debug/examples/loopback_fixture 127.0.0.1:18080 >/tmp/ores-pi-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:18080 >/dev/null
          if target/debug/ores-proc-isolation run curl-flex --config /tmp/ores-pi-smoke.yaml -- http://127.0.0.1:18080; then
            echo "sandbox unexpectedly reached host loopback" >&2
            exit 1
          fi
          kill "$server"
          wait "$server" 2>/dev/null || true
          trap - EXIT
          host_ip="$(ip -o -4 addr show scope global | awk 'NR==1 {split($4,a,"/"); print a[1]}')"
          test -n "$host_ip"
          target/debug/examples/loopback_fixture 0.0.0.0:18081 >/tmp/ores-pi-host-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent "http://${host_ip}:18081" >/dev/null
          if target/debug/ores-proc-isolation run curl-flex --config /tmp/ores-pi-smoke.yaml -- "http://${host_ip}:18081"; then
            echo "sandbox unexpectedly reached host interface ${host_ip}" >&2
            exit 1
          fi
      - name: Final exact-head guard
        if: always()
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
