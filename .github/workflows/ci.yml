name: ci
on:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/3fa-backend.rs
  SOURCE_SHA: e4930f5488a6d06ccef1e3eef39b7ab6c7909cb4
  SOURCE_BASE_SHA: f2a81af9947be5a2f19964de0780490b61467897

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact 3fa-backend source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/3fa-backend.rs
          ref: e4930f5488a6d06ccef1e3eef39b7ab6c7909cb4
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
          show-progress: false

      - name: Guard exact formatting-only source delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base "$SOURCE_BASE_SHA" "$SOURCE_SHA")" = "$SOURCE_BASE_SHA"
          git diff --check "$SOURCE_BASE_SHA" "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_BASE_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "src/flags.rs"
          test -z "$(git diff --numstat "$SOURCE_BASE_SHA" "$SOURCE_SHA" | awk '$3 != "src/flags.rs" { print }')"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Configure scoped Cargo git authentication
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global net.git-fetch-with-cli true

      - name: Prove clean Rust baseline
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo test --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Remove scoped Cargo authentication
        if: always()
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global --unset-all url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf || true
          git config --global --unset-all net.git-fetch-with-cli || true

      - name: Final immutable source guard
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_SHA" >/dev/null
          git clean -ffd >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check "$SOURCE_BASE_SHA" "$SOURCE_SHA"
