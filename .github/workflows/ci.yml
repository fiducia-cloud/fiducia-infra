name: ci
on:
  pull_request:

permissions:
  contents: read

env:
  CONSUMER_REPO: ORESoftware/ores-lambdas-template
  CONSUMER_SHA: 5c4752db76bf2b1dd3b3a5f904912db1817c9781
  CONSUMER_BASE_SHA: 8bf03b7022123d1a1a252c74774c9152eb6b94a3
  ORESC_REV: 6388131c1c93d3f8b096cd22aca1556d6d30b5c7
  RUST_TOOLCHAIN: 1.95.0

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require scoped cross-repository credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"

      - name: Check out exact consumer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-lambdas-template
          ref: 5c4752db76bf2b1dd3b3a5f904912db1817c9781
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
          show-progress: false

      - name: Guard exact consumer identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSUMER_SHA"
          test "$(git merge-base "$CONSUMER_BASE_SHA" "$CONSUMER_SHA")" = "$CONSUMER_BASE_SHA"
          git diff --check "$CONSUMER_BASE_SHA" "$CONSUMER_SHA"

      - name: Check out exact private ores-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-cli
          ref: 6388131c1c93d3f8b096cd22aca1556d6d30b5c7
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: .ci/ores-cli
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Prove ores-cli registry regression tests
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/.ci/ores-cli"
          test "$(git -C "$tool" rev-parse HEAD)" = "$ORESC_REV"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/oresc-target"
          cargo +"$RUST_TOOLCHAIN" test --locked --manifest-path "$tool/Cargo.toml" registry_includes_canonical_audit_config
          cargo +"$RUST_TOOLCHAIN" test --locked --manifest-path "$tool/Cargo.toml" accepts_lambda_and_standards_runtime_contract_names

      - name: Build exact ores-cli candidate
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/.ci/ores-cli"
          test "$(git -C "$tool" rev-parse HEAD)" = "$ORESC_REV"
          test -z "$(git -C "$tool" status --porcelain)"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/oresc-target"
          cargo +"$RUST_TOOLCHAIN" build --locked --manifest-path "$tool/Cargo.toml" --bin oresc
          install -d "$RUNNER_TEMP/oresc-bin"
          install -m 0755 "$CARGO_TARGET_DIR/debug/oresc" "$RUNNER_TEMP/oresc-bin/oresc"
          install -m 0644 "$tool/.cli-flags.toml" "$RUNNER_TEMP/oresc-bin/.cli-flags.toml"
          echo "$RUNNER_TEMP/oresc-bin" >> "$GITHUB_PATH"
          echo "FLAGS2ENV_CONFIG=$RUNNER_TEMP/oresc-bin/.cli-flags.toml" >> "$GITHUB_ENV"
          echo "FLAGS2ENV_DOTENV=0" >> "$GITHUB_ENV"
          rm -rf "$GITHUB_WORKSPACE/.ci"

      - name: Audit repository and root TOML contracts
        run: oresc --no-json audit repo

      - name: Audit environment declaration/reference coverage
        run: oresc --no-json audit env

      - name: Final exact consumer guard
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$CONSUMER_SHA" >/dev/null
          git clean -ffd >/dev/null
          test "$(git rev-parse HEAD)" = "$CONSUMER_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check "$CONSUMER_BASE_SHA" "$CONSUMER_SHA"
