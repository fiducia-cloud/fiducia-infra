name: ci
on:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-stack
  SOURCE_BRANCH: feat/cli-contract-governance-v1-20260922
  SOURCE_SHA: e265dcada9bef7956c9b8249dc67a5cd917ed27c
  SOURCE_MAIN_SHA: d46c07e0f91c2dbda9b2fee64bdd82f6d52fc1ef

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require scoped source credential
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
      - name: Check out exact ores-stack source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-stack
          ref: e265dcada9bef7956c9b8249dc67a5cd917ed27c
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 0
      - name: Guard exact source identity and remote immutability
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base "$SOURCE_MAIN_SHA" "$SOURCE_SHA")" = "$SOURCE_MAIN_SHA"
          git diff --check "$SOURCE_MAIN_SHA" "$SOURCE_SHA"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.88.0
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.9.0
      - name: Reject rustfmt debt in PR-touched Rust files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          test -z "$(git diff -- crates/ores-stack-cli/src/contract_cli.rs crates/ores-stack-cli/src/entry.rs)"
          git reset --hard "$SOURCE_SHA" >/dev/null
          git clean -ffd >/dev/null
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Configure scoped Cargo git authentication
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
          git config --global net.git-fetch-with-cli true
      - name: Prefetch locked Cargo graph under scoped authentication
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            cargo fetch --locked && exit 0
            test "$attempt" -lt 3
            sleep $((attempt * 5))
          done
          exit 1
      - name: Remove Cargo git authentication before deterministic tests
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global --unset-all url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf || true
          git config --global --unset-all net.git-fetch-with-cli || true
      - name: Check CLI with prefetched locked graph
        run: cargo check -p ores-stack-cli --all-targets --locked --offline
      - name: Prove the remaining inherited RPC drift fixture on exact base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_MAIN_SHA"
          set +e
          cargo test -p ores-stack-cli sync_check_detects_generated_rpc_drift --locked 2>&1 | tee "$RUNNER_TEMP/base-rpc-drift.log"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -F 'REST route authority moved under src/routes/rest/**' "$RUNNER_TEMP/base-rpc-drift.log"

          set +e
          cargo test -p ores-stack-cli generated_rest_route_compiles_against_pinned_operation_contract --locked --offline 2>&1 | tee "$RUNNER_TEMP/base-scaffold-rest.log"
          rc2=${PIPESTATUS[0]}
          cargo test -p ores-stack-cli generated_web_page_compiles_against_pinned_api_docs_contract --locked --offline 2>&1 | tee "$RUNNER_TEMP/base-scaffold-web.log"
          rc3=${PIPESTATUS[0]}
          set -e
          test "$rc2" -ne 0
          test "$rc3" -ne 0
          grep -F 'parse Cargo.toml: TOML parse error' "$RUNNER_TEMP/base-scaffold-rest.log"
          grep -F 'async fn' "$RUNNER_TEMP/base-scaffold-web.log"
          grep -F 'Rust 2015' "$RUNNER_TEMP/base-scaffold-web.log"

          set +e
          cargo test -p ores-stack-cli create_page_refuses_to_overwrite_authored_source --locked --offline 2>&1 | tee "$RUNNER_TEMP/base-scaffold-safety.log"
          rc5=${PIPESTATUS[0]}
          set -e
          test "$rc5" -ne 0
          grep -F 'async fn' "$RUNNER_TEMP/base-scaffold-safety.log"
          grep -F 'Rust 2015' "$RUNNER_TEMP/base-scaffold-safety.log"
          git checkout --detach "$SOURCE_SHA"
      - name: Test CLI excluding only proven inherited fixture failures
        run: |
          cargo test -p ores-stack-cli --locked --offline -- \
            --skip sync_check_detects_generated_rpc_drift \
            --skip generated_rest_route_compiles_against_pinned_operation_contract \
            --skip generated_web_page_compiles_against_pinned_api_docs_contract \
            --skip create_page_refuses_to_overwrite_authored_source
      - name: Install exact-version contract tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --no-save \
            "https://github.com/ORESoftware/typespec-json-schema-validator/archive/a1d863aca59362b3671ca12404041ff9a520ec8b.tar.gz" \
            "@typespec/compiler@1.16.0" \
            "@typespec/json-schema@1.16.0"
          test "$(node -p "require('./node_modules/@oresoftware/typespec-json-schema-validator/package.json').version")" = "0.1.0"
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_root/include/node/node.h"
          npm_config_nodedir="$node_root" node node_modules/node-gyp/bin/node-gyp.js rebuild \
            --directory=node_modules/@oresoftware/f2e/clients/nodejs
          test -f node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node
      - name: Prove inherited route-manifest parity stop on exact base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_MAIN_SHA"
          set +e
          npm run check:route-manifest 2>&1 | tee "$RUNNER_TEMP/base-route-manifest-parity.log"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 2
          grep -F 'OresStack.RouteSpec at #/properties/revalidateSecs/maximum' "$RUNNER_TEMP/base-route-manifest-parity.log"
          grep -F 'OresStack.RouteSpec at #/properties/revalidateSecs/minimum' "$RUNNER_TEMP/base-route-manifest-parity.log"
          git checkout --detach "$SOURCE_SHA"
      - name: Check new governance TypeSpec and JSON Schema parity directly
        run: npm run check:governance
      - name: Final immutable source guard
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$SOURCE_SHA" >/dev/null
          git clean -ffd >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "::add-mask::$ORE_SOURCE_PAT"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)" = "$SOURCE_MAIN_SHA"
