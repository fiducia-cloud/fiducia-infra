name: DEN-3330 one-shot Rust formatting repair

on:
  push:
    branches:
      - alexanderdmills/den-3330-commercial-model-projections
    paths:
      - '.github/workflows/den-3330-one-shot-rustfmt.yml'

permissions:
  contents: write

concurrency:
  group: den-3330-one-shot-rustfmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-and-clean-up:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the existing PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: alexanderdmills/den-3330-commercial-model-projections
          fetch-depth: 0
          persist-credentials: true

      - name: Install the reviewed Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0

      - name: Format only the commercial projection workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path quote-system/rust/Cargo.toml --all
          rm -- '.github/workflows/den-3330-one-shot-rustfmt.yml'

          allowed='^(\.github/workflows/den-3330-one-shot-rustfmt\.yml|quote-system/rust/crates/fiducia-commercial-contracts/src/lib\.rs|quote-system/rust/crates/fiducia-commercial-diesel/src/models\.rs|quote-system/rust/crates/fiducia-commercial-diesel/src/schema\.rs|quote-system/rust/crates/fiducia-commercial-seaorm/src/entities/part_0[1-4]\.rs)$'
          unexpected="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u | grep -Ev "${allowed}" || true)"
          if [[ -n "${unexpected}" ]]; then
            printf 'Unexpected formatter output:\n%s\n' "${unexpected}" >&2
            exit 1
          fi

          git add -- \
            '.github/workflows/den-3330-one-shot-rustfmt.yml' \
            'quote-system/rust/crates/fiducia-commercial-contracts/src/lib.rs' \
            'quote-system/rust/crates/fiducia-commercial-diesel/src/models.rs' \
            'quote-system/rust/crates/fiducia-commercial-diesel/src/schema.rs' \
            'quote-system/rust/crates/fiducia-commercial-seaorm/src/entities/part_01.rs' \
            'quote-system/rust/crates/fiducia-commercial-seaorm/src/entities/part_02.rs' \
            'quote-system/rust/crates/fiducia-commercial-seaorm/src/entities/part_03.rs' \
            'quote-system/rust/crates/fiducia-commercial-seaorm/src/entities/part_04.rs'
          git diff --cached --check
          cargo fmt --manifest-path quote-system/rust/Cargo.toml --all -- --check

      - name: Commit the exact formatter delta to PR 61
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-3330): format commercial model projections'
          git push origin HEAD:alexanderdmills/den-3330-commercial-model-projections
