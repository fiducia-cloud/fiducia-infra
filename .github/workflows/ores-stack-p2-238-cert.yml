name: ores-stack p2 #238 exact-head certification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-p2-238-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_STACK_SHA: '5075f1824afd2c7bf74a92131d747196d8f29481'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Fetch exact ores-stack head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"
      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
      - name: Certify edge_minimal P2 runner
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          bash scripts/bootstrap-cargo-lock.sh ensure
          rustfmt --edition 2024 --check crates/ores-stack-middleware-runner/src/lib.rs
          cargo check --locked -p ores-stack-middleware-runner --all-targets
          cargo test --locked -p ores-stack-middleware-runner -- --nocapture
          cargo clippy --locked -p ores-stack-middleware-runner --all-targets -- -D warnings
          git diff --check
