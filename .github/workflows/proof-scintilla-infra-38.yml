name: proof-scintilla-infra-38

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-scintilla-infra-38.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: a0b0fba83de1fa8f02111ee5a9a2d192839d26e8

jobs:
  lifecycle-host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact private Scintilla source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: scintilla-run/scintilla-infra
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          if grep -F '\${' fleet/nixos/scintilla-runtime.nix; then
            echo "escaped Nix interpolation remains in runtime module" >&2
            exit 1
          fi

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Run full Scintilla infra contract suite
        shell: bash
        run: node --test tests/*.test.mjs

      - name: Parse NixOS runtime module
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nix-bin
          nix-instantiate --parse fleet/nixos/scintilla-runtime.nix >/dev/null

      - name: Verify source checkout stayed immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
