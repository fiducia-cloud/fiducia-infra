name: ores-stack #275 one-line Clippy repair

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ores-stack-275-clippy-repair.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  STACK_BASE: '253382da3634ce9fde62704e79e42160cee66838'
  SOURCE_HEAD: '3e22ace5653308aab54abf391d4265656998e950'
  STACK_BRANCH: 'feat/parallel-rpc-runtime-client-lane'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Configure authenticated source access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Checkout exact source head
        run: |
          set -euo pipefail
          git clone https://github.com/ORESoftware/ores-stack.git ores-stack
          git -C ores-stack checkout "$STACK_BRANCH"
          test "$(git -C ores-stack rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git -C ores-stack rev-parse origin/main)" = "$STACK_BASE"
          test -z "$(git -C ores-stack status --porcelain)"
      - name: Apply exact one-line Clippy repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ores-stack/crates/ores-stack-core/src/rpc_http_client_lane_post.rs')
          text = path.read_text()
          old = '_ => bail!("unsafe prior parallel lane path {:?}", relative),'
          new = '_ => bail!("unsafe prior parallel lane path {relative:?}"),'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one repair site, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          test "$(git -C ores-stack diff --name-only | tr '\n' ' ')" = "crates/ores-stack-core/src/rpc_http_client_lane_post.rs "
          git -C ores-stack diff --check
      - name: Rust 1.88
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy
      - name: Format and verify confined diff
        working-directory: ores-stack
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check crates/ores-stack-core/src/rpc_http_client_lane_post.rs
          test "$(git diff --name-only | tr '\n' ' ')" = "crates/ores-stack-core/src/rpc_http_client_lane_post.rs "
          git diff --check
      - name: Locked compile and focused tests
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo check --locked -p ores-stack-core -p ores-stack-cli --all-targets
          cargo test --locked -p ores-stack-core rpc_http_client_lane -- --nocapture
          cargo test --locked -p ores-stack-core rpc_http_client_lane_post -- --nocapture
      - name: Prove no owned or new Clippy diagnostics
        run: |
          set -uo pipefail
          set +e
          CARGO_TARGET_DIR=/tmp/head-target cargo clippy --manifest-path ores-stack/Cargo.toml --locked -p ores-stack-core -p ores-stack-cli --all-targets --message-format=json > /tmp/head.jsonl
          head_rc=$?
          git -C ores-stack worktree add --detach /tmp/ores-stack-base "$STACK_BASE"
          CARGO_TARGET_DIR=/tmp/base-target cargo clippy --manifest-path /tmp/ores-stack-base/Cargo.toml --locked -p ores-stack-core -p ores-stack-cli --all-targets --message-format=json > /tmp/base.jsonl
          base_rc=$?
          set -e
          export HEAD_CLIPPY_RC="$head_rc" BASE_CLIPPY_RC="$base_rc"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          owned = {
              'crates/ores-stack-core/src/rpc_http_client_lane.rs',
              'crates/ores-stack-core/src/rpc_http_client_lane_post.rs',
              'crates/ores-stack-core/src/lib.rs',
              'crates/ores-stack-cli/src/legacy/mod.rs',
          }
          def norm(v):
              v = str(v or '').replace('\\','/')
              for marker in ('/ores-stack-base/','/ores-stack/'):
                  if marker in v: return v.split(marker,1)[1]
              return v
          def diags(path):
              out=set()
              for raw in Path(path).read_text().splitlines():
                  try: obj=json.loads(raw)
                  except json.JSONDecodeError: continue
                  if obj.get('reason')!='compiler-message': continue
                  msg=obj.get('message') or {}
                  if msg.get('level') not in {'warning','error'}: continue
                  spans=msg.get('spans') or []
                  primary=next((s for s in spans if s.get('is_primary')), spans[0] if spans else {})
                  out.add((msg.get('level') or '', (msg.get('code') or {}).get('code') or '', norm(primary.get('file_name')), (msg.get('message') or '').strip()))
              return out
          base, head = diags('/tmp/base.jsonl'), diags('/tmp/head.jsonl')
          owned_findings=sorted(d for d in head if d[2] in owned)
          new_findings=sorted(head-base)
          print(f"Clippy exit codes: base={os.environ['BASE_CLIPPY_RC']} head={os.environ['HEAD_CLIPPY_RC']}")
          print(f"Clippy diagnostics: base={len(base)} head={len(head)}")
          if owned_findings: print('owned-file findings:', *owned_findings, sep='\n')
          if new_findings: print('new findings:', *new_findings, sep='\n')
          if owned_findings or new_findings: raise SystemExit(1)
          PY
      - name: Commit and push exact repair
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        working-directory: ores-stack
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$STACK_BRANCH" | cut -f1)" = "$SOURCE_HEAD"
          test "$(git diff --name-only | tr '\n' ' ')" = "crates/ores-stack-core/src/rpc_http_client_lane_post.rs "
          git config user.name ORESoftware
          git config user.email alex@oresoftware.com
          git add crates/ores-stack-core/src/rpc_http_client_lane_post.rs
          git commit -m 'style(rpc): inline parallel lane format argument'
          git push origin "HEAD:refs/heads/$STACK_BRANCH"
          echo ORES_STACK_275_CLIPPY_REPAIR_PASS
