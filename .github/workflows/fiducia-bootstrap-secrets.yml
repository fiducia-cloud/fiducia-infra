name: fiducia-bootstrap-secrets
on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "contracts/external-secrets/fiducia-bootstrap.externalsecret.yaml"
      - "docs/fiducia-bootstrap-secret-readiness.md"
      - "scripts/capture-fiducia-bootstrap-readiness.sh"
      - "tools/validate-fiducia-bootstrap-secret-readiness.mjs"
      - "tools/fiducia-bootstrap-secret-readiness.test.mjs"
      - "package.json"
      - ".github/workflows/fiducia-bootstrap-secrets.yml"
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "contracts/external-secrets/fiducia-bootstrap.externalsecret.yaml"
      - "docs/fiducia-bootstrap-secret-readiness.md"
      - "scripts/capture-fiducia-bootstrap-readiness.sh"
      - "tools/validate-fiducia-bootstrap-secret-readiness.mjs"
      - "tools/fiducia-bootstrap-secret-readiness.test.mjs"
      - "package.json"
      - ".github/workflows/fiducia-bootstrap-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflow
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/fiducia-bootstrap-secrets.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22.22.1"
      - name: Validate exact cloud, ExternalSecret, store, and key-name contracts
        run: npm run check:bootstrap:secrets
      - name: Prove example evidence cannot pass production mode
        run: |
          set -euo pipefail
          if node tools/validate-fiducia-bootstrap-secret-readiness.mjs \
            --evidence bootstrap/fiducia-secret-readiness.example.json \
            --now 2026-08-03T20:30:00Z; then
            echo "example bootstrap evidence unexpectedly passed without --allow-example" >&2
            exit 1
          fi
      - name: Prove deterministic value-free report
        run: |
          set -euo pipefail
          node tools/validate-fiducia-bootstrap-secret-readiness.mjs \
            --evidence bootstrap/fiducia-secret-readiness.example.json \
            --allow-example \
            --now 2026-08-03T20:30:00Z > /tmp/bootstrap-report-1.json
          node tools/validate-fiducia-bootstrap-secret-readiness.mjs \
            --evidence bootstrap/fiducia-secret-readiness.example.json \
            --allow-example \
            --now 2026-08-03T20:30:00Z > /tmp/bootstrap-report-2.json
          cmp /tmp/bootstrap-report-1.json /tmp/bootstrap-report-2.json
      - name: Reject committed credentials and private keys in bootstrap artifacts
        run: |
          set -euo pipefail
          if grep -RInE \
            --include='*.json' --include='*.yaml' --include='*.md' \
            -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|tskey-(auth|client)-[A-Za-z0-9_-]+' \
            bootstrap \
            contracts/external-secrets/fiducia-bootstrap.externalsecret.yaml \
            docs/fiducia-bootstrap-secret-readiness.md; then
            echo "prohibited credential/private-key pattern detected" >&2
            exit 1
          fi
      - name: Verify bootstrap contract remains non-applied in the data-plane base
        run: |
          set -euo pipefail
          if grep -RInE 'fiducia-bootstrap\.externalsecret\.yaml|bootstrap/fiducia-secret-contract\.json' base laptop/clusters clusters; then
            echo "bootstrap recovery-root contracts must not be applied by the data-plane base" >&2
            exit 1
          fi
