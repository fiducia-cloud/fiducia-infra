name: ores-stack-244-edge-minimal-wrapper-cert

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-244-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_STACK_SHA: '96fec0a9360d167552b86816864aa7195d4c34ba'
  ORES_MIDDLEWARE_SHA: '5c43cea4bf01e13857d353dce5d14b88cfc24695'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack PR head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Format-check exact P2 wrapper slice
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check --config skip_children=true \
            crates/ores-stack-cli/src/entry.rs
          rustfmt --edition 2024 --check \
            crates/ores-stack-cli/src/ppr_middleware_wrapper.rs
          git diff --exit-code

      - name: Bootstrap repository lock evidence
        working-directory: ores-stack
        shell: bash
        run: bash scripts/bootstrap-cargo-lock.sh ensure

      - name: Check CLI and workspace
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p ores-stack --all-targets
          cargo check --locked --workspace --all-targets

      - name: Clippy CLI wrapper generator
        working-directory: ores-stack
        shell: bash
        run: cargo clippy --locked -p ores-stack --all-targets -- -D warnings

      - name: Test wrapper generator contracts
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p ores-stack ppr_middleware_wrapper -- --nocapture
          cargo test --locked -p ores-stack -- --nocapture
          git diff --exit-code

      - name: Compile generated P2 crate against current middleware authority
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/src/middleware"
          printf 'pub mod mw;\n' > "$fixture/src/middleware/mod.rs"
          cat > "$fixture/src/middleware/mw.rs" <<'RS'
          pub async fn middleware(
              mut args: ores_middleware::EdgeMinimalCallbackArgs,
          ) -> Result<ores_middleware::EdgeMinimalDecision, ores_middleware::IntegrationError> {
              args.set_request_header("x-ores-wrapper-cert", "admitted");
              Ok(ores_middleware::EdgeMinimalDecision::Continue(args.request))
          }
          RS
          cargo run --locked -p ores-stack -- \
            __ppr-generate-middleware-wrapper \
            --root="$fixture" \
            --ores-middleware-rev="$ORES_MIDDLEWARE_SHA"
          test -s "$fixture/tmp/ores-stack-ppr-middleware/Cargo.toml"
          test -s "$fixture/tmp/ores-stack-ppr-middleware/main.rs"
          ! grep -q 'ores-app' "$fixture/tmp/ores-stack-ppr-middleware/Cargo.toml"
          grep -q "$ORES_MIDDLEWARE_SHA" "$fixture/tmp/ores-stack-ppr-middleware/Cargo.toml"
          cargo check --manifest-path "$fixture/tmp/ores-stack-ppr-middleware/Cargo.toml"

      - name: Prove exact source identity after tests
        if: ${{ always() }}
        working-directory: ores-stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORES_STACK_SHA"
          git diff --exit-code
