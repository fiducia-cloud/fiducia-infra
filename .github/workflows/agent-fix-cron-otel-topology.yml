name: fix cron telemetry topology

on:
  push:
    branches:
      - agent/cron-observability-stack
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/cron-observability-stack')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/cron-observability-stack
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
      - name: Make tail sampling trace-consistent and document log ingestion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gateway = Path('observability/cron-stack/otel-gateway.yaml')
          source = gateway.read_text()
          old = '''spec:
            replicas: 2
            selector:
          '''
          new = '''spec:
            # Tail sampling keeps per-trace state. A single worker guarantees that
            # every span for a trace reaches the same decision maker. Production HA
            # must add a trace-ID-aware load-balancing tier before scaling workers.
            replicas: 1
            selector:
          '''
          if source.count(old) != 1:
              raise SystemExit('OTel gateway replica insertion point changed')
          gateway.write_text(source.replace(old, new, 1))

          docs = Path('docs/cron-observability.md')
          source = docs.read_text()
          source = source.replace(
              '- a two-replica OpenTelemetry Collector gateway accepting OTLP gRPC/HTTP;',
              '- a single trace-consistent OpenTelemetry tail-sampling gateway accepting OTLP gRPC/HTTP;',
          )
          source = source.replace(
              '''Point the existing per-pod or per-cluster OTel collectors at the central gateway:
          ''',
              '''Point the existing per-pod or per-cluster OTel collectors at the central gateway:
          ''',
          )
          anchor = '''For direct OTLP gRPC exporters, use port `4317`. The network policy accepts OTLP
          only from the `fiducia` namespace. Patch the source namespace in an overlay when
          services run elsewhere.
          '''
          addition = anchor + '''
          Fiducia Rust services emit structured JSON logs to container stdout. The gateway's
          OTLP logs receiver does **not** tail pod logs by itself. The cluster must run an
          authorized log agent that parses those stdout records and sends OTLP logs to this
          gateway or writes them directly to Loki. Patch the network policy for that agent's
          namespace. Treat an empty Loki data source as a deployment failure rather than as
          proof that the services emitted no logs.
          '''
          if anchor not in source:
              raise SystemExit('log-ingestion documentation insertion point changed')
          source = source.replace(anchor, addition, 1)
          source = source.replace(
              '''The OTel gateway itself is stateless and already runs two replicas with bounded
          memory, queues, retries, and topology spreading. It can be scaled horizontally
          without changing the service endpoint.
          ''',
              '''The supplied OTel gateway deliberately runs one replica because the tail-sampling
          processor is stateful per trace. Do not scale that Deployment directly: a normal
          Kubernetes Service can split one distributed trace across workers and produce partial
          or contradictory sampling decisions. Production HA requires a stateless OTLP receiver
          tier with the Collector load-balancing exporter (or an equivalent consistent-hash
          layer) that routes every span for a trace to the same sampling worker. Only that
          trace-ID-aware topology may scale the sampling workers horizontally.
          ''',
          )
          docs.write_text(source)

          tests = Path('tools/cron-observability-stack.test.mjs')
          source = tests.read_text()
          marker = '''test("collector has a second fail-closed sensitive-data boundary", async () => {
          '''
          new_test = '''test("tail sampling uses one trace-consistent worker until load balancing exists", async () => {
            const config = await read(gatewayPath);
            assert.match(config, /replicas: 1/);
            assert.doesNotMatch(config, /replicas: 2/);
          });

          test("collector has a second fail-closed sensitive-data boundary", async () => {
          '''
          if source.count(marker) != 1:
              raise SystemExit('collector topology test insertion point changed')
          source = source.replace(marker, new_test, 1)
          tests.write_text(source)
          PY
          node --test tools/cron-observability-stack.test.mjs
          kubectl kustomize observability/cron-stack >/tmp/fiducia-cron-observability.yaml
          grep -q 'replicas: 1' /tmp/fiducia-cron-observability.yaml
          rm .github/workflows/agent-fix-cron-otel-topology.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A observability/cron-stack/otel-gateway.yaml docs/cron-observability.md tools/cron-observability-stack.test.mjs .github/workflows/agent-fix-cron-otel-topology.yml
          git commit -m 'fix: make cron tail sampling trace consistent'
          git push origin HEAD:agent/cron-observability-stack
