name: ores-stack-config-235

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-stack-config-235.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  ORES_STACK_SHA: '6046bd8081ae1303365ee414938aa9baaf78be22'

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact ores-stack #235 head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-stack
          git -C ores-stack remote add origin https://github.com/ORESoftware/ores-stack.git
          git -C ores-stack fetch --depth=1 origin "$ORES_STACK_SHA"
          git -C ores-stack checkout --detach FETCH_HEAD
          test "$(git -C ores-stack rev-parse HEAD)" = "$ORES_STACK_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Format and diff checks
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          git diff --check

      - name: Bootstrap lock evidence
        shell: bash
        working-directory: ores-stack
        run: bash scripts/bootstrap-cargo-lock.sh ensure

      - name: Check core and full workspace
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo check --locked -p ores-stack-core --all-targets
          cargo check --locked --workspace --all-targets

      - name: Test config authority and core
        shell: bash
        working-directory: ores-stack
        run: |
          set -euo pipefail
          cargo test --locked -p ores-stack-core config::tests -- --nocapture
          cargo test --locked -p ores-stack-core -- --nocapture

      - name: Clippy core
        shell: bash
        working-directory: ores-stack
        run: cargo clippy --locked -p ores-stack-core --all-targets -- -D warnings

      - name: Final clean source check
        shell: bash
        working-directory: ores-stack
        run: git diff --exit-code
