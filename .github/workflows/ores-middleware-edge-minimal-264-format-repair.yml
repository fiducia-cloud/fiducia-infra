name: ores-middleware-edge-minimal-264-format-repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-middleware-edge-minimal-264-format-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET_BRANCH: 'fix/edge-minimal-combined-certified-20260922'
  TARGET_SHA: '81b9da14c5a4a585f3a5a375d4627e5b7d5cc1cc'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact clean #264 head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-middleware
          git -C ores-middleware remote add origin https://github.com/ORESoftware/ores-middleware.git
          git -C ores-middleware fetch --depth=1 origin "$TARGET_BRANCH"
          git -C ores-middleware checkout -b repair FETCH_HEAD
          test "$(git -C ores-middleware rev-parse HEAD)" = "$TARGET_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Format only edge-minimal host
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          rustfmt --edition 2024 src/rust/src/hosts/edge_minimal_local.rs
          git diff --check
          test "$(git diff --name-only | sort)" = 'src/rust/src/hosts/edge_minimal_local.rs'

      - name: Verify repaired format
        shell: bash
        working-directory: ores-middleware
        run: rustfmt --edition 2024 --check src/rust/src/hosts/edge_minimal_local.rs

      - name: Verify portable Clippy
        shell: bash
        working-directory: ores-middleware
        run: cargo clippy --locked -p ores-middleware --no-default-features --lib -- -D warnings

      - name: Verify provider API tests
        shell: bash
        working-directory: ores-middleware
        run: cargo test --locked -p ores-middleware --no-default-features provider_api::tests -- --nocapture

      - name: Verify edge-minimal host tests
        shell: bash
        working-directory: ores-middleware
        run: cargo test --locked -p ores-middleware --no-default-features hosts::edge_minimal_local::tests -- --nocapture

      - name: Verify portable all-targets
        shell: bash
        working-directory: ores-middleware
        run: cargo check --locked -p ores-middleware --no-default-features --all-targets

      - name: Commit and push guarded formatting repair
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = 'src/rust/src/hosts/edge_minimal_local.rs'
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add src/rust/src/hosts/edge_minimal_local.rs
          git commit -m 'style(rust): rustfmt edge-minimal host'
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA" || { echo "source branch moved: expected $TARGET_SHA got $remote_head"; exit 1; }
          git push origin HEAD:"$TARGET_BRANCH"
