name: fiducia-edge consolidation

on:
  pull_request:
    paths:
      - 'workers/fiducia-edge/**'
      - '.github/workflows/fiducia-edge-consolidation.yml'
  push:
    branches: [main]
    paths:
      - 'workers/fiducia-edge/**'
      - '.github/workflows/fiducia-edge-consolidation.yml'

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/fiducia-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
