name: repair ores-compose 154 rustfmt exact head

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/repair-ores-compose-154-rustfmt-20260923.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: ORESoftware/ores-compose
  SOURCE_BRANCH: feat/service-environment-isolation
  SOURCE_SHA: 14b10f64ef6e77430ce60fc8a2df9f5bea41ccbf
  SOURCE_MAIN_SHA: fb6d0b2aeb7d87c598e006bed050162b55e0c9f0

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact guarded source branch
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$SOURCE_REPO.git"
          git -C source fetch --depth=80 origin main "$SOURCE_BRANCH"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_MAIN_SHA"
          test "$(git -C source rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_SHA"
          git -C source checkout -B "$SOURCE_BRANCH" "$SOURCE_SHA"
          test "$(git -C source merge-base HEAD "$SOURCE_MAIN_SHA")" = "$SOURCE_MAIN_SHA"
          test -z "$(git -C source status --porcelain)"

      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Apply rustfmt with PR-delta confinement
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -ge 1
          for file in "${changed[@]}"; do
            case "$file" in
              src/config_loader.rs|src/local_up_process.rs|src/service_environment.rs|src/up_orchestrator.rs) ;;
              *) echo "rustfmt touched non-PR Rust path: $file" >&2; exit 1 ;;
            esac
          done
          git diff --check
          cargo fmt --all -- --check

      - name: Prove native Rust gates after formatting
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo check --all-targets --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.9.0'
          package-manager-cache: false

      - name: Prove TypeSpec JSON Schema parity after formatting
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          npx --yes --package=https://github.com/ORESoftware/typespec-json-schema-validator/archive/db0f1e66b2a65cad43c909aa558ae00c6a91578c.tar.gz tjsv check \
            --typespec=contracts/typespec/main.tsp \
            --schema=contracts/json-schema/contract.schema.json \
            --instances=contracts/instances \
            --report=target/compose-contract-parity.json \
            --quiet

      - name: Commit and guarded fast-forward source branch
        working-directory: source
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          remote_main=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)
          remote_branch=$(git ls-remote "https://x-access-token:${ORE_SOURCE_PAT}@github.com/${SOURCE_REPO}.git" "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          test "$remote_main" = "$SOURCE_MAIN_SHA"
          test "$remote_branch" = "$SOURCE_SHA"
          git config user.name ORESoftware
          git config user.email 11139560+ORESoftware@users.noreply.github.com
          git add src/config_loader.rs src/local_up_process.rs src/service_environment.rs src/up_orchestrator.rs
          git commit -m 'style(rust): normalize service environment formatting'
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          test -z "$(git status --porcelain)"
          echo ORES_COMPOSE_154_RUSTFMT_REPAIR_PUSHED
