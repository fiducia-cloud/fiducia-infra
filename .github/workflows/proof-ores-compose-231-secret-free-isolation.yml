name: proof ORES compose secret-free isolation 231

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proof-ores-compose-231-secret-free-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: 6f30f142775a9bd1b547bedb84c7a885e0f92027
  ISOLATION_SHA: 01a219481ef5613b5f485a4e40f78a4eb99b3e97

jobs:
  secret-free-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact ores-compose head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ORESoftware/ores-compose
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Configure scoped private Git dependency access
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.98.1"

      - name: Compile exact compose head
        run: cargo check --locked --all-targets

      - name: Run local-up secret transport tests
        run: |
          cargo test --locked --lib isolation_environment_encoding -- --nocapture
          cargo test --locked --lib isolation_policy -- --nocapture
          cargo test --locked --test deep_config_execution -- --nocapture

      - name: Verify helper protocol exists at reviewed head
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ORESoftware/ores-proc-isolation-cli.git "$RUNNER_TEMP/isolation"
          git -C "$RUNNER_TEMP/isolation" fetch --depth=1 origin "$ISOLATION_SHA"
          git -C "$RUNNER_TEMP/isolation" checkout --detach "$ISOLATION_SHA"
          test "$(git -C "$RUNNER_TEMP/isolation" rev-parse HEAD)" = "$ISOLATION_SHA"
          grep -q 'target-env-stdin' "$RUNNER_TEMP/isolation/.cli-flags.toml"
          grep -q '256 KiB' "$RUNNER_TEMP/isolation/README.md"
          grep -q '512 keys' "$RUNNER_TEMP/isolation/README.md"

      - name: Final exact-head guard
        if: always()
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Remove private credential rewrite
        if: always()
        shell: bash
        run: git config --global --unset-all "url.https://x-access-token:${ORE_SOURCE_PAT}@github.com/.insteadOf" >/dev/null 2>&1 || true
