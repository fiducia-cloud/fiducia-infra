name: ores-middleware-edge-minimal-264-repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ores-middleware-edge-minimal-264-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  TARGET_BRANCH: 'fix/edge-minimal-combined-certified-20260922'
  TARGET_SHA: '31bc7dbbaf5a10aa1a466eeeaae4e9148b049a31'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure authenticated GitHub access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Fetch exact #264 branch head
        shell: bash
        run: |
          set -euo pipefail
          git init ores-middleware
          git -C ores-middleware remote add origin https://github.com/ORESoftware/ores-middleware.git
          git -C ores-middleware fetch --depth=1 origin "$TARGET_BRANCH"
          git -C ores-middleware checkout -b repair FETCH_HEAD
          test "$(git -C ores-middleware rev-parse HEAD)" = "$TARGET_SHA"

      - name: Rust 1.88
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Apply rustfmt to portable P2 sources only
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          rustfmt --edition 2024 src/rust/src/provider_api.rs src/rust/src/hosts/edge_minimal_local.rs
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf 'changed files:\n%s\n' "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              src/rust/src/provider_api.rs|src/rust/src/hosts/edge_minimal_local.rs) ;;
              *) echo "unexpected formatted file: $path"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Repaired rustfmt gate
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check src/rust/src/provider_api.rs src/rust/src/hosts/edge_minimal_local.rs
          git diff --check

      - name: Repaired portable core Clippy
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          set -o pipefail
          cargo clippy --locked -p ores-middleware --no-default-features --lib -- -D warnings 2>&1 | tee /tmp/clippy-264.log

      - name: Preserve Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clippy-264
          path: /tmp/clippy-264.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Repaired provider API tests
        shell: bash
        working-directory: ores-middleware
        run: cargo test --locked -p ores-middleware --no-default-features provider_api::tests -- --nocapture

      - name: Repaired LocalEdgeMinimalHost tests
        shell: bash
        working-directory: ores-middleware
        run: cargo test --locked -p ores-middleware --no-default-features hosts::edge_minimal_local::tests -- --nocapture

      - name: Repaired portable all-target check
        shell: bash
        working-directory: ores-middleware
        run: cargo check --locked -p ores-middleware --no-default-features --all-targets

      - name: Commit and push guarded repair
        shell: bash
        working-directory: ores-middleware
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'ORESoftware CI repair'
          git config user.email 'noreply@oresoftware.com'
          git add src/rust/src/provider_api.rs src/rust/src/hosts/edge_minimal_local.rs
          git commit -m 'style(rust): rustfmt edge-minimal provider boundary'
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$TARGET_SHA" || { echo "source branch moved: expected $TARGET_SHA got $remote_head"; exit 1; }
          git push origin HEAD:"$TARGET_BRANCH"
