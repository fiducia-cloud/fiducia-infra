name: Quote system TypeSpec and JSON Schema peer-authority parity

# quote-system/contracts/main.tsp imports @typespec/http and @typespec/rest.
# The validator's own toolchain pins only @typespec/compiler and
# @typespec/json-schema, so without the caller's locked quote-system install
# compilation fails with import-not-found before any comparison runs. Installing
# quote-system/package-lock.json first lets the compiler resolve those libraries
# from quote-system/node_modules.

on:
  pull_request:
    paths:
      - "quote-system/contracts/**"
      - "quote-system/package.json"
      - "quote-system/package-lock.json"
      - ".github/workflows/quote-system-tjsv-peer-authority.yml"
  push:
    branches: [main]
    paths:
      - "quote-system/contracts/**"
      - "quote-system/package.json"
      - "quote-system/package-lock.json"
      - ".github/workflows/quote-system-tjsv-peer-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quote-system-tjsv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install locked TypeSpec libraries imported by the contract
        working-directory: quote-system
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          test -f node_modules/@typespec/http/package.json
          test -f node_modules/@typespec/rest/package.json

      - name: Compare independent TypeSpec and JSON Schema authorities
        uses: ORESoftware/typespec-json-schema-validator@93dd73cb246a09b0a1c62d7192cc62ca6ecbe405
        with:
          typespec: quote-system/contracts/main.tsp
          schema: quote-system/contracts/commercial-intake.schema.json
          mapping: quote-system/contracts/tjsv-declaration-mapping.json
          report: .typespec-json-schema-validator/quote-system/report.json
          sarif: .typespec-json-schema-validator/quote-system/report.sarif
          output_dir: .typespec-json-schema-validator/quote-system/generated
          max_probes: "64"

      - name: Verify authored authorities were not modified
        if: ${{ always() }}
        run: git diff --exit-code -- quote-system/contracts/main.tsp quote-system/contracts/commercial-intake.schema.json

      - name: Retain receipt, SARIF, and generated witness
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quote-system-tjsv-${{ github.run_id }}
          path: .typespec-json-schema-validator/quote-system/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
