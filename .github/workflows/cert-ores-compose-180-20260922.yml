name: certify ores-compose 180 exact head

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cert-ores-compose-180-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SOURCE_REPO: ORESoftware/ores-compose
      SOURCE_BRANCH: fix/pin-trusted-working-directory-inodes-20260922
      SOURCE_SHA: 78f7f0c6298c81a31aff414f037f27eeb9ebb52b
      SOURCE_BASE_SHA: c505136a2ed01dc9d3d428dff89557261b219922
    steps:
      - name: Configure authenticated source access
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          test -n "$ORE_SOURCE_PAT"
          echo "::add-mask::$ORE_SOURCE_PAT"
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Checkout exact candidate and bind source evidence
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none "https://github.com/${SOURCE_REPO}.git" source
          git -C source checkout --detach "$SOURCE_SHA"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source cat-file -e "$SOURCE_BASE_SHA^{commit}"
          test "$(git -C source merge-base "$SOURCE_SHA" "$SOURCE_BASE_SHA")" = "$SOURCE_BASE_SHA"
          test "$(git -C source diff --name-only "$SOURCE_BASE_SHA".."$SOURCE_SHA" | tr '\n' ' ')" = 'src/trusted_working_directory.rs '
          git -C source diff --check "$SOURCE_BASE_SHA".."$SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"
          remote_head=$(git -C source ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)
          remote_main=$(git -C source ls-remote origin refs/heads/main | cut -f1)
          test "$remote_head" = "$SOURCE_SHA"
          test "$remote_main" = "$SOURCE_BASE_SHA"

      - name: Install reviewed Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.98.1
          rustc --version | grep -F 'rustc 1.98.1'

      - name: Format changed source
        working-directory: source
        run: rustfmt --edition 2024 --check src/trusted_working_directory.rs

      - name: Locked all-target all-feature compile
        working-directory: source
        run: cargo check --locked --all-targets --all-features

      - name: Trusted-working-directory unit tests
        working-directory: source
        run: cargo test --locked --lib trusted_working_directory::tests -- --nocapture --test-threads=1

      - name: Trusted-working-directory integration regressions
        working-directory: source
        run: cargo test --locked --test trusted_working_directory_regressions -- --nocapture --test-threads=1

      - name: Repeat inode-replacement invariant 100 times
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in $(seq 1 100); do
            cargo test --locked --lib trusted_working_directory::tests::replacement_after_admission_is_detected -- --exact --test-threads=1 >/tmp/compose-180-repeat.log 2>&1 || {
              echo "replacement invariant failed at iteration $i" >&2
              cat /tmp/compose-180-repeat.log >&2
              exit 1
            }
          done
          echo ORES_COMPOSE_180_REPLACEMENT_100X_PASS

      - name: Ordinary content mutation remains valid
        working-directory: source
        run: cargo test --locked --lib trusted_working_directory::tests::directory_content_changes_do_not_change_admitted_identity -- --exact --test-threads=1

      - name: Preserve exhaustive dependency-wave proof
        working-directory: source
        run: cargo test --locked --test formal_dependency_graph_exhaustive -- --nocapture

      - name: Candidate Clippy boundary
        working-directory: source
        run: cargo clippy --locked --lib --no-deps -- -A warnings -D clippy::all

      - name: Final immutable-source decision
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_BASE_SHA"
          echo ORES_COMPOSE_180_EXACT_HEAD_PASS
